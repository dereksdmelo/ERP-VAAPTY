                  background: ativa ? C.roxo : ok ? C.verde : C.roxoFraco,
                  color: ativa || ok ? "#fff" : C.roxo,
                  fontFamily: F.disp, fontWeight: 800,
                }}>
                {ok && !ativa ? "✓" : e.letra}
              </span>
              <span className="text-center text-[11px] leading-tight" style={{ color: ativa ? C.roxo : C.mute, fontWeight: ativa ? 700 : 500 }}>
                {e.curto}
              </span>
            </button>
          );
        })}
      </div>

      <BarraEscuta escuta={escuta} />

      <div className="px-4 pt-4">
        <h2 className="text-[16px] font-semibold leading-tight">{et.nome}</h2>
      </div>

      <div className="space-y-4 p-4">

        {/* ---------- A ---------- */}
        {etapa === "A" && (
          <Bloco titulo="Chegada" sub="“Cliente não aguardou na loja” é o motivo de perda mais repetido no CRM. Combinar o tempo do processo agora é o que evita isso.">
            <div className="space-y-2.5">
              <Campo label="Negociador"><input className={inputCls} style={inputSty} value={f.negociador} onChange={(e) => set("negociador", e.target.value)} placeholder="Seu nome" /></Campo>
              <Campo label="Hora de chegada">
                <div className="flex gap-2">
                  <input type="time" className={inputCls} style={inputSty} value={f.chegada} onChange={(e) => set("chegada", e.target.value)} />
                  <button onClick={() => set("chegada", new Date().toTimeString().slice(0, 5))}
                    className="shrink-0 rounded-md border px-3 text-[13px] font-semibold" style={{ borderColor: C.line, color: C.roxo }}>Agora</button>
                </div>
              </Campo>
              <Toggle label="Carro subiu pro pátio" valor={f.carroSubiu} onChange={(v) => set("carroSubiu", v)} />
              <Toggle label="Combinei o tempo do processo com o cliente" nota="“A avaliação leva cerca de 40 minutos, tudo bem?”" valor={f.tempoCombinado} onChange={(v) => set("tempoCombinado", v)} />
            </div>
          </Bloco>
        )}

        {/* A autorização é pedida aqui, no primeiro contato, e vale
            para o atendimento inteiro. Pedir no meio da negociação
            seria pedir na pior hora possível. */}
        {etapa === "A" && (
          <Bloco titulo="Escutar a conversa"
            sub="Peça agora, no começo. Uma vez ligada, a escuta acompanha todas as etapas.">
            <EscutaControle escuta={escuta} f={f} set={set} />
          </Bloco>
        )}

        {/* ---------- P ---------- */}
        {etapa === "P" && (
          <>
            <Bloco titulo="O carro" sub="Digite a placa: vem marca, modelo, ano, cor, chassi e as versões FIPE.">
              <div className="flex gap-2">
                <input placeholder="ABC1D23" className={inputCls} style={{ ...inputSty, fontFamily: F.mono, letterSpacing: "0.08em" }}
                  value={placaBusca} onChange={(e) => setPlacaBusca(e.target.value.toUpperCase())} maxLength={8} />
                <button onClick={buscar} disabled={buscando || placaBusca.length < 7}
                  className="shrink-0 rounded-md px-4 text-[13px] font-semibold"
                  style={{ background: placaBusca.length < 7 ? C.line : C.roxo, color: "#fff" }}>
                  {buscando ? "…" : "Consultar"}
                </button>
              </div>
              {erroBusca && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erroBusca}</p>}

              {achado && (() => {
                const lista = filtrarPorCambio(achado.versoes || [], cambioBusca);
                const aviso = alertaDispersao(lista);
                return (
                  <div className="mt-3 rounded-md p-3" style={{ background: C.roxoFraco }}>
                    <div className="text-[13px] font-semibold">{achado.marca} {achado.modeloAbreviado}</div>
                    <div className="mt-0.5 text-[11px]" style={{ color: C.mute }}>
                      {achado.anoFabricacao}/{achado.anoModelo} · {achado.cor} · {achado.municipio} {achado.uf}
                    </div>
                    {achado.chassiCompleto && (
                      <div className="mt-1 text-[11px]" style={{ color: C.verde, fontFamily: F.mono }}>Chassi {achado.chassi}</div>
                    )}
                    <div className="mt-3 text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>Câmbio</div>
                    <div className="mt-1.5 flex gap-1.5">
                      {["Manual", "Automático", "Todos"].map((op) => {
                        const val = op === "Todos" ? "" : op;
                        const on = cambioBusca === val;
                        return (
                          <button key={op} onClick={() => setCambioBusca(val)} className="rounded-full px-3 py-1.5 text-[12px]"
                            style={{ background: on ? C.roxo : "#fff", color: on ? "#fff" : C.mute, border: `1px solid ${on ? C.roxo : C.line}` }}>{op}</button>
                        );
                      })}
                    </div>
                    <div className="mt-3 text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
                      {lista.length === 1 ? "Versão encontrada" : `${lista.length} versões — escolha`}
                    </div>
                    <div className="mt-1.5 space-y-1.5">
                      {lista.map((v) => (
                        <button key={v.codigoFipe + v.nome} onClick={() => escolherVersao(v)}
                          className="flex w-full items-center justify-between gap-3 rounded-md border px-3 py-2.5 text-left"
                          style={{ borderColor: C.line, background: "#fff" }}>
                          <span>
                            <span className="block text-[12px] leading-snug">{v.nome}</span>
                            <span className="text-[10px]" style={{ color: C.mute, fontFamily: F.mono }}>{v.codigoFipe} · {v.mesReferencia} · {v.confianca}%</span>
                          </span>
                          <span className="shrink-0 text-[12px] font-bold" style={{ fontFamily: F.mono, color: C.roxo }}>{brl(v.valor)}</span>
                        </button>
                      ))}
                    </div>
                    {aviso && <p className="mt-2 rounded px-2 py-1.5 text-[11px]" style={{ background: "#FDEDE6", color: C.laranja }}>{aviso}</p>}
                  </div>
                );
              })()}

              {!!f.placa && <ConferirFipe f={f} set={setVarios} />}

              {!!f.modelo && (() => {
                const termo = termoMercado || termoMercadoPadrao(f);
                const [ma, mo] = marcaModeloDa(f);
                const vistos = f.canaisVistos || [];
                const possiveis = canaisPossiveis(f);
                const faltam = faltamCanais(f);

                const marcarVisto = (chave) => {
                  if (vistos.indexOf(chave) >= 0) return;
                  set("canaisVistos", [...vistos, chave]);
                };

                // Navegador bloqueia abertura em série. Marco só o que
                // realmente abriu — dar por visto o que não abriu seria
                // liberar a etapa sem ninguém ter olhado.
                const abrirTodos = () => {
                  const abertos = [];
                  CANAIS.forEach((c) => {
                    const url = enderecoCanal(c, termo, ma, mo);
                    if (!url) return;
                    const j = window.open(url, "_blank", "noopener");
                    if (j) abertos.push(c.chave);
                  });
                  if (abertos.length) set("canaisVistos", [...new Set([...vistos, ...abertos])]);
                  setErroCanais(abertos.length < possiveis.length
                    ? "O navegador bloqueou parte das abas. Libere pop-ups para este site ou abra um a um."
                    : "");
                };

                return (
                  <div className="mt-3 rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${faltam.length ? C.laranja : C.verde}` }}>
                    <div className="flex items-baseline justify-between gap-2">
                      <span className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
                        Pesquisa de mercado
                      </span>
                      <span className="text-[10px]" style={{ fontFamily: F.mono, color: faltam.length ? C.laranja : C.verde }}>
                        {possiveis.length - faltam.length}/{possiveis.length}
                      </span>
                    </div>
                    <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
                      Abra os canais antes de sentar para negociar. O que o dono viu na internet é o número com que ele chegou — e a etapa só fecha depois que você olhou todos.
                    </p>

                    <input className={`${inputCls} mt-2`} style={inputSty} value={termo}
                      onChange={(e) => setTermoMercado(e.target.value)} placeholder="O que buscar" />

                    <button onClick={abrirTodos}
                      className="mt-2 w-full rounded-md py-2 text-[12px] font-semibold"
                      style={{ background: C.roxo, color: "#fff" }}>
                      Abrir todos
                    </button>

                    {[["anuncio", "Anúncio — o que o dono pede"],
                      ["tabela", "Tabela — o que o mercado pratica"]].map(([fam, titulo]) => {
                      const doGrupo = CANAIS.filter((c) => c.familia === fam && enderecoCanal(c, termo, ma, mo));
                      if (!doGrupo.length) return null;
                      return (
                        <div key={fam} className="mt-3">
                          <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>{titulo}</div>
                          <div className="mt-1.5 flex flex-wrap gap-1.5">
                            {doGrupo.map((c) => {
                              const href = enderecoCanal(c, termo, ma, mo);
                              const visto = vistos.indexOf(c.chave) >= 0;
                              return (
                                <a key={c.chave} href={href} target="_blank" rel="noopener noreferrer"
                                  onClick={() => marcarVisto(c.chave)}
                                  className="rounded-full px-3 py-1.5 text-[12px] font-medium"
                                  style={{ background: visto ? "#F0F8F4" : "#fff",
                                           color: visto ? C.verde : C.roxo,
                                           border: `1px solid ${visto ? C.verde : C.line}` }}>
                                  {visto ? "✓ " : ""}{c.nome}
                                </a>
                              );
                            })}
                          </div>
                          {/* A AutoAvaliar ignora parâmetro de URL e o resultado
                              passa por reCAPTCHA, então não dá para chegar com o
                              carro escolhido. O que dá é não fazer o negociador
                              lembrar: os três valores ficam à vista. */}
                          {fam === "tabela" && !!ma && (
                            <p className="mt-1.5 text-[10px] leading-relaxed" style={{ color: C.mute }}>
                              Na AutoAvaliar, selecione: <b>{ma.toUpperCase()}</b>
                              {mo ? <> · <b>{mo.toUpperCase()}</b></> : null}
                              {f.ano ? <> · <b>{String(f.ano).split("/").filter(Boolean).pop()}</b></> : null}
                              . A página não aceita link com o carro já escolhido, e o resultado passa por um reCAPTCHA.
                            </p>
                          )}
                        </div>
                      );
                    })}

                    {erroCanais && <p className="mt-2 text-[11px]" style={{ color: C.laranja }}>{erroCanais}</p>}

                    {!!faltam.length && (
                      <p className="mt-2 text-[11px]" style={{ color: C.laranja }}>
                        Falta abrir: {CANAIS.filter((c) => faltam.indexOf(c.chave) >= 0).map((c) => c.nome).join(", ")}.
                      </p>
                    )}

                    <p className="mt-3 text-[10px] leading-relaxed" style={{ color: C.mute }}>
                      <b>Anúncio é preço pedido, não preço de venda</b> — serve de teto.
                      {" "}A <b>FIPE</b> é média de varejo; o <b>KBB</b> é o varejo praticado;
                      {" "}a <b>tabela AutoAvaliar</b> é o repasse entre lojistas — a ponta que a Vaapty vende,
                      e por isso a que mais se aproxima do POR.
                    </p>
                    <p className="mt-1 text-[10px] leading-relaxed" style={{ color: C.mute }}>
                      KBB abre na marca: o modelo lá fica sob a carroceria, que a FIPE não informa.
                      {" "}A tabela AutoAvaliar abre no formulário de consulta — escolha marca, modelo, ano e estado lá dentro.
                    </p>
                  </div>
                );
              })()}

              <Desvalorizometro chave={f.fipeDesval} />
            </Bloco>

            {blocoCliente}

            <Bloco titulo="O cliente" sub="Descobrir que falta o decisor depois de 40 minutos de avaliação é perda certa.">
              <div className="space-y-2.5">
                <Campo label="Motivo da venda">
                  <select className={inputCls} style={inputSty} value={f.motivo} onChange={(e) => set("motivo", e.target.value)}>
                    {MOTIVOS.map((m) => <option key={m}>{m}</option>)}
                  </select>
                </Campo>
                <Campo label="Detalhe do motivo — opcional">
                  <textarea rows={2} className={inputCls} style={inputSty} value={f.motivoDetalhe}
                    onChange={(e) => set("motivoDetalhe", e.target.value)}
                    placeholder="A história por trás. Vai separando divórcio de mudança de emprego, e é o que dá argumento na hora do extrato." />
                </Campo>
                <div className="grid grid-cols-3 gap-2.5">
                  <Campo label="Pretensão"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.pretensao} onChange={(e) => set("pretensao", e.target.value)} /></Campo>
                  <Campo label="Quitação"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.quitacao} onChange={(e) => set("quitacao", e.target.value)} /></Campo>
                  <Campo label="Débitos"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.debitos} onChange={(e) => set("debitos", e.target.value)} /></Campo>
                </div>
                <p className="text-[10px] leading-relaxed" style={{ color: C.mute }}>
                  Quitação é o saldo do financiamento. Débitos é IPVA, multa e licenciamento em aberto — os dois saem do valor que o cliente recebe.
                </p>
                <Toggle label="O decisor está na loja" nota="Se não estiver, resolva antes de rodar o carro." valor={f.decisorPresente} onChange={(v) => set("decisorPresente", v)} />
                <Toggle label="Cliente entrega o carro hoje"
                  nota="Ciente de que, fechando negócio, o carro já fica na loja."
                  valor={f.entregaHoje} onChange={(v) => set("entregaHoje", v)} />
                <Toggle label="Já recebeu proposta de outro lugar" valor={f.temPropostaFora} onChange={(v) => set("temPropostaFora", v)} />
                {f.temPropostaFora && (
                  <div className="grid grid-cols-2 gap-2.5">
                    <Campo label="Quanto"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.propostaForaValor} onChange={(e) => set("propostaForaValor", e.target.value)} /></Campo>
                    <Campo label="Onde"><input className={inputCls} style={inputSty} value={f.propostaForaOnde} onChange={(e) => set("propostaForaOnde", e.target.value)} /></Campo>
                  </div>
                )}
              </div>
            </Bloco>

            <Bloco titulo="Documentos do carro e do cliente"
              sub="O CRLV e a CNH em foto ou PDF. É de onde saem os dados — anexando, você para de perguntar.">
              <Anexos atendimentoId={atendimento ? atendimento.id : null}
                rotulos={["CRLV", "CNH", "Identidade"]} />
            </Bloco>

            <Bloco titulo="Escutar a conversa" sub="É aqui que ele conta por que está vendendo. O cliente precisa autorizar antes — é a condição do parecer.">
              <EscutaPainel escuta={escuta} f={f} set={set} />
            </Bloco>
          </>
        )}

        {/* ---------- O ---------- */}
        {etapa === "O" && (
          <>
            <Bloco titulo="Mostre como funciona" sub="O cliente aceita um número menor quando entende de onde ele veio.">
              <div className="space-y-2.5">
                <Apresentacao aoAbrir={() => { if (!f.mostrouProcesso) set("mostrouProcesso", true); }} />
                <p className="text-[11px] leading-relaxed" style={{ color: C.mute }}>
                  Onze páginas, aqui mesmo — arraste ou use os botões para virar na frente do cliente. Abrir já marca que o processo foi mostrado.
                </p>
                <Toggle label="Mostrei o processo completo ao cliente" valor={f.mostrouProcesso} onChange={(v) => set("mostrouProcesso", v)} />
                <a href="/apresentacao.pdf" target="_blank" rel="noopener noreferrer"
                  className="block text-[11px] underline" style={{ color: C.mute }}>
                  Baixar o PDF — para mandar por WhatsApp
                </a>
              </div>
            </Bloco>

            <Bloco titulo="Prova social" sub="Depoimento de quem vendeu pelo mesmo motivo que esse cliente.">
              <div className="space-y-2.5">
                <Campo label="Necessidade principal do cliente">
                  <input className={inputCls} style={inputSty} value={f.necessidadeCliente} onChange={(e) => set("necessidadeCliente", e.target.value)}
                    placeholder="Ex.: precisa quitar dívida rápido" />
                </Campo>
                <Testemunhais necessidade={f.necessidadeCliente} negociador={f.negociador} />
                <Toggle label="Mostrei um caso parecido com o dele" valor={f.mostrouTestemunhal} onChange={(v) => set("mostrouTestemunhal", v)} />
              </div>
            </Bloco>
          </>
        )}

        {/* ---------- PUB ---------- */}
        {etapa === "PUB" && (
          <>
            <div className="rounded-lg p-3" style={{ background: liberado ? "#E7F4EE" : "#FDEDE6", border: `1px solid ${liberado ? C.verde : C.laranja}` }}>
              <div className="text-[12px] font-semibold" style={{ color: liberado ? C.verde : C.laranja }}>
                {liberado ? "Ficha completa — descritivo liberado" : `Faltam ${faltas.length} campos`}
              </div>
              {!liberado && <div className="mt-1 text-[11px]" style={{ color: C.mute }}>{faltas.map((x) => x[1]).join(" · ")}</div>}
            </div>

            {!!f.placa && !f.fipeConferida && <AvisoFipe />}

            <Bloco titulo="Fotos" sub={`Primeira é a capa. Até ${MAX_FOTOS}. Cada foto sobe para o servidor na hora; o aparelho não guarda nada depois que sobe.`}>
              <input ref={camRef} type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={receberFotos} />
              <input ref={galRef} type="file" accept="image/*" multiple className="hidden" onChange={receberFotos} />
              <div className="flex gap-2">
                <button onClick={() => camRef.current && camRef.current.click()} className="flex-1 rounded-md py-2.5 text-[13px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>Tirar foto</button>
                <button onClick={() => galRef.current && galRef.current.click()} className="flex-1 rounded-md border py-2.5 text-[13px] font-semibold" style={{ borderColor: C.line, color: C.roxo }}>Galeria</button>
              </div>
              {erroFoto && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erroFoto}</p>}
              {!!fotos.length && (
                <>
                  <div className="mt-3 text-[11px]" style={{ color: subindo ? C.roxo : C.mute }}>
                    {enviadas.length} de {fotos.length} no servidor{subindo ? " · enviando…" : ""}
                  </div>
                  <div className="mt-2 grid grid-cols-3 gap-2">
                    {fotos.map((p, i) => (
                      <div key={p.chave} className="relative overflow-hidden rounded-md" style={{ border: `1px solid ${p.estado === "erro" ? C.laranja : C.line}`, background: "#000" }}>
                        <img src={p.url || p.local} alt={`Foto ${i + 1}`} className="block h-20 w-full object-cover"
                          style={{ opacity: p.estado === "ok" ? 1 : 0.55 }} />
                        {i === 0 && <span className="absolute left-1 top-1 rounded px-1 py-0.5 text-[8px] font-bold uppercase" style={{ background: C.roxo, color: "#fff" }}>Capa</span>}
                        {p.estado !== "ok" && (
                          <span className="absolute right-1 top-1 rounded px-1 py-0.5 text-[8px] font-bold uppercase"
                            style={{ background: p.estado === "erro" ? C.laranja : "rgba(24,18,33,.8)", color: "#fff" }}>
                            {p.estado === "enviando" ? "Subindo" : p.estado === "aguardando" ? "Aguarda" : "Falhou"}
                          </span>
                        )}
                        <div className="absolute bottom-0 left-0 right-0 flex" style={{ background: "rgba(24,18,33,.72)" }}>
                          {p.estado === "erro" && veiculoId && (
                            <button onClick={() => enviarFoto(p.chave, veiculoId)} className="flex-1 py-1 text-[9px]" style={{ color: "#FFD9A8" }}>Tentar</button>
                          )}
                          {i !== 0 && p.estado === "ok" && (
                            <button onClick={() => definirCapa(i)} className="flex-1 py-1 text-[9px] text-white">Capa</button>
                          )}
                          <button onClick={() => removerFoto(i)} className="flex-1 py-1 text-[9px]" style={{ color: "#FFB39A" }}>Excluir</button>
                        </div>
                      </div>
                    ))}
                  </div>
                  {!veiculoId && fotos.some((p) => p.estado === "aguardando") && (
                    <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
                      Fotos esperando a ficha ir para o banco. Salve a ficha abaixo e elas sobem sozinhas.
                    </p>
                  )}
                  {fotos.some((p) => p.estado === "erro") && (
                    <p className="mt-2 text-[11px]" style={{ color: C.laranja }}>
                      {fotos.filter((p) => p.estado === "erro")[0].erro}
                    </p>
                  )}
                </>
              )}
            </Bloco>

            <Bloco titulo="Completar a ficha">
              <div className="space-y-3">
                <Campo label="Modelo" req><input className={inputCls} style={inputSty} value={f.modelo} onChange={(e) => set("modelo", e.target.value)} /></Campo>
                <div className="grid grid-cols-2 gap-3">
                  <Campo label="Ano / modelo" req><input className={inputCls} style={inputSty} value={f.ano} onChange={(e) => set("ano", e.target.value)} /></Campo>
                  <Campo label="Câmbio" req>
                    <select className={inputCls} style={inputSty} value={f.cambio} onChange={(e) => set("cambio", e.target.value)}>
                      {CAMBIO.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </Campo>
                  <Campo label="KM atual" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.km} onChange={(e) => set("km", e.target.value)} /></Campo>
                  <Campo label="KM quando o cliente pegou"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.kmEntrada} onChange={(e) => set("kmEntrada", e.target.value)} /></Campo>
                  <Campo label="Placa" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} value={f.placa} onChange={(e) => set("placa", e.target.value.toUpperCase())} /></Campo>
                  <Campo label="Cor"><input className={inputCls} style={inputSty} value={f.cor} onChange={(e) => set("cor", e.target.value)} /></Campo>
                  <Campo label="Renavam"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.renavam} onChange={(e) => set("renavam", e.target.value)} placeholder="do CRLV" /></Campo>
                  <Campo label="FIPE" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.fipe} onChange={(e) => set("fipe", e.target.value)} /></Campo>
                  <Campo label="POR" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.por} onChange={(e) => set("por", e.target.value)} /></Campo>
                </div>
                {!!f.placa && !f.fipeConferida && (
                  <p className="text-[11px] leading-relaxed" style={{ color: AMARELO.texto }}>
                    <b>Conferir valor FIPE.</b> Este número veio da consulta de placa, que adivinha a versão. Confirme na tabela oficial, na etapa de Pesquisa.
                  </p>
                )}
                {f.fipeConferida && (
                  <p className="text-[11px]" style={{ color: C.verde }}>
                    ✓ FIPE conferida na tabela oficial{f.fipeOficialMes ? ` — ${f.fipeOficialMes}` : ""}.
                  </p>
                )}
                <Campo label="Gastos / peças" req><input className={inputCls} style={inputSty} value={f.gastos} onChange={(e) => set("gastos", e.target.value)} /></Campo>
                <div>
                  <Rotulo req>Condição dos pneus</Rotulo>
                  <div className="mt-1 grid grid-cols-2 gap-2">
                    {["Diant. esq.", "Diant. dir.", "Tras. esq.", "Tras. dir."].map((p, i) => (
                      <select key={p} className={inputCls} style={inputSty} value={f.pneus[i]}
                        onChange={(e) => { const n = [...f.pneus]; n[i] = e.target.value; set("pneus", n); }}>
                        <option value="">{p}</option>
                        {PNEU.map((x) => <option key={x}>{x}</option>)}
                      </select>
                    ))}
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => set("leilao", !f.leilao)} className="flex-1 rounded-md border px-3 py-2 text-[13px]"
                    style={{ borderColor: f.leilao ? C.laranja : C.line, color: f.leilao ? C.laranja : C.mute, background: f.leilao ? "#FDEDE6" : "#fff" }}>Leilão / sinistro</button>
                  <button onClick={() => set("gnv", !f.gnv)} className="flex-1 rounded-md border px-3 py-2 text-[13px]"
                    style={{ borderColor: f.gnv ? C.roxo : C.line, color: f.gnv ? C.roxo : C.mute, background: f.gnv ? C.roxoFraco : "#fff" }}>GNV</button>
                </div>
                <div>
                  <Rotulo req>Opcionais</Rotulo>
                  <div className="mt-1.5 flex flex-wrap gap-1.5">
                    {OPCIONAIS.map((o) => {
                      const on = f.opcionais.includes(o);
                      return (
                        <button key={o} onClick={() => set("opcionais", on ? f.opcionais.filter((x) => x !== o) : [...f.opcionais, o])}
                          className="rounded-full px-3 py-1.5 text-[12px]"
                          style={{ background: on ? C.roxo : "#fff", color: on ? "#fff" : C.mute, border: `1px solid ${on ? C.roxo : C.line}` }}>{o}</button>
                      );
                    })}
                  </div>
                </div>
                <Campo label="Ressalvas — vai pro lojista">
                  <textarea rows={2} className={inputCls} style={inputSty} value={f.ressalvas} onChange={(e) => set("ressalvas", e.target.value)} />
                </Campo>
                <Campo label="Internas — nunca sai da loja">
                  <textarea rows={2} className={inputCls} style={{ ...inputSty, background: "#FBF7FD" }} value={f.internas} onChange={(e) => set("internas", e.target.value)} />
                </Campo>
              </div>
            </Bloco>

            <section className="rounded-lg" style={{ background: C.paper, border: `1px solid ${C.line}`, opacity: liberado ? 1 : 0.45 }}>
              <div className="flex items-center justify-between border-b px-4 py-3" style={{ borderColor: C.line }}>
                <span className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Descritivo</span>
                <button disabled={!liberado} onClick={() => copiar(descritivo, "d")} className="rounded-md px-3 py-1.5 text-[12px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                  {copiado === "d" ? "Copiado" : "Copiar"}
                </button>
              </div>
              <pre className="overflow-x-auto whitespace-pre-wrap px-4 py-3 text-[12px] leading-relaxed" style={{ fontFamily: F.body }}>{descritivo}</pre>
              <div className="border-t px-4 py-3" style={{ borderColor: C.line }}>
                <button disabled={!liberado} onClick={() => copiar(JSON.stringify(payloadShinkai(f, enviadas.length), null, 2), "s")}
                  className="w-full rounded-md border py-2 text-[12px] font-semibold" style={{ borderColor: C.line, color: C.roxo }}>
                  {copiado === "s" ? "JSON copiado" : "Copiar JSON do Shinkai"}
                </button>
              </div>
            </section>

            <section className="rounded-lg p-4" style={{ background: C.paper, border: `1px solid ${C.line}`, opacity: podeSalvar ? 1 : 0.45 }}>
              <div className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Banco</div>
              <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
                Grava a ficha no Supabase. Salvar de novo na mesma placa atualiza a ficha em avaliação em vez de criar outra.
                As fotos só sobem depois que a ficha existe no banco.
              </p>
              <button disabled={!podeSalvar || salvando} onClick={salvarNoBanco}
                className="mt-3 w-full rounded-md py-2.5 text-[13px] font-semibold"
                style={{ background: podeSalvar && !salvando ? C.roxo : C.line, color: "#fff" }}>
                {salvando ? "Salvando…" : veiculoId ? "Salvar de novo" : "Salvar no banco"}
              </button>
              {!podeSalvar && (
                <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
                  Falta {faltasFicha.map((x) => x[1]).join(" · ")}.
                </p>
              )}
              {salvo && salvoAtual && (
                <p className="mt-2 text-[12px]" style={{ color: C.verde }}>
                  {salvo.criado ? "Ficha criada" : "Ficha atualizada"} às {salvo.hora.toTimeString().slice(0, 5)}.
                </p>
              )}
              {salvo && !salvoAtual && (
                <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
                  Salva às {salvo.hora.toTimeString().slice(0, 5)} e alterada depois. Salve de novo.
                </p>
              )}
              {erroSalvar && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erroSalvar}</p>}
            </section>

            <Toggle label="Lancei o carro na plataforma" nota="Marque depois de publicar no grupo e no Shinkai." valor={f.publicado} onChange={(v) => { set("publicado", v); if (v && !f.esperaIniciadaEm) setVarios({ publicado: v, esperaIniciadaEm: Date.now() }); }} />
          </>
        )}

        {/* ---------- ESPERA ---------- */}
        {etapa === "ESP" && (
          <>
            <Bloco titulo="Enquanto as propostas chegam" sub="O carro está lançado e a rede está respondendo. Aqui não se registra nada — a primeira proposta que entra no sistema é o 1º extrato, na Negociação. Este é o tempo de conversa que decide o fechamento.">
              {restante == null ? (
                <button onClick={() => set("esperaIniciadaEm", Date.now())} className="w-full rounded-md py-3 text-[14px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                  Iniciar os 15 minutos
                </button>
              ) : (
                <div className="text-center">
                  <div className="text-[46px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: restante === 0 ? C.verde : C.roxo }}>
                    {mmss(restante)}
                  </div>
                  <p className="mt-2 text-[12px]" style={{ color: restante === 0 ? C.verde : C.mute }}>
                    {restante === 0 ? "Tempo encerrado — siga para a negociação." : "Fique com o cliente. Não deixe ele sozinho na mesa."}
                  </p>
                  <button onClick={() => set("esperaIniciadaEm", null)} className="mt-3 text-[12px] underline" style={{ color: C.mute }}>Reiniciar</button>
                </div>
              )}
            </Bloco>

            <Bloco titulo="Anote o que ouvir" sub="O que ele falar aqui é o argumento que você usa na hora do extrato.">
              <textarea rows={5} className={inputCls} style={inputSty} value={f.notasEspera} onChange={(e) => set("notasEspera", e.target.value)}
                placeholder="Precisa do dinheiro até sexta. Mulher não sabe da dívida. Já tentou vender há 2 meses…" />
            </Bloco>

            <Bloco titulo="Escutar a conversa" sub="Transcreve o que for dito e destaca os ganchos. O cliente precisa autorizar antes — é a condição do parecer.">
              <EscutaPainel escuta={escuta} f={f} set={set} />
            </Bloco>
          </>
        )}

        {/* ---------- N ---------- */}
        {etapa === "N" && (() => {
          /* O caminho é uma fila só, e a tela mostra um passo de cada
             vez: extrato 1 → contra 1 → 5 min → extrato 2 → contra 2 →
             5 min → extrato 3 → pré-contrato. Antes disso tudo
             aparecia junto e o negociador tinha que lembrar da ordem. */
          const R = f.rodadas;
          const n = R.length;
          const atual = n ? R[n - 1] : null;
          const faltaContra = !!atual && !atual.contra;
          const podeContar = !!atual && !!atual.contra && !atual.esperaEm && n < 3;
          const sobra = atual && atual.esperaEm
            ? Math.max(0, RODADA_SEG - Math.floor((agora - atual.esperaEm) / 1000))
            : null;
          const noRelogio = sobra != null && sobra > 0;
          const liberado = n === 0 || (n < 3 && !!atual.contra && sobra === 0);
          const fim = n === 3;

          const passo = (num, rot, estado) => (
            <div className="flex items-center gap-2">
              <span className="flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[10px] font-bold"
                style={{ background: estado === "feito" ? C.verde : estado === "agora" ? C.roxo : "#E7E3EC",
                         color: estado === "espera" ? C.mute : "#fff" }}>
                {estado === "feito" ? "✓" : num}
              </span>
              <span className="text-[11px]" style={{ color: estado === "espera" ? C.mute : C.ink, fontWeight: estado === "agora" ? 700 : 400 }}>{rot}</span>
            </div>
          );

          return (
          <>
            {gap != null && (
              <div className="rounded-lg p-3" style={{ background: C.roxoFraco, border: `1px solid ${C.line}` }}>
                <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Gap de abertura</div>
                <div className="mt-0.5 text-[22px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>{gap}%</div>
                <div className="mt-1 text-[11px]" style={{ color: C.mute }}>
                  Primeiro extrato {brl(f.rodadas[0].impresso)} contra pretensão de {brl(f.pretensao)}.
                </div>
              </div>
            )}

            {/* o caminho, sempre à vista */}
            <div className="rounded-lg p-3" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
              <div className="flex flex-wrap gap-x-4 gap-y-1.5">
                {[1, 2, 3].map((k) => (
                  <React.Fragment key={k}>
                    {passo(k, `Extrato ${k}`, n >= k ? "feito" : (liberado && n === k - 1 ? "agora" : "espera"))}
                    {k < 3 && passo("↓", `Contra ${k}`, (R[k - 1] && R[k - 1].contra) ? "feito" : (faltaContra && n === k ? "agora" : "espera"))}
                    {k < 3 && passo("⏱", "5 min", (R[k - 1] && R[k - 1].esperaEm && (n > k || sobra === 0)) ? "feito" : ((podeContar || noRelogio) && n === k ? "agora" : "espera"))}
                  </React.Fragment>
                ))}
                {passo("✎", "Pré-contrato", fim ? "agora" : "espera")}
              </div>
            </div>

            {/* 1. o extrato da vez */}
            {liberado && (
              <Bloco titulo={`Extrato de ofertas — ${n + 1}º de três`}
                sub="Sorteie a rodada e imprima. A folha sai igual ao que está aqui.">
                <SimuladorPropostas
                  alvoPadrao={f.por || f.fipe} veiculo={f.modelo} negociador={f.negociador}
                  rotuloImprimir={`Imprimir o ${n + 1}º extrato e seguir`}
                  aoImprimir={(r) => {
                    set("rodadas", [...f.rodadas, { impresso: String(r.melhor), contra: "", esperaEm: null }]);
                    gerarDocumento("extrato_ofertas", `Extrato de ofertas ${n + 1}`, extratoOfertas(dadosDoc, r, n + 1), n + 1);
                  }} />
              </Bloco>
            )}

            {/* 2. a contraproposta do cliente */}
            {faltaContra && (
              <Bloco titulo={`Contraproposta ${n}`}
                sub={`Você levou ${brl(atual.impresso)} para a mesa. Quanto ele pediu?`}>
                <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 18 }}
                  inputMode="numeric" placeholder="Quanto o cliente pediu"
                  value={novaRodada.contra}
                  onChange={(e) => setNovaRodada({ ...novaRodada, contra: e.target.value })} />
                <button
                  onClick={() => {
                    if (!novaRodada.contra.trim()) return;
                    const copia = f.rodadas.slice();
                    copia[n - 1] = { ...atual, contra: novaRodada.contra.trim() };
                    set("rodadas", copia);
                    setNovaRodada({ impresso: "", contra: "" });
                  }}
                  className="mt-2 w-full rounded-md py-3 text-[14px] font-semibold"
                  style={{ background: C.roxo, color: "#fff" }}>
                  Registrar a contraproposta
                </button>
                <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
                  É este número que vai para o termo de aceite — não o que a loja imprimiu.
                </p>
              </Bloco>
            )}

            {/* 3. os cinco minutos */}
            {(podeContar || noRelogio) && (
              <Bloco titulo="Cinco minutos com a mesa"
                sub="O tempo em que você some para consultar. Sem ele, o próximo extrato sai na hora e o cliente entende que o número já estava pronto.">
                {podeContar ? (
                  <button onClick={() => {
                      const copia = f.rodadas.slice();
                      copia[n - 1] = { ...atual, esperaEm: Date.now() };
                      set("rodadas", copia);
                    }}
                    className="w-full rounded-md py-3 text-[14px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                    Iniciar os 5 minutos
                  </button>
                ) : (
                  <div className="text-center">
                    <div className="text-[46px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>
                      {mmss(sobra)}
                    </div>
                    <p className="mt-2 text-[12px]" style={{ color: C.mute }}>Fique com o cliente. Volte com o próximo extrato.</p>
                    <button onClick={() => {
                        const copia = f.rodadas.slice();
                        copia[n - 1] = { ...atual, esperaEm: Date.now() - RODADA_SEG * 1000 };
                        set("rodadas", copia);
                      }}
                      className="mt-3 text-[12px] underline" style={{ color: C.mute }}>pular o tempo</button>
                  </div>
                )}
              </Bloco>
            )}

            {/* 4. acabaram as três: vai para o fechamento */}
            {fim && (
              <Bloco titulo="Três rodadas feitas" sub="Daqui o caminho é o pré-contrato, no Tome a iniciativa.">
                <button disabled={!podeImprimir}
                  onClick={() => gerarDocumento("pre_contrato", "Pré-contrato", preContrato(dadosDoc))}
                  className="w-full rounded-md py-3 text-[14px] font-semibold"
                  style={{ background: podeImprimir ? C.roxo : "#E7E3EC", color: podeImprimir ? "#fff" : C.mute }}>
                  {podeImprimir ? "Imprimir o pré-contrato" : "Pré-contrato — complete o cliente na Pesquisa"}
                </button>
                <button onClick={() => setEtapa("T")}
                  className="mt-2 w-full rounded-md border py-2.5 text-[13px] font-semibold"
                  style={{ borderColor: C.roxo, color: C.roxo }}>
                  Ir para o Tome a iniciativa
                </button>
              </Bloco>
            )}

            {/* o histórico das rodadas, compacto */}
            {n > 0 && (
              <Bloco titulo="As rodadas até aqui" sub="Cada extrato impresso e o que o cliente respondeu.">
                <div className="space-y-2">
                  {R.map((r, i) => (
                    <div key={i} className="rounded-md p-3" style={{ background: "#FBFAFC", border: `1px dashed ${C.line}` }}>
                      <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>{i + 1}º extrato</div>
                      <div className="mt-1 flex items-baseline justify-between">
                        <span className="text-[17px]" style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(r.impresso)}</span>
                        <span className="text-[11px]" style={{ color: C.mute }}>impresso</span>
                      </div>
                      {r.contra && (
                        <div className="mt-1 flex items-baseline justify-between">
                          <span className="text-[17px]" style={{ fontFamily: F.mono, fontWeight: 700, color: C.laranja }}>{brl(r.contra)}</span>
                          <span className="text-[11px]" style={{ color: C.mute }}>contra do cliente</span>
                        </div>
                      )}
                      <button disabled={!podeImprimir}
                        onClick={() => gerarDocumento("termo_aceite", `Termo de aceite ${i + 1}`, termoAceite(dadosDoc, r, i + 1), i + 1)}
                        className="mt-2 w-full rounded-md border py-1.5 text-[11px] font-semibold"
                        style={{ borderColor: podeImprimir ? C.roxo : C.line, color: podeImprimir ? C.roxo : C.mute }}>
                        {podeImprimir ? "Termo de aceite" : "Termo de aceite — complete o cliente na Pesquisa"}
                      </button>
                      {docsDe("extrato_ofertas", i + 1).concat(docsDe("termo_aceite", i + 1)).map((d, k) => (
                        <div key={k} className="mt-1 text-[10px]" style={{ color: C.verde }}>
                          {d.rotulo} às {hhmm(d.em)}{d.protocolo ? ` · ${d.protocolo}` : ""}{d.noBanco ? "" : " · fora do banco"}
                        </div>
                      ))}
                    </div>
                  ))}
                  {erroDoc && <p className="text-[12px]" style={{ color: C.laranja }}>{erroDoc}</p>}
                </div>
              </Bloco>
            )}

            <Bloco titulo="Escutar a conversa" sub="Os ganchos do que ele falar aqui são o argumento da próxima rodada.">
              <EscutaPainel escuta={escuta} f={f} set={set} />
            </Bloco>

            <Bloco titulo="Objeção principal" sub="O que travou a conversa.">
              <select className={inputCls} style={inputSty} value={f.objecao} onChange={(e) => set("objecao", e.target.value)}>
                {OBJECOES.map((o) => <option key={o}>{o}</option>)}
              </select>
              <div className="mt-3">
                <Pendente>
                  Os argumentos sugeridos por IA para cada objeção entram aqui. Precisam da matéria-prima: quais objeções aparecem e o que funciona contra cada uma, coletado com os negociadores.
                </Pendente>
              </div>
            </Bloco>
          </>
          );
        })()}

        {/* ---------- T ---------- */}
        {etapa === "T" && (
          <>
            {/* Primeiro de propósito, a pedido do Derek: é aqui que o
                valor fecha. O pré-contrato e o contrato final saem com
                esse número, e documento gerado com valor que ainda vai
                mudar é documento para refazer. */}
            <Bloco titulo="Quanto fechou" sub="Este número vai para o pré-contrato, para o contrato e para a conta abaixo.">
              <div className="grid grid-cols-2 gap-2.5">
                <Campo label="Valor fechado" req>
                  <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
                    value={f.valorFechado} onChange={(e) => set("valorFechado", e.target.value)} />
                </Campo>
                <Campo label="Forma">
                  <select className={inputCls} style={inputSty} value={f.formaFechamento} onChange={(e) => set("formaFechamento", e.target.value)}>
                    {FECHAMENTO.map((o) => <option key={o}>{o}</option>)}
                  </select>
                </Campo>
              </div>
            </Bloco>

            <Bloco titulo="Check list do negócio" sub="A conta do negócio e os dados bancários. Preenchido aqui, não no papel — o administrativo confere na tela dele depois, e o sistema carimba quem conferiu.">
              <ChecklistDigital atendimentoId={atendimento ? atendimento.id : null}
                ficha={f} perfil={perfil} aoCarregar={setChecklist} />
            </Bloco>

            <Bloco titulo="Pré-contrato e cautelar"
              sub="O pré-contrato é assinado antes de o carro ir para a cautelar — é ele que segura o negócio enquanto o laudo não sai.">
              <div className="space-y-2.5">
                <Toggle label="Aceite final assinado" valor={f.aceiteFinal} onChange={(v) => set("aceiteFinal", v)} />
                <Toggle label="Carro enviado para a cautelar" valor={f.cautelarEnviado} onChange={(v) => set("cautelarEnviado", v)} />
                <div className="grid grid-cols-2 gap-2">
                  <button disabled={!podeImprimir}
                    onClick={() => gerarDocumento("autorizacao_cautelar", "Autorização de cautelar", autorizacaoCautelar(dadosDoc), null)}
                    className="rounded-md border py-2 text-[12px] font-semibold"
                    style={{ borderColor: podeImprimir ? C.roxo : C.line, color: podeImprimir ? C.roxo : C.mute }}>
                    Autorização de cautelar
                  </button>
                  <button disabled={!podeImprimir || !f.valorFechado}
                    onClick={() => gerarDocumento("pre_contrato", "Pré-contrato", preContrato(dadosDoc), null)}
                    className="rounded-md border py-2 text-[12px] font-semibold"
                    style={{ borderColor: podeImprimir && f.valorFechado ? C.roxo : C.line, color: podeImprimir && f.valorFechado ? C.roxo : C.mute }}>
                    Pré-contrato
                  </button>
                </div>
                {!podeImprimir && (
                  <p className="text-[11px]" style={{ color: AMARELO.texto }}>
                    Falta {faltamCliente.map((x) => x[1]).join(" · ")} do cliente — preencha na etapa Pesquisa para liberar a impressão.
                  </p>
                )}
                {podeImprimir && !f.valorFechado && (
                  <p className="text-[11px]" style={{ color: C.mute }}>
                    O pré-contrato precisa do valor fechado — é a cláusula que dá objeto ao documento.
                  </p>
                )}
                {erroDoc && <p className="text-[12px]" style={{ color: C.laranja }}>{erroDoc}</p>}
                {!!docs.length && (
                  <div className="rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                    <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Documentos gerados</div>
                    <div className="mt-1.5 space-y-1">
                      {docs.map((d, k) => (
                        <div key={k} className="flex items-baseline justify-between gap-2">
                          <span className="text-[12px]">{d.rotulo}</span>
                          <span className="text-[10px]" style={{ color: d.noBanco ? C.mute : C.laranja, fontFamily: F.mono }}>
                            {hhmm(d.em)}{d.noBanco ? "" : " · fora do banco"}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <button disabled={!podeImprimir}
                  onClick={() => gerarDocumento("check_list", "Check list", checkList(dadosDoc, checklist), null)}
                  className="w-full rounded-md border py-2 text-[12px] font-semibold"
                  style={{ borderColor: C.line, color: podeImprimir ? C.roxo : C.mute }}>
                  Check list do negócio
                </button>
                <p className="text-[11px] leading-relaxed" style={{ color: C.mute }}>
                  Os documentos saem com o texto que a casa assina e com os dados do cliente preenchidos. Só os dados bancários ficam em branco: o sistema não guarda conta nem chave PIX.
                </p>
              </div>
            </Bloco>

            {/* A cautelar pode reprovar, e aí a negociação reabre.
                Este passo fica entre o pré-contrato e o contrato: é
                onde o negócio combinado ou confirma ou volta à mesa. */}
            {f.cautelarEnviado && (
              <Bloco titulo="Resultado da cautelar"
                sub="O laudo chegou? É aqui que o negócio confirma ou volta para a mesa.">
                {!f.cautelarResultado ? (
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => set("cautelarResultado", "aprovada")}
                      className="rounded-md py-3 text-[13px] font-semibold" style={{ background: C.verde, color: "#fff" }}>
                      Aprovada
                    </button>
                    <button onClick={() => set("cautelarResultado", "reprovada")}
                      className="rounded-md py-3 text-[13px] font-semibold" style={{ background: C.laranja, color: "#fff" }}>
                      Reprovada
                    </button>
                  </div>
                ) : (
                  <div>
                    <div className="flex items-center justify-between gap-2 rounded-md px-3 py-2"
                      style={{ background: f.cautelarResultado === "aprovada" ? "#F0F8F4" : AMARELO.fundo,
                               border: `1px solid ${f.cautelarResultado === "aprovada" ? C.verde : AMARELO.borda}` }}>
                      <span className="text-[13px] font-semibold"
                        style={{ color: f.cautelarResultado === "aprovada" ? C.verde : AMARELO.texto }}>
                        {f.cautelarResultado === "aprovada"
                          ? "Cautelar aprovada — segue para o contrato."
                          : "Cautelar reprovada — o valor precisa ser refeito."}
                      </span>
                      <button onClick={() => setVarios({ cautelarResultado: "", cautelarLaudo: "" })}
                        className="shrink-0 text-[11px] underline" style={{ color: C.mute }}>trocar</button>
                    </div>

                    {f.cautelarResultado === "reprovada" && (
                      <div className="mt-3 space-y-3">
                        <Campo label="O que apareceu no laudo">
                          <textarea rows={2} className={inputCls} style={inputSty}
                            placeholder="Estrutural na longarina direita, troca de teto…"
                            value={f.cautelarLaudo} onChange={(e) => set("cautelarLaudo", e.target.value)} />
                        </Campo>

                        <div className="rounded-md p-3" style={{ background: "#FBF7FD", border: `1px solid ${C.line}` }}>
                          <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.roxo }}>
                            Novo extrato para o cliente
                          </div>
                          <p className="mt-1 text-[11px]" style={{ color: C.mute }}>
                            A rede refaz a oferta com o laudo na mão. Coloque quanto passa a valer e imprima.
                          </p>
                          <div className="mt-2">
                            <SimuladorPropostas
                              alvoPadrao={f.valorFechado} veiculo={f.modelo} negociador={f.negociador}
                              rotuloImprimir={`Imprimir o extrato da revisão ${(f.revisoes || []).length + 1}`}
                              aoImprimir={(r) => {
                                const n = (f.revisoes || []).length + 1;
                                setVarios({
                                  revisoes: [...(f.revisoes || []), { valor: String(r.melhor), em: new Date().toISOString() }],
                                  valorFechado: String(r.melhor),
                                });
                                gerarDocumento("extrato_revisao", `Extrato da revisão ${n}`,
                                  extratoOfertas(dadosDoc, r, n, "Extrato de ofertas — revisão após a cautelar"), null);
                              }} />
                          </div>
                        </div>

                        {!!(f.revisoes || []).length && (
                          <div className="rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                            <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Revisões</div>
                            {f.revisoes.map((rv, k) => (
                              <div key={k} className="mt-1 flex items-baseline justify-between">
                                <span className="text-[13px]" style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(rv.valor)}</span>
                                <span className="text-[10px]" style={{ color: C.mute }}>{hhmm(rv.em)}</span>
                              </div>
                            ))}
                          </div>
                        )}

                        <button disabled={!podeImprimir || !f.valorFechado}
                          onClick={() => gerarDocumento("pre_contrato", "Pré-contrato (revisão)", preContrato(dadosDoc), null)}
                          className="w-full rounded-md py-3 text-[13px] font-semibold"
                          style={{ background: podeImprimir && f.valorFechado ? C.roxo : "#E7E3EC",
                                   color: podeImprimir && f.valorFechado ? "#fff" : C.mute }}>
                          Imprimir o novo pré-contrato
                        </button>
                        <p className="text-[11px]" style={{ color: C.mute }}>
                          O pré-contrato anterior morreu com o laudo. Este é o que vale, e sai com o valor novo — o contrato só vem depois dele assinado.
                        </p>
                      </div>
                    )}
                  </div>
                )}
              </Bloco>
            )}

            <Bloco titulo="Anexos do fechamento"
              sub="Comprovante de residência, laudo da cautelar e comprovante de pagamento.">
              <Anexos atendimentoId={atendimento ? atendimento.id : null}
                rotulos={["Comprovante de residência", "Laudo cautelar", "Comprovante de pagamento", "Contrato assinado", "Outro"]}
                key={guardados} />
            </Bloco>


            <Bloco titulo="Depois da cautelar">
              <div className="space-y-2.5">
                <Toggle label="Contrato assinado" valor={f.contratoAssinado} onChange={(v) => set("contratoAssinado", v)} />
              </div>
            </Bloco>

            {/* No fim de tudo, a pedido do Derek, e por dois motivos:
                o contrato carrega o valor e a conta bancária, que se
                fecham acima — documento gerado com número que ainda vai
                mudar é documento para refazer; e só faz sentido depois
                do laudo, porque antes disso o negócio ainda pode voltar
                à mesa. */}
            {f.cautelarResultado === "aprovada" && (
              <Bloco titulo="Contrato de aceite de proposta"
                sub="É o cliente que assina — ele vende o carro. Sai com a conta do negócio e os dados bancários que estão acima.">
                <div className="space-y-2.5">
                  {/* O renavam também aqui: ele não vem da consulta de
                      placa, e é no contrato que a falta aparece. Quem
                      descobre na hora não volta até a Pesquisa. */}
                  <Campo label="Renavam do carro" req>
                    <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
                      value={f.renavam} onChange={(e) => set("renavam", e.target.value)}
                      placeholder="do CRLV — o contrato pede" />
                  </Campo>

                  {/* O contrato qualifica o cliente com cidade, bairro,
                      CEP e UF separados, e a 0007 guardava tudo numa
                      linha só. Está tudo no CRLV que ele já anexou. */}
                  <Campo label="RG ou inscrição estadual">
                    <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }}
                      value={cliente.cliente_rg} onChange={(e) => setCliente({ ...cliente, cliente_rg: e.target.value })} />
                  </Campo>
                  <Campo label="Endereço">
                    <input className={inputCls} style={inputSty} placeholder="rua e número, do CRLV"
                      value={cliente.cliente_endereco} onChange={(e) => setCliente({ ...cliente, cliente_endereco: e.target.value })} />
                  </Campo>
                  <div className="grid grid-cols-2 gap-2.5">
                    <Campo label="Cidade">
                      <input className={inputCls} style={inputSty} value={cliente.cliente_cidade}
                        onChange={(e) => setCliente({ ...cliente, cliente_cidade: e.target.value })} />
                    </Campo>
                    <Campo label="UF">
                      <input className={inputCls} style={inputSty} maxLength={2} value={cliente.cliente_uf}
                        onChange={(e) => setCliente({ ...cliente, cliente_uf: e.target.value.toUpperCase() })} />
                    </Campo>
                    <Campo label="Bairro">
                      <input className={inputCls} style={inputSty} value={cliente.cliente_bairro}
                        onChange={(e) => setCliente({ ...cliente, cliente_bairro: e.target.value })} />
                    </Campo>
                    <Campo label="CEP">
                      <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
                        value={cliente.cliente_cep} onChange={(e) => setCliente({ ...cliente, cliente_cep: e.target.value })} />
                    </Campo>
                  </div>
                  <Campo label="E-mail do cliente — é para lá que vai a assinatura">
                    <input className={inputCls} style={inputSty} inputMode="email" value={cliente.cliente_email}
                      onChange={(e) => setCliente({ ...cliente, cliente_email: e.target.value })} />
                  </Campo>
                  <button onClick={salvarCliente} disabled={salvandoCliente}
                    className="w-full rounded-md border py-2 text-[12px] font-semibold"
                    style={{ borderColor: C.line, color: C.roxo }}>
                    {salvandoCliente ? "Salvando…" : "Salvar dados do cliente"}
                  </button>

                  {(() => {
                    const faltaCarro = [["renavam", "renavam"], ["placa", "placa"], ["chassi", "chassi"],
                                        ["marca", "marca"], ["modelo", "modelo"], ["cor", "cor"], ["km", "KM"]]
                      .filter(([k]) => !String(f[k] || "").trim()).map((x) => x[1]);
                    const faltaCli = !String(cliente.cliente_nome || "").trim() || !String(cliente.cliente_cpf || "").trim();
                    const pronto = !faltaCarro.length && !faltaCli && !!f.valorFechado;
                    return (
                      <>
                        <button disabled={!pronto}
                          onClick={() => gerarDocumento("contrato_final", "Contrato de aceite de proposta",
                            aceiteProposta({ ...dadosDoc, ...cliente }, checklist), null)}
                          className="w-full rounded-md py-3 text-[14px] font-semibold"
                          style={{ background: pronto ? C.roxo : "#E7E3EC", color: pronto ? "#fff" : C.mute }}>
                          Imprimir o contrato
                        </button>
                        {!pronto && (
                          <p className="text-[11px]" style={{ color: AMARELO.texto }}>
                            Falta{" "}
                            {[!!faltaCarro.length && `do carro: ${faltaCarro.join(", ")}`,
                              faltaCli && "nome e CPF do cliente",
                              !f.valorFechado && "o valor fechado"].filter(Boolean).join(" · ")}.
                          </p>
                        )}
                        {!checklist && (
                          <p className="text-[11px]" style={{ color: AMARELO.texto }}>
                            Salve o check list acima — a conta do negócio e os dados bancários saem dele, e sem ele o contrato imprime com essas tabelas em branco.
                          </p>
                        )}

                        <p className="text-[11px]" style={{ color: zapOk === false ? C.laranja : C.mute }}>
                          {zapOk === null ? "Conferindo a chave do ZapSign…"
                            : zapOk ? "Chave do ZapSign configurada."
                            : "A chave do ZapSign não chegou à Vercel. Confira a variável ZAPSIGN_TOKEN em Settings → Environment Variables e refaça o deploy."}
                        </p>
                        <button
                          disabled={!pronto || !!enviandoZap || (!cliente.cliente_email && !cliente.cliente_telefone)}
                          onClick={async () => {
                            setEnvioZap(""); setEnviandoZap(true);
                            try {
                              const r = await enviarParaAssinatura(atendimento.id, {
                                nome: `Aceite de proposta — ${f.placa || "sem placa"}`,
                                conteudo: aceiteProposta({ ...dadosDoc, ...cliente }, checklist),
                                signatarios: [{
                                  nome: cliente.cliente_nome,
                                  email: cliente.cliente_email,
                                  telefone: cliente.cliente_telefone,
                                }],
                              });
                              setEnvioZap(r.assinantes && r.assinantes.length
                                ? `Enviado. Link para ${r.assinantes[0].nome}: ${r.assinantes[0].link}`
                                : "Enviado ao ZapSign.");
                            } catch (e) { setEnvioZap(e.message); }
                            setEnviandoZap(false);
                          }}
                          className="w-full rounded-md border py-2.5 text-[13px] font-semibold"
                          style={{ borderColor: pronto ? C.roxo : C.line, color: pronto ? C.roxo : C.mute }}>
                          {enviandoZap ? "Enviando…" : "Enviar para o cliente assinar no ZapSign"}
                        </button>
                        {!cliente.cliente_email && !cliente.cliente_telefone && (
                          <p className="text-[11px]" style={{ color: C.mute }}>
                            O ZapSign precisa do e-mail ou do telefone do cliente para mandar o convite.
                          </p>
                        )}
                        {envioZap && (
                          <p className="text-[11px] leading-relaxed"
                            style={{ color: envioZap.indexOf("Enviado") === 0 ? C.verde : C.laranja, wordBreak: "break-all" }}>
                            {envioZap}
                          </p>
                        )}
                        {atendimento && atendimento.contrato_assinado_em && (
                          <div className="rounded-md p-3" style={{ background: "#F0F8F4", border: `1px solid ${C.verde}` }}>
                            <p className="text-[12px] font-semibold" style={{ color: C.verde }}>
                              Contrato assinado em {new Date(atendimento.contrato_assinado_em).toLocaleString("pt-BR")}.
                            </p>
                            <button
                              disabled={!!guardandoVia}
                              onClick={async () => {
                                setErroVia(""); setGuardandoVia(true);
                                try {
                                  const d = await guardarContratoAssinado(atendimento.id);
                                  setErroVia(d.ja_guardado ? "A via assinada já está nos anexos." : "Guardado nos anexos do fechamento.");
                                  setGuardados((n) => n + 1);
                                } catch (e) { setErroVia(e.message); }
                                setGuardandoVia(false);
                              }}
                              className="mt-2 w-full rounded-md py-2 text-[12px] font-semibold"
                              style={{ background: guardandoVia ? C.line : C.verde, color: "#fff" }}>
                              {guardandoVia ? "Guardando…" : "Guardar a via assinada nos anexos"}
                            </button>
                            {erroVia && <p className="mt-1 text-[11px]" style={{ color: C.mute }}>{erroVia}</p>}
                          </div>
                        )}
                      </>
                    );
                  })()}
                </div>
              </Bloco>
            )}
          </>
        )}

        {/* ---------- E ---------- */}
        {etapa === "E" && (
          <>
            <Bloco titulo="Avaliação no Google" sub="Mostre o QR para o cliente ler na hora, ainda na loja. Avaliação pedida depois, por mensagem, quase nunca sai.">
              <div className="flex flex-col items-center">
                <img src={qrDe(AVALIACAO_LINK, 260)} alt="QR da avaliação da Vaapty no Google"
                  className="block rounded-lg" style={{ width: 200, height: 200, border: `1px solid ${C.line}`, background: "#fff" }} />
                <p className="mt-2 text-center text-[11px]" style={{ color: C.mute }}>
                  Aponte a câmera do cliente para o código.
                </p>
              </div>

              <div className="mt-3 space-y-2">
                <input readOnly className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 11 }}
                  value={AVALIACAO_LINK} onFocus={(e) => e.target.select()} />
                <div className="flex gap-2">
                  <button onClick={() => copiar(AVALIACAO_LINK, "av")}
                    className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
                    style={{ background: C.roxo, color: "#fff" }}>
                    {copiado === "av" ? "Link copiado" : "Copiar link"}
                  </button>
                  <a href={AVALIACAO_LINK} target="_blank" rel="noopener noreferrer"
                    className="flex-1 rounded-md border py-2.5 text-center text-[13px] font-semibold"
                    style={{ borderColor: C.line, color: C.roxo }}>
                    Abrir
                  </a>
                </div>
              </div>

              <div className="mt-3">
                <Toggle label="Pedi a avaliação no Google" nota="Entra no score do negociador." valor={f.avaliacaoGoogle} onChange={(v) => set("avaliacaoGoogle", v)} />
              </div>
            </Bloco>

            <Bloco titulo={`Indicações — ${f.indicacoes.length} de 10`} sub="Quem ele conhece que tem carro. A lista vai para a pré-venda com a promessa do brinde.">
              <div className="space-y-2">
                {f.indicacoes.map((p, i) => (
                  <div key={i} className="flex items-center justify-between rounded-md px-3 py-2" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                    <span className="text-[13px]">{p.nome}<span className="ml-2 text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>{p.fone}</span>
                      {p.enviada && <span className="ml-2 text-[10px]" style={{ color: C.verde }}>enviada</span>}</span>
                    <button onClick={() => set("indicacoes", f.indicacoes.filter((_, x) => x !== i))} className="text-[11px]" style={{ color: C.laranja }}>remover</button>
                  </div>
                ))}
                {f.indicacoes.length < 10 && (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <input placeholder="Nome" className={inputCls} style={inputSty} value={novaInd.nome} onChange={(e) => setNovaInd({ ...novaInd, nome: e.target.value })} />
                      <input placeholder="Telefone" className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="tel" value={novaInd.fone} onChange={(e) => setNovaInd({ ...novaInd, fone: e.target.value })} />
                    </div>
                    <button onClick={() => { if (!novaInd.nome.trim()) return; set("indicacoes", [...f.indicacoes, novaInd]); setNovaInd({ nome: "", fone: "" }); }}
                      className="w-full rounded-md py-2.5 text-[13px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>Adicionar indicação</button>
                  </>
                )}
                {f.indicacoes.some((p) => !p.enviada) && (
                  <button
                    onClick={async () => {
                      const pendentes = f.indicacoes.filter((p) => !p.enviada && p.nome && p.nome.trim());
                      if (!pendentes.length) return;
                      setEnvioLeads("indo");
                      try {
                        await enviarIndicacoes(pendentes.map((p) => ({
                          atendimento_id: atendimento ? atendimento.id : null,
                          nome: p.nome,
                          telefone: p.fone,
                          negociador_nome: (atendimento && atendimento.negociador_nome) || (perfil && perfil.nome) || null,
                          cliente_nome: (atendimento && atendimento.cliente_nome) || null,
                          cliente_telefone: (atendimento && atendimento.cliente_telefone) || null,
                        })));
                        // Marcar as enviadas é o que impede a segunda
                        // batida no botão de duplicar a fila da pré-venda.
                        set("indicacoes", f.indicacoes.map((p) => (p.enviada ? p : { ...p, enviada: true })));
                        setEnvioLeads("ok");
                      } catch (e) { setEnvioLeads(e.message); }
                    }}
                    className="w-full rounded-md border py-2.5 text-[13px] font-semibold"
                    style={{ borderColor: C.roxo, color: C.roxo }}>
                    {envioLeads === "indo" ? "Enviando…"
                      : `Enviar ${f.indicacoes.filter((p) => !p.enviada).length} para a pré-venda`}
                  </button>
                )}
                {envioLeads && envioLeads !== "indo" && (
                  <p className="text-[11px]" style={{ color: envioLeads === "ok" ? C.verde : C.laranja }}>
                    {envioLeads === "ok" ? "Na fila da pré-venda." : envioLeads}
                  </p>
                )}
                {f.indicacoes.length > 0 && f.indicacoes.every((p) => p.enviada) && (
                  <p className="text-[11px]" style={{ color: C.verde }}>Todas já foram para a fila da pré-venda.</p>
                )}
              </div>
            </Bloco>
          </>
        )}
      </div>

      {/* navegação */}
      <div className="fixed bottom-0 left-0 right-0 flex gap-2 px-4 py-3" style={{ background: C.paper, borderTop: `1px solid ${C.line}` }}>
        <button onClick={() => idx > 0 && setEtapa(ETAPAS[idx - 1].id)} disabled={idx === 0}
          className="rounded-md border px-4 py-2.5 text-[13px] font-semibold" style={{ borderColor: C.line, color: idx === 0 ? C.line : C.mute }}>
          Voltar
        </button>
        <button onClick={() => idx < ETAPAS.length - 1 && setEtapa(ETAPAS[idx + 1].id)} disabled={idx === ETAPAS.length - 1}
          className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
          style={{ background: idx === ETAPAS.length - 1 ? C.line : C.roxo, color: "#fff" }}>
          {idx === ETAPAS.length - 1 ? "Fim do atendimento" : `Ir para ${ETAPAS[idx + 1].curto}`}
        </button>
      </div>
    </div>
  );
}


/**
 * O status é o que faz a lista do CRM valer. Sem isto tudo fica
 * "aberto" para sempre e o funil não conta nada.
 */
function StatusAtendimento({ valor, aoMudar, erro }) {
  const legado = valor && !STATUS_AT.some((x) => x[0] === valor);
  return (
    <div className="px-4 pt-3">
      <div className="rolar flex gap-1.5 overflow-x-auto">
        {legado && (
          <span className="shrink-0 rounded-full px-3 py-1.5 text-[11px]"
            style={{ background: "#8A8394", color: "#fff", border: "1px solid #8A8394" }}>
            {rotuloStatus(valor)}
          </span>
        )}
        {STATUS_AT.map(([val, rot]) => (
          <button key={val} onClick={() => aoMudar(val)}
            className="shrink-0 rounded-full px-3 py-1.5 text-[11px]"
            style={{ background: valor === val ? corStatus(val) : "#fff", color: valor === val ? "#fff" : C.mute,
                     border: `1px solid ${valor === val ? corStatus(val) : C.line}` }}>
            {rot}
          </button>
        ))}
      </div>
      {erro && <p className="mt-1 text-[11px]" style={{ color: C.laranja }}>{erro}</p>}
    </div>
  );
}
