                          </p>
                          <div className="mt-2">
                            <SimuladorPropostas
                              alvoPadrao={f.valorFechado} veiculo={f.modelo} negociador={f.negociador}
                              rotuloImprimir={`Imprimir o extrato da revisão ${(f.revisoes || []).length + 1}`}
                              aoImprimir={(r) => {
                                const n = (f.revisoes || []).length + 1;
                                setVarios({
                                  revisoes: [...(f.revisoes || []), { valor: String(r.melhor), em: new Date().toISOString() }],
                                  valorFechado: String(r.melhor),
                                });
                                gerarDocumento("extrato_revisao", `Extrato da revisão ${n}`,
                                  extratoOfertas(dadosDoc, r, n, "Extrato de ofertas — revisão após a cautelar"), null);
                              }} />
                          </div>
                        </div>

                        {!!(f.revisoes || []).length && (
                          <div className="rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                            <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Revisões</div>
                            {f.revisoes.map((rv, k) => (
                              <div key={k} className="mt-1 flex items-baseline justify-between">
                                <span className="text-[13px]" style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(rv.valor)}</span>
                                <span className="text-[10px]" style={{ color: C.mute }}>{hhmm(rv.em)}</span>
                              </div>
                            ))}
                          </div>
                        )}

                        <button disabled={!podeImprimir || !f.valorFechado}
                          onClick={() => gerarDocumento("pre_contrato", "Pré-contrato (revisão)", preContrato(dadosDoc), null)}
                          className="w-full rounded-md py-3 text-[13px] font-semibold"
                          style={{ background: podeImprimir && f.valorFechado ? C.roxo : "#E7E3EC",

                          Imprimir o novo pré-contrato
                        </button>
                        <p className="text-[11px]" style={{ color: C.mute }}>

                        </p>
                      </div>
                    )}
                  </div>
                )}
              </Bloco>

            <Bloco titulo="Check list do negócio" sub="Preenchido aqui, não no papel. O administrativo confere na mesma tela depois, e o sistema carimba quem conferiu.">

                ficha={f} perfil={perfil} aoCarregar={setChecklist} />
            </Bloco>

            <Bloco titulo="Depois da cautelar">
              <div className="space-y-2.5">
                <Toggle label="Contrato assinado" valor={f.contratoAssinado} onChange={(v) => set("contratoAssinado", v)} />
                <Pendente>
                  Assinatura pelo ZapSign entra neste ponto, junto com o anexo dos documentos da negociação. Depende do backend: contrato assinado precisa ficar guardado e recuperável.
                </Pendente>
              </div>
            </Bloco>
          </>
        )}

        {/* ---------- E ---------- */}
        {etapa === "E" && (
          <>
            <Bloco titulo="Avaliação no Google" sub="Mostre o QR para o cliente ler na hora, ainda na loja. Avaliação pedida depois, por mensagem, quase nunca sai.">
              <div className="flex flex-col items-center">
                <img src={qrDe(AVALIACAO_LINK, 260)} alt="QR da avaliação da Vaapty no Google"
                  className="block rounded-lg" style={{ width: 200, height: 200, border: `1px solid ${C.line}`, background: "#fff" }} />
                <p className="mt-2 text-center text-[11px]" style={{ color: C.mute }}>

              </div>

              <div className="mt-3 space-y-2">
                <input readOnly className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 11 }}
                  value={AVALIACAO_LINK} onFocus={(e) => e.target.select()} />
                <div className="flex gap-2">
                  <button onClick={() => copiar(AVALIACAO_LINK, "av")}
                    className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
                    style={{ background: C.roxo, color: "#fff" }}>
                    {copiado === "av" ? "Link copiado" : "Copiar link"}
                  </button>

                    className="flex-1 rounded-md border py-2.5 text-center text-[13px] font-semibold"

              <div className="mt-3">
                <Toggle label="Pedi a avaliação no Google" nota="Entra no score do negociador." valor={f.avaliacaoGoogle} onChange={(v) => set("avaliacaoGoogle", v)} />

            </Bloco>

            <Bloco titulo={`Indicações — ${f.indicacoes.length} de 10`} sub="Quem ele conhece que tem carro. A lista vai para a pré-venda com a promessa do brinde.">
              <div className="space-y-2">
                {f.indicacoes.map((p, i) => (
                  <div key={i} className="flex items-center justify-between rounded-md px-3 py-2" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                    <span className="text-[13px]">{p.nome}<span className="ml-2 text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>{p.fone}</span>
                      {p.enviada && <span className="ml-2 text-[10px]" style={{ color: C.verde }}>enviada</span>}</span>
                    <button onClick={() => set("indicacoes", f.indicacoes.filter((_, x) => x !== i))} className="text-[11px]" style={{ color: C.laranja }}>remover</button>
                  </div>
                ))}
                {f.indicacoes.length < 10 && (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <input placeholder="Nome" className={inputCls} style={inputSty} value={novaInd.nome} onChange={(e) => setNovaInd({ ...novaInd, nome: e.target.value })} />
                      <input placeholder="Telefone" className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="tel" value={novaInd.fone} onChange={(e) => setNovaInd({ ...novaInd, fone: e.target.value })} />
                    </div>
                    <button onClick={() => { if (!novaInd.nome.trim()) return; set("indicacoes", [...f.indicacoes, novaInd]); setNovaInd({ nome: "", fone: "" }); }}
                      className="w-full rounded-md py-2.5 text-[13px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>Adicionar indicação</button>
                  </>
                )}
                {f.indicacoes.some((p) => !p.enviada) && (
                  <button
                    onClick={async () => {
                      const pendentes = f.indicacoes.filter((p) => !p.enviada && p.nome && p.nome.trim());
                      if (!pendentes.length) return;
                      setEnvioLeads("indo");
                      try {
                        await enviarIndicacoes(pendentes.map((p) => ({
                          atendimento_id: atendimento ? atendimento.id : null,
                          nome: p.nome,
                          telefone: p.fone,
                          negociador_nome: (atendimento && atendimento.negociador_nome) || (perfil && perfil.nome) || null,
                          cliente_nome: (atendimento && atendimento.cliente_nome) || null,
                          cliente_telefone: (atendimento && atendimento.cliente_telefone) || null,
                        })));
                        // Marcar as enviadas é o que impede a segunda
                        // batida no botão de duplicar a fila da pré-venda.
                        set("indicacoes", f.indicacoes.map((p) => (p.enviada ? p : { ...p, enviada: true })));
                        setEnvioLeads("ok");
                      } catch (e) { setEnvioLeads(e.message); }
                    }}
                    className="w-full rounded-md border py-2.5 text-[13px] font-semibold"
                    style={{ borderColor: C.roxo, color: C.roxo }}>
                    {envioLeads === "indo" ? "Enviando…"
                      : `Enviar ${f.indicacoes.filter((p) => !p.enviada).length} para a pré-venda`}
                  </button>
                )}
                {envioLeads && envioLeads !== "indo" && (
                  <p className="text-[11px]" style={{ color: envioLeads === "ok" ? C.verde : C.laranja }}>
                    {envioLeads === "ok" ? "Na fila da pré-venda." : envioLeads}
                  </p>
                )}
                {f.indicacoes.length > 0 && f.indicacoes.every((p) => p.enviada) && (
                  <p className="text-[11px]" style={{ color: C.verde }}>Todas já foram para a fila da pré-venda.</p>
                )}
              </div>
            </Bloco>
          </>
        )}
      </div>

      {/* navegação */}
      <div className="fixed bottom-0 left-0 right-0 flex gap-2 px-4 py-3" style={{ background: C.paper, borderTop: `1px solid ${C.line}` }}>
        <button onClick={() => idx > 0 && setEtapa(ETAPAS[idx - 1].id)} disabled={idx === 0}
          className="rounded-md border px-4 py-2.5 text-[13px] font-semibold" style={{ borderColor: C.line, color: idx === 0 ? C.line : C.mute }}>
          Voltar
        </button>
        <button onClick={() => idx < ETAPAS.length - 1 && setEtapa(ETAPAS[idx + 1].id)} disabled={idx === ETAPAS.length - 1}
          className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
          style={{ background: idx === ETAPAS.length - 1 ? C.line : C.roxo, color: "#fff" }}>
          {idx === ETAPAS.length - 1 ? "Fim do atendimento" : `Ir para ${ETAPAS[idx + 1].curto}`}
        </button>
      </div>
    </div>
  );
}

const numeroBR = (v) => {
  let t = String(v == null ? "" : v).replace(/R\$|\s/g, "").trim();

/**
 * ===== escuta da conversa =====
 *
 * O parecer jurídico saiu em 28/08/2026 e a condição é uma só: o
 * consentimento do cliente vem antes. Por isso o botão do microfone
 * nasce desligado e só acende depois do toggle — não é enfeite, é a
 * base legal. Quem trocar a ordem, ou ligar a escuta sem o toggle,
 * derruba o parecer inteiro.
 *
 * O consentimento fica registrado com data e hora (`escutaEm`), que é
 * o que se mostra se alguém perguntar quando o cliente autorizou.
 *
 * O QUE ISTO É, EXATAMENTE:
 *   · a transcrição usa o reconhecimento de voz do próprio navegador
 *     (`SpeechRecognition`). Sem biblioteca, sem endpoint novo — e a
 *     Vercel já está em 12 de 12 funções.
 *   · **o áudio vai para o serviço de voz da Google ou da Apple**,
 *     conforme o navegador. Não é processamento local, e está escrito
 *     na tela de consentimento porque o cliente precisa saber disso.
 *   · nós não gravamos áudio em lugar nenhum. Só o texto fica, e fica
 *     no aparelho, junto com o resto do atendimento.
 *   · os "sinais" abaixo são busca por palavra, não modelo de
 *     linguagem. Chamar isso de IA na frente de quem decide seria
 *     mentira. Um resumo de verdade precisa de um LLM, o que pede uma
 *     chave paga e uma função — hoje não cabe.
 *
 * Vale como está porque o que trava o negociador não é a falta de
 * resumo: é que ele não anota. O texto corrido mais o destaque de
 * "tem pressa" e "tem outra proposta" já é mais do que ele levaria
 * para a mesa de memória.
 */

const SINAIS = [
  { id: "pressa", rotulo: "Tem pressa", cor: "#C2410C",
    termos: ["preciso do dinheiro", "urgente", "com pressa", "essa semana", "ate sexta", "o quanto antes", "rapido", "hoje mesmo"] },
  { id: "concorrencia", rotulo: "Tem outra proposta", cor: "#B91C1C",
    termos: ["outra proposta", "me ofereceram", "outro lugar", "outra loja", "ja fui em", "olx", "webmotors", "na concorrencia"] },
  { id: "decisor", rotulo: "Decisor não está na mesa", cor: "#A16207",
    termos: ["minha esposa", "meu marido", "meu socio", "vou falar com", "preciso conversar com", "nao decido sozinho"] },
  { id: "divida", rotulo: "Tem dívida no carro", cor: "#7C3AED",
    termos: ["financiado", "financiamento", "parcelas", "devo", "quitar", "banco", "alienado", "em nome do banco"] },
  { id: "objecao", rotulo: "Achou pouco", cor: "#BE123C",
    termos: ["muito pouco", "ta baixo", "esta baixo", "esperava mais", "nao da", "vale mais", "e pouco"] },
  { id: "recuo", rotulo: "Está recuando", cor: "#4B5563",
    termos: ["vou pensar", "depois eu volto", "dar uma olhada", "outro dia", "te aviso"] },
  { id: "fechamento", rotulo: "Sinal de fechamento", cor: "#15803D",
    termos: ["se der", "eu fecho", "aceito", "pode ser", "fechado", "vamos fazer", "topo"] },
];

// O reconhecimento devolve "até" ou "ate" conforme o serviço, e a
// busca não pode depender disso. `semAcento` já existe lá em cima —
// declarar de novo aqui derrubaria a aplicação inteira, como quase
// aconteceu com o `brl` dos documentos.
const sinaisDe = (texto) => {
  const t = semAcento(texto).toLowerCase();
  return SINAIS.filter((s) => s.termos.some((termo) => t.indexOf(termo) >= 0));
};

/**
 * A escuta vive no atendimento inteiro, não na etapa.
 *
 * O Derek pediu que a autorização fosse pedida no começo e o microfone
 * atravessasse a negociação toda. Enquanto isto era um componente
 * dentro da etapa, trocar de etapa desmontava o componente e matava o
 * reconhecimento no meio da conversa — sem aviso nenhum.
 *
 * Por isso virou hook, chamado uma vez lá em cima no `VaaptyAponte`,
 * que fica montado do começo ao fim do atendimento. As etapas só
 * mostram o que ele já está fazendo. **Quem voltar a declarar isto
 * dentro de uma etapa reintroduz o corte.**
 */
function useEscuta(f, set) {
  const Rec = (typeof window !== "undefined") &&
    (window.SpeechRecognition || window.webkitSpeechRecognition);

  const [ouvindo, setOuvindo] = useState(false);
  const [parcial, setParcial] = useState("");
  const [erro, setErro] = useState("");
  const [desde, setDesde] = useState(null);
  const recRef = useRef(null);
  const ligadoRef = useRef(false);
  const textoRef = useRef(f.transcricao || "");
  // `set` muda de identidade a cada render; o callback do
  // reconhecimento não pode ficar preso na versão velha.
  const setRef = useRef(set);
  setRef.current = set;

  // O navegador encerra a sessão sozinho depois de um silêncio. Se
  // ainda estamos ligados, religa — senão a escuta morre no meio da
  // conversa sem ninguém perceber.
  const criar = () => {
    const r = new Rec();
    r.lang = "pt-BR";
    r.continuous = true;
    r.interimResults = true;
    r.onresult = (ev) => {
      let novoFinal = "", emAndamento = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const trecho = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) novoFinal += trecho + " ";
        else emAndamento += trecho;
      }
      setParcial(emAndamento);
      if (novoFinal) {
        // Só o trecho fechado vai para a ficha: gravar a cada palavra
        // provisória escreveria no localStorage dezenas de vezes por
        // minuto.
        textoRef.current = (textoRef.current + novoFinal).slice(-16000);
        setRef.current("transcricao", textoRef.current);
      }
    };
    r.onerror = (ev) => {
      const c = ev && ev.error;
      if (c === "not-allowed" || c === "service-not-allowed") {
        setErro("O navegador negou o microfone. Libere nas permissões do site.");
        ligadoRef.current = false;
        setOuvindo(false);
      } else if (c !== "no-speech" && c !== "aborted") {
        setErro("A escuta falhou: " + c);
      }
    };
    r.onend = () => {
      if (ligadoRef.current) { try { r.start(); } catch (e) { /* já rodando */ } }
      else setOuvindo(false);
    };
    return r;
  };

  const ligar = () => {
    if (!Rec || !f.escutaOk || ligadoRef.current) return;
    setErro("");
    ligadoRef.current = true;
    recRef.current = criar();
    try { recRef.current.start(); setOuvindo(true); setDesde(Date.now()); }
    catch (e) { setErro("Não consegui abrir o microfone."); ligadoRef.current = false; }
  };

  const desligar = () => {
    ligadoRef.current = false;
    setParcial(""); setDesde(null);
    if (recRef.current) { try { recRef.current.stop(); } catch (e) {} }
    setOuvindo(false);
  };

  // Sair do atendimento com o microfone aberto seria escuta sem
  // ninguém olhando. Aqui o desmonte é o fim do atendimento, não a
  // troca de etapa — que é exatamente a diferença.
  useEffect(() => () => {
    ligadoRef.current = false;
    if (recRef.current) { try { recRef.current.stop(); } catch (e) {} }
  }, []);

  const limpar = () => { textoRef.current = ""; set("transcricao", ""); setParcial(""); };

  return { Rec, ouvindo, parcial, erro, desde, ligar, desligar, limpar };
}

/**

 * aberto. É o que impede a escuta de rodar esquecida: quem olha a tela
 * vê que está ligada, em qualquer etapa.
 */
function BarraEscuta({ escuta }) {
  const { ouvindo, desligar, desde } = escuta;
  const [, forcar] = useState(0);
  useEffect(() => {
    if (!ouvindo) return;
    const t = setInterval(() => forcar((x) => x + 1), 1000);
    return () => clearInterval(t);
  }, [ouvindo]);
  if (!ouvindo) return null;
  const seg = desde ? Math.floor((Date.now() - desde) / 1000) : 0;
  return (
    <div className="flex items-center justify-between gap-3 px-4 py-1.5"

      <button onClick={desligar} className="text-[11px] underline">parar</button>
    </div>
  );
}

/**
 * ===== simulador de propostas =====
 *
 * Reproduz, célula por célula, a planilha "Simulador de Proposta" do
 * Derek. Dado o valor de referência do carro e quantas propostas se
 * quer ver, devolve a nuvem de valores no desenho que a rede costuma
 * responder — para treinar negociador novo e para demonstrar o
 * processo ao cliente sem esperar a rede real.
 *
 * A conta da planilha:
 *   Vmax      = arredonda(referência × 0,90)      teto do repasse
 *   Vmedio    = arredonda(Vmax × 0,90)            centro da nuvem
 *   intervalo = arredonda((Vmax − Vmedio) ÷ 5)    largura de um degrau
 *   V0        = Vmedio − 10 × intervalo           piso
 *   proposta  = V0 + sorteio(0..16) × intervalo × |sen(π·n/45)|
 * Tudo arredondado à centena, como lá.
 *
 * O seno é o que dá forma à nuvem, e é a parte que ninguém adivinha
 * olhando o resultado: a proposta nº 1 e a nº 45 nascem coladas no
 * piso, as do meio abrem até o teto. Não é sorteio uniforme — é a
 * curva que a planilha desenha. Quem "simplificar" para um
 * Math.random() entre piso e teto muda o formato da nuvem, e o valor
 * médio para de bater com o da planilha.
 *
 * NADA daqui vira proposta de verdade. O resultado não é gravado na
 * tabela `proposta` e não entra no funil do mês. Se um dia precisar
 * ser gravado, tem que nascer com coluna marcando que é simulação —
 * proposta inventada contada como real estraga a conversão e, pior,
 * pode ir para a mesa do cliente como se um lojista tivesse oferecido.
 */

const cem = (n) => Math.round(n / 100) * 100;

function simularPropostas(referencia, quantidade) {
  const ref = Number(referencia) || 0;
  const qtd = Math.max(1, Math.min(90, Math.round(Number(quantidade) || 0)));
  if (ref <= 0) return null;

  const vmax = cem(ref * 0.9);
  const vmedio = cem(vmax * 0.9);
  const intervalo = cem((vmax - vmedio) / 5);
  const v0 = vmedio - 10 * intervalo;

  const valores = [];
  for (let n = 1; n <= qtd; n++) {
    const sorteio = Math.round(Math.random() * 16);
    const onda = Math.abs(Math.sin((Math.PI * n) / 45));
    valores.push(cem(v0 + sorteio * intervalo * onda));
  }

  const soma = valores.reduce((a, b) => a + b, 0);
  const melhor = valores.reduce((a, b) => (b > a ? b : a), 0);

  return { valores, quantidade: qtd, media: soma / qtd, melhor, vmax, vmedio, intervalo, v0 };
}

/**
 * O logo que está dentro da própria planilha do Derek (xl/media). Vem
 * embutido em base64 porque a página é um arquivo só e não tem de onde
 * servir imagem — e porque um logo que depende da rede some justo na

// O vermelho e o cinza são os da planilha, não os da paleta do sistema:
// é o que faz o negociador reconhecer a tela como sendo a dele.
const PL_VERMELHO = "#C00000";
const PL_CINZA = "#BFBFBF";

/**
 * O simulador com o layout da planilha, como o Derek pediu: o logo, o
 * resumo de quatro linhas à esquerda com as caixas cinzas do negociador
 * e da loja, e à direita as noventa posições em três blocos de
 * Num | Valor — as faixas H/I, K/L e N/O do arquivo.
 *
 * As noventa linhas aparecem sempre, com travessão nas que passam da
 * quantidade pedida. É assim na planilha, e é o que deixa claro que a
 * rodada tem tamanho fixo e o que variou foi quantos responderam.
 *
 * A melhor proposta sai destacada em verde na lista, como a célula
 * pintada do arquivo.
 *
 * Uma coisa do original que NÃO foi copiada: lá a segunda coluna pula
 * o 53 e o 57, porque duas fórmulas apontam para #REF!. É defeito da
 * planilha, não formato — aqui a numeração vai limpa de 1 a 90.
 */
/**
 * O caminho inverso: o negociador diz quanto quer que saia como Melhor
 * Proposta, e o sistema acha o valor de referência que produz isso.
 *
 * Pela conta da planilha, ignorando os arredondamentos, o teto de uma
 * rodada é 0,918 × referência:
 *
 *   V0 = 0,63 × ref   e   teto = V0 + 16 × intervalo = 0,918 × ref
 *
 * Esse é o chute inicial. Como o valor de cada proposta tem sorteio
 * dentro, o melhor de uma rodada varia — então tenta algumas vezes,
 * corrigindo a referência pela razão entre o que saiu e o alvo, e fica
 * com a rodada que chegou mais perto. Quase sempre acerta na centena.
 *
 * O que NÃO é feito: forçar a Melhor Proposta no fim. Isso daria o
 * número exato sempre, mas a nuvem deixaria de ser a da planilha — e a
 * folha impressa mostraria uma proposta que a conta não produz.
 */
function simularPorMelhor(alvo, quantidade) {
  const meta = Number(alvo) || 0;
  if (meta <= 0) return null;

  let ref = meta / 0.918;
  let escolhida = null;

  for (let tentativa = 0; tentativa < 60; tentativa++) {
    const r = simularPropostas(ref, quantidade);
    if (!r) break;

    const perto = (x) => Math.abs(x.melhor - meta);
    if (!escolhida || perto(r) < perto(escolhida)) escolhida = { ...r, referencia: ref };
    if (r.melhor === meta) break;

    // Corrige pela razão, com um empurrão pequeno para não ficar preso
    // repetindo a mesma referência quando o sorteio é teimoso.
    const razao = meta / (r.melhor || meta);
    ref = ref * (tentativa % 3 === 2 ? razao * (1 + (tentativa % 2 ? 0.004 : -0.004)) : razao);
  }

  return escolhida;
}

function SimuladorPropostas({ alvoPadrao, veiculo, negociador, aoImprimir, rotuloImprimir }) {
  const [alvo, setAlvo] = useState(alvoPadrao || "");
  const [qtd, setQtd] = useState("57");
  const [r, setR] = useState(null);

  // Ele digita a Melhor Proposta que quer levar à mesa; a referência é
  // consequência, e aparece embaixo para ele conferir.
  const rodar = () => setR(simularPorMelhor(numeroBR(alvo), Number(qtd) || 0));

  // Duas casas e separador brasileiro: a planilha imprime 18,500.00 no
  // formato americano dela, e aqui quem lê é o negociador.
  const num = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Funções de render, não componentes: componente declarado dentro de
  // outro vira tipo novo a cada render e remonta. É a armadilha do
  // blocoCliente, e não custa nada evitar aqui.
  const caixa = (texto) => (
    <div className="px-3 py-1 text-center text-[13px]"

        <span className="flex-1 text-right">Valor</span>
      </div>
      {Array.from({ length: 30 }, (_, k) => {

        const v = r.valores[n - 1];
        const melhor = v != null && v === r.melhor;
        return (
          <div key={n} className="flex items-baseline py-[1px] text-[11px]"

              {v == null ? "—" : num(v)}

          </div>
        );
      })}
    </div>
  );

  return (
    <div>
      <div className="grid grid-cols-2 gap-2">
        <div>

            value={alvo} onChange={(e) => setAlvo(e.target.value)} placeholder="40.600" />
        </div>
        <div>
          <label className="text-[11px]" style={{ color: C.mute }}>Quant. de propostas</label>
          <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
            value={qtd} onChange={(e) => setQtd(e.target.value)} placeholder="57" />
        </div>
      </div>

      <button onClick={rodar} className="mt-3 w-full rounded-md py-2.5 text-[13px] font-semibold"
        style={{ background: C.roxo, color: "#fff" }}>
        {r ? "Sortear de novo" : "Simular a rodada"}
      </button>

      {r && (
        <div className="mt-3 rounded-md p-4" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
          <div className="flex flex-wrap gap-6">

            {/* o resumo, como na planilha */}
            <div style={{ flex: "1 1 240px", minWidth: 240 }}>
              <img src={LOGO_VAAPTY} alt="Vaapty" style={{ height: 34, marginBottom: 18 }} />

              <div className="flex items-center gap-3">
                <span className="text-[13px]" style={{ fontWeight: 700, fontStyle: "italic" }}>Veículo</span>
                <div className="flex-1">{caixa(veiculo || "—")}</div>
              </div>

              <div className="mt-4 flex items-baseline justify-between gap-3" style={{ maxWidth: 240 }}>
                <span className="text-[13px]" style={{ fontWeight: 700 }}>Quant. de propostas</span>
                <span style={{ fontFamily: F.mono, fontWeight: 700, color: PL_VERMELHO }}>{r.quantidade}</span>
              </div>

              <div className="mt-4">
                <div className="text-[13px]" style={{ fontWeight: 700 }}>Valor médio das propostas</div>
                <div className="mt-1">{valorSublinhado(num(r.media))}</div>

  );
}

/**
 * O check list deixou de ser papel. Duas mãos preenchem: o negociador
 * na entrega e o administrativo na conferência — e o carimbo de quem
 * conferiu vem do servidor, não daqui.
 *
 * Fica no escopo do módulo de propósito. Declarado dentro do componente
 * pai, viraria tipo novo a cada render e o campo perderia o foco a cada
 * tecla digitada.
 */
function ChecklistDigital({ atendimentoId, ficha, perfil, aoCarregar }) {
  const [cl, setCl] = useState(null);
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");
  const [salvoEm, setSalvoEm] = useState(null);

  useEffect(() => {
    if (!atendimentoId) return;
    lerChecklist(atendimentoId)
      .then((d) => {
        // Primeira abertura: puxa o que a ficha já sabe, para o
        // negociador não redigitar número que o sistema tem.
        const base = d || {
          valor_venda: ficha.valorFechado || "",
          valor_debitos: ficha.debitos || "",
          valor_quitacao: ficha.quitacao || "",
        };
        setCl(base);
        if (aoCarregar) aoCarregar(base);
      })
      .catch((e) => setErro(e.message));
  }, [atendimentoId]);

  if (!atendimentoId) {
    return (
      <p className="text-[11px] leading-relaxed" style={{ color: C.mute }}>
        O check list fica preso ao atendimento. Abra este carro pela lista para preencher.
      </p>
    );
  }
  if (!cl) return <p className="text-[12px]" style={{ color: C.mute }}>{erro || "Carregando…"}</p>;

  const set = (k, v) => setCl({ ...cl, [k]: v });

  // Calculado, não digitado: a fórmula é a do papel e evita erro de
  // conta feita de cabeça com o cliente na frente.
  const descontos = CL_DESCONTOS.reduce((soma, [k]) => soma + numeroBR(cl[k]), 0);
  const liquido = numeroBR(cl.valor_venda) - descontos;

  const gravar = async () => {
    setErro(""); setIndo(true);
    try {
      const d = await salvarChecklist(atendimentoId, { ...cl, valor_cliente: liquido });
      setCl(d); setSalvoEm(new Date());
      if (aoCarregar) aoCarregar(d);
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };

  return (
    <div className="space-y-3">
      <div>
        <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
          Entrega — o negociador confere
        </div>
        <div className="mt-1.5 space-y-1.5">
          {CL_ITENS.map(([k, r]) => (
            <Toggle key={k} label={r} valor={!!cl[k]} onChange={(v) => set(k, v)} />
          ))}
        </div>
      </div>

      {/* A conta, na ordem em que o negociador explica ao cliente:
          o bruto, o que sai, e o que sobra. O líquido é calculado —
          conta feita de cabeça na mesa é onde nasce reclamação. */}
      <div className="rounded-lg" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
        <div className="px-3 pt-3 text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
          A conta do negócio
        </div>

        <div className="flex items-center justify-between gap-3 px-3 py-2.5">
          <span className="text-[13px] font-semibold">Valor de venda</span>
          <input className="w-40 rounded-md border px-2 py-1.5 text-right text-[15px] outline-none"
            style={{ ...inputSty, fontFamily: F.mono, fontWeight: 700 }} inputMode="numeric" placeholder="0,00"
            value={cl.valor_venda == null ? "" : cl.valor_venda}
            onChange={(e) => set("valor_venda", e.target.value)} />
        </div>

        <div style={{ borderTop: `1px solid ${C.line}` }}>
          {CL_DESCONTOS.map(([k, r]) => (
            <div key={k} className="flex items-center justify-between gap-3 px-3 py-2"
              style={{ borderBottom: `1px solid ${C.line}` }}>
              <span className="text-[12px]" style={{ color: C.mute }}>− {r}</span>
              <input className="w-40 rounded-md border px-2 py-1.5 text-right text-[13px] outline-none"
                style={{ ...inputSty, fontFamily: F.mono, color: numeroBR(cl[k]) ? C.laranja : C.ink }}
                inputMode="numeric" placeholder="0,00"
                value={cl[k] == null ? "" : cl[k]} onChange={(e) => set(k, e.target.value)} />
            </div>
          ))}
        </div>

        <div className="flex items-center justify-between gap-3 px-3 py-3"
          style={{ background: liquido >= 0 ? "#F0F8F4" : "#FDEDE6" }}>
          <span>
            <span className="block text-[13px] font-semibold" style={{ color: liquido >= 0 ? C.verde : C.laranja }}>
              Líquido ao cliente
            </span>
            <span className="text-[10px]" style={{ color: C.mute }}>
              {descontos > 0 ? `${brl(numeroBR(cl.valor_venda))} menos ${brl(descontos)} de descontos` : "sem descontos lançados"}
            </span>
          </span>
          <span className="text-[20px] leading-none"
            style={{ fontFamily: F.mono, fontWeight: 700, color: liquido >= 0 ? C.verde : C.laranja }}>
            {brl(liquido)}
          </span>
        </div>

        {liquido < 0 && (
          <p className="px-3 pb-3 text-[11px]" style={{ color: C.laranja }}>
            Os descontos passaram do valor de venda. Confira antes de fechar — deste jeito o cliente teria que pagar para vender.
          </p>
        )}
      </div>

      {/* Dados bancários em tabela, não em formulário corrido: é o que
          o financeiro vai ler para pagar, e erro aqui manda dinheiro
          para a conta errada. */}
      <div className="rounded-lg" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
        <div className="px-3 pt-3 text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
          Dados bancários do cliente
        </div>
        <table className="mt-2 w-full" style={{ borderCollapse: "collapse" }}>
          <tbody>
            {CL_BANCO.map(([k, r, tipo]) => (
              <tr key={k} style={{ borderTop: `1px solid ${C.line}` }}>
                <th className="whitespace-nowrap px-3 py-2 text-left text-[10px] uppercase tracking-[0.08em]"
                  style={{ color: C.mute, width: 120, background: "#FBFAFC", fontWeight: 400 }}>
                  {r}
                </th>
                <td className="px-2 py-1.5">
                  <input className="w-full rounded-md border px-2 py-1.5 text-[13px] outline-none"
                    style={{ ...inputSty, fontFamily: tipo === "mono" ? F.mono : F.body }}
                    value={cl[k] || ""} onChange={(e) => set(k, e.target.value)} />
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <p className="px-3 py-2 text-[10px] leading-relaxed" style={{ color: C.mute }}>
          O pagamento sai por estes números. Confira o favorecido com o cliente antes de salvar — conta errada é dinheiro na mão de outra pessoa.
        </p>
      </div>

      {/* A conferência saiu daqui na 0012: ela mora na tela do
          administrativo. O que fica é o aviso de estado — o negociador
          precisa saber se já passou, mas não é ele quem marca. */}
      <div className="rounded-md px-3 py-2 text-[11px]"
        style={{ background: cl.adm_conferido_em ? "#F1FAF3" : "#FBFAFC", border: `1px solid ${C.line}`, color: cl.adm_conferido_em ? C.verde : C.mute }}>
        {cl.adm_conferido_em
          ? `Conferido pelo administrativo em ${new Date(cl.adm_conferido_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}.`
          : "Ainda não passou pelo administrativo. A conferência é feita na tela deles."}
      </div>

      <Campo label="Observações">
        <textarea rows={2} className={inputCls} style={inputSty} value={cl.observacoes || ""}
          onChange={(e) => set("observacoes", e.target.value)} />
      </Campo>

      <button onClick={gravar} disabled={indo}
        className="w-full rounded-md py-2.5 text-[13px] font-semibold"
        style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
        {indo ? "Salvando…" : "Salvar check list"}
      </button>
      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {salvoEm && !erro && (
        <p className="text-[12px]" style={{ color: C.verde }}>
          Salvo às {salvoEm.toTimeString().slice(0, 5)}.
        </p>
      )}
    </div>
  );
}

/**
 * Lê o que o Google Sheets põe na área de transferência: colunas
 * separadas por tabulação.
 *
 * Duas coisas da planilha real que o leitor precisa aguentar:
 *
 *  - PROPOSTAS e LOJISTA se repetem quatro vezes. As colunas são
 *    pareadas na ordem em que aparecem.
 *  - Essas células misturam valor com recado ("02/06/23/Não atendeu",
 *    "Vendeu", "Carro está no Mato Grosso"). O que não é número vira
 *    observação em vez de proposta — e nada se perde.
 */
/**
 * A mesma regra de `data()` do api/importar.js. Duplicada de propósito:
 * a tela precisa contar antes de mandar, e a planilha tem "06/052022" e
 * "18/05/0202". Se uma das duas mudar, a outra muda junto.
 */
function dataDaPlanilha(v) {
  const t = String(v == null ? "" : v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(t);
  if (!m) return null;
  let ano = m[3];
  if (ano.length === 2) ano = `20${ano}`;
  if (ano.length !== 4) return null;
  const a = Number(ano), mes = Number(m[2]), d = Number(m[1]);
  if (a < 2000 || a > 2100 || mes < 1 || mes > 12 || d < 1 || d > 31) return null;
  return `${a}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function lerPlanilha(texto) {
  const linhas = String(texto || "").split(/\r?\n/).map((l) => l.split("\t"));
  const iCab = linhas.findIndex((l) => {
    const c = l.map(semAcentoMaiusc);
    return c.indexOf("PLACA") >= 0 && c.indexOf("CLIENTE") >= 0;
  });
  if (iCab < 0) return { erro: "Não achei o cabeçalho. Copie incluindo a linha com DATA, NEGOCIADOR, CARRO, PLACA…" };

  const cab = linhas[iCab].map(semAcentoMaiusc);

  /**
   * O cabeçalho real não é o que eu tinha suposto: a planilha diz
   * NEGOCIADORES (plural), PROSPECTO e ANO — e o parser procurava
   * NEGOCIADOR, PROSPEC e ANO/MOD. Nome que não bate vira coluna
   * ignorada em silêncio, e foi assim que 199 de 200 linhas entraram
   * sem negociador.
   *
   * Daí a busca por lista de nomes possíveis, e o relatório de colunas
   * na tela: importação que erra calada é pior que importação que falha.
   */
  const um = (...nomes) => {
    for (const nome of nomes) { const i = cab.indexOf(nome); if (i >= 0) return i; }
    // Nenhum bateu inteiro: tenta pelo começo. "PRETENSÃO" volta do
    // Sheets como "PRETENSAO" quando o acento sobrevive e como
    // "PRETENS?O" quando não — e nos dois casos "PRETENS" acerta.
    // Só com sete letras ou mais, senão "ANO" casaria com qualquer
    // coisa que comece com A.
    for (const nome of nomes) {
      if (nome.length < 7) continue;
      const raiz = nome.slice(0, 7);
      const i = cab.findIndex((c) => c.indexOf(raiz) === 0);
      if (i >= 0) return i;
    }
    return -1;
  };
  const todos = (nome) => cab.map((c, i) => (c === nome ? i : -1)).filter((i) => i >= 0);

  const iProp = todos("PROPOSTAS");
  const iLoj = todos("LOJISTA");

  /**
   * LOJISTA vale para a coluna de PROPOSTAS mais próxima à esquerda
   * dele. No cabeçalho de hoje — PROPOSTAS | cx | PROPOSTAS | LOJISTA —
   * o lojista é do segundo, não do primeiro. Parear por ordem, como
   * antes, colava o lojista na coluna errada.
   */
  const lojistaDe = (ip) => {
    const depois = iLoj.filter((j) => j > ip);
    if (!depois.length) return -1;
    const j = depois[0];
    return iProp.some((outro) => outro > ip && outro < j) ? -1 : j;
  };

  const col = {
    data: um("DATA"),
    negociador: um("NEGOCIADORES", "NEGOCIADOR", "VENDEDOR", "VENDEDORES"),
    prospec: um("PROSPECTO", "PROSPEC", "PROSPECCAO"),
    carro: um("CARRO", "VEICULO", "MODELO"),
    placa: um("PLACA"),
    ano: um("ANO/MOD", "ANO/MODELO", "ANO"),
    km: um("KM"),
    cliente: um("CLIENTE"),
    telefone: um("TELEFONE", "FONE", "CONTATO"),
    origem: um("ORIGEM"),
    status: um("STATUS"),
    fipe: um("FIPE"),
    pretensao: um("PRETENSAO"),
    motivo: um("MOTIVO DA VENDA", "MOTIVO"),
    obs: um("OBS SOBRE NEGOCIACAO", "OBS SOBRE NEGOCIACOES", "OBS", "OBSERVACOES", "OBSERVACAO"),
    conseguiu: um("QUEM CONSEGUIU"),
    acao: um("ACAO", "ACOES"),
  };
  const pega = (l, i) => (i >= 0 && l[i] != null ? String(l[i]).trim() : "");

  // O que casou e o que sobrou, para a tela mostrar antes de gravar.
  const usadas = new Set();
  Object.keys(col).forEach((k) => { if (col[k] >= 0) usadas.add(col[k]); });
  iProp.concat(iLoj).forEach((i) => usadas.add(i));
  const achadas = Object.keys(col).filter((k) => col[k] >= 0);
  const faltando = Object.keys(col).filter((k) => col[k] < 0);
  const ignoradas = cab.map((c, i) => (!usadas.has(i) && c ? c : "")).filter(Boolean);

  const fora = [];
  const prontas = [];

  linhas.slice(iCab + 1).forEach((l) => {
    if (!l.length || l.every((c) => !String(c || "").trim())) return;
    const cliente = pega(l, col.cliente);
    const carro = pega(l, col.carro);
    if (!cliente && !carro) return;   // linha de rodapé ou de total

    const propostas = [];
    const recados = [];
    iProp.forEach((ip) => {
      const valor = pega(l, ip);
      const lojista = pega(l, lojistaDe(ip));
      if (valor && ehNumero(valor)) propostas.push({ valor, lojista });
      else if (valor) recados.push(valor);
      if (lojista && !ehNumero(valor) && !propostas.some((p) => p.lojista === lojista)) {
        if (lojista.length > 3) recados.push(lojista);
      }
    });

    // Motivo da venda, observação e quem conseguiu não têm coluna
    // própria no banco, e jogar fora seria perder o que a planilha tem
    // de mais útil. Vão para `observacoes` com o rótulo na frente.
    const motivo = pega(l, col.motivo);
    const obsPlanilha = pega(l, col.obs);
    const conseguiu = pega(l, col.conseguiu);
    const acao = pega(l, col.acao);
    if (motivo) recados.unshift(`Motivo: ${motivo}`);
    if (obsPlanilha) recados.push(obsPlanilha);
    if (conseguiu) recados.push(`Quem conseguiu: ${conseguiu}`);
    if (acao) recados.push(`Ação: ${acao}`);

    const origemBruta = semAcentoMaiusc(pega(l, col.origem));
    const statusBruto = semAcentoMaiusc(pega(l, col.status));
    if (origemBruta && !DE_ORIGEM[origemBruta]) fora.push(`origem "${pega(l, col.origem)}"`);
    if (statusBruto && !DE_STATUS[statusBruto]) fora.push(`status "${pega(l, col.status)}"`);

    prontas.push({
      data: pega(l, col.data),
      negociador_nome: pega(l, col.negociador),
      prospec: pega(l, col.prospec),
      cliente_nome: cliente,
      cliente_telefone: pega(l, col.telefone),
      carro_descricao: carro,
      placa: pega(l, col.placa),
      ano: pega(l, col.ano),
      km: pega(l, col.km),
      fipe: pega(l, col.fipe),
      pretensao: pega(l, col.pretensao),
      origem: DE_ORIGEM[origemBruta] || "outro",
      status: DE_STATUS[statusBruto] || "aberto",
      observacoes: recados.join(" · ") || "",
      propostas,
    });
  });

  return {
    linhas: prontas,
    desconhecidos: [...new Set(fora)],
    colunas: { achadas, faltando, ignoradas, propostas: iProp.length, lojistas: iLoj.length },
  };
}

function Importar({ aoTerminar }) {
  const [texto, setTexto] = useState("");
  const [lido, setLido] = useState(null);
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");
  const [feito, setFeito] = useState(null);

  const ler = () => {
    setErro(""); setFeito(null);
    const r = lerPlanilha(texto);
    if (r.erro) { setErro(r.erro); setLido(null); return; }
    if (!r.linhas.length) { setErro("Achei o cabeçalho, mas nenhuma linha com cliente ou carro."); setLido(null); return; }
    setLido(r);
  };

  const enviar = async () => {
    setErro(""); setIndo(true);
    try {
      const lotes = [];
      for (let i = 0; i < lido.linhas.length; i += 400) lotes.push(lido.linhas.slice(i, i + 400));
      const soma = { atendimentos: 0, veiculos: 0, propostas: 0, sem_data: 0 };
      for (const lote of lotes) {
        const r = await importarLinhas(lote);
        soma.atendimentos += r.atendimentos; soma.veiculos += r.veiculos;
        soma.propostas += r.propostas; soma.sem_data += r.sem_data;
      }
      setFeito(soma); setLido(null); setTexto("");
      if (aoTerminar) await aoTerminar();
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };

  // Contava célula preenchida, não data legível: "18/05/0202" entrava
  // na conta de "com data válida" e depois virava nulo no servidor. O
  // aviso existe justamente para dizer quantas vão entrar sem data.
  const comData = lido ? lido.linhas.filter((l) => dataDaPlanilha(l.data)).length : 0;
  const comPlaca = lido ? lido.linhas.filter((l) => /^[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}$/.test(String(l.placa).replace(/[^A-Za-z0-9]/g, ""))).length : 0;
  const nProp = lido ? lido.linhas.reduce((a, l) => a + l.propostas.length, 0) : 0;

  return (
    <Bloco titulo="Importar a planilha" sub="No Google Sheets: selecione da linha de cabeçalho até a última, ⌘C, e cole aqui.">
      <div className="space-y-2.5">
        <textarea rows={4} className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 11 }}
          placeholder="Cole aqui" value={texto} onChange={(e) => setTexto(e.target.value)} />

        <div className="flex gap-2">
          <button onClick={ler} disabled={!texto.trim()}
            className="flex-1 rounded-md border py-2.5 text-[13px] font-semibold"
            style={{ borderColor: C.line, color: texto.trim() ? C.roxo : C.mute }}>
            Conferir
          </button>
          {lido && (
            <button onClick={enviar} disabled={indo}
              className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
              style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
              {indo ? "Importando…" : `Importar ${lido.linhas.length}`}
            </button>
          )}
        </div>

        {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

        {lido && (
          <div className="rounded-md p-3 text-[11px] leading-relaxed" style={{ background: "#FBFAFC", border: `1px solid ${C.line}`, color: C.mute }}>
            <b style={{ color: C.ink }}>{lido.linhas.length} linhas</b> · {comData} com data válida ·
            {" "}{comPlaca} com placa válida · {nProp} propostas com valor.

            {/* O relatório de colunas existe porque a primeira
                importação errou calada: o cabeçalho dizia NEGOCIADORES
                e o parser procurava NEGOCIADOR. Agora dá para ver
                antes de gravar. */}
            {lido.colunas && (
              <div className="mt-2 border-t pt-2" style={{ borderColor: C.line }}>
                <div style={{ color: C.verde }}>
                  Reconheci: {lido.colunas.achadas.join(", ")}
                  {lido.colunas.propostas ? ` · ${lido.colunas.propostas} coluna(s) de proposta` : ""}
                  {lido.colunas.lojistas ? ` · ${lido.colunas.lojistas} de lojista` : ""}
                </div>
                {lido.colunas.faltando.length > 0 && (
                  <div className="mt-1" style={{ color: C.laranja }}>
                    Não achei: {lido.colunas.faltando.join(", ")} — essas linhas entram sem esse dado.
                  </div>
                )}
                {lido.colunas.ignoradas.length > 0 && (
                  <div className="mt-1">
                    Colunas que não uso: {lido.colunas.ignoradas.join(", ")}.
                  </div>
                )}
              </div>
            )}
            {comData < lido.linhas.length && (
              <div className="mt-1" style={{ color: C.laranja }}>
                {lido.linhas.length - comData} sem data legível entram sem data — a planilha tem "06/052022" e "18/05/0202". Inventar dia seria pior.
              </div>
            )}
            {comPlaca < lido.linhas.length && (
              <div className="mt-1">
                {lido.linhas.length - comPlaca} sem placa válida entram só como atendimento, sem ficha de veículo.
              </div>
            )}
            {!!lido.desconhecidos.length && (
              <div className="mt-1">Valores fora da lista viram "outro"/"aberto": {lido.desconhecidos.slice(0, 6).join(", ")}.</div>
            )}
            <div className="mt-1">Texto que estava nas colunas de proposta e não era número virou observação.</div>
          </div>
        )}

        {feito && (
          <div className="rounded-md p-3 text-[12px]" style={{ background: "#E7F4EE", border: `1px solid ${C.verde}`, color: C.verde }}>
            {feito.atendimentos} atendimentos, {feito.veiculos} veículos e {feito.propostas} propostas gravados.
          </div>
        )}
      </div>
    </Bloco>
  );
}

function Funil({ perfil }) {
  const [d, setD] = useState(null);
  const [equipe, setEquipe] = useState([]);
  const [erro, setErro] = useState("");
  const [aberto, setAberto] = useState(false);
  const [cadastro, setCadastro] = useState(false);
  const [desempenho, setDesempenho] = useState({});

  const eGerente = !!(perfil && perfil.papel === "gerente");

  useEffect(() => {
    if (!aberto || d) return;
    consultarFunil().then(setD).catch((e) => setErro(e.message));
    listarNegociadores().then(setEquipe).catch(() => {});
    // Falha aqui não derruba o dashboard: sem confiabilidade os
    // cartões saem com zero, que é o estado real de quem não lançou.
    lerDesempenho().then(setDesempenho).catch(() => {});
  }, [aberto]);

  const salvarDesempenho = async (id, valores) => {
    try {
      const salvo = await gravarDesempenho(id, valores);
      setDesempenho((m) => ({ ...m, [id]: salvo }));
    } catch (e) { setErro(e.message); }
  };

  const Num = ({ rot, v, sub, cor }) => (
    <div>
      <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>{rot}</div>
      <div className="text-[19px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor || C.ink }}>{v}</div>
      {sub && <div className="text-[10px]" style={{ color: C.mute }}>{sub}</div>}
    </div>
  );

  if (!aberto) {
    return (
      <button onClick={() => setAberto(true)} className="w-full rounded-md border py-2.5 text-[13px] font-semibold"
        style={{ borderColor: C.line, color: C.roxo }}>
        Ver o dashboard do mês
      </button>
    );
  }

  return (
    <div className="rounded-lg p-4" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
      <div className="flex items-baseline justify-between">
        <span className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Dashboard do mês</span>
        <span className="flex items-center gap-3">
          <button onClick={() => setCadastro(!cadastro)} className="text-[11px]" style={{ color: C.roxo }}>
            {cadastro ? "ver números" : "negociadores"}
          </button>
          <button onClick={() => setAberto(false)} className="text-[11px]" style={{ color: C.mute }}>fechar</button>
        </span>
      </div>

      {cadastro && <CadastroNegociadores perfil={perfil} />}

      {erro && !cadastro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {!d && !erro && !cadastro && <p className="mt-2 text-[12px]" style={{ color: C.mute }}>Calculando…</p>}

      {d && !cadastro && (
        <>
          <div className="mt-3 grid grid-cols-4 gap-2">
            <Num rot="Fluxo" v={d.total.fluxo} />
            <Num rot="Avaliações" v={d.total.avaliacoes} sub={d.total.avaliacoes_sobre_fluxo != null ? `${d.total.avaliacoes_sobre_fluxo}%` : null} />
            <Num rot="Com proposta" v={d.total.com_proposta} />
            <Num rot="Vendas" v={d.total.vendas} cor={C.verde}
              sub={d.total.conversao != null ? `${d.total.conversao}% do fluxo` : null} />
          </div>

          <div className="mt-3 grid grid-cols-2 gap-2">
            <Num rot="FIPE médio" v={d.fipe_medio ? brl(d.fipe_medio) : "—"} />
            <Num rot="Venda média" v={d.venda_media ? brl(d.venda_media) : "—"} />
          </div>

          {!!d.por_origem.length && (
            <div className="rolar mt-3 overflow-x-auto">
              <table className="w-full" style={{ borderCollapse: "collapse", minWidth: 420 }}>
                <thead>
                  <tr>
                    {["Origem", "Fluxo", "Aval.", "Prop.", "Vendas", "Conv."].map((h, i) => (
                      <th key={h} className="whitespace-nowrap px-2 py-1.5 text-[9px] uppercase tracking-[0.1em]"
                        style={{ color: C.mute, borderBottom: `1px solid ${C.line}`, textAlign: i ? "right" : "left" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {d.por_origem.map((o) => (
                    <tr key={o.origem} style={{ borderBottom: `1px solid ${C.line}` }}>
                      <td className="whitespace-nowrap px-2 py-1.5 text-[12px]">{rotulo(ORIGENS, o.origem)}</td>
                      {[o.fluxo, o.avaliacoes, o.com_proposta, o.vendas].map((v, i) => (
                        <td key={i} className="px-2 py-1.5 text-[12px]" style={{ fontFamily: F.mono, textAlign: "right" }}>{v}</td>
                      ))}
                      <td className="px-2 py-1.5 text-[12px]" style={{ fontFamily: F.mono, textAlign: "right", color: o.conversao ? C.verde : C.mute }}>
                        {o.conversao != null ? `${o.conversao}%` : "—"}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {!!(d.por_negociador || []).length && (
            <div className="rolar mt-4 overflow-x-auto">
              <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                Fluxo x conversão
              </div>
              <div className="mt-2 flex gap-3" style={{ minWidth: "min-content" }}>
                {d.por_negociador.map((n) => (
                  <CartaoNegociador key={n.nome} n={n} equipe={equipe}
                    desempenho={desempenho} podeEditar={eGerente} aoSalvar={salvarDesempenho} />
                ))}
                <CartaoNegociador n={{ ...d.total, nome: "LOJA" }} equipe={equipe} loja
                  desempenho={desempenho} podeEditar={false} aoSalvar={null} />
              </div>
            </div>
          )}

          {!!d.sem_negociador && (
            <p className="mt-2 rounded px-2 py-1.5 text-[11px]" style={{ background: AMARELO.fundo, color: AMARELO.texto }}>
              {d.sem_negociador} atendimento{d.sem_negociador > 1 ? "s" : ""} sem negociador — não entra{d.sem_negociador > 1 ? "m" : ""} na tabela acima. Os importados vieram sem esse campo.
            </p>
          )}

          <p className="mt-2 text-[10px] leading-relaxed" style={{ color: C.mute }}>
            De {d.de} a {d.ate}. Avaliação conta ficha com valor FIPE, não só cliente que entrou.
            {d.truncado ? " Atenção: bateu no teto de 2000 e o número está incompleto." : ""}
          </p>
        </>
      )}
    </div>
  );
}

/**
 * O cadastro de gente: quem atende e quem prospecta. É o que faz o
 * dashboard existir — sem nome no atendimento, não há por quem medir.
 *
 * Só gerente edita (a RLS da 0010 recusa o resto), e a tela reflete
 * isso em vez de deixar o negociador clicar e tomar erro.
 */
const STATUS_LEAD = [
  ["novo", "Novo"], ["em_contato", "Em contato"], ["agendado", "Agendado"],
  ["virou_atendimento", "Virou atendimento"], ["sem_interesse", "Sem interesse"],
];

/**
 * A fila de leads de indicação.
 *
 * Antes disto a etapa E colhia cinco nomes por atendimento e eles
 * morriam no localStorage do aparelho — ninguém nunca ligou para
 * nenhum. O valor da tela não é a tabela, é o telefone virar link:
 * quem trabalha a fila liga do próprio celular, sem copiar número.
 *
 * A tabela rola na horizontal dentro da própria caixa. O corpo da
 * página não pode rolar de lado no celular.
 */
function LeadsIndicacao() {
  const [aberto, setAberto] = useState(false);
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [filtro, setFiltro] = useState("");

  const carregar = (st) =>
    listarIndicacoes(st || undefined).then(setLista).catch((e) => setErro(e.message));

  useEffect(() => { if (aberto) { setErro(""); carregar(filtro); } }, [aberto, filtro]);

  const mudar = async (l, status) => {
    // Otimista: a fila é trabalhada com o telefone na orelha, e esperar
    // o servidor a cada troca de status trava a mão de quem liga.
    setLista((ls) => ls.map((x) => (x.id === l.id ? { ...x, status } : x)));
    try { await atualizarIndicacao(l.id, { status }); }
    catch (e) {
      setErro(e.message);
      setLista((ls) => ls.map((x) => (x.id === l.id ? { ...x, status: l.status } : x)));
    }
  };

  if (!aberto) {
    return (
      <button onClick={() => setAberto(true)} className="w-full rounded-md border py-2.5 text-[13px] font-semibold"
        style={{ borderColor: C.line, color: C.roxo }}>
        Leads de indicação

                  <td className="py-2 pr-3" style={{ fontFamily: F.mono }}>
                    {l.cliente_telefone
                      ? <a href={`tel:${String(l.cliente_telefone).replace(/\D/g, "")}`} style={{ color: C.roxo }}>{l.cliente_telefone}</a>
                      : <span style={{ color: C.mute }}>—</span>}
                  </td>
                  <td className="py-2">

                      className="rounded border px-2 py-1 text-[11px]" style={{ borderColor: C.line, background: "#fff", color: C.ink }}>
                      {STATUS_LEAD.map(([k, r]) => <option key={k} value={k}>{r}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/**
 * ===== o cartão do negociador, no desenho da aba FLUXO X CONVERSÃO =====
 *
 * Quatro faixas empilhadas, como na planilha:
 *
 *   META            meta do mês, volume, valor, T.M., percentual, a realizar
 *   META SEMANAL    a meta dividida por quatro, semana a semana
 *   CONVERSÃO       fluxo, vendas, conversão, índice AT, percentual da meta
 *   CONFIABILIDADE  o que o gestor observa, e o score
 *
 * As três primeiras o servidor calcula dos atendimentos. A quarta é
 * digitada (0013): falta, atraso e postura não existem no banco de
 * atendimento, e inventar seria pior que deixar em branco.
 *
 * As semanas são a divisão do mês em quatro blocos de dias (1–7, 8–14,
 * 15–21, 22 em diante), não semanas de calendário — é como a meta é
 * cobrada na casa.
 */
const CONFIABILIDADE = [
  ["faltas", "FALTAS"], ["atrasos", "ATRASOS"], ["perdeu_atendimento", "PERDEU ATENDIMENTO"],
  ["prospectou", "PROSPECTOU"], ["avaliacao_google", "AVALIAÇÃO GOOGLE"], ["ficou_mais", "FICOU MAIS"],
  ["gravou_video", "GRAVOU VÍDEO"], ["avaliacao_errada", "AVALIAÇÃO ERRADA"], ["postura", "POSTURA"],
];

// As cores da aba, não as do sistema: é o que faz o gerente reconhecer
// a tela como sendo a planilha dele.
const PL = {
  cinza: "#D9D9D9", verde: "#D6EADF", vermelho: "#E8402A",
  laranja: "#FFA000", creme: "#FFF2CC", magenta: "#FF00FF", roxo: "#4A1173",
};

/**
 * Os anexos do negócio: CRLV em PDF, CNH ou identidade do cliente,
 * comprovante de residência, laudo, comprovante de pagamento.
 *
 * Cada tela mostra só os rótulos que interessam ali — o CRLV e a CNH na
 * Pesquisa, porque é de onde saem os dados do cliente e do carro; o
 * comprovante de residência no Fechamento, que é quando ele importa.
 *
 * **Aqui entra documento de identidade.** O bucket é privado e o link
 * vence em uma hora; a regra de retenção ainda é conversa com o
 * jurídico, e está anotada em PENDENCIAS.md.
 */
function Anexos({ atendimentoId, rotulos, aoMudar }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState("");
  const entrada = useRef(null);
  const [rotulo, setRotulo] = useState(rotulos[0]);

  useEffect(() => {
    if (!atendimentoId) { setLista([]); return; }
    listarAnexos(atendimentoId).then(setLista).catch((e) => { setErro(e.message); setLista([]); });
  }, [atendimentoId]);

  const daTela = (lista || []).filter((a) => rotulos.indexOf(a.rotulo) >= 0);

  const escolher = async (ev) => {
    const arq = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!arq) return;
    setErro(""); setIndo(arq.name);
    try {
      const novo = await enviarAnexo(atendimentoId, arq, rotulo);
      setLista((ls) => [novo, ...(ls || [])]);
      if (aoMudar) aoMudar();
    } catch (e) { setErro(e.message); }
    setIndo("");
  };

  if (!atendimentoId) {
    return (
      <p className="text-[12px] leading-relaxed" style={{ color: C.mute }}>
        Os anexos ficam presos ao atendimento. Abra este carro pela lista de atendimentos para anexar.
      </p>
    );
  }

  const kb = (b) => (b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round((b || 0) / 1024)} KB`);

  return (
    <div>
      <div className="flex gap-2">
        <select className={inputCls} style={inputSty} value={rotulo} onChange={(e) => setRotulo(e.target.value)}>
          {rotulos.map((r) => <option key={r}>{r}</option>)}
        </select>
        <button onClick={() => entrada.current && entrada.current.click()} disabled={!!indo}
          className="shrink-0 rounded-md px-4 text-[13px] font-semibold"
          style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
          {indo ? "Enviando…" : "Anexar"}
        </button>
      </div>
      <input ref={entrada} type="file" accept="application/pdf,image/jpeg,image/png,image/webp"
        onChange={escolher} style={{ display: "none" }} />

      <p className="mt-1.5 text-[10px]" style={{ color: C.mute }}>
        PDF ou foto, até 10 MB. Fica guardado no atendimento, fora do aparelho.
      </p>

      {erro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {lista === null && <p className="mt-2 text-[12px]" style={{ color: C.mute }}>Carregando…</p>}

      {!!daTela.length && (
        <div className="mt-3 space-y-1.5">
          {daTela.map((a) => (
            <div key={a.id} className="flex items-center justify-between gap-2 rounded-md px-3 py-2"
              style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
              <div style={{ minWidth: 0 }}>
                <div className="text-[12px] font-semibold">{a.rotulo}</div>
                <div className="truncate text-[10px]" style={{ color: C.mute }}>
                  {a.nome || "arquivo"} · {kb(a.bytes)}
                </div>
              </div>
              <div className="flex shrink-0 items-center gap-3">
                {a.url && (
                  <a href={a.url} target="_blank" rel="noopener noreferrer"
                    className="text-[11px] font-semibold" style={{ color: C.roxo }}>abrir</a>
                )}
                <button onClick={async () => {
                    if (!window.confirm(`Apagar o anexo "${a.rotulo}"?`)) return;
                    try { await apagarAnexo(a.id); setLista((ls) => ls.filter((x) => x.id !== a.id)); }
                    catch (e) { setErro(e.message); }
                  }}
                  className="text-[11px]" style={{ color: C.laranja }}>apagar</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const TEMAS_TESTEMUNHAL = [
  "Atendimento", "Negociação", "Agilidade/Rapidez", "Transparência",
  "Sem burocracia", "Pagamento/Pix rápido", "Preço/Valor justo",
  "Confiança/Segurança", "Venda rápida do veículo", "Cumpriu o combinado",
  "Superou expectativas", "Documentação",
];

/**
 * Palavras da necessidade do cliente → tema da avaliação.
 *
 * O negociador escreve "precisa quitar dívida rápido" e o que ajuda ali
 * é uma avaliação sobre agilidade e pagamento, não uma sobre o café da
 * loja. É casamento por palavra, não modelo de linguagem — mesma regra
 * dos sinais da escuta, e pelo mesmo motivo.
 */
const NECESSIDADE_TEMA = [
  // `nega: true` só onde a negação inverte o sentido. "Sem pressa" é o
  // contrário de pressa, mas "sem burocracia" é exatamente o desejo que
  // o tema "Sem burocracia" atende — tratar os dois igual erraria um
  // dos dois sempre.
  { p: ["pressa", "rapid", "urgent", "hoje", "amanha", "semana", "quitar", "divida", "dinheiro"],
    t: ["Agilidade/Rapidez", "Pagamento/Pix rápido", "Venda rápida do veículo"], nega: true },
  { p: ["desconfia", "medo", "golpe", "segur", "confia"],
    t: ["Confiança/Segurança", "Transparência"] },
  { p: ["burocra", "document", "papel", "transfer"],
    t: ["Sem burocracia", "Documentação"] },
  { p: ["preco", "valor", "pouco", "baixo", "caro"],
    t: ["Preço/Valor justo", "Negociação"] },
  { p: ["combinad", "prometeu", "cumpr"],
    t: ["Cumpriu o combinado", "Transparência"] },
];

/**
 * A biblioteca de testemunhais da etapa O.
 *
 * São as avaliações de verdade do perfil da loja no Google — 750 com
 * texto, tema e colaborador citado, das 994 positivas que o Derek
 * levantou. Ficam em `testemunhais.json`, servido como arquivo estático:
 * 171 KB dentro do index.html pesariam em toda abertura do sistema, e
 * aqui só descem quando o negociador abre o bloco. E arquivo estático
 * não gasta função da Vercel, que está em 12 de 12.
 *
 * O filtro por colaborador é o que faz diferença na mesa: o negociador
 * mostra avaliação em que o nome dele aparece. Por isso ele já entra
 * marcado quando o nome bate com alguém citado.
 */
function Testemunhais({ necessidade, negociador, aoMostrar }) {
  const [tudo, setTudo] = useState(null);
  const [erro, setErro] = useState("");
  const [tema, setTema] = useState("");
  const [soMeus, setSoMeus] = useState(false);
  const [quantos, setQuantos] = useState(5);

  useEffect(() => {
    fetch("/testemunhais.json")
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error("Não consegui carregar as avaliações."))))
      .then(setTudo)
      .catch((e) => { setErro(e.message); setTudo([]); });
  }, []);

  // O primeiro nome basta: a planilha traz "Tiago/Thiago" e "André".
  const meuNome = semAcento(String(negociador || "").trim().split(/\s+/)[0] || "").toLowerCase();
  const ehMeu = (r) => !!meuNome && semAcento(r.c || "").toLowerCase().indexOf(meuNome) >= 0;
  const tenhoMinhas = !!(tudo || []).some(ehMeu);

  // Sugestão a partir do que o negociador escreveu na necessidade.
  const sugeridos = useMemo(() => {
    const t = semAcento(necessidade || "").toLowerCase();
    if (!t.trim()) return [];

    /* "sem pressa" estava acendendo Agilidade, que é o contrário do que
       o cliente disse. Achar a palavra não basta: se logo antes dela
       vier uma negação, ela vale ao contrário e o tema não entra. */
    const NEGA = ["sem ", "nao ", "nenhuma ", "nenhum "];
    const citado = (p, nega) => {
      let i = t.indexOf(p);
      while (i >= 0) {
        if (!nega) return true;
        // Quinze caracteres antes cobrem "não tem pressa" sem alcançar
        // a frase anterior.
        const antes = t.slice(Math.max(0, i - 15), i);
        if (!NEGA.some((neg) => antes.indexOf(neg) >= 0)) return true;
        i = t.indexOf(p, i + 1);
      }
      return false;
    };

    const achados = [];
    NECESSIDADE_TEMA.forEach((g) => {
      if (g.p.some((palavra) => citado(palavra, g.nega))) {
        g.t.forEach((x) => { if (achados.indexOf(x) < 0) achados.push(x); });
      }
    });
    return achados;
  }, [necessidade]);

  useEffect(() => { if (sugeridos.length && !tema) setTema(sugeridos[0]); }, [sugeridos.length]);
  useEffect(() => { if (tenhoMinhas) setSoMeus(true); }, [tenhoMinhas]);

  const lista = (tudo || [])
    .filter((r) => (!tema || (r.k || []).indexOf(tema) >= 0))
    .filter((r) => (!soMeus || ehMeu(r)));

  if (tudo === null) return <p className="text-[12px]" style={{ color: C.mute }}>Carregando as avaliações…</p>;
  if (erro) return <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>;

  return (
    <div>
      {!!sugeridos.length && (
        <p className="mb-2 text-[11px]" style={{ color: C.mute }}>
          Pelo que você escreveu, o que convence este cliente é{" "}
          <b style={{ color: C.ink }}>{sugeridos.join(" ou ")}</b>.
        </p>
      )}

      <div className="flex gap-1.5 overflow-x-auto pb-1">
        <button onClick={() => setTema("")}
          className="shrink-0 rounded-full px-3 py-1 text-[11px]"
          style={{ background: tema === "" ? C.roxo : "#fff", color: tema === "" ? "#fff" : C.mute, border: `1px solid ${C.line}` }}>
          Todos
        </button>
        {TEMAS_TESTEMUNHAL.map((t) => (
          <button key={t} onClick={() => setTema(t === tema ? "" : t)}
            className="shrink-0 rounded-full px-3 py-1 text-[11px]"
            style={{
              background: tema === t ? C.roxo : "#fff",
              color: tema === t ? "#fff" : (sugeridos.indexOf(t) >= 0 ? C.roxo : C.mute),
              border: `1px solid ${sugeridos.indexOf(t) >= 0 ? C.roxo : C.line}`,
              fontWeight: sugeridos.indexOf(t) >= 0 ? 700 : 400,
            }}>
            {t}
          </button>
        ))}
      </div>

      {tenhoMinhas && (
        <div className="mt-2">
          <Toggle label={`Só as que citam ${String(negociador).split(/\s+/)[0]}`}
            nota="Avaliação com o seu nome vale mais que uma genérica."
            valor={soMeus} onChange={setSoMeus} />
        </div>
      )}

      <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
        {lista.length} avaliaç{lista.length === 1 ? "ão" : "ões"} de 5 estrelas no Google.
      </p>

      <div className="mt-2 space-y-2">
        {lista.slice(0, quantos).map((r, i) => (
          <div key={i} className="rounded-md p-3" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
            <p className="text-[13px] leading-relaxed">“{r.t}”</p>
            <div className="mt-1.5 flex items-baseline justify-between gap-2">
              <span className="text-[11px] font-semibold">{r.n}</span>
              <span className="text-[10px]" style={{ color: C.mute }}>
                ★★★★★ · {r.q}{r.c ? ` · ${r.c}` : ""}
              </span>
            </div>
          </div>
        ))}
      </div>

      {lista.length > quantos && (
        <button onClick={() => setQuantos(quantos + 10)}
          className="mt-2 w-full rounded-md border py-2 text-[12px] font-semibold"
          style={{ borderColor: C.line, color: C.roxo }}>
          Ver mais {Math.min(10, lista.length - quantos)}
        </button>
      )}

      {!lista.length && (
        <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
          Nenhuma avaliação com esse filtro. Tire o tema ou desmarque o seu nome.
        </p>
      )}
    </div>
  );
}

function CartaoNegociador({ n, equipe, loja, desempenho, podeEditar, aoSalvar }) {
  const cad = loja ? null : (equipe || []).filter((x) => String(x.nome).toUpperCase() === n.nome)[0];

  // A loja é a soma das metas de quem está ativo — na planilha o mês
  // fechou em R$ 105.000 com seis negociadores de R$ 17.500 na semana.
  const metaValor = loja
    ? (equipe || []).reduce((soma, x) => soma + (Number(x.meta_valor) || 0), 0)
    : (cad ? Number(cad.meta_valor) || 0 : 0);
  const metaVolume = loja
    ? (equipe || []).reduce((soma, x) => soma + (Number(x.meta_volume) || 0), 0)
    : (cad ? Number(cad.meta_volume) || 0 : 0);

  const valor = Number(n.valor_vendido) || 0;
  const tm = n.vendas ? valor / n.vendas : 0;
  const pctValor = metaValor ? (valor / metaValor) * 100 : 0;
  const aRealizar = valor - metaValor;
  const semanas = n.semanas || [0, 0, 0, 0];
  const acumulado = semanas.reduce((a, b) => a + b, 0);
  const quinzenal = semanas[0] + semanas[1];
  const pctVolume = metaVolume ? (n.vendas / metaVolume) * 100 : 0;

  const dsp = loja || !cad ? null : (desempenho || {})[cad.id];
  const [edit, setEdit] = useState(null);

  const pc = (v) => `${(Number(v) || 0).toFixed(2).replace(".", ",")}%`;
  const rs = (v) => `R$ ${(Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

  const faixa = (titulo, cor, fundo) => (
    <div className="px-2 py-1 text-center text-[10px] font-bold tracking-wider"
      style={{ background: fundo, color: cor }}>{titulo}</div>
  );

  const item = (rot, val, destaque) => (
    <div key={rot} className="flex items-baseline justify-between gap-2 px-2 py-[2px] text-[10px]">
      <span style={{ color: "#3B3547" }}>{rot}</span>
      <span style={{ fontFamily: F.mono, fontWeight: destaque ? 700 : 500, whiteSpace: "nowrap" }}>{val}</span>
    </div>
  );

  return (
    <div style={{ width: 208, flex: "0 0 208px", border: `1px solid ${C.line}`, background: "#fff" }}>
      {/* ---- meta do mês ---- */}
      <div className="px-2 py-1 text-center text-[11px] font-bold" style={{ background: PL.cinza }}>{n.nome}</div>
      <div className="px-2 py-1 text-center text-[15px]" style={{ background: PL.cinza, fontFamily: F.mono, fontWeight: 700 }}>
        {rs(metaValor)}
      </div>
      <div style={{ background: PL.verde }}>
        {item("VOLUME", n.vendas)}
        {item("VALOR", rs(valor))}
        {item("T.M.", rs(tm))}
        {item("PERCENTUAL", pc(pctValor))}
      </div>
      {faixa("A REALIZAR", "#3B3547", PL.cinza)}
      <div className="px-2 py-1 text-center text-[14px]"
        style={{ background: aRealizar >= 0 ? "#1D7F58" : PL.vermelho, color: "#fff", fontFamily: F.mono, fontWeight: 700 }}>
        {aRealizar >= 0 ? rs(aRealizar) : `-${rs(Math.abs(aRealizar))}`}
      </div>

      {/* ---- meta semanal ---- */}
      {faixa("META SEMANAL", "#1F5C3A", "#C6E0B4")}
      <div className="px-2 py-1 text-center text-[13px]" style={{ background: PL.verde, fontFamily: F.mono, fontWeight: 700 }}>
        {rs(metaValor / 4)}
      </div>
      <div>
        {item("SEMANA 1", rs(semanas[0]))}
        {item("SEMANA 2", rs(semanas[1]))}
        <div className="flex items-baseline justify-between gap-2 px-2 py-[2px] text-[10px]"
          style={{ background: quinzenal >= metaValor / 2 ? "#D6EADF" : "#FBD4CE" }}>
          <span>QUINZENAL</span>
          <span style={{ fontFamily: F.mono, fontWeight: 700 }}>{rs(quinzenal)}</span>
        </div>
        {item("SEMANA 3", rs(semanas[2]))}
        {item("SEMANA 4", rs(semanas[3]))}
      </div>
      {faixa("ACUMULADO", "#3B3547", PL.cinza)}
      <div className="px-2 py-1 text-center text-[14px]"
        style={{ background: acumulado >= metaValor ? "#D6EADF" : PL.vermelho, color: acumulado >= metaValor ? C.ink : "#fff", fontFamily: F.mono, fontWeight: 700 }}>
        {rs(acumulado)}
      </div>

function CadastroNegociadores({ perfil }) {
  const [lista, setLista] = useState([]);
  const [novo, setNovo] = useState({ nome: "", papel: "negociador" });
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState(false);
  const eGerente = perfil && perfil.papel === "gerente";

  const carregar = () => listarNegociadores().then(setLista).catch((e) => setErro(e.message));
  useEffect(() => { carregar(); }, []);

  const cadastrar = async () => {
    if (!novo.nome.trim()) return;
    setErro(""); setIndo(true);
    try { await criarNegociador(novo); setNovo({ nome: "", papel: novo.papel }); await carregar(); }
    catch (e) { setErro(e.message); }
    setIndo(false);
  };

  const mexer = async (id, mud) => {
    setErro("");
    try { await atualizarNegociador(id, mud); await carregar(); }
    catch (e) { setErro(e.message); }
  };

  const grupo = (papel, titulo) => {
    const gente = lista.filter((n) => n.papel === papel);
    if (!gente.length) return null;
    return (
      <div className="mt-3">
        <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>{titulo}</div>
        <div className="mt-1.5 space-y-1.5">
          {gente.map((n) => (
            <div key={n.id} className="flex items-center gap-2 rounded-md px-3 py-2"
              style={{ background: n.ativo ? "#fff" : "#FBFAFC", border: `1px solid ${C.line}`, opacity: n.ativo ? 1 : 0.55 }}>
              <span className="flex-1 text-[13px] font-medium">{n.nome}</span>
              {eGerente ? (
                <>
                  <input className="w-24 rounded-md border px-2 py-1 text-right text-[12px] outline-none"
                    style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" title="Meta do mês em R$"
                    defaultValue={n.meta_valor == null ? "" : Math.round(n.meta_valor)}
                    onBlur={(e) => e.target.value != Math.round(n.meta_valor) && mexer(n.id, { meta_valor: e.target.value })} />
                  <input className="w-14 rounded-md border px-2 py-1 text-right text-[12px] outline-none"
                    style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" title="Meta de carros no mês"
                    defaultValue={n.meta_volume == null ? "" : n.meta_volume}
                    onBlur={(e) => e.target.value != n.meta_volume && mexer(n.id, { meta_volume: e.target.value })} />
                  <button onClick={() => mexer(n.id, { ativo: !n.ativo })} className="text-[11px]"
                    style={{ color: n.ativo ? C.laranja : C.verde }}>
                    {n.ativo ? "desativar" : "ativar"}
                  </button>
                </>
              ) : (
                <span className="text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>
                  {brl(n.meta_valor)} · {n.meta_volume} carros
                </span>
              )}
            </div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div>
      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {grupo("negociador", "Negociadores")}
      {grupo("prospeccao", "Prospecção")}

      {eGerente && (
        <div className="mt-3 space-y-2">
          <div className="grid grid-cols-3 gap-2">
            <input className={`${inputCls} col-span-2`} style={inputSty} placeholder="Nome"
              value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} />
            <select className={inputCls} style={inputSty} value={novo.papel}
              onChange={(e) => setNovo({ ...novo, papel: e.target.value })}>
              <option value="negociador">Negociador</option>
              <option value="prospeccao">Prospecção</option>
            </select>
          </div>
          <button onClick={cadastrar} disabled={indo || !novo.nome.trim()}
            className="w-full rounded-md py-2.5 text-[13px] font-semibold"
            style={{ background: indo || !novo.nome.trim() ? C.line : C.roxo, color: "#fff" }}>
            {indo ? "Cadastrando…" : "Cadastrar"}
          </button>
          <p className="text-[10px] leading-relaxed" style={{ color: C.mute }}>
            Os dois números são a meta do mês: valor e quantidade de carros. Saem do campo e já salvam.
          </p>
        </div>
      )}
    </div>
  );
}

  );
