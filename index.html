      <div className="self-start rounded-xl p-4" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
        <div className="text-[12px]" style={{ color: C.mute }}>Rentabilidade dos carros ({d.carros_vendidos} vendido{d.carros_vendidos === 1 ? "" : "s"})</div>
        <div className="text-[22px] font-bold" style={{ fontVariantNumeric: "tabular-nums", color: C.verde }}>{rs2(d.rentabilidade)}</div>
        <div className="mt-3 text-[12px]" style={{ color: C.mute }}>Despesas</div>
        <div className="text-[18px] font-semibold" style={{ fontVariantNumeric: "tabular-nums", color: C.laranja }}>{rs2(d.total_despesas + d.sem_categoria)}</div>
        <div className="mt-3 text-[12px]" style={{ color: C.mute }}>Lucro</div>
        <div className="text-[26px] font-bold" style={{ fontVariantNumeric: "tabular-nums", color: d.lucro >= 0 ? C.verde : C.laranja }}>{rs2(d.lucro)}</div>
        <p className="mt-3 text-[11px] leading-snug" style={{ color: C.mute }}>Como na planilha: despesa é crédito − débito por categoria, e a rentabilidade líquida dos carros vendidos no mês entra como receita. Negociação, retirada e transferência ficam fora.</p>
      </div>
    </div>
    </div>
  );
}

/* ---------------- carros ---------------- */

function FinCarros({ comp }) {
  const [d, setD] = useState(null); const [erro, setErro] = useState("");
  useEffect(() => { setD(null); fin("carros", { competencia: comp }).then(setD).catch((e) => setErro(e.message)); }, [comp]);
  if (erro) return <p className="text-[13px]" style={{ color: C.laranja }}>{erro}</p>;
  if (!d) return <p className="text-[13px]" style={{ color: C.mute }}>Cruzando estoque e lançamentos…</p>;
  const par = (p, pago) => {
    const ok = p > 0 && Math.abs(pago - p) < 1;
    const cor = p === 0 && pago === 0 ? C.mute : ok ? C.verde : pago === 0 ? C.laranja : AMARELO.texto;
    return <span style={{ color: cor, fontVariantNumeric: "tabular-nums" }}>{rs2(pago)}<span style={{ color: C.mute }}> / {rs2(p)}</span></span>;
  };
  return (
    <div className="rolar overflow-x-auto rounded-xl" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
      <table className="w-full" style={{ borderCollapse: "collapse", minWidth: 860 }}>
        <thead><tr>{["Entrou", "Carro", "Placa", "Comprador", "Pago ao cliente", "Quitação", "Débitos", "Recebido do lojista"].map((h, i) => (
          <th key={h} className="whitespace-nowrap px-2 py-2 text-[11px] font-semibold uppercase tracking-[0.04em]" style={{ color: C.mute, textAlign: i >= 4 ? "right" : "left", borderBottom: `1px solid ${C.line}` }}>{h}</th>))}</tr></thead>
        <tbody>
          {d.carros.map((c) => (
            <tr key={c.id} style={{ borderBottom: `1px solid ${C.line}` }}>
              <td className="whitespace-nowrap px-2 py-1.5 text-[12px]">{diaBR(c.entrou_em)}</td>
              <td className="px-2 py-1.5 text-[12px]">{c.carro || "—"}</td>
              <td className="px-2 py-1.5 text-[12px]" style={{ fontFamily: F.mono }}>{c.placa || "—"}</td>
              <td className="px-2 py-1.5 text-[12px]">{c.comprador || <span style={{ color: C.mute }}>{c.situacao === "vendido" ? "—" : "no pátio"}</span>}</td>
              <td className="px-2 py-1.5 text-right text-[12px]">{par(c.cliente.previsto, c.cliente.pago)}</td>
              <td className="px-2 py-1.5 text-right text-[12px]">{par(c.quitacao.previsto, c.quitacao.pago)}</td>
              <td className="px-2 py-1.5 text-right text-[12px]">{par(c.debitos.previsto, c.debitos.pago)}</td>
              <td className="px-2 py-1.5 text-right text-[12px]">{par(c.lojista.previsto, c.lojista.recebido)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      {!d.carros.length && <p className="px-3 py-6 text-center text-[13px]" style={{ color: C.mute }}>Nenhum carro entrou ou foi vendido em {rotuloMes(comp)}.</p>}
      <p className="px-3 py-2 text-[11px]" style={{ color: C.mute }}>pago / combinado. Verde bate; laranja nada pago; amarelo parcial. O vínculo vem da placa na descrição do lançamento.</p>
    </div>
  );
}

/* ---------------- folha ---------------- */

  const [d, setD] = useState(null); const [erro, setErro] = useState(""); const [vales, setVales] = useState([]);

    setErro("");
    fin("folha", { competencia: comp }).then(setD).catch((e) => setErro(e.message));
    fin("vale", { competencia: comp }).then((x) => setVales(x.vales)).catch(() => {});
  };
  useEffect(() => { setD(null); carregar(); }, [comp]);
  const gravar = async (l, mud) => {
    try { await fin("folha", { competencia: comp }, finJson("PUT", { funcionario_id: l.funcionario_id, salario: l.salario, comissao: l.comissao, bonificacao: l.bonificacao, ...mud })); carregar(); }

    <input className="w-24 rounded border px-1.5 py-1 text-right text-[12px] outline-none" style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal"

          <tbody>
            {d.folha.map((l) => (
              <tr key={l.funcionario_id} style={{ borderBottom: `1px solid ${C.line}` }}>
                <td className="px-2 py-1.5 text-[13px] font-semibold">{l.nome}{!l.gravada && <span className="ml-1 text-[10px] font-normal" style={{ color: C.mute }}>base</span>}</td>

/**
 * A venda: escolher o comprador e lançar o valor.
 *
 * O comprador é cadastro, não texto solto no carro. O mesmo lojista
 * leva dezenas de carros — sem cadastro, "AUTO CENTER SUL" e "Auto
 * Center Sul" viram dois compradores e o histórico se parte no meio.
 */
function VenderCarro({ e, aoVender, aoFechar }) {
  const [busca, setBusca] = useState("");
  const [achados, setAchados] = useState([]);
  const [escolhido, setEscolhido] = useState(null);
  const [criando, setCriando] = useState(null);
  const [valor, setValor] = useState("");
  const [quando, setQuando] = useState(hojeEmSP());
  const [nota, setNota] = useState("");
  const [erro, setErro] = useState("");
  const c = contaDoEstoque(e);

  useEffect(() => {
    let vivo = true;
    const t = setTimeout(() => {
      listarCompradores(busca).then((l) => { if (vivo) setAchados(l); }).catch(() => {});
    }, 250);
    return () => { vivo = false; clearTimeout(t); };
  }, [busca]);

  const cadastrar = async () => {
    if (!String(criando.nome || "").trim()) return;
    setErro("");
    try {
      const novo = await criarComprador(criando);
      setEscolhido(novo); setCriando(null); setBusca("");
    } catch (ex) { setErro(ex.message); }
  };

  const valorNum = Number(String(valor).replace(/\./g, "").replace(",", ".")) || 0;
  const margem = valorNum ? valorNum - c.atual : null;
  const pronto = !!escolhido && valorNum > 0 && /^\d{4}-\d{2}-\d{2}$/.test(quando);

  return (
    <div className="rounded-lg p-3.5" style={{ background: C.paper, border: `1px solid ${C.roxo}` }}>
      <div className="flex items-baseline justify-between">
        <span className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.roxo, fontWeight: 700 }}>Vender carro</span>
        <button onClick={aoFechar} className="text-[12px]" style={{ color: C.mute }}>cancelar</button>
      </div>

      {erro && <p className="mt-1 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      {/* ---- comprador ---- */}
      {escolhido ? (
        <div className="mt-2 flex items-center gap-2 rounded-md px-2.5 py-2" style={{ background: C.roxoFraco }}>
          <span className="flex-1 text-[14px] font-semibold">{escolhido.nome}
            <span className="block text-[11px] font-normal" style={{ color: C.mute }}>
              {escolhido.tipo === "lojista" ? "Lojista" : "Pessoa física"}
              {escolhido.cidade ? ` · ${escolhido.cidade}${escolhido.uf ? `/${escolhido.uf}` : ""}` : ""}
            </span>
          </span>
          <button onClick={() => setEscolhido(null)} className="text-[11px]" style={{ color: C.roxo }}>trocar</button>
        </div>
      ) : criando ? (
        <div className="mt-2 space-y-2">
          <input className={inputCls} style={inputSty} placeholder="Nome do comprador" value={criando.nome}
            onChange={(ev) => setCriando({ ...criando, nome: ev.target.value })} />
          <div className="flex gap-2">
            <select className="rounded-md border px-2 py-2.5 text-[16px] outline-none" style={inputSty}
              value={criando.tipo} onChange={(ev) => setCriando({ ...criando, tipo: ev.target.value })}>
              <option value="lojista">Lojista</option>
              <option value="pessoa_fisica">Pessoa física</option>
            </select>
            <input className={`${inputCls} flex-1`} style={inputSty} placeholder="Telefone" inputMode="tel"
              value={criando.telefone} onChange={(ev) => setCriando({ ...criando, telefone: ev.target.value })} />
          </div>
          <div className="flex gap-2">
            <input className={`${inputCls} flex-1`} style={inputSty} placeholder="CPF ou CNPJ"
              value={criando.documento} onChange={(ev) => setCriando({ ...criando, documento: ev.target.value })} />
            <input className={`${inputCls} flex-1`} style={inputSty} placeholder="Cidade"
              value={criando.cidade} onChange={(ev) => setCriando({ ...criando, cidade: ev.target.value })} />
            <input className="w-16 rounded-md border px-2 py-2.5 text-center text-[16px] uppercase outline-none" style={inputSty}
              placeholder="UF" maxLength={2}
              value={criando.uf} onChange={(ev) => setCriando({ ...criando, uf: ev.target.value })} />
          </div>
          <div className="flex gap-2">
            <button onClick={cadastrar} className="flex-1 rounded-md py-2 text-[14px] font-semibold"
              style={{ background: C.roxo, color: "#fff" }}>Cadastrar</button>
            <button onClick={() => setCriando(null)} className="px-3 text-[13px]" style={{ color: C.mute }}>voltar à busca</button>
          </div>
        </div>
      ) : (
        <div className="mt-2">
          <input className={inputCls} style={inputSty} placeholder="Buscar comprador pelo nome"
            value={busca} onChange={(ev) => setBusca(ev.target.value)} />
          {!!achados.length && (
            <div className="mt-1.5 max-h-48 overflow-y-auto rounded-md" style={{ border: `1px solid ${C.line}` }}>
              {achados.map((x) => (
                <button key={x.id} onClick={() => setEscolhido(x)}
                  className="block w-full px-2.5 py-2 text-left text-[13px]" style={{ borderBottom: `1px solid ${C.line}` }}>
                  {x.nome}
                  <span style={{ color: C.mute }}> · {x.tipo === "lojista" ? "lojista" : "PF"}{x.cidade ? ` · ${x.cidade}` : ""}</span>
                </button>
              ))}
            </div>
          )}
          <button onClick={() => setCriando({ nome: busca, tipo: "lojista", telefone: "", documento: "", cidade: "", uf: "" })}
            className="mt-1.5 text-[12px]" style={{ color: C.roxo }}>
            + cadastrar comprador novo
          </button>
        </div>
      )}

      {/* ---- valor e data ---- */}
      <div className="mt-3 flex gap-2">
        <label className="flex-1">
          <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Valor da venda</span>
          <input className="mt-[2px] w-full rounded-md border px-2 py-2 text-right text-[18px] outline-none"
            style={{ ...inputSty, fontFamily: F.mono, fontWeight: 700 }} inputMode="decimal"
            value={valor} onChange={(ev) => setValor(ev.target.value)} />
        </label>
        <label style={{ width: 140, flex: "0 0 140px" }}>
          <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Quando</span>
          <input type="date" className="mt-[2px] w-full rounded-md border px-2 py-2 text-[15px] outline-none"
            style={inputSty} value={quando} onChange={(ev) => setQuando(ev.target.value)} />
        </label>
      </div>

      {/* A margem aparece ANTES de confirmar, e é de propósito: é a
          última chance de ver que o carro está saindo no prejuízo. */}
      <div className="mt-2 rounded-md px-2.5 py-2 text-[13px]"
        style={{ background: margem == null ? "#F7F5FA" : margem >= 0 ? "#E8F3EE" : "#FDECE8" }}>
        {margem == null
          ? <span style={{ color: C.mute }}>Custo de hoje: {brl(c.atual)}. Digite o valor para ver a margem.</span>
          : <>Margem <b style={{ color: margem >= 0 ? C.verde : C.laranja, fontFamily: F.mono }}>{brl(margem)}</b>
              <span style={{ color: C.mute }}> — venda {brl(valorNum)} menos custo {brl(c.atual)}</span>
              {!!c.aberto && <span style={{ color: AMARELO.texto }}> · {c.aberto} conta{c.aberto > 1 ? "s" : ""} ainda em aberto</span>}</>}
      </div>

      <input className={`${inputCls} mt-2`} style={inputSty} placeholder="Observação da venda (opcional)"
        value={nota} onChange={(ev) => setNota(ev.target.value)} />

      <button disabled={!pronto}
        onClick={() => aoVender({
          situacao: "vendido", comprador_id: escolhido.id,
          valor_venda: valor, vendido_em: quando, nota_venda: nota,
        })}
        className="mt-3 w-full rounded-md py-3 text-[15px] font-semibold"
        style={{ background: pronto ? C.roxo : C.line, color: pronto ? "#fff" : C.mute }}>
        Confirmar a venda
      </button>
      {!pronto && (
        <p className="mt-1 text-[11px]" style={{ color: C.mute }}>
          Falta {!escolhido ? "escolher o comprador" : "informar o valor"}.
        </p>
      )}
    </div>
  );
}

function TelaADM({ perfil }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [foco, setFoco] = useState(null);      // atendimento aberto
  const [cl, setCl] = useState(null);
  const [indo, setIndo] = useState(false);
  const [salvo, setSalvo] = useState(false);

  const conferidoEm = (a) => {
    const c = a.checklist;
    const linha = Array.isArray(c) ? c[0] : c;
    return linha ? linha.adm_conferido_em : null;
  };

  const carregar = () =>
    listarAtendimentos({ status: "fechado", limite: 200 })
      .then((ls) => setLista(ls.slice().sort((a, b) => {
        const ca = conferidoEm(a) ? 1 : 0, cb = conferidoEm(b) ? 1 : 0;
        if (ca !== cb) return ca - cb;                    // pendente primeiro
        return String(b.data || "").localeCompare(String(a.data || ""));
      })))
      .catch((e) => setErro(e.message));

  useEffect(() => { carregar(); }, []);

  const abrir = async (a) => {
    setFoco(a); setCl(null); setErro(""); setSalvo(false);
    try { setCl((await lerChecklist(a.id)) || {}); }
    catch (e) { setErro(e.message); setCl({}); }
  };

  const gravar = async () => {
    setIndo(true); setErro(""); setSalvo(false);
    try {
      // Só os campos do administrativo sobem. Mandar o check list
      // inteiro daqui sobrescreveria o que o negociador digitou com o
      // que esta tela leu minutos atrás.
      const so = {};
      CL_ADM.forEach(([k]) => { so[k] = !!cl[k]; });
      const d = await salvarChecklist(foco.id, so);
      setCl(d); setSalvo(true);
      await carregar();
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };

  const pendentes = lista ? lista.filter((a) => !conferidoEm(a)).length : 0;

  if (foco) {
    return (
      <div className="min-h-screen" style={{ background: C.paper }}>
        <div className="px-4 py-3" style={{ background: C.roxo, color: "#fff" }}>
          <button onClick={() => { setFoco(null); setCl(null); }} className="text-[12px]" style={{ opacity: 0.85 }}>← voltar à fila</button>
          <h1 className="mt-1 text-[18px]" style={{ fontFamily: F.disp, fontWeight: 700 }}>
            {foco.cliente_nome || "Sem nome"}
          </h1>
          <p className="text-[12px]" style={{ opacity: 0.8 }}>
            {foco.carro_descricao || (foco.veiculo && foco.veiculo.marca_modelo) || "—"}
          </p>
        </div>

        <div className="space-y-3 p-4">
          {!cl && !erro && <p className="text-[12px]" style={{ color: C.mute }}>Carregando o check list…</p>}

          {cl && (
            <>
              <div className="rounded-lg p-4" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
                <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
                  O que o negociador entregou
                </div>
                <div className="mt-2 space-y-1">
                  {CL_ITENS.map(([k, r]) => (
                    <div key={k} className="flex items-center justify-between text-[12px]">
                      <span style={{ color: cl[k] ? C.ink : C.mute }}>{r}</span>
                      <span style={{ color: cl[k] ? C.verde : C.laranja, fontWeight: 600 }}>{cl[k] ? "sim" : "não"}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-3 border-t pt-2 text-[12px]" style={{ borderColor: C.line }}>
                  <div className="flex justify-between"><span style={{ color: C.mute }}>Valor de venda</span><span style={{ fontFamily: F.mono }}>{brl(numeroBR(cl.valor_venda))}</span></div>
                  <div className="flex justify-between"><span style={{ color: C.mute }}>Líquido ao cliente</span><span style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(numeroBR(cl.valor_cliente))}</span></div>
                </div>
                {cl.banco_favorecido && (
                  <div className="mt-2 rounded-md px-3 py-2 text-[11px]" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                    <div style={{ color: C.mute }}>Favorecido</div>
                    <div style={{ fontWeight: 600 }}>{cl.banco_favorecido}</div>
                    <div style={{ fontFamily: F.mono, color: C.mute }}>
                      {[cl.banco_nome, cl.banco_agencia, cl.banco_conta].filter(Boolean).join(" · ")}
                    </div>
                    {cl.banco_pix && <div style={{ fontFamily: F.mono, color: C.mute }}>PIX {cl.banco_pix}</div>}
                  </div>
                )}
              </div>

              <div className="rounded-lg p-4" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
                <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.roxo }}>
                  Conferência do administrativo
                </div>
                <div className="mt-2 space-y-1.5">
                  {CL_ADM.map(([k, r]) => (
                    <Toggle key={k} label={r} valor={!!cl[k]} onChange={(v) => setCl({ ...cl, [k]: v })} />
                  ))}
                </div>
                {cl.adm_conferido_em && (
                  <p className="mt-2 text-[11px]" style={{ color: C.verde }}>
                    Última conferência em {new Date(cl.adm_conferido_em).toLocaleString("pt-BR")}.
                  </p>
                )}
                <button onClick={gravar} disabled={indo}
                  className="mt-3 w-full rounded-md py-2.5 text-[13px] font-semibold"
                  style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
                  {indo ? "Salvando…" : "Salvar a conferência"}
                </button>
                {salvo && !erro && <p className="mt-2 text-[12px]" style={{ color: C.verde }}>Conferência registrada no seu nome.</p>}
              </div>
            </>
          )}

          {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <Cabecalho titulo="Administrativo"
        sub={lista ? `${lista.length} fechados · ${pendentes} esperando conferência` : "Carregando…"} />

      <div className="space-y-2">
        {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

        {lista && !lista.length && (
          <p className="text-[12px] leading-relaxed" style={{ color: C.mute }}>
            Nenhum negócio fechado ainda. A fila enche quando o negociador marca o atendimento como fechado.
          </p>
        )}

        {lista && lista.map((a) => {
          const ok = conferidoEm(a);
          return (
            <button key={a.id} onClick={() => abrir(a)}
              className="w-full rounded-lg p-3 text-left"
              style={{ background: "#fff", border: `1px solid ${ok ? C.line : C.laranja}` }}>
              <div className="flex items-baseline justify-between gap-2">
                <span className="text-[14px]" style={{ fontWeight: 600 }}>{a.cliente_nome || "Sem nome"}</span>
                <span className="shrink-0 text-[10px] font-semibold" style={{ color: ok ? C.verde : C.laranja }}>
                  {ok ? "conferido" : "pendente"}
                </span>
              </div>
              <div className="text-[12px]" style={{ color: C.mute }}>
                {a.carro_descricao || (a.veiculo && a.veiculo.marca_modelo) || "—"}
                {a.veiculo && a.veiculo.placa ? ` · ${a.veiculo.placa}` : ""}
              </div>
              <div className="text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>
                {a.data ? String(a.data).split("-").reverse().join("/") : "sem data"}
                {a.valor_fechado ? ` · ${brl(Number(a.valor_fechado))}` : ""}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ==================================================================
 * A CASCA
 *
 * Até aqui o sistema era uma tela de celular que crescia junto com a
 * janela: botão de 1.400 px, tabela de dez colunas a 10 px, e os
 * destinos da gestão — painel, estoque, leads, administrativo —
 * escondidos numa sanfona dentro da lista de atendimentos. Navegação
 * era um widget, não navegação.
 *
 * Agora há uma casca única: barra lateral no desktop, barra inferior
 * no celular, e cada destino é uma página com cabeçalho próprio. O
 * mês é escolhido uma vez, no cabeçalho, e vale para tudo que mede
 * um mês.
 * ================================================================== */

const ICONE = {
  atendimentos: "M4 6h16M4 12h16M4 18h10",
  prevendas: "M5 4h3l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2zM17 3v4M15 5h4",
  estoque: "M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5zm4 2h.01M17 15h.01",
  painel: "M4 20V10m6 10V4m6 16v-7",
  rentabilidade: "M4 18l5-6 4 3 7-9M15 6h5v5",
  financeiro: "M3 7h18v12H3zM3 11h18M7 15h3",
  lojistas: "M4 9h16l-1 11H5zM4 9l2-5h12l2 5M9 13v4M15 13v4",
  leads: "M5 4h3l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z",
  adm: "M9 12l2 2 4-4M5 5h14v14H5z",
  gestao: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 4l-2-1 .3-2.2-2-1.2-1.7 1.4L12.5 8l-.5-2h-2l-.5 2-2.1 1-1.7-1.4-2 1.2L4 11l-2 1 2 1-.3 2.2 2 1.2 1.7-1.4 2.1 1 .5 2h2l.5-2 2.1-1 1.7 1.4 2-1.2L18 13z",
};

const Icone = ({ nome, tam }) => (
  <svg width={tam || 20} height={tam || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d={ICONE[nome] || ""} />
  </svg>
);

/**
 * Os destinos, e quem vê cada um. Administrativo aparece para quem
 * confere; gestão (cadastros, metas, importação) só para gerente.
 */
function destinosPara(perfil) {
  const gerente = !!(perfil && perfil.papel === "gerente");
  const adm = !!(perfil && (perfil.administrativo || gerente));
  return [
    { id: "prevendas", rot: "Pré-vendas", curto: "Pré-v.", principal: true },
    { id: "atendimentos", rot: "Atendimentos", curto: "Atend.", principal: true },
    { id: "estoque", rot: "Estoque", curto: "Estoque", principal: true },
    { id: "painel", rot: "Painel do mês", curto: "Painel" },
    { id: "rentabilidade", rot: "Rentabilidade", curto: "Rentab." },
    { id: "leads", rot: "Leads de indicação", curto: "Leads" },
    adm ? { id: "adm", rot: "Administrativo", curto: "Adm." } : null,
    gerente ? { id: "gestao", rot: "Equipe e metas", curto: "Equipe" } : null,
    // Área restrita: só quem tem o sinalizador no perfil (0021). A tela
    // esconde o destino; quem protege de verdade é a RLS.
    (perfil && (perfil.financeiro || gerente)) ? { id: "financeiro", rot: "Financeiro", curto: "Financ." } : null,
    { id: "lojistas", rot: "Venda para lojistas", curto: "Lojistas" },
  ].filter(Boolean);
}

const Logotipo = () => (
  <span className="flex items-center gap-2">
    <span className="grid h-8 w-8 place-items-center rounded-lg text-[13px]"
      style={{ background: C.roxo, color: "#fff", fontFamily: F.disp, fontWeight: 800 }}>V</span>
    <span className="text-[15px] tracking-tight" style={{ fontFamily: F.disp, fontWeight: 800 }}>Vaapty</span>
  </span>
);

function Shell({ perfil, tela, setTela, children }) {
  const destinos = destinosPara(perfil);
  const principais = destinos.filter((d) => d.principal);
  const demais = destinos.filter((d) => !d.principal);
  const [mais, setMais] = useState(false);

  const ir = (id) => { setTela(id); setMais(false); window.scrollTo(0, 0); };

  const itemLateral = (d) => {
    const ativo = tela === d.id;
    return (
      <button key={d.id} onClick={() => ir(d.id)}
        className="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-[14px]"
        style={{
          background: ativo ? C.roxoFraco : "transparent",
          color: ativo ? C.roxo : C.ink,
          fontWeight: ativo ? 700 : 500,
        }}>
        <Icone nome={d.id} tam={18} />
        {d.rot}
      </button>
    );
  };

  const itemInferior = (d, aoClicar, ativo) => (
    <button key={d.id} onClick={aoClicar} className="flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px]"
      style={{ color: ativo ? C.roxo : C.mute, fontWeight: ativo ? 700 : 500 }}>
      <Icone nome={d.id} tam={22} />
      {d.curto}
    </button>
  );

  return (
    <div className="min-h-screen" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
      {/* ---- barra lateral (desktop) ---- */}
      <aside className="fixed inset-y-0 left-0 hidden w-60 flex-col lg:flex"
        style={{ background: C.paper, borderRight: `1px solid ${C.line}` }}>
        <div className="px-5 pt-5 pb-4"><Logotipo /></div>
        <nav className="flex-1 space-y-0.5 px-3">
          {principais.map(itemLateral)}
          {!!demais.length && <div className="my-3 border-t" style={{ borderColor: C.line }} />}
          {demais.map(itemLateral)}
        </nav>
        <div className="px-5 py-4" style={{ borderTop: `1px solid ${C.line}` }}>
          <div className="truncate text-[13px] font-semibold">{perfil ? perfil.nome : ""}</div>
          <div className="flex items-center justify-between text-[12px]" style={{ color: C.mute }}>
            <span className="capitalize">{perfil ? perfil.papel : ""}</span>
            <button onClick={sair} style={{ color: C.mute }}>sair</button>
          </div>
        </div>
      </aside>

      {/* ---- conteúdo ---- */}
      <main className="pb-24 lg:pb-10 lg:pl-60">
        <div className="mx-auto max-w-[1080px] px-4 pt-4 lg:px-8 lg:pt-8">{children}</div>
      </main>

      {/* ---- barra inferior (celular) ----
          Três destinos de todo dia e um "mais". O polegar alcança;
          a sanfona no meio da lista, não. */}
      <nav className="fixed inset-x-0 bottom-0 z-30 flex lg:hidden"
        style={{ background: C.paper, borderTop: `1px solid ${C.line}`, paddingBottom: "env(safe-area-inset-bottom)" }}>
        {principais.map((d) => itemInferior(d, () => ir(d.id), tela === d.id))}
        <button onClick={() => setMais(!mais)} className="flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px]"
          style={{ color: mais || demais.some((d) => d.id === tela) ? C.roxo : C.mute, fontWeight: 500 }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" />
          </svg>
          Mais
        </button>
      </nav>

      {mais && (
        <div className="fixed inset-0 z-40 lg:hidden" onClick={() => setMais(false)} style={{ background: "rgba(24,18,33,0.35)" }}>
          <div className="absolute inset-x-0 bottom-0 rounded-t-2xl p-4 pb-8" style={{ background: C.paper }}
            onClick={(e) => e.stopPropagation()}>
            <div className="mx-auto mb-3 h-1 w-10 rounded-full" style={{ background: C.line }} />
            {demais.map((d) => (
              <button key={d.id} onClick={() => ir(d.id)}
                className="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-[15px]"
                style={{ color: tela === d.id ? C.roxo : C.ink, fontWeight: tela === d.id ? 700 : 500 }}>
                <Icone nome={d.id} tam={20} />{d.rot}
              </button>
            ))}
            <div className="mt-2 flex items-center justify-between px-3 pt-3 text-[13px]"
              style={{ borderTop: `1px solid ${C.line}`, color: C.mute }}>
              <span>{perfil ? `${perfil.nome} · ${perfil.papel}` : ""}</span>
              <button onClick={sair} style={{ color: C.roxo, fontWeight: 600 }}>sair</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/**
 * O cabeçalho de cada página: título, uma linha de contexto, e no
 * máximo uma ação principal. O seletor de mês entra aqui nas páginas
 * que medem um mês — é o mesmo estado, vindo do App.
 */
function Cabecalho({ titulo, sub, acao, mes }) {
  return (
    <div className="mb-4 flex flex-wrap items-end justify-between gap-x-4 gap-y-3 lg:mb-6">
      <div className="min-w-0">
        <h1 className="text-[26px] leading-none tracking-tight lg:text-[30px]" style={{ fontFamily: F.disp, fontWeight: 800 }}>
          {titulo}
        </h1>
        {sub && <p className="mt-1.5 text-[14px]" style={{ color: C.mute }}>{sub}</p>}
      </div>
      <div className="flex flex-wrap items-center gap-2">
        {mes && (
          <select className="rounded-lg border px-3 py-2 text-[14px] outline-none"
            style={{ ...inputSty, fontWeight: 600 }} value={mes.comp} onChange={(e) => mes.setComp(e.target.value)}>
            {mes.MESES.map((m) => <option key={m} value={m}>{rotuloMes(m)}</option>)}
            {mes.todos && <option value="">Todos os meses</option>}
          </select>
        )}
        {acao}
      </div>
    </div>
  );
}

const BotaoPrimario = ({ children, onClick, disabled, className }) => (
  <button onClick={onClick} disabled={disabled}
    className={`rounded-lg px-4 py-2.5 text-[14px] font-semibold ${className || ""}`}
    style={{ background: disabled ? C.line : C.roxo, color: disabled ? C.mute : "#fff" }}>
    {children}
  </button>
);

/** Equipe, metas e importação — o que era a sanfona da gestão. */
function TelaGestao({ perfil, comp }) {
  const [importando, setImportando] = useState(false);
  return (
    <div>
      <Cabecalho titulo="Equipe e metas"
        sub="Quem vende, a meta de cada um e a meta da loja no mês." />
      <div className="grid gap-4 lg:grid-cols-[1fr_320px]">
        <Bloco titulo="Negociadores">
          <CadastroNegociadores perfil={perfil} competencia={comp || competenciaDe(hojeEmSP())} />
        </Bloco>
        <div className="space-y-4">
          <Bloco titulo="Planilha do CRM" sub="Cole o que copiou do Google Sheets. Cada linha vira um atendimento.">
            {importando
              ? <Importar aoTerminar={() => setImportando(false)} />
              : <BotaoPrimario onClick={() => setImportando(true)} className="w-full">Importar planilha</BotaoPrimario>}
          </Bloco>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [estado, setEstado] = useState("carregando");   // carregando | fora | esperando | dentro | erro
  const [perfil, setPerfil] = useState(null);
  const [erro, setErro] = useState("");
  const [aberto, setAberto] = useState(null);           // atendimento em foco, ou a lista
  // A página atual e o mês. O mês mora aqui porque vale para mais de
  // uma página — a lista de atendimentos e o painel medem o mesmo mês.
  const [tela, setTela] = useState("atendimentos");
  const [comp, setComp] = useState(() => competenciaDe(hojeEmSP()));
  const MESES = useMemo(() => mesesRecentes(18), []);

  const verQuemSou = async () => {
    try {
      const d = await consultarPerfil();
      if (!d.liberado || !d.eu) { setEstado("esperando"); return; }
      setPerfil(d.eu); setEstado("dentro");
    } catch (e) {
      setErro(e.message);
      setEstado(AUTH.sessao ? "erro" : "fora");
    }
  };

  useEffect(() => {
    AUTH.aoSair = () => { setPerfil(null); setEstado("fora"); };
    (async () => {
      try { await carregarConfig(); } catch (e) { setErro(e.message); setEstado("erro"); return; }
      await restaurarSessao();
      if (!AUTH.sessao) { setEstado("fora"); return; }
      await verQuemSou();
    })();
    return () => { AUTH.aoSair = null; };
  }, []);

  if (estado === "carregando") return <Aviso titulo="Carregando…">Um instante.</Aviso>;
  if (estado === "fora") return <Login aoEntrar={verQuemSou} />;

  if (estado === "esperando") return (
    <Aviso titulo="Acesso ainda não liberado"
      acao={<button onClick={sair} className="mt-4 text-[13px] underline" style={{ color: C.roxo }}>Sair</button>}>
      Sua conta existe, mas o gerente ainda não liberou. Enquanto isso, o sistema não mostra nada — é assim de propósito, porque aqui dentro tem dado de cliente.
    </Aviso>
  );

  if (estado === "erro") return (
    <Aviso titulo="Não consegui entrar"
      acao={<button onClick={sair} className="mt-4 text-[13px] underline" style={{ color: C.roxo }}>Sair e tentar de novo</button>}>
      {erro}
    </Aviso>
  );

  if (aberto) {
    return <VaaptyAponte perfil={perfil} atendimento={aberto}
             aoVoltar={() => setAberto(null)}
             aoRecarregar={async () => { try { setAberto(await lerAtendimento(aberto.id)); } catch (e) {} }} />;
  }
  const abrir = async (id) => {
    try { setAberto(await lerAtendimento(id)); } catch (e) { alert(e.message); }
  };
  const mes = { comp, setComp, MESES };
  const compOuAtual = comp || competenciaDe(hojeEmSP());

  return (
    <Shell perfil={perfil} tela={tela} setTela={setTela}>
      {tela === "prevendas" && <TelaPreVendas perfil={perfil} aoAbrirAtendimento={abrir} />}
      {tela === "atendimentos" && <CRM perfil={perfil} aoAbrir={abrir} mes={{ ...mes, todos: true }} />}
      {tela === "estoque" && <TelaEstoque perfil={perfil} comp={compOuAtual} mes={mes} />}
      {tela === "rentabilidade" && <TelaEstoque perfil={perfil} comp={compOuAtual} mes={mes} modo="rentabilidade" />}
      {tela === "painel" && <Funil perfil={perfil} comp={compOuAtual} mes={mes} />}
      {tela === "leads" && <LeadsIndicacao />}
      {tela === "adm" && <TelaADM perfil={perfil} />}
      {tela === "gestao" && <TelaGestao perfil={perfil} comp={compOuAtual} />}
      {tela === "financeiro" && <TelaFinanceiro perfil={perfil} comp={compOuAtual} mes={mes} />}
      {tela === "lojistas" && <TelaVendaLojistas perfil={perfil} />}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
</body>
