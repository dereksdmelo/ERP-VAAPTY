const ehNumero = (v) => {
  const s = String(v || "").replace(/R\$|\s|\./g, "").replace(",", ".");
  return s !== "" && Number.isFinite(Number(s));
};

/**
 * Lê o que o Google Sheets põe na área de transferência: colunas
 * separadas por tabulação.
 *
 * Duas coisas da planilha real que o leitor precisa aguentar:
 *
 *  - PROPOSTAS e LOJISTA se repetem quatro vezes. As colunas são
 *    pareadas na ordem em que aparecem.
 *  - Essas células misturam valor com recado ("02/06/23/Não atendeu",
 *    "Vendeu", "Carro está no Mato Grosso"). O que não é número vira
 *    observação em vez de proposta — e nada se perde.
 */
/**
 * A mesma regra de `data()` do api/importar.js. Duplicada de propósito:
 * a tela precisa contar antes de mandar, e a planilha tem "06/052022" e
 * "18/05/0202". Se uma das duas mudar, a outra muda junto.
 */
function dataDaPlanilha(v) {
  const t = String(v == null ? "" : v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(t);
  if (!m) return null;
  let ano = m[3];
  if (ano.length === 2) ano = `20${ano}`;
  if (ano.length !== 4) return null;
  const a = Number(ano), mes = Number(m[2]), d = Number(m[1]);
  if (a < 2000 || a > 2100 || mes < 1 || mes > 12 || d < 1 || d > 31) return null;
  return `${a}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function lerPlanilha(texto) {
  const linhas = String(texto || "").split(/\r?\n/).map((l) => l.split("\t"));
  const iCab = linhas.findIndex((l) => {
    const c = l.map(semAcentoMaiusc);
    return c.indexOf("PLACA") >= 0 && c.indexOf("CLIENTE") >= 0;
  });
  if (iCab < 0) return { erro: "Não achei o cabeçalho. Copie incluindo a linha com DATA, NEGOCIADOR, CARRO, PLACA…" };

  const cab = linhas[iCab].map(semAcentoMaiusc);

  /**
   * O cabeçalho real não é o que eu tinha suposto: a planilha diz
   * NEGOCIADORES (plural), PROSPECTO e ANO — e o parser procurava
   * NEGOCIADOR, PROSPEC e ANO/MOD. Nome que não bate vira coluna
   * ignorada em silêncio, e foi assim que 199 de 200 linhas entraram
   * sem negociador.
   *
   * Daí a busca por lista de nomes possíveis, e o relatório de colunas
   * na tela: importação que erra calada é pior que importação que falha.
   */
  const um = (...nomes) => {
    for (const nome of nomes) { const i = cab.indexOf(nome); if (i >= 0) return i; }
    // Nenhum bateu inteiro: tenta pelo começo. "PRETENSÃO" volta do
    // Sheets como "PRETENSAO" quando o acento sobrevive e como
    // "PRETENS?O" quando não — e nos dois casos "PRETENS" acerta.
    // Só com sete letras ou mais, senão "ANO" casaria com qualquer
    // coisa que comece com A.
    for (const nome of nomes) {
      if (nome.length < 7) continue;
      const raiz = nome.slice(0, 7);
      const i = cab.findIndex((c) => c.indexOf(raiz) === 0);
      if (i >= 0) return i;
    }
    return -1;
  };
  const todos = (nome) => cab.map((c, i) => (c === nome ? i : -1)).filter((i) => i >= 0);

  const iProp = todos("PROPOSTAS");
  const iLoj = todos("LOJISTA");

  /**
   * LOJISTA vale para a coluna de PROPOSTAS mais próxima à esquerda
   * dele. No cabeçalho de hoje — PROPOSTAS | cx | PROPOSTAS | LOJISTA —
   * o lojista é do segundo, não do primeiro. Parear por ordem, como
   * antes, colava o lojista na coluna errada.
   */
  const lojistaDe = (ip) => {
    const depois = iLoj.filter((j) => j > ip);
    if (!depois.length) return -1;
    const j = depois[0];
    return iProp.some((outro) => outro > ip && outro < j) ? -1 : j;
  };

  const col = {
    data: um("DATA"),
    negociador: um("NEGOCIADORES", "NEGOCIADOR", "VENDEDOR", "VENDEDORES"),
    prospec: um("PROSPECTO", "PROSPEC", "PROSPECCAO"),
    carro: um("CARRO", "VEICULO", "MODELO"),
    placa: um("PLACA"),
    ano: um("ANO/MOD", "ANO/MODELO", "ANO"),
    km: um("KM"),
    cliente: um("CLIENTE"),
    telefone: um("TELEFONE", "FONE", "CONTATO"),
    origem: um("ORIGEM"),
    status: um("STATUS"),
    fipe: um("FIPE"),
    pretensao: um("PRETENSAO"),
    motivo: um("MOTIVO DA VENDA", "MOTIVO"),
    obs: um("OBS SOBRE NEGOCIACAO", "OBS SOBRE NEGOCIACOES", "OBS", "OBSERVACOES", "OBSERVACAO"),
    conseguiu: um("QUEM CONSEGUIU"),
    acao: um("ACAO", "ACOES"),
  };
  const pega = (l, i) => (i >= 0 && l[i] != null ? String(l[i]).trim() : "");

  // O que casou e o que sobrou, para a tela mostrar antes de gravar.
  const usadas = new Set();
  Object.keys(col).forEach((k) => { if (col[k] >= 0) usadas.add(col[k]); });
  iProp.concat(iLoj).forEach((i) => usadas.add(i));
  const achadas = Object.keys(col).filter((k) => col[k] >= 0);
  const faltando = Object.keys(col).filter((k) => col[k] < 0);
  const ignoradas = cab.map((c, i) => (!usadas.has(i) && c ? c : "")).filter(Boolean);

  const fora = [];
  const prontas = [];

  linhas.slice(iCab + 1).forEach((l) => {
    if (!l.length || l.every((c) => !String(c || "").trim())) return;
    const cliente = pega(l, col.cliente);
    const carro = pega(l, col.carro);
    if (!cliente && !carro) return;   // linha de rodapé ou de total

    const propostas = [];
    const recados = [];
    iProp.forEach((ip) => {
      const valor = pega(l, ip);
      const lojista = pega(l, lojistaDe(ip));
      if (valor && ehNumero(valor)) propostas.push({ valor, lojista });
      else if (valor) recados.push(valor);
      if (lojista && !ehNumero(valor) && !propostas.some((p) => p.lojista === lojista)) {
        if (lojista.length > 3) recados.push(lojista);
      }
    });

    // Motivo da venda, observação e quem conseguiu não têm coluna
    // própria no banco, e jogar fora seria perder o que a planilha tem
    // de mais útil. Vão para `observacoes` com o rótulo na frente.
    const motivo = pega(l, col.motivo);
    const obsPlanilha = pega(l, col.obs);
    const conseguiu = pega(l, col.conseguiu);
    const acao = pega(l, col.acao);
    if (motivo) recados.unshift(`Motivo: ${motivo}`);
    if (obsPlanilha) recados.push(obsPlanilha);
    if (conseguiu) recados.push(`Quem conseguiu: ${conseguiu}`);
    if (acao) recados.push(`Ação: ${acao}`);

    const origemBruta = semAcentoMaiusc(pega(l, col.origem));
    const statusBruto = semAcentoMaiusc(pega(l, col.status));
    if (origemBruta && !DE_ORIGEM[origemBruta]) fora.push(`origem "${pega(l, col.origem)}"`);
    if (statusBruto && !DE_STATUS[statusBruto]) fora.push(`status "${pega(l, col.status)}"`);

    prontas.push({
      data: pega(l, col.data),
      negociador_nome: pega(l, col.negociador),
      prospec: pega(l, col.prospec),
      cliente_nome: cliente,
      cliente_telefone: pega(l, col.telefone),
      carro_descricao: carro,
      placa: pega(l, col.placa),
      ano: pega(l, col.ano),
      km: pega(l, col.km),
      fipe: pega(l, col.fipe),
      pretensao: pega(l, col.pretensao),
      origem: DE_ORIGEM[origemBruta] || "outro",
      status: DE_STATUS[statusBruto] || "aberto",
      observacoes: recados.join(" · ") || "",
      propostas,
    });
  });

  return {
    linhas: prontas,
    desconhecidos: [...new Set(fora)],
    colunas: { achadas, faltando, ignoradas, propostas: iProp.length, lojistas: iLoj.length },
  };
}

function Importar({ aoTerminar }) {
  const [texto, setTexto] = useState("");
  const [lido, setLido] = useState(null);
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");
  const [feito, setFeito] = useState(null);

  const ler = () => {
    setErro(""); setFeito(null);
    const r = lerPlanilha(texto);
    if (r.erro) { setErro(r.erro); setLido(null); return; }
    if (!r.linhas.length) { setErro("Achei o cabeçalho, mas nenhuma linha com cliente ou carro."); setLido(null); return; }
    setLido(r);
  };

  const enviar = async () => {
    setErro(""); setIndo(true);
    try {
      const lotes = [];
      for (let i = 0; i < lido.linhas.length; i += 400) lotes.push(lido.linhas.slice(i, i + 400));
      const soma = { atendimentos: 0, veiculos: 0, propostas: 0, sem_data: 0 };
      for (const lote of lotes) {
        const r = await importarLinhas(lote);
        soma.atendimentos += r.atendimentos; soma.veiculos += r.veiculos;
        soma.propostas += r.propostas; soma.sem_data += r.sem_data;
      }
      setFeito(soma); setLido(null); setTexto("");
      if (aoTerminar) await aoTerminar();
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };

  // Contava célula preenchida, não data legível: "18/05/0202" entrava
  // na conta de "com data válida" e depois virava nulo no servidor. O
  // aviso existe justamente para dizer quantas vão entrar sem data.
  const comData = lido ? lido.linhas.filter((l) => dataDaPlanilha(l.data)).length : 0;
  const comPlaca = lido ? lido.linhas.filter((l) => /^[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}$/.test(String(l.placa).replace(/[^A-Za-z0-9]/g, ""))).length : 0;
  const nProp = lido ? lido.linhas.reduce((a, l) => a + l.propostas.length, 0) : 0;

  return (
    <Bloco titulo="Importar a planilha" sub="No Google Sheets: selecione da linha de cabeçalho até a última, ⌘C, e cole aqui.">
      <div className="space-y-2.5">
        <textarea rows={4} className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 11 }}
          placeholder="Cole aqui" value={texto} onChange={(e) => setTexto(e.target.value)} />

        <div className="flex gap-2">
          <button onClick={ler} disabled={!texto.trim()}
            className="flex-1 rounded-md border py-2.5 text-[13px] font-semibold"
            style={{ borderColor: C.line, color: texto.trim() ? C.roxo : C.mute }}>
            Conferir
          </button>
          {lido && (
            <button onClick={enviar} disabled={indo}
              className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
              style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
              {indo ? "Importando…" : `Importar ${lido.linhas.length}`}
            </button>
          )}
        </div>

        {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

        {lido && (
          <div className="rounded-md p-3 text-[11px] leading-relaxed" style={{ background: "#FBFAFC", border: `1px solid ${C.line}`, color: C.mute }}>
            <b style={{ color: C.ink }}>{lido.linhas.length} linhas</b> · {comData} com data válida ·
            {" "}{comPlaca} com placa válida · {nProp} propostas com valor.

            {/* O relatório de colunas existe porque a primeira
                importação errou calada: o cabeçalho dizia NEGOCIADORES
                e o parser procurava NEGOCIADOR. Agora dá para ver
                antes de gravar. */}
            {lido.colunas && (
              <div className="mt-2 border-t pt-2" style={{ borderColor: C.line }}>
                <div style={{ color: C.verde }}>
                  Reconheci: {lido.colunas.achadas.join(", ")}
                  {lido.colunas.propostas ? ` · ${lido.colunas.propostas} coluna(s) de proposta` : ""}
                  {lido.colunas.lojistas ? ` · ${lido.colunas.lojistas} de lojista` : ""}
                </div>
                {lido.colunas.faltando.length > 0 && (
                  <div className="mt-1" style={{ color: C.laranja }}>
                    Não achei: {lido.colunas.faltando.join(", ")} — essas linhas entram sem esse dado.
                  </div>
                )}
                {lido.colunas.ignoradas.length > 0 && (
                  <div className="mt-1">
                    Colunas que não uso: {lido.colunas.ignoradas.join(", ")}.
                  </div>
                )}
              </div>
            )}
            {comData < lido.linhas.length && (
              <div className="mt-1" style={{ color: C.laranja }}>
                {lido.linhas.length - comData} sem data legível entram sem data — a planilha tem "06/052022" e "18/05/0202". Inventar dia seria pior.
              </div>
            )}
            {comPlaca < lido.linhas.length && (
              <div className="mt-1">
                {lido.linhas.length - comPlaca} sem placa válida entram só como atendimento, sem ficha de veículo.
              </div>
            )}
            {!!lido.desconhecidos.length && (
              <div className="mt-1">Valores fora da lista viram "outro"/"aberto": {lido.desconhecidos.slice(0, 6).join(", ")}.</div>
            )}
            <div className="mt-1">Texto que estava nas colunas de proposta e não era número virou observação.</div>
          </div>
        )}

        {feito && (
          <div className="rounded-md p-3 text-[12px]" style={{ background: "#E7F4EE", border: `1px solid ${C.verde}`, color: C.verde }}>
            {feito.atendimentos} atendimentos, {feito.veiculos} veículos e {feito.propostas} propostas gravados.
          </div>
        )}
      </div>
    </Bloco>
  );
}

function Funil({ perfil, comp, mes }) {
  const [d, setD] = useState(null);
  const [equipe, setEquipe] = useState([]);
  const [erro, setErro] = useState("");
  // Sempre aberto: é uma página agora, não um widget dentro da lista.
  const aberto = true;
  const [desempenho, setDesempenho] = useState({});
  // Sem isso a régua pisca "nenhuma meta cadastrada" enquanto o
  // cadastro não chega — texto errado é pior que espaço vazio.
  const [equipeOk, setEquipeOk] = useState(false);
  const [metaLoja, setMetaLoja] = useState(null);
  // O mês vem de cima. Ele manda na tela inteira — a lista do CRM e
  // este painel — e por isso o seletor mora lá, não aqui: dois
  // seletores discordando na mesma tela é pior que nenhum.
  const eGerente = !!(perfil && perfil.papel === "gerente");

  useEffect(() => {
    if (!aberto) return;
    // Trocar de mês rápido pode fazer a resposta velha chegar por
    // último e sobrescrever a nova. `vivo` descarta o que ficou para
    // trás.
    let vivo = true;
    setD(null); setErro(""); setMetaLoja(null); setDesempenho({});
    const { de, ate } = faixaDoMes(comp);
    consultarFunil(de, ate).then((x) => { if (vivo) setD(x); })
      .catch((e) => { if (vivo) setErro(e.message); });
    // Falha aqui cai na soma das individuais, e a régua diz que caiu.
    lerMetaLoja(comp).then((x) => { if (vivo) setMetaLoja(x.meta); }).catch(() => {});
    // Falha aqui não derruba o dashboard: sem confiabilidade os
    // cartões saem com zero, que é o estado real de quem não lançou.
    lerDesempenho(comp).then((x) => { if (vivo) setDesempenho(x); }).catch(() => {});
    return () => { vivo = false; };
  }, [aberto, comp]);

  // O cadastro de gente não muda de mês, então carrega uma vez só.
  useEffect(() => {
    if (!aberto || equipeOk) return;
    listarNegociadores().then(setEquipe).catch(() => {}).then(() => setEquipeOk(true));
  }, [aberto]);

  const salvarDesempenho = async (id, valores) => {
    try {
      const salvo = await gravarDesempenho(id, valores, comp);
      setDesempenho((m) => ({ ...m, [id]: salvo }));
    } catch (e) { setErro(e.message); }
  };

  const Num = ({ rot, v, sub, cor }) => (
    <div>
      <div className="text-[12px]" style={{ color: C.mute }}>{rot}</div>
      <div className="text-[24px] leading-tight tracking-tight" style={{ fontWeight: 700, color: cor || C.ink, fontVariantNumeric: "tabular-nums" }}>{v}</div>
      {sub && <div className="text-[12px]" style={{ color: C.mute }}>{sub}</div>}
    </div>
  );

  return (
    <div>
      <Cabecalho titulo="Painel do mês"
        sub={`${rotuloMes(comp)} · meta, ritmo e conversão por negociador`}
        mes={mes} />

      {erro && <p className="mt-2 text-[13px]" style={{ color: C.laranja }}>{erro}</p>}
      {!d && !erro && <p className="mt-2 text-[13px]" style={{ color: C.mute }}>Calculando…</p>}

      {d && (
        <>
          {equipeOk && (
            <div className="mb-4">
              <ReguaDoMes d={d} equipe={equipe} metaLoja={metaLoja} />
            </div>
          )}

          {/* Os seis números do funil num cartão só. Antes dois deles
              ficavam soltos fora do cartão, como se fossem outra coisa. */}
          <div className="grid grid-cols-2 gap-4 rounded-xl p-4 lg:grid-cols-6 lg:p-5" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
            <Num rot="Fluxo" v={d.total.fluxo} />
            <Num rot="Avaliações" v={d.total.avaliacoes} sub={d.total.avaliacoes_sobre_fluxo != null ? `${d.total.avaliacoes_sobre_fluxo}% do fluxo` : null} />
            <Num rot="Com proposta" v={d.total.com_proposta} />
            <Num rot="Vendas" v={d.total.vendas} cor={C.verde}
              sub={d.total.conversao != null ? `${d.total.conversao}% do fluxo` : null} />
            <Num rot="FIPE médio" v={d.fipe_medio ? brl(d.fipe_medio) : "—"} />
            <Num rot="Venda média" v={d.venda_media ? brl(d.venda_media) : "—"} />
          </div>

          {!!d.por_origem.length && (
            <div className="rolar mt-3 overflow-x-auto">
              <table className="w-full" style={{ borderCollapse: "collapse", minWidth: 420 }}>
                <thead>
                  <tr>
                    {["Origem", "Fluxo", "Aval.", "Prop.", "Vendas", "Conv."].map((h, i) => (
                      <th key={h} className="whitespace-nowrap px-2 py-1.5 text-[9px] uppercase tracking-[0.1em]"
                        style={{ color: C.mute, borderBottom: `1px solid ${C.line}`, textAlign: i ? "right" : "left" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {d.por_origem.map((o) => (
                    <tr key={o.origem} style={{ borderBottom: `1px solid ${C.line}` }}>
                      <td className="whitespace-nowrap px-2 py-1.5 text-[12px]">{rotulo(ORIGENS, o.origem)}</td>
                      {[o.fluxo, o.avaliacoes, o.com_proposta, o.vendas].map((v, i) => (
                        <td key={i} className="px-2 py-1.5 text-[12px]" style={{ fontFamily: F.mono, textAlign: "right" }}>{v}</td>
                      ))}
                      <td className="px-2 py-1.5 text-[12px]" style={{ fontFamily: F.mono, textAlign: "right", color: o.conversao ? C.verde : C.mute }}>
                        {o.conversao != null ? `${o.conversao}%` : "—"}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {!!(d.por_negociador || []).length && (
            <div className="rolar mt-4 overflow-x-auto">
              <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                Fluxo x conversão
              </div>
              <div className="mt-2 flex gap-3" style={{ minWidth: "min-content" }}>
                {d.por_negociador.map((n) => (
                  <CartaoNegociador key={n.nome} n={n} equipe={equipe}
                    desempenho={desempenho} podeEditar={eGerente} aoSalvar={salvarDesempenho} />
                ))}
                <CartaoNegociador n={{ ...d.total, nome: "LOJA" }} equipe={equipe} loja metaLoja={metaLoja}
                  desempenho={desempenho} podeEditar={false} aoSalvar={null} />
              </div>
            </div>
          )}

          {!!d.sem_negociador && (
            <p className="mt-2 rounded px-2 py-1.5 text-[11px]" style={{ background: AMARELO.fundo, color: AMARELO.texto }}>
              {d.sem_negociador} atendimento{d.sem_negociador > 1 ? "s" : ""} sem negociador — não entra{d.sem_negociador > 1 ? "m" : ""} na tabela acima. Os importados vieram sem esse campo.
            </p>
          )}

          <p className="mt-2 text-[10px] leading-relaxed" style={{ color: C.mute }}>
            De {d.de} a {d.ate}. Avaliação conta ficha com valor FIPE, não só cliente que entrou.
            {d.truncado ? " Atenção: bateu no teto de 2000 e o número está incompleto." : ""}
          </p>
        </>
      )}
    </div>
  );
}

/**
 * O cadastro de gente: quem atende e quem prospecta. É o que faz o
 * dashboard existir — sem nome no atendimento, não há por quem medir.
 *
 * Só gerente edita (a RLS da 0010 recusa o resto), e a tela reflete
 * isso em vez de deixar o negociador clicar e tomar erro.
 */
const STATUS_LEAD = [
  ["novo", "Novo"], ["em_contato", "Em contato"], ["agendado", "Agendado"],
  ["virou_atendimento", "Virou atendimento"], ["sem_interesse", "Sem interesse"],
];

/**
 * A fila de leads de indicação.
 *
 * Antes disto a etapa E colhia cinco nomes por atendimento e eles
 * morriam no localStorage do aparelho — ninguém nunca ligou para
 * nenhum. O valor da tela não é a tabela, é o telefone virar link:
 * quem trabalha a fila liga do próprio celular, sem copiar número.
 *
 * A tabela rola na horizontal dentro da própria caixa. O corpo da
 * página não pode rolar de lado no celular.
 */
function LeadsIndicacao() {
  const aberto = true;   // é uma página agora
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [filtro, setFiltro] = useState("");

  const carregar = (st) =>
    listarIndicacoes(st || undefined).then(setLista).catch((e) => setErro(e.message));

  useEffect(() => { if (aberto) { setErro(""); carregar(filtro); } }, [aberto, filtro]);

  const mudar = async (l, status) => {
    // Otimista: a fila é trabalhada com o telefone na orelha, e esperar
    // o servidor a cada troca de status trava a mão de quem liga.
    setLista((ls) => ls.map((x) => (x.id === l.id ? { ...x, status } : x)));
    try { await atualizarIndicacao(l.id, { status }); }
    catch (e) {
      setErro(e.message);
      setLista((ls) => ls.map((x) => (x.id === l.id ? { ...x, status: l.status } : x)));
    }
  };


  const abertos = lista ? lista.filter((l) => l.status === "novo").length : 0;

  return (
    <div>
      <Cabecalho titulo="Leads de indicação"
        sub={lista
          ? <>{lista.length} na fila · <span style={{ color: abertos ? C.laranja : C.mute }}>{abertos} sem ninguém ter ligado</span></>
          : "Quem os clientes indicaram, com telefone para ligar do próprio celular."} />
      <div className="rounded-xl p-4" style={{ background: C.paper, border: `1px solid ${C.line}` }}>

      <div className="mt-3 flex gap-1.5 overflow-x-auto pb-1">
        <button onClick={() => setFiltro("")}
          className="shrink-0 rounded-full px-3 py-1 text-[11px]"
          style={{ background: filtro === "" ? C.roxo : "#fff", color: filtro === "" ? "#fff" : C.mute, border: `1px solid ${C.line}` }}>
          Todos
        </button>
        {STATUS_LEAD.map(([k, r]) => (
          <button key={k} onClick={() => setFiltro(k)}
            className="shrink-0 rounded-full px-3 py-1 text-[11px]"
            style={{ background: filtro === k ? C.roxo : "#fff", color: filtro === k ? "#fff" : C.mute, border: `1px solid ${C.line}` }}>
            {r}
          </button>
        ))}
      </div>

      {erro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {!lista && !erro && <p className="mt-2 text-[12px]" style={{ color: C.mute }}>Carregando…</p>}

      {lista && !lista.length && (
        <p className="mt-3 text-[12px] leading-relaxed" style={{ color: C.mute }}>
          Nenhum lead ainda. Eles entram quando o negociador manda as indicações da etapa E.
        </p>
      )}

      {lista && lista.length > 0 && (
        <div className="mt-3 overflow-x-auto">
          <table className="w-full text-[12px]" style={{ borderCollapse: "collapse", minWidth: 620 }}>
            <thead>
              <tr style={{ color: C.mute }}>
                <th className="py-1 pr-3 text-left font-medium">Indicado</th>
                <th className="py-1 pr-3 text-left font-medium">Telefone</th>
                <th className="py-1 pr-3 text-left font-medium">Negociador</th>
                <th className="py-1 pr-3 text-left font-medium">Quem indicou</th>
                <th className="py-1 pr-3 text-left font-medium">Telefone de quem indicou</th>
                <th className="py-1 text-left font-medium">Status</th>
              </tr>
            </thead>
            <tbody>
              {lista.map((l) => (
                <tr key={l.id} style={{ borderTop: `1px solid ${C.line}` }}>
                  <td className="py-2 pr-3">{l.nome}</td>
                  <td className="py-2 pr-3" style={{ fontFamily: F.mono }}>
                    {l.telefone
                      ? <a href={`tel:${String(l.telefone).replace(/\D/g, "")}`} style={{ color: C.roxo }}>{l.telefone}</a>
                      : <span style={{ color: C.mute }}>—</span>}
                  </td>
                  <td className="py-2 pr-3">{l.negociador_nome || <span style={{ color: C.mute }}>—</span>}</td>
                  <td className="py-2 pr-3">{l.cliente_nome || <span style={{ color: C.mute }}>—</span>}</td>
                  <td className="py-2 pr-3" style={{ fontFamily: F.mono }}>
                    {l.cliente_telefone
                      ? <a href={`tel:${String(l.cliente_telefone).replace(/\D/g, "")}`} style={{ color: C.roxo }}>{l.cliente_telefone}</a>
                      : <span style={{ color: C.mute }}>—</span>}
                  </td>
                  <td className="py-2">
                    <select value={l.status} onChange={(e) => mudar(l, e.target.value)}
                      className="rounded border px-2 py-1 text-[11px]" style={{ borderColor: C.line, background: "#fff", color: C.ink }}>
                      {STATUS_LEAD.map(([k, r]) => <option key={k} value={k}>{r}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
    </div>
  );
}

/**
 * ===== o cartão do negociador, no desenho da aba FLUXO X CONVERSÃO =====
 *
 * Quatro faixas empilhadas, como na planilha:
 *
 *   META            meta do mês, volume, valor, T.M., percentual, a realizar
 *   META SEMANAL    a meta dividida por quatro, semana a semana
 *   CONVERSÃO       fluxo, vendas, conversão, índice AT, percentual da meta
 *   CONFIABILIDADE  o que o gestor observa, e o score
 *
 * As três primeiras o servidor calcula dos atendimentos. A quarta é
 * digitada (0013): falta, atraso e postura não existem no banco de
 * atendimento, e inventar seria pior que deixar em branco.
 *
 * As semanas são a divisão do mês em quatro blocos de dias (1–7, 8–14,
 * 15–21, 22 em diante), não semanas de calendário — é como a meta é
 * cobrada na casa.
 */
const CONFIABILIDADE = [
  ["faltas", "FALTAS"], ["atrasos", "ATRASOS"], ["perdeu_atendimento", "PERDEU ATENDIMENTO"],
  ["prospectou", "PROSPECTOU"], ["avaliacao_google", "AVALIAÇÃO GOOGLE"], ["ficou_mais", "FICOU MAIS"],
  ["gravou_video", "GRAVOU VÍDEO"], ["avaliacao_errada", "AVALIAÇÃO ERRADA"], ["postura", "POSTURA"],
];

// As cores da aba, não as do sistema: é o que faz o gerente reconhecer
// a tela como sendo a planilha dele.
const PL = {
  cinza: "#D9D9D9", verde: "#D6EADF", vermelho: "#E8402A",
  laranja: "#FFA000", creme: "#FFF2CC", magenta: "#FF00FF", roxo: "#4A1173",
};

/**
 * Os anexos do negócio: CRLV em PDF, CNH ou identidade do cliente,
 * comprovante de residência, laudo, comprovante de pagamento.
 *
 * Cada tela mostra só os rótulos que interessam ali — o CRLV e a CNH na
 * Pesquisa, porque é de onde saem os dados do cliente e do carro; o
 * comprovante de residência no Fechamento, que é quando ele importa.
 *
 * **Aqui entra documento de identidade.** O bucket é privado e o link
 * vence em uma hora; a regra de retenção ainda é conversa com o
 * jurídico, e está anotada em PENDENCIAS.md.
 */
function Anexos({ atendimentoId, rotulos, aoMudar }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState("");
  const entrada = useRef(null);
  const [rotulo, setRotulo] = useState(rotulos[0]);

  useEffect(() => {
    if (!atendimentoId) { setLista([]); return; }
    listarAnexos(atendimentoId).then(setLista).catch((e) => { setErro(e.message); setLista([]); });
  }, [atendimentoId]);

  const daTela = (lista || []).filter((a) => rotulos.indexOf(a.rotulo) >= 0);

  const escolher = async (ev) => {
    const arq = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!arq) return;
    setErro(""); setIndo(arq.name);
    try {
      const novo = await enviarAnexo(atendimentoId, arq, rotulo);
      setLista((ls) => [novo, ...(ls || [])]);
      if (aoMudar) aoMudar();
    } catch (e) { setErro(e.message); }
    setIndo("");
  };

  if (!atendimentoId) {
    return (
      <p className="text-[12px] leading-relaxed" style={{ color: C.mute }}>
        Os anexos ficam presos ao atendimento. Abra este carro pela lista de atendimentos para anexar.
      </p>
    );
  }

  const kb = (b) => (b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round((b || 0) / 1024)} KB`);

  return (
    <div>
      <div className="flex gap-2">
        <select className={inputCls} style={inputSty} value={rotulo} onChange={(e) => setRotulo(e.target.value)}>
          {rotulos.map((r) => <option key={r}>{r}</option>)}
        </select>
        <button onClick={() => entrada.current && entrada.current.click()} disabled={!!indo}
          className="shrink-0 rounded-md px-4 text-[13px] font-semibold"
          style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
          {indo ? "Enviando…" : "Anexar"}
        </button>
      </div>
      <input ref={entrada} type="file" accept="application/pdf,image/jpeg,image/png,image/webp"
        onChange={escolher} style={{ display: "none" }} />

      <p className="mt-1.5 text-[10px]" style={{ color: C.mute }}>
        PDF ou foto, até 10 MB. Fica guardado no atendimento, fora do aparelho.
      </p>

      {erro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {lista === null && <p className="mt-2 text-[12px]" style={{ color: C.mute }}>Carregando…</p>}

      {!!daTela.length && (
        <div className="mt-3 space-y-1.5">
          {daTela.map((a) => (
            <div key={a.id} className="flex items-center justify-between gap-2 rounded-md px-3 py-2"
              style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
              <div style={{ minWidth: 0 }}>
                <div className="text-[12px] font-semibold">{a.rotulo}</div>
                <div className="truncate text-[10px]" style={{ color: C.mute }}>
                  {a.nome || "arquivo"} · {kb(a.bytes)}
                </div>
              </div>
              <div className="flex shrink-0 items-center gap-3">
                {a.url && (
                  <a href={a.url} target="_blank" rel="noopener noreferrer"
                    className="text-[11px] font-semibold" style={{ color: C.roxo }}>abrir</a>
                )}
                <button onClick={async () => {
                    if (!window.confirm(`Apagar o anexo "${a.rotulo}"?`)) return;
                    try { await apagarAnexo(a.id); setLista((ls) => ls.filter((x) => x.id !== a.id)); }
                    catch (e) { setErro(e.message); }
                  }}
                  className="text-[11px]" style={{ color: C.laranja }}>apagar</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const TEMAS_TESTEMUNHAL = [
  "Atendimento", "Negociação", "Agilidade/Rapidez", "Transparência",
  "Sem burocracia", "Pagamento/Pix rápido", "Preço/Valor justo",
  "Confiança/Segurança", "Venda rápida do veículo", "Cumpriu o combinado",
  "Superou expectativas", "Documentação",
];

/**
 * Palavras da necessidade do cliente → tema da avaliação.
 *
 * O negociador escreve "precisa quitar dívida rápido" e o que ajuda ali
 * é uma avaliação sobre agilidade e pagamento, não uma sobre o café da
 * loja. É casamento por palavra, não modelo de linguagem — mesma regra
 * dos sinais da escuta, e pelo mesmo motivo.
 */
const NECESSIDADE_TEMA = [
  // `nega: true` só onde a negação inverte o sentido. "Sem pressa" é o
  // contrário de pressa, mas "sem burocracia" é exatamente o desejo que
  // o tema "Sem burocracia" atende — tratar os dois igual erraria um
  // dos dois sempre.
  { p: ["pressa", "rapid", "urgent", "hoje", "amanha", "semana", "quitar", "divida", "dinheiro"],
    t: ["Agilidade/Rapidez", "Pagamento/Pix rápido", "Venda rápida do veículo"], nega: true },
  { p: ["desconfia", "medo", "golpe", "segur", "confia"],
    t: ["Confiança/Segurança", "Transparência"] },
  { p: ["burocra", "document", "papel", "transfer"],
    t: ["Sem burocracia", "Documentação"] },
  { p: ["preco", "valor", "pouco", "baixo", "caro"],
    t: ["Preço/Valor justo", "Negociação"] },
  { p: ["combinad", "prometeu", "cumpr"],
    t: ["Cumpriu o combinado", "Transparência"] },
];

/**
 * A biblioteca de testemunhais da etapa O.
 *
 * São as avaliações de verdade do perfil da loja no Google — 750 com
 * texto, tema e colaborador citado, das 994 positivas que o Derek
 * levantou. Ficam em `testemunhais.json`, servido como arquivo estático:
 * 171 KB dentro do index.html pesariam em toda abertura do sistema, e
 * aqui só descem quando o negociador abre o bloco. E arquivo estático
 * não gasta função da Vercel, que está em 12 de 12.
 *
 * O filtro por colaborador é o que faz diferença na mesa: o negociador
 * mostra avaliação em que o nome dele aparece. Por isso ele já entra
 * marcado quando o nome bate com alguém citado.
 */
/**
 * A apresentação na própria tela, em vez de abrir o PDF em outra aba.
 *
 * O Derek pediu assim depois de desistir do vídeo: virar as páginas na
 * frente do cliente, sem sair do sistema e sem depender do leitor de
 * PDF do celular — que no iPhone abre o arquivo inteiro numa aba e
 * quase sempre volta para a primeira página.
 *
 * As onze páginas foram extraídas do próprio `apresentacao.pdf`, que
 * era feito de uma imagem por página, e viraram JPEG de 1200 px:
 * 1,5 MB no total contra 9,2 MB do PDF. Descem uma a uma, e não de
 * uma vez, porque isso acontece no 4G do pátio.
 *
 * O PDF continua no lugar, para quando ele quiser mandar por WhatsApp.
 */
const APRESENTACAO_PAGINAS = 11;

function Apresentacao({ aoAbrir }) {
  const [pag, setPag] = useState(1);
  const trilho = useRef(null);

  const ir = (n) => {
    const alvo = Math.min(APRESENTACAO_PAGINAS, Math.max(1, n));
    setPag(alvo);
    if (trilho.current) {
      trilho.current.scrollTo({ left: trilho.current.clientWidth * (alvo - 1), behavior: "smooth" });
    }
  };

  // Arrastar com o dedo também conta: o indicador segue o que está na
  // tela, e não só o que os botões mandaram.
  const aoRolar = () => {
    if (!trilho.current) return;
    const largura = trilho.current.clientWidth || 1;
    const atual = Math.round(trilho.current.scrollLeft / largura) + 1;
    if (atual !== pag) setPag(atual);
  };

  return (
    <div>
      <div ref={trilho} onScroll={aoRolar}
        className="flex overflow-x-auto rounded-md"
        style={{ scrollSnapType: "x mandatory", border: `1px solid ${C.line}`, background: "#000" }}>
        {Array.from({ length: APRESENTACAO_PAGINAS }, (_, i) => (
          <img key={i} src={`/apresentacao/${String(i + 1).padStart(2, "0")}.jpg`}
            alt={`Página ${i + 1}`}
            loading={i === 0 ? "eager" : "lazy"}
            onLoad={i === 0 && aoAbrir ? aoAbrir : undefined}
            style={{ width: "100%", flex: "0 0 100%", scrollSnapAlign: "start", display: "block" }} />
        ))}
      </div>

      <div className="mt-2 flex items-center justify-between gap-3">
        <button onClick={() => ir(pag - 1)} disabled={pag <= 1}
          className="rounded-md border px-4 py-2 text-[13px] font-semibold"
          style={{ borderColor: C.line, color: pag <= 1 ? C.mute : C.roxo }}>
          ‹ Anterior
        </button>
        <span className="text-[12px]" style={{ color: C.mute, fontFamily: F.mono }}>
          {pag} de {APRESENTACAO_PAGINAS}
        </span>
        <button onClick={() => ir(pag + 1)} disabled={pag >= APRESENTACAO_PAGINAS}
          className="rounded-md border px-4 py-2 text-[13px] font-semibold"
          style={{ borderColor: C.line, color: pag >= APRESENTACAO_PAGINAS ? C.mute : C.roxo }}>
          Próxima ›
        </button>
      </div>
    </div>
  );
}

function Testemunhais({ necessidade, negociador, aoMostrar }) {
  const [tudo, setTudo] = useState(null);
  const [erro, setErro] = useState("");
  const [tema, setTema] = useState("");
  const [soMeus, setSoMeus] = useState(false);
  const [quantos, setQuantos] = useState(5);

  useEffect(() => {
    fetch("/testemunhais.json")
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error("Não consegui carregar as avaliações."))))
      .then(setTudo)
      .catch((e) => { setErro(e.message); setTudo([]); });
  }, []);

  // O primeiro nome basta: a planilha traz "Tiago/Thiago" e "André".
  const meuNome = semAcento(String(negociador || "").trim().split(/\s+/)[0] || "").toLowerCase();
  const ehMeu = (r) => !!meuNome && semAcento(r.c || "").toLowerCase().indexOf(meuNome) >= 0;
  const tenhoMinhas = !!(tudo || []).some(ehMeu);

  // Sugestão a partir do que o negociador escreveu na necessidade.
  const sugeridos = useMemo(() => {
    const t = semAcento(necessidade || "").toLowerCase();
    if (!t.trim()) return [];

    /* "sem pressa" estava acendendo Agilidade, que é o contrário do que
       o cliente disse. Achar a palavra não basta: se logo antes dela
       vier uma negação, ela vale ao contrário e o tema não entra. */
    const NEGA = ["sem ", "nao ", "nenhuma ", "nenhum "];
    const citado = (p, nega) => {
      let i = t.indexOf(p);
      while (i >= 0) {
        if (!nega) return true;
        // Quinze caracteres antes cobrem "não tem pressa" sem alcançar
        // a frase anterior.
        const antes = t.slice(Math.max(0, i - 15), i);
        if (!NEGA.some((neg) => antes.indexOf(neg) >= 0)) return true;
        i = t.indexOf(p, i + 1);
      }
      return false;
    };

    const achados = [];
    NECESSIDADE_TEMA.forEach((g) => {
      if (g.p.some((palavra) => citado(palavra, g.nega))) {
        g.t.forEach((x) => { if (achados.indexOf(x) < 0) achados.push(x); });
      }
    });
    return achados;
  }, [necessidade]);

  useEffect(() => { if (sugeridos.length && !tema) setTema(sugeridos[0]); }, [sugeridos.length]);
  useEffect(() => { if (tenhoMinhas) setSoMeus(true); }, [tenhoMinhas]);

  const lista = (tudo || [])
    .filter((r) => (!tema || (r.k || []).indexOf(tema) >= 0))
    .filter((r) => (!soMeus || ehMeu(r)));

  if (tudo === null) return <p className="text-[12px]" style={{ color: C.mute }}>Carregando as avaliações…</p>;
  if (erro) return <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>;

  return (
    <div>
      {!!sugeridos.length && (
        <p className="mb-2 text-[11px]" style={{ color: C.mute }}>
          Pelo que você escreveu, o que convence este cliente é{" "}
          <b style={{ color: C.ink }}>{sugeridos.join(" ou ")}</b>.
        </p>
      )}

      <div className="flex gap-1.5 overflow-x-auto pb-1">
        <button onClick={() => setTema("")}
          className="shrink-0 rounded-full px-3 py-1 text-[11px]"
          style={{ background: tema === "" ? C.roxo : "#fff", color: tema === "" ? "#fff" : C.mute, border: `1px solid ${C.line}` }}>
          Todos
        </button>
        {TEMAS_TESTEMUNHAL.map((t) => (
          <button key={t} onClick={() => setTema(t === tema ? "" : t)}
            className="shrink-0 rounded-full px-3 py-1 text-[11px]"
            style={{
              background: tema === t ? C.roxo : "#fff",
              color: tema === t ? "#fff" : (sugeridos.indexOf(t) >= 0 ? C.roxo : C.mute),
              border: `1px solid ${sugeridos.indexOf(t) >= 0 ? C.roxo : C.line}`,
              fontWeight: sugeridos.indexOf(t) >= 0 ? 700 : 400,
            }}>
            {t}
          </button>
        ))}
      </div>

      {tenhoMinhas && (
        <div className="mt-2">
          <Toggle label={`Só as que citam ${String(negociador).split(/\s+/)[0]}`}
            nota="Avaliação com o seu nome vale mais que uma genérica."
            valor={soMeus} onChange={setSoMeus} />
        </div>
      )}

      <p className="mt-2 text-[13px]" style={{ color: C.mute }}>
        {lista.length} de 750 avaliações escritas neste filtro.
      </p>

      {/* A âncora do perfil inteiro, e não só do que está filtrado: são
          os números que o cliente confere no Google em dois toques. O
          dourado é cor de nota, não a roxa da ação — as duas não
          disputam. */}
      <div className="mt-3 flex items-center gap-3 rounded-lg px-4 py-3"
        style={{ background: "#FFFBF2", border: `1px solid ${ESTRELA}33` }}>
        <span className="text-[30px] leading-none" style={{ fontFamily: F.disp, fontWeight: 800 }}>4,8</span>
        <span>
          <span className="block text-[15px] tracking-[0.14em]" style={{ color: ESTRELA }}>★★★★★</span>
          <span className="block text-[12px]" style={{ color: C.mute }}>1.996 avaliações no Google</span>
        </span>
      </div>

      <div className="mt-3 grid gap-2.5" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))" }}>
        {lista.slice(0, quantos).map((r, i) => (
          <div key={i} className="flex flex-col rounded-lg p-4"
            style={{ background: C.paper, border: `1px solid ${C.line}` }}>
            <span className="text-[15px] tracking-[0.18em]" style={{ color: ESTRELA }}>★★★★★</span>
            <p className="mt-2 flex-1 text-[15px] leading-relaxed">“{r.t}”</p>
            <div className="mt-3 border-t pt-2.5" style={{ borderColor: C.line }}>
              <span className="block text-[13px] font-semibold">{r.n}</span>
              <span className="block text-[11.5px]" style={{ color: C.mute }}>
                {r.q}{r.c ? ` · atendido por ${r.c}` : ""}
              </span>
            </div>
          </div>
        ))}
      </div>

      {lista.length > quantos && (
        <button onClick={() => setQuantos(quantos + 10)}
          className="mt-3 w-full rounded-md border py-2.5 text-[14px] font-semibold"
          style={{ borderColor: C.line, color: C.roxo }}>
          Ver mais {Math.min(10, lista.length - quantos)}
        </button>
      )}

      {!lista.length && (
        <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
          Nenhuma avaliação com esse filtro. Tire o tema ou desmarque o seu nome.
        </p>
      )}
    </div>
  );
}

/**
 * A régua do mês — o quadro branco da parede, em tela.
 *
 * A pergunta que ela responde numa olhada é uma só: já passou mais mês
 * do que entrou faturamento? A barra de cima é a meta da loja,
 * preenchida na proporção do que foi vendido; a régua de baixo são os
 * dias, com hoje marcado. As duas dividem a mesma largura de
 * propósito — é isso que faz o atraso virar distância física.
 *
 * Por que a leitura é em DIAS e não em porcentagem: "43% da meta com
 * 58% do mês" pede conta de cabeça em pé, na frente do quadro.
 * "Quatro dias atrás do ritmo" não pede.
 *
 * O ritmo necessário (`porDia`) é a única projeção aqui, e é
 * aritmética simples: o que falta dividido pelos dias que sobram. Não
 * tem tendência, não tem sazonalidade — inventar previsão em cima de
 * um mês de dado importado seria número bonito e mentiroso.
 */
function ReguaDoMes({ d, equipe, metaLoja }) {
  const [ano, mes] = String(d.de || "").split("-").map(Number);
  if (!ano || !mes) return null;

  // Dia 0 do mês seguinte é o último dia deste — evita tabela de
  // bissexto à mão.
  const diasNoMes = new Date(Date.UTC(ano, mes, 0)).getUTCDate();

  // O período pode ser um mês fechado: aí o mês inteiro já decorreu, e
  // marcar "hoje" no dia 5 diria que sobram 26 dias que não existem.
  const hojeISO = hojeEmSP();
  const mesCorrente = hojeISO.slice(0, 7) === `${ano}-${String(mes).padStart(2, "0")}`;
  const diaHoje = mesCorrente ? Number(hojeISO.slice(8, 10)) : diasNoMes;

  // Prospecção não vende, e a meta dela não entra na conta — somar as
  // duas inflaria o alvo e faria o mês parecer pior do que foi.
  const ativos = (equipe || []).filter((x) => x.ativo && x.papel === "negociador");
  const soma = ativos.reduce((s, x) => s + (Number(x.meta_valor) || 0), 0);

  // A meta da loja é digitada (0018), não somada: a soma pressupõe que
  // todo mundo bate a sua. Enquanto não houver uma digitada, a régua
  // usa a soma e DIZ que está usando — número sem procedência aqui
  // vira cobrança em cima de um alvo que ninguém definiu.
  const metaDigitada = Number(metaLoja && metaLoja.valor) || 0;
  const meta = metaDigitada || soma;
  const porSoma = !metaDigitada && soma > 0;
  const realizado = Number(d.total.valor_vendido) || 0;

  const pctTempo = diaHoje / diasNoMes;
  const pctMeta = meta ? realizado / meta : 0;

  // Onde o verde para, contra onde hoje está. É a leitura que a régua
  // entrega de graça.
  const diaEquivalente = pctMeta * diasNoMes;
  const atraso = Math.round(diaHoje - diaEquivalente);

  const falta = Math.max(0, meta - realizado);
  const diasQueSobram = Math.max(0, diasNoMes - diaHoje);
  const porDia = diasQueSobram ? falta / diasQueSobram : falta;

  const noRitmo = atraso <= 0;
  const cor = noRitmo ? C.verde : C.laranja;

  const rotuloMes = `${String(mes).padStart(2, "0")}/${String(ano).slice(2)}`;

  // ---- as linhas individuais -------------------------------------
  // O cadastro manda na lista: negociador com meta e sem venda tem que
  // aparecer zerado, que é justamente o que precisa ser visto.
  const porNome = {};
  (d.por_negociador || []).forEach((n) => { porNome[n.nome] = n; });

  const linhas = ativos.map((x) => {
    const nome = String(x.nome).toUpperCase();
    const n = porNome[nome];
    delete porNome[nome];
    return {
      nome,
      meta: Number(x.meta_valor) || 0,
      valor: n ? Number(n.valor_vendido) || 0 : 0,
      vendas: n ? n.vendas : 0,
      semMeta: false,
    };
  });

  // Quem vendeu e não está no cadastro aparece assim mesmo, sem meta.
  // Sumir com a venda para manter a tabela bonita esconderia
  // faturamento — e é exatamente o caso dos atendimentos importados,
  // cujo negociador veio só como texto.
  Object.keys(porNome).forEach((nome) => {
    linhas.push({
      nome,
      meta: 0,
      valor: Number(porNome[nome].valor_vendido) || 0,
      vendas: porNome[nome].vendas,
      semMeta: true,
    });
  });

  linhas.sort((a, b) => b.valor - a.valor);

  // ---- a régua ----------------------------------------------------
  const dias = [];
  for (let i = 1; i <= diasNoMes; i++) dias.push(i);

  // Coluna de largura fixa que não encolhe. `width` sozinho num filho
  // de flex ainda encolhe, e no celular isso quebrava "sem meta" em
  // duas linhas e transformava o nome do negociador em reticências.
  const col = (w) => ({ width: w, flex: `0 0 ${w}px` });

  const barra = (pct, corBarra, altura) => (
    <div className="relative overflow-hidden rounded-[2px]" style={{ height: altura, background: "#E6E1EC" }}>
      <div className="h-full" style={{ width: `${Math.min(100, Math.max(0, pct * 100))}%`, background: corBarra }} />
      <div className="absolute top-0 h-full" style={{ left: `${pctTempo * 100}%`, width: 2, marginLeft: -1, background: C.ink }} />
    </div>
  );

  return (
    <div className="rounded-md p-3" style={{ background: "#F7F5FA", border: `1px solid ${C.line}` }}>
      <div className="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1">
        <span className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.ink, fontFamily: F.disp, fontWeight: 700 }}>
          Meta × mês · {rotuloMes}
        </span>
        <span className="text-[11px]" style={{ color: C.mute }}>
          {mesCorrente ? `dia ${diaHoje} de ${diasNoMes} · ${Math.round(pctTempo * 100)}% do mês` : "mês fechado"}
        </span>
      </div>

      {meta === 0 ? (
        <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
          Sem meta para este mês. Abra <span style={{ color: C.roxo }}>negociadores</span> e defina a meta da
          loja — é ela que a régua mede.
        </p>
      ) : (
        <>
          <div className="mt-2 flex items-baseline gap-3">
            <span className="text-[22px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
              {brl(realizado)}
            </span>
            <span className="text-[12px]" style={{ color: C.mute }}>
              de {brl(meta)} · {(pctMeta * 100).toFixed(1).replace(".", ",")}%
            </span>
          </div>
          {porSoma && (
            <p className="mt-1 text-[10px]" style={{ color: C.mute }}>
              Alvo pela soma das metas individuais — a meta da loja ainda não foi definida
              em <span style={{ color: C.roxo }}>negociadores</span>.
            </p>
          )}

          {/* A barra e a régua compartilham a largura: é o alinhamento
              entre as duas que transforma o atraso em distância. */}
          <div className="mt-2">
            {barra(pctMeta, cor, 22)}
            <div className="mt-[3px] flex">
              {dias.map((n) => {
                // No celular são 31 casas em 340 px: escrever todos os
                // números os cola num borrão. A escala fica nas marcas
                // de 5 em 5 mais hoje; o resto é tique.
                const marca = n === 1 || n === diasNoMes || n % 5 === 0 || n === diaHoje;
                return (
                  <div key={n} className="flex-1 text-center text-[8px] leading-[12px]"
                    style={{
                      background: n === diaHoje ? C.ink : (n <= diaHoje ? "#DCD6E4" : "#F1EEF5"),
                      color: n === diaHoje ? "#fff" : C.mute,
                      borderLeft: n === 1 ? "none" : "1px solid #fff",
                      fontFamily: F.mono,
                      fontWeight: n === diaHoje ? 700 : 400,
                    }}>
                    {marca ? n : "\u00b7"}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Mês fechado não tem ritmo a corrigir: falar em "dias atrás"
              de um mês que acabou é cobrança sem destino. O que resta
              dizer é se bateu, e por quanto. */}
          <div className="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-[12px]">
            {mesCorrente ? (
              <>
                <span style={{ color: cor, fontWeight: 700 }}>
                  {atraso === 0 ? "No ritmo do mês"
                    : atraso > 0 ? `${atraso} dia${atraso > 1 ? "s" : ""} atrás do ritmo`
                    : `${-atraso} dia${-atraso > 1 ? "s" : ""} à frente do ritmo`}
                </span>
                <span style={{ color: C.mute }}>
                  {falta > 0
                    ? <>faltam <b style={{ color: C.ink }}>{brl(falta)}</b>{diasQueSobram ? <> em {diasQueSobram} dia{diasQueSobram > 1 ? "s" : ""} — {brl(porDia)}/dia</> : " e o mês acabou"}</>
                    : "meta batida"}
                </span>
              </>
            ) : (
              <span style={{ color: cor, fontWeight: 700 }}>
                {falta > 0
                  ? <>Fechou <b>{brl(falta)}</b> abaixo da meta</>
                  : <>Meta batida — <b>{brl(realizado - meta)}</b> acima</>}
              </span>
            )}
          </div>

          {/* ---- as metas individuais, como no quadro ---- */}
          <div className="mt-3 border-t pt-2" style={{ borderColor: C.line }}>
            <div className="flex items-baseline gap-[6px] px-1 pb-1 text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>
              <span style={col(58)}>Neg</span>
              <span style={{ ...col(62), textAlign: "right" }}>Meta</span>
              <span style={{ ...col(62), textAlign: "right" }}>Feito</span>
              <span className="flex-1" style={{ minWidth: 30 }}>Ritmo</span>
              <span style={{ ...col(30), textAlign: "right" }}>%</span>
            </div>
            {linhas.map((l) => {
              const p = l.meta ? l.valor / l.meta : 0;
              const dele = l.meta ? (l.valor / l.meta) * diasNoMes : 0;
              const bateu = l.meta && diaHoje - dele <= 0;
              return (
                <div key={l.nome} className="flex items-center gap-[6px] px-1 py-[3px] text-[10px]">
                  <span className="truncate" style={{ ...col(58), fontSize: 11, fontWeight: 600 }} title={l.nome}>{l.nome}</span>
                  <span style={{ ...col(62), textAlign: "right", fontFamily: F.mono, color: l.semMeta ? C.mute : C.ink, whiteSpace: "nowrap" }}>
                    {l.semMeta ? "sem meta" : brl(l.meta)}
                  </span>
                  <span style={{ ...col(62), textAlign: "right", fontFamily: F.mono, fontWeight: 700, whiteSpace: "nowrap" }}>
                    {brl(l.valor)}
                  </span>
                  <span className="flex-1" style={{ minWidth: 30 }}>
                    {l.meta ? barra(p, bateu ? C.verde : C.laranja, 10) : null}
                  </span>
                  <span style={{ ...col(30), textAlign: "right", fontFamily: F.mono, color: l.meta ? (bateu ? C.verde : C.laranja) : C.mute }}>
                    {l.meta ? `${Math.round(p * 100)}%` : "—"}
                  </span>
                </div>
              );
            })}
            {mesCorrente && (
              <p className="mt-1 px-1 text-[10px]" style={{ color: C.mute }}>
                O traço escuro em cada barra é o dia de hoje. Barra atrás dele, atrasado.
              </p>
            )}
          </div>
        </>
      )}
    </div>
  );
}

function CartaoNegociador({ n, equipe, loja, metaLoja, desempenho, podeEditar, aoSalvar }) {
  const cad = loja ? null : (equipe || []).filter((x) => String(x.nome).toUpperCase() === n.nome)[0];

  // A loja é a soma das metas de quem está ativo — na planilha o mês
  // fechou em R$ 105.000 com seis negociadores de R$ 17.500 na semana.
  // A meta da loja é digitada (0018) e não é a soma das individuais —
  // somar pressupõe que todos batam a sua. A soma só entra como
  // recurso quando ninguém definiu a meta ainda; assim o cartão nunca
  // amanhece com alvo zero, que pareceria meta batida ao contrário.
  const daLoja = (equipe || []).filter((x) => x.ativo && x.papel === "negociador");
  const somaValor = daLoja.reduce((soma, x) => soma + (Number(x.meta_valor) || 0), 0);
  const somaVolume = daLoja.reduce((soma, x) => soma + (Number(x.meta_volume) || 0), 0);
  const metaValor = loja
    ? (Number(metaLoja && metaLoja.valor) || somaValor)
    : (cad ? Number(cad.meta_valor) || 0 : 0);
  const metaVolume = loja
    ? (Number(metaLoja && metaLoja.volume) || somaVolume)
    : (cad ? Number(cad.meta_volume) || 0 : 0);

  const valor = Number(n.valor_vendido) || 0;
  const tm = n.vendas ? valor / n.vendas : 0;
  const pctValor = metaValor ? (valor / metaValor) * 100 : 0;
  const aRealizar = valor - metaValor;
  const semanas = n.semanas || [0, 0, 0, 0];
  const acumulado = semanas.reduce((a, b) => a + b, 0);
  const quinzenal = semanas[0] + semanas[1];
  const pctVolume = metaVolume ? (n.vendas / metaVolume) * 100 : 0;

  const dsp = loja || !cad ? null : (desempenho || {})[cad.id];
  const [edit, setEdit] = useState(null);

  const pc = (v) => `${(Number(v) || 0).toFixed(2).replace(".", ",")}%`;
  const rs = (v) => `R$ ${(Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

  const faixa = (titulo, cor, fundo) => (
    <div className="px-2 py-1 text-center text-[10px] font-bold tracking-wider"
      style={{ background: fundo, color: cor }}>{titulo}</div>
  );

  const item = (rot, val, destaque) => (
    <div key={rot} className="flex items-baseline justify-between gap-2 px-2 py-[2px] text-[10px]">
      <span style={{ color: "#3B3547" }}>{rot}</span>
      <span style={{ fontFamily: F.mono, fontWeight: destaque ? 700 : 500, whiteSpace: "nowrap" }}>{val}</span>
    </div>
  );

  return (
    <div style={{ width: 208, flex: "0 0 208px", border: `1px solid ${C.line}`, background: "#fff" }}>
      {/* ---- meta do mês ---- */}
      <div className="px-2 py-1 text-center text-[11px] font-bold" style={{ background: PL.cinza }}>{n.nome}</div>
      <div className="px-2 py-1 text-center text-[15px]" style={{ background: PL.cinza, fontFamily: F.mono, fontWeight: 700 }}>
        {rs(metaValor)}
      </div>
      <div style={{ background: PL.verde }}>
        {item("VOLUME", n.vendas)}
        {item("VALOR", rs(valor))}
        {item("T.M.", rs(tm))}
        {item("PERCENTUAL", pc(pctValor))}
      </div>
      {faixa("A REALIZAR", "#3B3547", PL.cinza)}
      <div className="px-2 py-1 text-center text-[14px]"
        style={{ background: aRealizar >= 0 ? "#1D7F58" : PL.vermelho, color: "#fff", fontFamily: F.mono, fontWeight: 700 }}>
        {aRealizar >= 0 ? rs(aRealizar) : `-${rs(Math.abs(aRealizar))}`}
      </div>

      {/* ---- meta semanal ---- */}
      {faixa("META SEMANAL", "#1F5C3A", "#C6E0B4")}
      <div className="px-2 py-1 text-center text-[13px]" style={{ background: PL.verde, fontFamily: F.mono, fontWeight: 700 }}>
        {rs(metaValor / 4)}
      </div>
      <div>
        {item("SEMANA 1", rs(semanas[0]))}
        {item("SEMANA 2", rs(semanas[1]))}
        <div className="flex items-baseline justify-between gap-2 px-2 py-[2px] text-[10px]"
          style={{ background: quinzenal >= metaValor / 2 ? "#D6EADF" : "#FBD4CE" }}>
          <span>QUINZENAL</span>
          <span style={{ fontFamily: F.mono, fontWeight: 700 }}>{rs(quinzenal)}</span>
        </div>
        {item("SEMANA 3", rs(semanas[2]))}
        {item("SEMANA 4", rs(semanas[3]))}
      </div>
      {faixa("ACUMULADO", "#3B3547", PL.cinza)}
      <div className="px-2 py-1 text-center text-[14px]"
        style={{ background: acumulado >= metaValor ? "#D6EADF" : PL.vermelho, color: acumulado >= metaValor ? C.ink : "#fff", fontFamily: F.mono, fontWeight: 700 }}>
        {rs(acumulado)}
      </div>

      {/* ---- conversão ---- */}
      <div className="px-2 py-1 text-center text-[11px] font-bold" style={{ background: loja ? PL.roxo : PL.laranja, color: loja ? "#fff" : "#1A1520" }}>
        {n.nome}
      </div>
      <div className="px-2 py-1 text-center text-[18px]" style={{ background: PL.cinza, fontFamily: F.mono, fontWeight: 700 }}>
        {metaVolume || "—"}
      </div>
      <div>
        {item("FLUXO", n.fluxo)}
        {item("VENDAS", n.vendas)}
        {item("CONVERSÃO", n.conversao != null ? pc(n.conversao) : "—")}
        {item("INDICE AT", dsp ? Number(dsp.indice_at) || 0 : "—")}
      </div>
      {faixa("PERCENTUAL", "#3B3547", PL.cinza)}
      <div className="px-2 py-1 text-center text-[17px]"
        style={{ fontFamily: F.mono, fontWeight: 700, color: pctVolume >= 100 ? C.verde : pctVolume >= 60 ? C.ink : C.laranja }}>
        {pc(pctVolume)}
      </div>

      {/* ---- confiabilidade ---- */}
      {faixa("CONFIABILIDADE", "#fff", PL.magenta)}
      <div className="px-2 py-1 text-center text-[10px] font-bold" style={{ background: PL.creme }}>{n.nome}</div>
      {loja ? (
        <div className="px-2 py-2 text-center text-[10px]" style={{ color: C.mute }}>
          A confiabilidade é por pessoa.
        </div>
      ) : !cad ? (
        <div className="px-2 py-2 text-center text-[10px]" style={{ color: C.laranja }}>
          Sem cadastro — não dá para lançar.
        </div>
      ) : edit ? (
        <div className="px-1.5 py-1">
          {CONFIABILIDADE.map(([k, r]) => (
            <div key={k} className="flex items-center justify-between gap-1 py-[1px]">
              <span className="text-[9px]">{r}</span>
              <input value={edit[k]} inputMode="decimal"
                onChange={(e) => setEdit({ ...edit, [k]: e.target.value })}
                className="w-14 rounded border px-1 text-right text-[10px]"
                style={{ borderColor: C.line, fontFamily: F.mono }} />
            </div>
          ))}
          <div className="flex items-center justify-between gap-1 py-[1px]">
            <span className="text-[9px]">INDICE AT</span>
            <input value={edit.indice_at} inputMode="decimal"
              onChange={(e) => setEdit({ ...edit, indice_at: e.target.value })}
              className="w-14 rounded border px-1 text-right text-[10px]"
              style={{ borderColor: C.line, fontFamily: F.mono }} />
          </div>
          <div className="mt-1 flex gap-1">
            <button onClick={() => { aoSalvar(cad.id, edit); setEdit(null); }}
              className="flex-1 rounded py-1 text-[10px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>Salvar</button>
            <button onClick={() => setEdit(null)} className="rounded px-2 text-[10px]" style={{ color: C.mute }}>sair</button>
          </div>
        </div>
      ) : (
        <>
          <div>
            {CONFIABILIDADE.map(([k, r]) => {
              const v = dsp ? Number(dsp[k]) || 0 : 0;
              const ruim = ["faltas", "atrasos", "perdeu_atendimento", "avaliacao_errada"].indexOf(k) >= 0;
              return (
                <div key={k} className="flex items-baseline justify-between gap-2 px-2 py-[2px] text-[9px]"
                  style={{ background: ruim ? "#FBD4CE" : "#DFF0DC" }}>
                  <span>{r}</span>
                  <span style={{ fontFamily: F.mono, fontWeight: 600 }}>{k === "postura" ? pc(v) : v}</span>
                </div>
              );
            })}
          </div>
          {faixa("SCORE", "#3B3547", PL.cinza)}
          <div className="px-2 py-1 text-center text-[16px]" style={{ fontFamily: F.mono, fontWeight: 700, color: C.mute }}>
            —
          </div>
          <p className="px-2 pb-1 text-[8px] leading-tight" style={{ color: C.mute }}>
            O score sai quando a fórmula da planilha vier — não dá para adivinhar peso de avaliação de gente.
          </p>
          {podeEditar && (
            <button
              onClick={() => setEdit(CONFIABILIDADE.reduce((o, [k]) => ({ ...o, [k]: String(dsp ? dsp[k] : (k === "postura" ? 100 : 0)) }),
                { indice_at: String(dsp ? dsp.indice_at : 0) }))}
              className="w-full py-1 text-[10px] font-semibold" style={{ background: "#F6F4F8", color: C.roxo }}>
              lançar
            </button>
          )}
        </>
      )}
    </div>
  );
}

function CadastroNegociadores({ perfil, competencia, aoMudarMetaLoja }) {
  const [lista, setLista] = useState([]);
  const [novo, setNovo] = useState({ nome: "", papel: "negociador" });
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState(false);
  const [loja, setLoja] = useState(null);
  const [lojaComp, setLojaComp] = useState("");
  const [lojaSalvo, setLojaSalvo] = useState("");
  const eGerente = perfil && perfil.papel === "gerente";

  const carregar = () => listarNegociadores().then(setLista).catch((e) => setErro(e.message));
  useEffect(() => { carregar(); }, []);

  // A meta da loja é por mês: seguir o seletor do painel é o que
  // impede alguém de digitar a meta de agosto olhando setembro.
  useEffect(() => {
    setLoja(null); setLojaSalvo("");
    lerMetaLoja(competencia).then((d) => { setLojaComp(d.competencia); setLoja(d.meta || { valor: 0, volume: 0 }); })
      .catch((e) => setErro(e.message));
  }, [competencia]);

  const salvarLoja = async (mud) => {
    const alvo = { valor: 0, volume: 0, ...(loja || {}), ...mud };
    setErro(""); setLojaSalvo("");
    try {
      const salvo = await gravarMetaLoja({ valor: alvo.valor, volume: alvo.volume }, lojaComp);
      setLoja(salvo);
      setLojaSalvo("salvo");
      if (aoMudarMetaLoja) aoMudarMetaLoja(salvo);
    } catch (e) { setErro(e.message); }
  };

  // A soma das individuais não é a meta da loja — é a referência ao
  // lado dela. Ver as duas juntas é o que deixa a folga explícita.
  const soma = lista
    .filter((x) => x.ativo && x.papel === "negociador")
    .reduce((t, x) => t + (Number(x.meta_valor) || 0), 0);

  const cadastrar = async () => {
    if (!novo.nome.trim()) return;
    setErro(""); setIndo(true);
    try { await criarNegociador(novo); setNovo({ nome: "", papel: novo.papel }); await carregar(); }
    catch (e) { setErro(e.message); }
    setIndo(false);
  };

  const mexer = async (id, mud) => {
    setErro("");
    try { await atualizarNegociador(id, mud); await carregar(); }
    catch (e) { setErro(e.message); }
  };

  // Grava no blur, e só quando mudou — cada tecla seria uma escrita no
  // banco. `defaultValue` em vez de `value` porque o valor autoritativo
  // é o que o servidor devolveu, não o que está sendo digitado.
  const campoMeta = (n, chave, rot, largura) => (
    <label style={{ width: largura, flex: `0 0 ${largura}px` }}>
      <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>{rot}</span>
      <input className="mt-[2px] w-full rounded-md border px-2 py-1 text-right text-[12px] outline-none"
        style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal"
        defaultValue={n[chave] == null || Number(n[chave]) === 0 ? "" : n[chave]}
        onBlur={(e) => {
          const antes = Number(n[chave]) || 0;
          const agora = Number(String(e.target.value).replace(/\./g, "").replace(",", ".")) || 0;
          if (agora !== antes) mexer(n.id, { [chave]: e.target.value });
        }} />
    </label>
  );

  const grupo = (papel, titulo) => {
    const gente = lista.filter((n) => n.papel === papel);
    if (!gente.length) return null;
    return (
      <div className="mt-3">
        <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>{titulo}</div>
        <div className="mt-1.5 space-y-1.5">
          {gente.map((n) => (
            <div key={n.id} className="rounded-md px-3 py-2"
              style={{ background: n.ativo ? "#fff" : "#FBFAFC", border: `1px solid ${C.line}`, opacity: n.ativo ? 1 : 0.55 }}>
              <div className="flex items-center gap-2">
              <span className="flex-1 text-[13px] font-medium">{n.nome}</span>
              <span className="text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>
                {brl(n.meta_valor)} · {n.meta_volume} carros
              </span>
              {eGerente && (
                <button onClick={() => mexer(n.id, { ativo: !n.ativo })} className="text-[11px]"
                  style={{ color: n.ativo ? C.laranja : C.verde }}>
                  {n.ativo ? "desativar" : "ativar"}
                </button>
              )}
              </div>

              {/* A meta é o que a pessoa controla, não o número final:
                  atendimentos × conversão × ticket. O faturamento
                  aparece embaixo porque é consequência — e vem do
                  servidor, que é quem faz a conta (0018). */}
              {eGerente && (
                <>
                  {/* O resultado não se repete aqui: ele já está no
                      cabeçalho da linha, e é o que o servidor gravou. */}
                  <div className="mt-2 flex items-end gap-1.5">
                    {campoMeta(n, "meta_atendimentos", "Atend.", 64)}
                    <span className="pb-1.5 text-[11px]" style={{ color: C.mute }}>×</span>
                    {campoMeta(n, "meta_conversao", "Conv. %", 64)}
                    <span className="pb-1.5 text-[11px]" style={{ color: C.mute }}>×</span>
                    {campoMeta(n, "meta_ticket", "Ticket R$", 92)}
                  </div>
                  {!Number(n.meta_atendimentos) && Number(n.meta_valor) > 0 && (
                    <p className="mt-1 text-[10px] leading-snug" style={{ color: C.laranja }}>
                      Os {brl(n.meta_valor)} vieram do cadastro antigo. Preencha os três campos para a meta
                      passar a sair deles.
                    </p>
                  )}
                </>
              )}
            </div>
          ))}
        </div>
      </div>
    );
  };

  const rotuloComp = lojaComp
    ? `${lojaComp.slice(5, 7)}/${lojaComp.slice(2, 4)}`
    : "";

  return (
    <div>
      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      {/* ---- a meta da loja, independente das individuais ---- */}
      <div className="rounded-md px-3 py-2.5" style={{ background: C.roxoFraco, border: `1px solid ${C.line}` }}>
        <div className="flex items-baseline justify-between gap-2">
          <span className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.roxo, fontWeight: 700 }}>
            Meta da loja · {rotuloComp}
          </span>
          {lojaSalvo && <span className="text-[10px]" style={{ color: C.verde }}>{lojaSalvo}</span>}
        </div>

        {loja === null ? (
          <p className="mt-1 text-[11px]" style={{ color: C.mute }}>Carregando…</p>
        ) : eGerente ? (
          <div className="mt-2 flex items-end gap-2">
            <label style={{ width: 120, flex: "0 0 120px" }}>
              <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Faturamento R$</span>
              <input className="mt-[2px] w-full rounded-md border px-2 py-1 text-right text-[13px] outline-none"
                style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal"
                defaultValue={Number(loja.valor) ? Math.round(loja.valor) : ""}
                onBlur={(e) => {
                  const v = Number(String(e.target.value).replace(/\./g, "").replace(",", ".")) || 0;
                  if (v !== (Number(loja.valor) || 0)) salvarLoja({ valor: v });
                }} />
            </label>
            <label style={{ width: 70, flex: "0 0 70px" }}>
              <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Carros</span>
              <input className="mt-[2px] w-full rounded-md border px-2 py-1 text-right text-[13px] outline-none"
                style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
                defaultValue={Number(loja.volume) ? loja.volume : ""}
                onBlur={(e) => {
                  const v = Math.trunc(Number(e.target.value) || 0);
                  if (v !== (Number(loja.volume) || 0)) salvarLoja({ volume: v });
                }} />
            </label>
          </div>
        ) : (
          <div className="mt-1 text-[14px]" style={{ fontFamily: F.mono, fontWeight: 700 }}>
            {Number(loja.valor) ? brl(loja.valor) : "não definida"}
            {Number(loja.volume) ? <span className="text-[11px]" style={{ fontWeight: 400, color: C.mute }}> · {loja.volume} carros</span> : null}
          </div>

        <p className="mt-1.5 text-[10px] leading-snug" style={{ color: C.mute }}>
          A soma das metas individuais dá <b style={{ fontFamily: F.mono }}>{brl(soma)}</b> — mas ela pressupõe

      {grupo("negociador", "Negociadores")}

/**
 * ===== a tela do administrativo =====
 *
 * O Derek pediu que a conferência saísse da tela do negociador: "vai
 * ficar em outra tela, só na tela do adm mesmo". A razão é de processo,
 * não de layout — enquanto as duas mãos preenchiam o mesmo formulário,
 * nada impedia o negociador de marcar a própria conferência, e
 * "conferido" deixava de significar alguma coisa.
 *
 * Quem entra aqui é `administrativo` ou gerente (0012). O servidor
 * confere de novo no PUT: a tela esconder o botão não é controle de
 * acesso, é conveniência.
 *
 * A lista traz os fechados, porque conferência é do negócio fechado. O
 * pendente vem primeiro — é a fila de trabalho de quem senta aqui, e
 * ordenar por data deixaria o atrasado no fim.
 */
/* ==================================================================
 * ESTOQUE (0019)
 * ================================================================== */

const TIPOS_CUSTO = [
  ["quitacao", "Quitação"], ["debitos", "Débitos"], ["cautelar", "Cautelar"],
  ["transporte", "Transporte"], ["reparo", "Reparo"], ["juros", "Juros"],
  ["documentacao", "Documentação"], ["deducao", "Dedução"], ["comissao_externa", "Comissão externa"], ["outro", "Outro"],
];
const rotuloCusto = (t) => (TIPOS_CUSTO.filter((x) => x[0] === t)[0] || ["", "Outro"])[1];

/**
 * A conta do carro no pátio.
 *
 * `previsto` é o que o negócio combinou; `atual` é o que já foi pago,
 * mais o previsto do que ainda não foi. É por isso que existe um
 * terceiro número e não dois: um carro sem nada pago mostraria custo
 * igual à compra, o que faria todo carro novo parecer barato.
 *
 * `realizado` nulo é "ainda não pagou". Zero é "pagou zero" — conta
 * perdoada, desconto integral. Tratar os dois igual esconderia
 * justamente o desconto que se conseguiu.
 */
function contaDoEstoque(e) {
  const compra = Number(e.valor_compra) || 0;
  const custos = e.estoque_custo || [];
  let previsto = compra;
  let atual = compra;
  let aberto = 0;
  custos.forEach((c) => {
    const p = Number(c.previsto) || 0;
    previsto += p;
    if (c.realizado == null) { atual += p; aberto += 1; }
    else atual += Number(c.realizado) || 0;
  });
  const venda = Number(e.valor_venda) || 0;
  return {
    compra, previsto, atual, aberto, venda,
    desvio: atual - previsto,
    margem: venda ? venda - atual : null,
  };
}

const diasNoPatio = (e) => {
  const de = String(e.entrou_em || "").slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(de)) return null;
  const fim = e.vendido_em && /^\d{4}-\d{2}-\d{2}$/.test(e.vendido_em) ? e.vendido_em : hojeEmSP();
  return Math.max(0, Math.round((Date.parse(fim) - Date.parse(de)) / 86400000));
};

const diaBR = (v) => {
  const s = String(v || "").slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "—";
};

/**
 * A vista de rentabilidade: a planilha CONTROLE DE VEÍCULOS / CLIENTES
 * do Derek, calculada em cima do estoque.
 *
 *   bruta   = venda − valor cliente − débitos − quitação − deduções
 *   líquida = bruta − cautelar − comissão externa − demais custos
 *
 * A planilha separa "custo do carro" (o que foi combinado com o
 * cliente) de "custo da venda" (cautelar, comissão externa); aqui
 * cada linha de custo tem um tipo, então a separação é por tipo. A
 * conta é feita na tela porque a lista do estoque vem inteira (não é
 * paginada como o CRM) — se um dia passar de 300 carros, isto vai para
 * o servidor.
 */
const CUSTO_DO_CARRO = ["debitos", "quitacao", "deducao"];

function rentabilidadeDe(e) {
  const c = contaDoEstoque(e);
  const custos = e.estoque_custo || [];
  const soma = (filtro) => custos
    .filter(filtro)
    .reduce((t, l) => t + (l.realizado == null ? Number(l.previsto) || 0 : Number(l.realizado) || 0), 0);
  const doCarro = soma((l) => CUSTO_DO_CARRO.indexOf(l.tipo) >= 0);
  const daVenda = soma((l) => CUSTO_DO_CARRO.indexOf(l.tipo) < 0);
  const por = (tipo) => soma((l) => l.tipo === tipo);
  const bruta = c.venda - c.compra - doCarro;
  return {
    ...c,
    debitos: por("debitos"), quitacao: por("quitacao"), deducoes: por("deducao"),
    cautelar: por("cautelar"), comissaoExterna: por("comissao_externa"),
    bruta, liquida: bruta - daVenda,
  };
}

// 1ª..5ª semana do mês, como a planilha conta: dias 1–7, 8–14…
const semanaDe = (e) => {
  if (e.semana_venda) return Number(e.semana_venda);
  const d = Number(String(e.vendido_em || "").slice(8, 10));
  return d ? Math.min(5, Math.floor((d - 1) / 7) + 1) : null;
};

function Rentabilidade({ vendidos, comp }) {
  const rs = (v) => (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const linhas = vendidos.map((e) => ({ e, r: rentabilidadeDe(e), semana: semanaDe(e), dias: diasNoPatio(e) }));

  const total = linhas.reduce((t, { r }) => ({
    venda: t.venda + r.venda, compra: t.compra + r.compra, debitos: t.debitos + r.debitos,
    quitacao: t.quitacao + r.quitacao, deducoes: t.deducoes + r.deducoes, bruta: t.bruta + r.bruta,
    cautelar: t.cautelar + r.cautelar, custo: t.custo + r.atual, comissao: t.comissao + r.comissaoExterna,
    liquida: t.liquida + r.liquida,
  }), { venda: 0, compra: 0, debitos: 0, quitacao: 0, deducoes: 0, bruta: 0, cautelar: 0, custo: 0, comissao: 0, liquida: 0 });

  // A caixa TOTAL NEGOCIADORES da planilha.
  const porNeg = {};
  linhas.forEach(({ e, r }) => {
    const n = String(e.negociador_nome || "sem negociador").toUpperCase();
    porNeg[n] = porNeg[n] || { nome: n, carros: 0, liquida: 0 };
    porNeg[n].carros += 1; porNeg[n].liquida += r.liquida;
  });
  const negociadores = Object.keys(porNeg).map((k) => porNeg[k]).sort((a, b) => b.liquida - a.liquida);

  const th = (t, dir) => (
    <th className="whitespace-nowrap px-2 py-2 text-[11px] font-semibold uppercase tracking-[0.04em]"
      style={{ color: C.mute, textAlign: dir || "right", borderBottom: `1px solid ${C.line}` }}>{t}</th>
  );
  const td = (v, opts) => (
    <td className="whitespace-nowrap px-2 py-1.5 text-[12px]"
      style={{ textAlign: (opts && opts.dir) || "right", fontVariantNumeric: "tabular-nums",
               color: (opts && opts.cor) || C.ink, fontWeight: (opts && opts.forte) ? 700 : 400 }}>
      {v}
    </td>
  );

  if (!linhas.length) {
    return (
      <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.paper, border: `1px dashed ${C.line}` }}>
        <p className="text-[15px] font-semibold">Nenhuma venda em {rotuloMes(comp)}.</p>
        <p className="mt-1 text-[13px]" style={{ color: C.mute }}>
          Carro vendido no estoque aparece aqui, com a rentabilidade calculada linha a linha.
        </p>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {/* ---- o resumo, em cima: é o que se olha primeiro ---- */}
      <div className="grid grid-cols-2 gap-3 rounded-xl p-4 lg:grid-cols-4" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
        {[["Carros vendidos", linhas.length, null],
          ["Faturamento", brl(total.venda), null],
          ["Rentabilidade bruta", brl(total.bruta), total.bruta >= 0 ? C.verde : C.laranja],
          ["Rentabilidade líquida", brl(total.liquida), total.liquida >= 0 ? C.verde : C.laranja]].map(([rot, v, cor]) => (
          <div key={rot}>
            <div className="text-[12px]" style={{ color: C.mute }}>{rot}</div>
            <div className="text-[22px] leading-tight tracking-tight" style={{ fontWeight: 700, color: cor || C.ink, fontVariantNumeric: "tabular-nums" }}>{v}</div>
          </div>
        ))}
      </div>

      <div className="grid gap-4 lg:grid-cols-[1fr_280px]">
        {/* ---- a planilha ---- */}
        <div className="rolar overflow-x-auto rounded-xl" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
          <table className="w-full" style={{ borderCollapse: "collapse", minWidth: 1180 }}>
            <thead>
              <tr>
                {th("Data", "left")}{th("Dias")}{th("Carro", "left")}{th("Placa", "left")}{th("Comprador", "left")}
                {th("Venda")}{th("Cliente")}{th("Débitos")}{th("Quitação")}{th("Deduções")}{th("Bruta")}
                {th("Cautelar")}{th("Custo")}{th("Com. ext.")}{th("Sem.")}{th("Líquida")}{th("Negociador", "left")}{th("Meio", "left")}
              </tr>
            </thead>
            <tbody>
              {linhas.map(({ e, r, semana, dias }) => {
                const v = e.veiculo || {};
                return (
                  <tr key={e.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                    {td(diaBR(e.entrou_em), { dir: "left" })}
                    {td(dias != null ? dias : "—")}
                    {td(v.marca_modelo || "—", { dir: "left" })}
                    {td(v.placa || "—", { dir: "left" })}
