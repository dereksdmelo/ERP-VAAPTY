/* ===================== sessão ===================== */

/**
 * A sessão vive aqui, fora do React, porque as funções de API são de
 * módulo e precisam do token sem receber props. Um navegador, um
 * usuário — não há risco de troca como haveria no servidor.
 */
const AUTH = { cfg: null, sessao: null, aoSair: null };

async function carregarConfig() {
  if (AUTH.cfg) return AUTH.cfg;
  const r = await fetch("/api/config");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Configuração do servidor indisponível.");
  AUTH.cfg = d;
  return d;
}

const guardarSessao = (s) => {
  AUTH.sessao = s;
  if (s) window.storage.set("vaapty:sessao", JSON.stringify(s)).catch(() => {});
  else window.storage.delete("vaapty:sessao").catch(() => {});
};

async function restaurarSessao() {
  try {
    const r = await window.storage.get("vaapty:sessao");
    if (r && r.value) AUTH.sessao = JSON.parse(r.value);
  } catch (e) {}
  return AUTH.sessao;
}

async function entrar(email, senha) {
  const cfg = await carregarConfig();
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ email: String(email).trim(), password: senha }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // A mensagem do Supabase vem em inglês e não diz nada ao negociador.
    const m = String(d.error_description || d.msg || d.error || "");
    throw new Error(/invalid/i.test(m) ? "E-mail ou senha não conferem." : m || "Não consegui entrar.");
  }
  guardarSessao(d);
  return d;
}

async function renovarSessao() {
  const cfg = await carregarConfig();
  const atual = AUTH.sessao;
  if (!atual || !atual.refresh_token) throw new Error("Sessão expirada.");
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: atual.refresh_token }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { guardarSessao(null); throw new Error("Sessão expirada. Entre de novo."); }
  guardarSessao(d);
  return d;
}

function sair() {
  guardarSessao(null);
  if (AUTH.aoSair) AUTH.aoSair();
}

/**
 * Toda chamada às funções em api/ passa por aqui. O token do Supabase
 * dura uma hora; em vez de vigiar o relógio, deixo o 401 acontecer e
 * renovo uma vez. Se falhar de novo, é sessão morta mesmo.
 */
async function fetchAut(url, opcoes) {
  if (!AUTH.sessao) throw new Error("Entre para continuar.");
  const monta = () => {
    const o = { ...(opcoes || {}) };
    o.headers = { ...(o.headers || {}), Authorization: `Bearer ${AUTH.sessao.access_token}` };
    return o;
  };
  let r = await fetch(url, monta());
  if (r.status === 401) {
    try { await renovarSessao(); } catch (e) { sair(); throw e; }
    r = await fetch(url, monta());
    if (r.status === 401) { sair(); throw new Error("Sessão expirada. Entre de novo."); }
  }
  return r;
}

async function enviarAnexo(atendimentoId, arquivo, rotulo) {
  const dados = await new Promise((ok, falha) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result);
    fr.onerror = () => falha(new Error("Não consegui ler o arquivo."));
    fr.readAsDataURL(arquivo);
  });
  const r = await fetchAut("/api/foto?recurso=anexo", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      atendimento_id: atendimentoId, rotulo,
      nome: arquivo.name, tipo: arquivo.type, dados,
    }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui anexar.");
  return d.anexo;
}

  const r = await fetchAut(`/api/foto?recurso=anexo&id=${encodeURIComponent(id)}`, { method: "DELETE" });

  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui salvar a ordem.");
  return d;
}

const RX_AUT = /\b(AUT|AUTOM|CVT|DCT|AT)\b\.?/i;
const RX_MEC = /\b(MEC|MANUAL|MT)\b\.?/i;
function filtrarPorCambio(vs, cambio) {
  if (!cambio) return vs;
  const quer = cambio !== "Manual";
  const f = vs.filter((v) => (quer ? RX_AUT.test(v.nome) : RX_MEC.test(v.nome) || !RX_AUT.test(v.nome)));
  return f.length ? f : vs;
}
function alertaDispersao(vs) {
  if (vs.length < 2) return null;
  const a = vs.map((v) => v.valor);
  const d = Math.max(...a) - Math.min(...a);
  return d < 2000 ? null : `As versões variam ${brl(d)} entre si. Confirme no documento.`;
}

/**
 * O nome que a FIPE devolve é comprido demais para busca de anúncio
 * ("CHEVROLET ONIX HATCH LTZ 1.4 8V FlexPower 5p Mec." não acha nada).
 * Tira a parte que descreve motor e câmbio e fica com marca, modelo,
 * versão e ano — que é como o anúncio costuma ser escrito.
 */
const RX_RUIDO = /^(\d+[.,]\d+|\d+v|\d+p|mec|aut|autom|automatico|flex|flexpower|power|cvt)\.?$/i;
function termoMercadoPadrao(f) {
  const toks = String(f.modelo || "").split(/\s+/).filter((t) => t && !RX_RUIDO.test(t));
  const ano = String(f.ano || "").split("/")[0];
  return [...toks.slice(0, 4), ano].filter(Boolean).join(" ").trim();
}

/**
 * Canais de anúncio. * Canais de anúncio, todos com busca própria — conferi um por um em
 * 27/08/2026 com HYUNDAI/I30.
 *
 * A OLX busca por texto livre; os outros três montam o caminho com
 * marca e modelo separados, e por isso `marca` e `modeloCurto` são
 * guardados na ficha quando a versão FIPE é escolhida.
 *
 * Chaves na Mão ficou de fora: não responde a nenhum dos dois padrões
 * e devolve "página não encontrada". Link quebrado na frente do
 * cliente é pior que canal a menos.
 */
const semAcento = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const fatia = (t) => semAcento(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const CANAIS = [
  // Anúncio: o que o dono PEDE. Serve de teto.
  { chave: "olx", nome: "OLX", familia: "anuncio", cor: "#6D1B9E", tipo: "texto",
    url: (t) => `https://www.olx.com.br/autos-e-pecas/carros-vans-e-utilitarios?q=${encodeURIComponent(t)}` },
  { chave: "webmotors", nome: "Webmotors", familia: "anuncio", tipo: "caminho",
    url: (ma, mo) => `https://www.webmotors.com.br/carros/estoque/${fatia(ma)}/${fatia(mo)}` },
  { chave: "icarros", nome: "iCarros", familia: "anuncio", tipo: "caminho",
    url: (ma, mo) => `https://www.icarros.com.br/comprar/usados/${fatia(ma)}/${fatia(mo)}` },
  { chave: "mercadolivre", nome: "Mercado Livre", familia: "anuncio", tipo: "caminho",
    url: (ma, mo) => `https://carros.mercadolivre.com.br/${fatia(ma)}/${fatia(mo)}/` },
  { chave: "facebook", nome: "Marketplace", familia: "anuncio", tipo: "texto",
    url: (t) => `https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(t)}` },

  // Tabela: o que o mercado PRATICA. Cada uma mede uma ponta.
  // KBB é varejo; AutoAvaliar é repasse — a ponta que a Vaapty vende.
  // O modelo no KBB fica sob a carroceria (/hatchback/i30/), que a FIPE
  // não devolve, então o link para na marca.
  { chave: "kbb", nome: "KBB — varejo", familia: "tabela", tipo: "marca",
    url: (ma) => `https://www.kbb.com.br/sp/marcas/${fatia(ma)}/` },
  // Tabela transacional de repasse, em consulta pública: escolhe marca,
  // modelo, ano, versão e estado. Fica em subdomínio próprio — a página
  // do produto no site institucional é outra coisa, e pede login.
  { chave: "autoavaliar", nome: "AutoAvaliar — repasse", familia: "tabela", tipo: "fixo",
    url: () => "https://tabela.autoavaliar.com.br/" },
];

const enderecoCanal = (c, termo, marca, modelo) => {
  if (c.tipo === "fixo") return c.url();
  if (c.tipo === "texto") return c.url(termo);
  if (c.tipo === "marca") return marca ? c.url(marca) : null;
  return marca && modelo ? c.url(marca, modelo) : null;
};

const marcaModeloDa = (f) => {
  const partes = String(f.modelo || "").split(/\s+/);
  return [f.marca || partes[0] || "", f.modeloCurto || partes[1] || ""];
};

/**
 * A pesquisa de mercado faz parte do processo: o negociador precisa ter
 * olhado o preço anunciado antes de sentar para negociar. Por isso a
 * etapa P só fecha depois de abrir todos os canais possíveis.
 *
 * "Possíveis" e não "todos": sem marca e modelo separados, os canais de
 * caminho não têm endereço, e exigir clique em link inexistente
 * travaria o atendimento.
 */
function canaisPossiveis(f) {
  const [ma, mo] = marcaModeloDa(f);
  return CANAIS.filter((c) => !!enderecoCanal(c, "x", ma, mo)).map((c) => c.chave);
}
function faltamCanais(f) {
  const vistos = f.canaisVistos || [];
  return canaisPossiveis(f).filter((c) => vistos.indexOf(c) < 0);
}

/**
 * Conferência na FIPE oficial, na ordem MARCA → ANO → MODELO.
 *
 * A FIPE navega marca → modelo → ano, mas aí a lista de modelos mistura
 * o mesmo carro de vinte anos diferentes. Escolhendo o ano antes, a
 * lista de modelos já vem curta e só com o que existiu naquele ano.
 */
function ConferirFipe({ f, set }) {
  const [marcas, setMarcas] = useState([]);
  const [marca, setMarca] = useState("");
  const [ano, setAno] = useState("");
  const [modelos, setModelos] = useState([]);
  const [escolha, setEscolha] = useState("");      // "codigo|combustivel"
  const [res, setRes] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState("");            // marcas | modelos | valor

  const anos = useMemo(() => {
    const atual = new Date().getFullYear();
    const l = [];
    for (let a = atual + 1; a >= 1985; a--) l.push(a);
    return l;
  }, []);

  useEffect(() => {
    setIndo("marcas");
    fipeOficial({ acao: "marcas" })
      .then((d) => {
        setMarcas(d.marcas || []);
        // Adianta o que já se sabe da ficha.
        const alvo = (d.marcas || []).filter((m) =>
          m.nome.toLowerCase() === String(f.marca || "").toLowerCase())[0];
        if (alvo) setMarca(String(alvo.codigo));
        const a = String(f.ano || "").split("/")[1] || String(f.ano || "").split("/")[0];
        if (a && /^\d{4}$/.test(a)) setAno(a);
      })
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  }, []);

  useEffect(() => {
    setModelos([]); setEscolha(""); setRes(null);
    if (!marca || !ano) return;
    setIndo("modelos"); setErro("");
    fipeOficial({ acao: "modelos", marca, ano })
      .then((d) => {
        setModelos(d.modelos || []);
        if (!(d.modelos || []).length) setErro("A FIPE não tem modelos dessa marca nesse ano.");
      })
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  }, [marca, ano]);

  const buscarValor = (valorEscolha) => {
    setEscolha(valorEscolha); setRes(null);
    if (!valorEscolha) return;
    const [codigo, comb] = valorEscolha.split("|");
    setIndo("valor"); setErro("");
    fipeOficial({ acao: "valor", marca, modelo: codigo, ano, combustivel: comb })
      .then(setRes)
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  };

  const usar = () => {
    set({
      fipe: String(res.valor),
      fipeCodigo: res.codigo_fipe || f.fipeCodigo,
      fipeConferida: true,
      fipeOficialCodigo: res.codigo_fipe || "",
      fipeOficialMes: res.mes_referencia || "",
      fipeAutenticacao: res.autenticacao || "",
    });
  };

  const daPlaca = Number(f.fipe) || 0;
  const diferenca = res && daPlaca ? res.valor - daPlaca : 0;

  return (
    <div className="mt-3 rounded-md p-3"
      style={{ background: f.fipeConferida ? "#F0F8F4" : AMARELO.fundo,
               border: `1px solid ${f.fipeConferida ? C.verde : AMARELO.borda}` }}>
      <div className="flex items-baseline justify-between gap-2">
        <span className="text-[10px] uppercase tracking-[0.13em]" style={{ color: f.fipeConferida ? C.verde : AMARELO.texto }}>
          {f.fipeConferida ? "✓ FIPE conferida na fonte" : "Conferir na tabela FIPE oficial"}
        </span>
      </div>

      {f.fipeConferida ? (
        <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
          {f.fipeOficialCodigo} · {f.fipeOficialMes}
          {f.fipeAutenticacao ? ` · autenticação ${f.fipeAutenticacao}` : ""}
        </p>
      ) : (
        <p className="mt-1 text-[11px] leading-relaxed" style={{ color: AMARELO.texto }}>
          A consulta de placa adivinha a versão. Aqui você confirma na fonte — marca, depois ano, depois modelo.
        </p>
      )}

      <div className="mt-2 space-y-2">
        <div className="grid grid-cols-2 gap-2">
          <Campo label="Marca">
            <select className={inputCls} style={inputSty} value={marca} onChange={(e) => setMarca(e.target.value)}>
              <option value="">{indo === "marcas" ? "carregando…" : "escolha"}</option>
              {marcas.map((m) => <option key={m.codigo} value={m.codigo}>{m.nome}</option>)}
            </select>
          </Campo>
          <Campo label="Ano do modelo">
            <select className={inputCls} style={inputSty} value={ano} onChange={(e) => setAno(e.target.value)}>
              <option value="">escolha</option>
              {anos.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Campo>
        </div>

        <Campo label={`Modelo${modelos.length ? ` — ${modelos.length} naquele ano` : ""}`}>
          <select className={inputCls} style={inputSty} value={escolha}
            disabled={!modelos.length} onChange={(e) => buscarValor(e.target.value)}>
            <option value="">
              {indo === "modelos" ? "carregando…" : !marca || !ano ? "escolha marca e ano antes" : "escolha"}
            </option>
            {modelos.map((m) => (
              <option key={`${m.codigo}-${m.combustivel}`} value={`${m.codigo}|${m.combustivel}`}>{m.nome}</option>
            ))}
          </select>
        </Campo>
      </div>

      {indo === "valor" && <p className="mt-2 text-[11px]" style={{ color: C.mute }}>Consultando a FIPE…</p>}
      {erro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      {res && (
        <div className="mt-2 rounded-md p-3" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
          <div className="text-[19px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>
            {res.valor_texto}
          </div>
          <div className="mt-0.5 text-[11px]" style={{ color: C.mute }}>
            {res.modelo} · {res.combustivel} · {res.ano_modelo}
          </div>
          <div className="mt-0.5 text-[10px]" style={{ color: C.mute, fontFamily: F.mono }}>
            {res.codigo_fipe} · {res.mes_referencia} · autenticação {res.autenticacao}
          </div>

          {!!daPlaca && diferenca !== 0 && (
            <div className="mt-2 rounded px-2 py-1.5 text-[11px]"
              style={{ background: AMARELO.fundo, color: AMARELO.texto }}>
              A consulta de placa trouxe {brl(daPlaca)} — diferença de {brl(Math.abs(diferenca))}.
              {" "}Confira se a versão bate antes de usar.
            </div>
          )}
          {!!daPlaca && diferenca === 0 && (
            <div className="mt-2 text-[11px]" style={{ color: C.verde }}>Bate com o valor da consulta de placa.</div>
          )}

          <button onClick={usar} className="mt-2 w-full rounded-md py-2 text-[13px] font-semibold"
            style={{ background: C.roxo, color: "#fff" }}>
            Usar este valor na ficha
          </button>
        </div>
      )}
    </div>
  );
}

/**
 * O histórico FIPE do carro, mês a mês. Vale mais na mesa do que
 * qualquer argumento: o cliente ancora no que pagou, e a curva mostra
 * quanto custa continuar esperando.
 *
 * Gráfico em SVG na mão — o projeto não tem build nem biblioteca.
 */
function Desvalorizometro({ chave }) {
  const [d, setD] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState(false);

  useEffect(() => {
    if (!chave) { setD(null); setErro(""); return; }
    let vivo = true;
    setIndo(true); setErro("");
    consultarDesvalorizacao(chave)
      .then((x) => { if (vivo) setD(x); })
      .catch((e) => { if (vivo) setErro(e.message); })
      .then(() => { if (vivo) setIndo(false); });
    return () => { vivo = false; };
  }, [chave]);

  if (!chave) return null;
  if (indo) return <p className="mt-3 text-[11px]" style={{ color: C.mute }}>Carregando o histórico FIPE…</p>;
  if (erro) return <p className="mt-3 text-[11px]" style={{ color: C.laranja }}>{erro}</p>;
  if (!d || !d.serie || d.serie.length < 2) return null;

  const L = 300, A = 70, m = 4;
  const vals = d.serie.map((x) => x.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const faixa = max - min || 1;
  const px = (i) => m + (i * (L - 2 * m)) / (d.serie.length - 1);
  const py = (v) => m + (A - 2 * m) * (1 - (v - min) / faixa);
  const linha = d.serie.map((x, i) => `${px(i).toFixed(1)},${py(x.valor).toFixed(1)}`).join(" ");
  const area = `${m},${A - m} ${linha} ${(L - m).toFixed(1)},${A - m}`;

  const doze = d.doze_meses;

  return (
    <div className="mt-3 rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
      <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
        Desvalorizômetro · FIPE mês a mês
      </div>

      <svg viewBox={`0 0 ${L} ${A}`} className="mt-2 block w-full" style={{ height: 70 }} preserveAspectRatio="none">
        <polygon points={area} fill={C.roxoFraco} />
        <polyline points={linha} fill="none" stroke={C.roxo} strokeWidth="1.5" strokeLinejoin="round" />
        <circle cx={px(d.serie.length - 1)} cy={py(vals[vals.length - 1])} r="2.5" fill={C.roxo} />
      </svg>

      <div className="flex justify-between text-[9px]" style={{ color: C.mute, fontFamily: F.mono }}>
        <span>{d.serie[0].mes}</span>
        <span>{d.atual.mes}</span>
      </div>

      {doze && (() => {
        // Carro velho no Brasil tem subido de tabela. Tratar tudo como
        // perda seria mentira na frente do cliente — e o argumento de
        // negociação é outro em cada caso.
        const caiu = doze.reais < 0;
        const cor = caiu ? C.laranja : C.verde;
        return (
          <div className="mt-2 grid grid-cols-2 gap-2">
            <div>
              <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                {caiu ? "Perdeu em 12 meses" : "Subiu em 12 meses"}
              </div>
              <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
                {caiu ? "−" : "+"}{brl(Math.abs(doze.reais))}
              </div>
              <div className="text-[10px]" style={{ color: C.mute }}>
                {Math.abs(doze.pct)}% desde {doze.de}
              </div>
            </div>
            <div>
              <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                {caiu ? "Por mês parado" : "Por mês"}
              </div>
              <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
                {caiu ? "−" : "+"}{brl(Math.abs(doze.por_mes))}
              </div>
              <div className="text-[10px]" style={{ color: C.mute }}>
                {caiu ? "é o custo de esperar" : "acompanhando a tabela"}
              </div>
            </div>
          </div>
        );
      })()}

      <p className="mt-2 text-[10px] leading-relaxed" style={{ color: C.mute }}>
        {d.desde_o_pico.reais < 0
          ? `Do topo (${brl(d.pico.valor)}, ${d.pico.mes}) até hoje: ${brl(Math.abs(d.desde_o_pico.reais))} a menos — ${Math.abs(d.desde_o_pico.pct)}%.`
          : `Está no maior valor da série (${d.pico.mes}).`}
        {" "}São {d.meses_disponiveis} meses de tabela.
      </p>
    </div>
  );
}

function comprimir(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onerror = () => rej(new Error("Não consegui ler a imagem."));
    l.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Arquivo inválido."));
      img.onload = () => {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res({ src: cv.toDataURL("image/jpeg", q), largura: cv.width, altura: cv.height });
      };
      img.src = l.result;
    };
    l.readAsDataURL(file);
  });
}

];
function faltando(f, fotos) {
  const l = OBRIGATORIOS.filter(([k]) => {
    const v = f[k];
    if (k === "pneus") return v.some((p) => !p);
    if (k === "opcionais") return v.length === 0;
    return v === "" || v == null;
  });
  if (!fotos.length) l.push(["fotos", "Ao menos 1 foto"]);
  return l;
}

function etapaConcluida(id, f, fotos) {

    case "P": return !!f.motivo && !!f.pretensao && f.decisorPresente && faltamCanais(f).length === 0;

    case "PUB": return faltando(f, fotos).length === 0 && f.publicado;
    case "ESP": return !!f.esperaIniciadaEm;
    case "N": return f.rodadas.length > 0;
    case "T": return f.aceiteFinal && !!f.valorFechado;
    case "E": return f.avaliacaoGoogle || f.indicacoes.length > 0;
    default: return false;

function extratoOfertas(f, r, indice, titulo) {
  const valores = (r && r.valores) || [];
  const cem = (v) => Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const melhor = r ? r.melhor : 0;

  // Três blocos de 30, como as faixas H/I, K/L e N/O da planilha. Vão
  // lado a lado no papel, do mesmo jeito que estão na tela.
  const coluna = (inicio) => {
    let linhas = "";
    for (let k = 0; k < 30; k++) {
      const n = inicio + k;
      const v = valores[n - 1];
      linhas += `<tr><td class="n">${n}</td>` +
        `<td class="v${v != null && v === melhor ? " destaque" : ""}">${v == null ? "—" : cem(v)}</td></tr>`;
    }
    return `<table class="col"><thead><tr><th>Num</th><th class="d">Valor</th></tr></thead><tbody>${linhas}</tbody></table>`;
  };

  const corpo = `<div class="extrato">
  <div class="lado">
    <div class="tit">${titulo || `Extrato de ofertas — ${indice}ª rodada`}</div>

    <div class="linhaV"><span class="rot">Veículo</span><span class="caixa">${ou((r && r.veiculo) || f.modelo, "marca e modelo")}</span></div>

    <div class="par"><span>Quant. de propostas</span><span class="vm">${r ? r.quantidade : 0}</span></div>

    <div class="bloco">
      <div class="rotG">Valor médio das propostas</div>
      <div class="sub"><span class="vm">R$</span><span class="vm">${cem(r ? r.media : 0)}</span></div>
    </div>

    <div class="bloco">
      <div class="rotG grande">Melhor Proposta</div>
      <div class="sub"><span class="vm grande">R$</span><span class="vm grande">${cem(melhor)}</span></div>
    </div>

    <div class="caixa cheia">${ou((r && r.negociador) || f.negociador, "negociador")}</div>
    <div class="caixa cheia">JOINVILLE</div>
  </div>

  <div class="cols">${coluna(1)}${coluna(31)}${coluna(61)}</div>
</div>`;

  return moldura({
    titulo: `Extrato de ofertas ${indice}`,
    corpo,
    protocolo: protocolo(f, `EXT${indice}`),
    logo: true,
    paisagem: true,
  });
}

function abrirDocumento(html) {
  const j = window.open("", "_blank");
  if (!j) return { ok: false, erro: "O navegador bloqueou a janela. Libere pop-ups para este site." };
  j.document.write(html);
  j.document.close();
  setTimeout(() => j.print(), 400);
  return { ok: true };
}

// O protocolo vive dentro do HTML gerado, no rodapé. Tirá-lo de lá
// evita mexer nas funções de documento só para devolver mais um valor.
const extrairProtocolo = (html) => {
  const m = /Protocolo ([A-Z0-9-]+)/.exec(String(html || ""));
  return m ? m[1] : null;
};

/* ===================== app ===================== */
function VaaptyAponte({ perfil, atendimento, aoVoltar }) {
  // Cada atendimento tem o seu canto no aparelho. Sem isto, abrir o
  // segundo carro sobrescreveria a ficha do primeiro.
  const aid = (atendimento && atendimento.id) || "solto";
  const CH_AT = `vaapty:at:${aid}`;
  const CH_FOTOS = `vaapty:fotos:${aid}`;
  const CH_VEIC = `vaapty:veiculo:${aid}`;

  const [f, setF] = useState(VAZIO);
  const [fotos, setFotos] = useState([]);
  const [etapa, setEtapa] = useState("A");
  const [copiado, setCopiado] = useState("");
  const [agora, setAgora] = useState(Date.now());

  const [placaBusca, setPlacaBusca] = useState("");
  const [buscando, setBuscando] = useState(false);
  const [erroBusca, setErroBusca] = useState("");
  const [achado, setAchado] = useState(null);
  const [cambioBusca, setCambioBusca] = useState("");
  const [cota, setCota] = useState(null);

  const [termoMercado, setTermoMercado] = useState("");
  const [cliente, setCliente] = useState({
    cliente_nome: (atendimento && atendimento.cliente_nome) || "",
    cliente_telefone: (atendimento && atendimento.cliente_telefone) || "",
    cliente_cpf: (atendimento && atendimento.cliente_cpf) || "",
    cliente_rg: (atendimento && atendimento.cliente_rg) || "",
    cliente_endereco: (atendimento && atendimento.cliente_endereco) || "",
    // O comprador é o lojista que leva o carro — a outra parte do
    // contrato final, e não o cliente que vende (0014).
    comprador_nome: (atendimento && atendimento.comprador_nome) || "",
    comprador_cpf: (atendimento && atendimento.comprador_cpf) || "",
    comprador_nacionalidade: (atendimento && atendimento.comprador_nacionalidade) || "Brasileiro(a)",
    comprador_estado_civil: (atendimento && atendimento.comprador_estado_civil) || "",
    comprador_profissao: (atendimento && atendimento.comprador_profissao) || "",
    comprador_endereco: (atendimento && atendimento.comprador_endereco) || "",
  });
  const [checklist, setChecklist] = useState(null);
  const [statusAtual, setStatusAtual] = useState((atendimento && atendimento.status) || "aberto");
  const [erroStatus, setErroStatus] = useState("");
  const [salvandoCliente, setSalvandoCliente] = useState(false);
  const [erroCliente, setErroCliente] = useState("");
  const [erroCanais, setErroCanais] = useState("");
  const [novaRodada, setNovaRodada] = useState({ impresso: "", contra: "" });
  const [novaInd, setNovaInd] = useState({ nome: "", fone: "" });
  const [envioLeads, setEnvioLeads] = useState("");
  const [erroFoto, setErroFoto] = useState("");
  const [veiculoId, setVeiculoId] = useState(null);
  const [pronto, setPronto] = useState(false);
  const fotosRef = useRef([]);
  const fRef = useRef(VAZIO);
  const [erroDoc, setErroDoc] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [salvo, setSalvo] = useState(null);
  const [erroSalvar, setErroSalvar] = useState("");
  const camRef = useRef(null); const galRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(CH_AT);
        if (r && r.value) { const n = { ...VAZIO, ...JSON.parse(r.value) }; fRef.current = n; setF(n); }
      } catch (e) {}

      let vid = null;
      const vEmbutido = atendimento && (atendimento.veiculo || [])[0];
      if (vEmbutido && vEmbutido.id) { vid = vEmbutido.id; setVeiculoId(vid); }
      else {
        try {
          const r = await window.storage.get(CH_VEIC);
          if (r && r.value) { vid = JSON.parse(r.value).id || null; setVeiculoId(vid); }
        } catch (e) {}
      }

      // No aparelho só sobra o que ainda não subiu.
      let pendentes = [];
      try { const r = await window.storage.get(CH_FOTOS); if (r && r.value) pendentes = JSON.parse(r.value); } catch (e) {}
      pendentes = (Array.isArray(pendentes) ? pendentes : [])
        .filter((p) => p && p.local)
        .map((p, i) => ({
          chave: p.chave || `p${i}-${Math.random().toString(36).slice(2, 7)}`,
          local: p.local, largura: p.largura, altura: p.altura, id: null, url: null,
          estado: "erro", erro: p.erro || "Ficou pendente do atendimento anterior.",
        }));

      let doServidor = [];
      if (vid) {
        try {
          doServidor = (await listarFotos(vid)).map((x) => ({
            chave: `s-${x.id}`, id: x.id, caminho: x.caminho, url: x.url,
            local: null, estado: "ok", erro: "",
          }));
        } catch (e) { setErroFoto(e.message); }
      }

      aplicar(() => [...doServidor, ...pendentes]);
      setPronto(true);
      setCota(await consultarCota());
    })();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // O celular não guarda foto que já está no servidor. Quando a última
  // sobe, a chave sai do localStorage inteira.
  useEffect(() => {
    if (!pronto) return;
    const pend = fotos
      .filter((p) => p.estado !== "ok" && p.local)
      .map((p) => ({ chave: p.chave, local: p.local, largura: p.largura, altura: p.altura, erro: p.erro || "" }));
    if (!pend.length) window.storage.delete(CH_FOTOS).catch(() => {});
    else window.storage.set(CH_FOTOS, JSON.stringify(pend))
      .catch(() => setErroFoto("Não coube no armazenamento local."));
  }, [fotos, pronto]);

  const guardarFicha = (n) => {
    fRef.current = n;
    setF(n); window.storage.set(CH_AT, JSON.stringify(n)).catch(() => {});
  };
  const set = (k, v) => guardarFicha({ ...fRef.current, [k]: v });
  const setVarios = (o) => guardarFicha({ ...fRef.current, ...o });

  // Uma escuta por atendimento, e não por etapa: aqui em cima ela
  // sobrevive à troca de passo. Ver o comentário do useEscuta.
  const escuta = useEscuta(f, set);
  // fotosRef é a versão autoritativa: o upload é assíncrono e não pode
  // ler estado velho de dentro de uma closure.
  const aplicar = (fn) => { const n = fn(fotosRef.current); fotosRef.current = n; setFotos(n); };
  const mudarFoto = (chave, mud) =>
    aplicar((prev) => prev.map((p) => (p.chave === chave ? { ...p, ...mud } : p)));

  const buscar = async () => {
    setErroBusca(""); setAchado(null); setBuscando(true); setCambioBusca(f.cambio || "");
    try { setAchado(await consultarPlaca(placaBusca)); setCota(await consultarCota()); }
    catch (e) { setErroBusca(e.message); }
    setBuscando(false);
  };
  const escolherVersao = (v) => {
    setVarios({
      placa: achado.placa, modelo: `${achado.marca} ${v.nome}`,
      ano: `${achado.anoFabricacao || ""}/${v.anoModelo || achado.anoModelo || ""}`,
      fipe: String(Math.round(v.valor)), fipeCodigo: v.codigoFipe,
      fipeDesval: v.desvalorizometro || "",
      marca: achado.marca || "",
      modeloCurto: String(achado.modeloAbreviado || "").split(/\s+/)[0] || "",
      chassi: achado.chassiCompleto ? achado.chassi : "",
      cor: achado.cor || "", combustivel: v.combustivel || achado.combustivel || "",
      cambio: cambioBusca || f.cambio,
    });
    setAchado(null); setPlacaBusca("");
  };

  const enviarFoto = async (chave, vid) => {
    const alvo = fotosRef.current.find((p) => p.chave === chave);
    if (!alvo || alvo.estado === "ok" || alvo.estado === "enviando" || !alvo.local) return;
    mudarFoto(chave, { estado: "enviando", erro: "" });
    try {
      const ordem = Math.max(0, fotosRef.current.findIndex((p) => p.chave === chave));
      const d = await subirFoto(vid, alvo, ordem);
      mudarFoto(chave, { estado: "ok", id: d.id, caminho: d.caminho, url: d.url, local: null, erro: "" });
    } catch (e) {
      // A imagem continua no aparelho: "tentar de novo" reaproveita.
      mudarFoto(chave, { estado: "erro", erro: e.message });
    }
  };

  const receberFotos = async (ev) => {
    setErroFoto("");
    const arqs = Array.from(ev.target.files || []);
    if (!arqs.length) return;
    const espaco = MAX_FOTOS - fotosRef.current.length;
    if (espaco <= 0) { setErroFoto(`Limite de ${MAX_FOTOS} fotos.`); return; }
    const novas = [];
    for (const a of arqs.slice(0, espaco)) {
      try {
        const img = await comprimir(a);
        novas.push({
          chave: `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          local: img.src, largura: img.largura, altura: img.altura,
          id: null, url: null, estado: "aguardando", erro: "",
        });
      } catch (e) { setErroFoto(e.message); }
    }
    if (novas.length) {
      aplicar((prev) => [...prev, ...novas]);
      if (veiculoId) for (const n of novas) await enviarFoto(n.chave, veiculoId);
    }
    ev.target.value = "";
  };

  const salvarOrdem = async (lista) => {
    const ordens = lista.map((p, i) => ({ id: p.id, ordem: i })).filter((o) => o.id);
    if (!ordens.length) return;
    try { await gravarOrdemFotos(ordens); } catch (e) { setErroFoto(e.message); }
  };
  const definirCapa = async (i) => {
    const n = [...fotosRef.current];
    const [x] = n.splice(i, 1); n.unshift(x);
    aplicar(() => n);
    await salvarOrdem(n);
  };
  const removerFoto = async (i) => {
    const alvo = fotosRef.current[i];
    if (!alvo) return;
    if (alvo.id) {
      try { await apagarFotoServidor(alvo.id); }
      catch (e) { setErroFoto(e.message); return; }
    }
    const n = fotosRef.current.filter((_, x) => x !== i);
    aplicar(() => n);
    await salvarOrdem(n);
  };

  /**
   * Gera, abre para impressão e registra. A abertura da janela precisa
   * acontecer no mesmo passo do clique — pop-up aberto depois de um
   * await é bloqueado pelo navegador.
   */
  const gerarDocumento = async (tipo, rotulo, html, rodada) => {
    setErroDoc("");
    const r = abrirDocumento(html);
    if (!r.ok) { setErroDoc(r.erro); return; }

    const reg = {
      tipo, rotulo,
      rodada: rodada == null ? null : rodada,
      protocolo: extrairProtocolo(html),
      em: new Date().toISOString(),
      noBanco: false,

    if (veiculoId) {

        await registrarDocumento({
          veiculo_id: veiculoId, tipo, rodada: reg.rodada,

        });
        reg.noBanco = true;
      } catch (e) { setErroDoc(e.message); }
    }

    guardarFicha({ ...fRef.current, documentos: [...(fRef.current.documentos || []), reg] });
  };

  // Sem estes quatro, o documento sai com lacuna. E papel com lacuna
  // volta para ser preenchido depois — que é como contrato acaba
  // assinado pela metade.
  // O endereço saiu da trava a pedido do Derek: ele não quer perguntar
  // ao cliente o que já está na CNH e no CRLV. A cláusula continua nos
  // documentos — é texto assinado, não se apaga — e sai com a linha em
  // branco para preencher à mão quando o papel exigir.
  const OBRIG_CLIENTE = [
    ["cliente_nome", "Nome"], ["cliente_cpf", "CPF"], ["cliente_rg", "RG"],

  const mudarStatus = async (novo, manual) => {

      if (avancoDe(novo) <= avancoDe(statusAtual)) return;   // nunca volta
    }

    catch (e) { setStatusAtual(antes); setErroStatus(e.message); }
  };

  // Segue o preenchimento: carro no pátio, lançamento, propostas,
  // rodadas, fechamento.
  useEffect(() => {
    const derivado = statusDerivado(f);
    if (derivado) mudarStatus(derivado, false);
  }, [f.carroSubiu, f.publicado, f.aceiteFinal, f.valorFechado, f.rodadas.length]);

  const salvarCliente = async () => {
    if (!atendimento) { setErroCliente("Abra o atendimento pela lista para salvar."); return; }
    setErroCliente(""); setSalvandoCliente(true);
    try { await atualizarAtendimento(atendimento.id, cliente); }
    catch (e) { setErroCliente(e.message); }
    setSalvandoCliente(false);
  };

  const blocoCliente = (
    <Bloco titulo="Dados do cliente" sub="Nome, CPF e RG travam a impressão — papel com lacuna volta para ser completado depois, e é assim que contrato acaba assinado pela metade. O resto é opcional: anexe o CRLV e a CNH em vez de perguntar.">
      <div className="space-y-2.5">
        <Campo label="Nome completo" req>
          <input className={inputCls} style={inputSty} value={cliente.cliente_nome}
            onChange={(e) => setCliente({ ...cliente, cliente_nome: e.target.value })} />
        </Campo>
        <div className="grid grid-cols-2 gap-2.5">
          <Campo label="CPF" req>
            <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
              value={cliente.cliente_cpf} onChange={(e) => setCliente({ ...cliente, cliente_cpf: e.target.value })} />
          </Campo>
          <Campo label="RG" req>
            <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }}
              value={cliente.cliente_rg} onChange={(e) => setCliente({ ...cliente, cliente_rg: e.target.value })} />
          </Campo>
        </div>
        <Campo label="Telefone">
          <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="tel"
            value={cliente.cliente_telefone} onChange={(e) => setCliente({ ...cliente, cliente_telefone: e.target.value })} />
        </Campo>
        {/* Sem `req`: não trava mais a impressão. A cláusula continua no
            termo e no pré-contrato — é texto assinado — e sai com a
            linha em branco quando este campo estiver vazio. O endereço
            do proprietário está no CRLV, que agora é anexado. */}

        <button onClick={salvarCliente} disabled={salvandoCliente}

        {!podeImprimir && (

          </p>
        )}
      </div>
    </Bloco>
  );

  const copiar = (t, tag) => {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    setCopiado(tag); setTimeout(() => setCopiado(""), 1800);
  };

  const corpoBanco = useMemo(() => JSON.stringify(fichaParaBanco(f)), [f]);
  const salvoAtual = !!salvo && salvo.corpo === corpoBanco;

  const salvarNoBanco = async () => {
    setErroSalvar(""); setSalvando(true);
    try {
      const d = await salvarFicha({ ...JSON.parse(corpoBanco), atendimento_id: atendimento ? atendimento.id : null });
      const t = new Date(d.salvo_em);
      setSalvo({ hora: isNaN(t.getTime()) ? new Date() : t, criado: !!d.criado, corpo: corpoBanco });
      if (d.id) {
        setVeiculoId(d.id);
        window.storage.set(CH_VEIC, JSON.stringify({ id: d.id, placa: d.placa })).catch(() => {});
        // Foto tirada antes de existir veículo estava só esperando por isto.
        for (const p of fotosRef.current.filter((x) => x.estado !== "ok" && x.local)) {
          await enviarFoto(p.chave, d.id);
        }

        // Documento gerado antes de existir veículo: registra agora. O
        // HTML já se perdeu (não fica no aparelho), então a linha vai
        // sem conteúdo — dá para saber que existiu, não o que dizia.
        const feitos = [];
        for (const doc of (fRef.current.documentos || []).filter((x) => !x.noBanco)) {
          try {
            await registrarDocumento({
              veiculo_id: d.id, tipo: doc.tipo, rodada: doc.rodada,
              protocolo: doc.protocolo, conteudo: null, negociador: fRef.current.negociador,
            });
            feitos.push(doc.em);
          } catch (e) { setErroDoc(e.message); }
        }
        if (feitos.length) {
          guardarFicha({
            ...fRef.current,
            documentos: (fRef.current.documentos || []).map((x) =>
              feitos.indexOf(x.em) >= 0 ? { ...x, noBanco: true } : x),
          });
        }
      }
    } catch (e) { setErroSalvar(e.message); }
    setSalvando(false);
  };

  const enviadas = useMemo(() => fotos.filter((p) => p.estado === "ok"), [fotos]);
  const subindo = fotos.some((p) => p.estado === "enviando");
  const faltas = useMemo(() => faltando(f, enviadas), [f, enviadas]);
  const liberado = faltas.length === 0;
  // A ficha precisa ir ao banco antes das fotos: é o id dela que dá
  // destino ao upload. Por isso o botão de salvar não espera foto.
  const faltasFicha = faltas.filter((x) => x[0] !== "fotos");
  const podeSalvar = faltasFicha.length === 0;
  const descritivo = gerarDescritivo(f, enviadas.length);

  const restante = f.esperaIniciadaEm ? Math.max(0, ESPERA_SEG - Math.floor((agora - f.esperaIniciadaEm) / 1000)) : null;
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  // O contrato precisa do cliente, que mora no atendimento e não na
  // ficha do veículo.
  const dadosDoc = {
    ...f,
    ...cliente,
    valorFechado: f.valorFechado || (atendimento && atendimento.valor_fechado) || "",
  };


  const docs = f.documentos || [];
  const hhmm = (iso) => { const d = new Date(iso); return isNaN(d.getTime()) ? "—" : d.toTimeString().slice(0, 5); };
  const docsDe = (tipo, rodada) =>
    docs.filter((x) => x.tipo === tipo && (rodada == null || x.rodada === rodada));

  const gap = useMemo(() => {
    if (!f.pretensao || !f.rodadas.length) return null;
    return Math.round(((Number(f.pretensao) - Number(f.rodadas[0].impresso)) / Number(f.pretensao)) * 100);
  }, [f.pretensao, f.rodadas]);

  const idx = ETAPAS.findIndex((e) => e.id === etapa);
  const et = ETAPAS[idx];

  return (
    <div className="min-h-screen w-full pb-24" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap');
        input:focus,textarea:focus,select:focus{border-color:${C.roxo}!important;box-shadow:0 0 0 3px ${C.roxoFraco}}
        .rolar::-webkit-scrollbar{height:0}
        @media (prefers-reduced-motion: reduce){*{transition:none!important}}
      `}</style>

      {/* cabeçalho */}
      <header className="px-4 pt-4 pb-3" style={{ background: C.roxo, color: "#fff" }}>
        <div className="flex items-baseline justify-between">
          <span className="text-[10px] uppercase tracking-[0.22em]" style={{ opacity: 0.7 }}>
            {perfil ? `${perfil.nome} · ${perfil.papel}` : "Vaapty Joinville"}
          </span>
          {cota && (
            <span className="text-[10px]" style={{ fontFamily: F.mono, opacity: cota.restantes <= 3 ? 1 : 0.7, color: cota.restantes <= 3 ? "#FFC9B4" : "#fff" }}>
              {cota.usadas}/{cota.limiteDiario} consultas
            </span>
          )}
        </div>
        {(() => {
          const vBanco = (atendimento && (atendimento.veiculo || [])[0]) || null;
          const titulo = f.modelo || (vBanco && vBanco.marca_modelo) ||
            (atendimento && atendimento.carro_descricao) || "Novo atendimento";
          const placa = f.placa || (vBanco && vBanco.placa) || "";
          const ano = f.ano || (vBanco ? [vBanco.ano_fabricacao, vBanco.ano_modelo].filter(Boolean).join("/") : "");
          const fipe = f.fipe || (vBanco && vBanco.fipe_valor) || "";
          return (
            <>
              <h1 className="mt-1 text-[17px] leading-tight" style={{ fontFamily: F.disp, fontWeight: 800 }}>
                {titulo}
              </h1>
              {!!placa && (
                <div className="mt-1 text-[11px]" style={{ fontFamily: F.mono, opacity: 0.85 }}>
                  {placa}{ano ? ` · ${ano}` : ""}{fipe ? ` · FIPE ${brl(fipe)}` : ""}
                </div>
              )}
            </>
          );
        })()}
        <div className="mt-2 flex items-center gap-3">
          {aoVoltar && (
            <button onClick={aoVoltar} className="text-[11px] font-semibold" style={{ color: "#fff" }}>‹ Atendimentos</button>
          )}
          {atendimento && atendimento.cliente_nome && (
            <span className="text-[10px]" style={{ opacity: 0.75 }}>{atendimento.cliente_nome}</span>
          )}
          <button onClick={sair} className="ml-auto text-[10px] underline" style={{ color: "#fff", opacity: 0.7 }}>Sair</button>
        </div>
      </header>

      {atendimento && (

      <div className="rolar flex gap-1.5 overflow-x-auto px-3 py-3" style={{ background: C.paper, borderBottom: `1px solid ${C.line}` }}>

              <span className="flex h-9 w-9 items-center justify-center rounded-full text-[15px]"
                style={{
                  background: ativa ? C.roxo : ok ? C.verde : C.roxoFraco,

              <Campo label="Hora de chegada">
                <div className="flex gap-2">

        {etapa === "P" && (

                  value={placaBusca} onChange={(e) => setPlacaBusca(e.target.value.toUpperCase())} maxLength={8} />
                <button onClick={buscar} disabled={buscando || placaBusca.length < 7}

                  {buscando ? "…" : "Consultar"}
                </button>
              </div>
              {erroBusca && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erroBusca}</p>}

              {achado && (() => {
                const lista = filtrarPorCambio(achado.versoes || [], cambioBusca);
                const aviso = alertaDispersao(lista);
                return (
                  <div className="mt-3 rounded-md p-3" style={{ background: C.roxoFraco }}>
                    <div className="text-[13px] font-semibold">{achado.marca} {achado.modeloAbreviado}</div>
                    <div className="mt-0.5 text-[11px]" style={{ color: C.mute }}>

                    <div className="mt-3 text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>Câmbio</div>
                    <div className="mt-1.5 flex gap-1.5">
                      {["Manual", "Automático", "Todos"].map((op) => {

                        return (

                            style={{ background: on ? C.roxo : "#fff", color: on ? "#fff" : C.mute, border: `1px solid ${on ? C.roxo : C.line}` }}>{op}</button>

                    <div className="mt-3 text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
                      {lista.length === 1 ? "Versão encontrada" : `${lista.length} versões — escolha`}

                    <div className="mt-1.5 space-y-1.5">
                      {lista.map((v) => (
                        <button key={v.codigoFipe + v.nome} onClick={() => escolherVersao(v)}
                          className="flex w-full items-center justify-between gap-3 rounded-md border px-3 py-2.5 text-left"
                          style={{ borderColor: C.line, background: "#fff" }}>
                          <span>
                            <span className="block text-[12px] leading-snug">{v.nome}</span>
                            <span className="text-[10px]" style={{ color: C.mute, fontFamily: F.mono }}>{v.codigoFipe} · {v.mesReferencia} · {v.confianca}%</span>
                          </span>
                          <span className="shrink-0 text-[12px] font-bold" style={{ fontFamily: F.mono, color: C.roxo }}>{brl(v.valor)}</span>
                        </button>
                      ))}
                    </div>
                    {aviso && <p className="mt-2 rounded px-2 py-1.5 text-[11px]" style={{ background: "#FDEDE6", color: C.laranja }}>{aviso}</p>}
                  </div>
                );
              })()}

              {!!f.placa && <ConferirFipe f={f} set={setVarios} />}

              {!!f.modelo && (() => {
                const termo = termoMercado || termoMercadoPadrao(f);
                const [ma, mo] = marcaModeloDa(f);
                const vistos = f.canaisVistos || [];
                const possiveis = canaisPossiveis(f);
                const faltam = faltamCanais(f);

                const marcarVisto = (chave) => {
                  if (vistos.indexOf(chave) >= 0) return;
                  set("canaisVistos", [...vistos, chave]);
                };

                // Navegador bloqueia abertura em série. Marco só o que
                // realmente abriu — dar por visto o que não abriu seria
                // liberar a etapa sem ninguém ter olhado.
                const abrirTodos = () => {
                  const abertos = [];
                  CANAIS.forEach((c) => {
                    const url = enderecoCanal(c, termo, ma, mo);
                    if (!url) return;
                    const j = window.open(url, "_blank", "noopener");
                    if (j) abertos.push(c.chave);
                  });
                  if (abertos.length) set("canaisVistos", [...new Set([...vistos, ...abertos])]);
                  setErroCanais(abertos.length < possiveis.length
                    ? "O navegador bloqueou parte das abas. Libere pop-ups para este site ou abra um a um."
                    : "");
                };

                return (
                  <div className="mt-3 rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${faltam.length ? C.laranja : C.verde}` }}>
                    <div className="flex items-baseline justify-between gap-2">
                      <span className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
                        Pesquisa de mercado
                      </span>
                      <span className="text-[10px]" style={{ fontFamily: F.mono, color: faltam.length ? C.laranja : C.verde }}>
                        {possiveis.length - faltam.length}/{possiveis.length}

                    </div>
                    <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>

                    </p>

                    <input className={`${inputCls} mt-2`} style={inputSty} value={termo}
                      onChange={(e) => setTermoMercado(e.target.value)} placeholder="O que buscar" />

                    <button onClick={abrirTodos}
                      className="mt-2 w-full rounded-md py-2 text-[12px] font-semibold"
                      style={{ background: C.roxo, color: "#fff" }}>

                    </button>

                    {[["anuncio", "Anúncio — o que o dono pede"],
                      ["tabela", "Tabela — o que o mercado pratica"]].map(([fam, titulo]) => {
                      const doGrupo = CANAIS.filter((c) => c.familia === fam && enderecoCanal(c, termo, ma, mo));
                      if (!doGrupo.length) return null;
                      return (
                        <div key={fam} className="mt-3">

                                           color: visto ? C.verde : C.roxo,
                                           border: `1px solid ${visto ? C.verde : C.line}` }}>
                                  {visto ? "✓ " : ""}{c.nome}

                              passa por reCAPTCHA, então não dá para chegar com o

                      </p>

                      <b>Anúncio é preço pedido, não preço de venda</b> — serve de teto.

                      {" "}a <b>tabela AutoAvaliar</b> é o repasse entre lojistas — a ponta que a Vaapty vende,

                    </p>

        {/* ---------- PUB ---------- */}

                        {i === 0 && <span className="absolute left-1 top-1 rounded px-1 py-0.5 text-[8px] font-bold uppercase" style={{ background: C.roxo, color: "#fff" }}>Capa</span>}

            <Bloco titulo="Completar a ficha">
              <div className="space-y-3">

                <div className="grid grid-cols-2 gap-3">
                  <Campo label="Ano / modelo" req><input className={inputCls} style={inputSty} value={f.ano} onChange={(e) => set("ano", e.target.value)} /></Campo>
                  <Campo label="Câmbio" req>
                    <select className={inputCls} style={inputSty} value={f.cambio} onChange={(e) => set("cambio", e.target.value)}>
                      {CAMBIO.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </Campo>
                  <Campo label="KM atual" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.km} onChange={(e) => set("km", e.target.value)} /></Campo>
                  <Campo label="KM quando o cliente pegou"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.kmEntrada} onChange={(e) => set("kmEntrada", e.target.value)} /></Campo>
                  <Campo label="Placa" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} value={f.placa} onChange={(e) => set("placa", e.target.value.toUpperCase())} /></Campo>
                  <Campo label="Cor"><input className={inputCls} style={inputSty} value={f.cor} onChange={(e) => set("cor", e.target.value)} /></Campo>
                  <Campo label="Renavam"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.renavam} onChange={(e) => set("renavam", e.target.value)} placeholder="do CRLV" /></Campo>
                  <Campo label="FIPE" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.fipe} onChange={(e) => set("fipe", e.target.value)} /></Campo>
                  <Campo label="POR" req><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.por} onChange={(e) => set("por", e.target.value)} /></Campo>

                  </p>

                {f.fipeConferida && (
                  <p className="text-[11px]" style={{ color: C.verde }}>
                    ✓ FIPE conferida na tabela oficial{f.fipeOficialMes ? ` — ${f.fipeOficialMes}` : ""}.
                  </p>
                )}
                <Campo label="Gastos / peças" req><input className={inputCls} style={inputSty} value={f.gastos} onChange={(e) => set("gastos", e.target.value)} /></Campo>
                <div>
                  <Rotulo req>Condição dos pneus</Rotulo>
                  <div className="mt-1 grid grid-cols-2 gap-2">
                    {["Diant. esq.", "Diant. dir.", "Tras. esq.", "Tras. dir."].map((p, i) => (
                      <select key={p} className={inputCls} style={inputSty} value={f.pneus[i]}
                        onChange={(e) => { const n = [...f.pneus]; n[i] = e.target.value; set("pneus", n); }}>
                        <option value="">{p}</option>
                        {PNEU.map((x) => <option key={x}>{x}</option>)}
                      </select>
                    ))}
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => set("leilao", !f.leilao)} className="flex-1 rounded-md border px-3 py-2 text-[13px]"
                    style={{ borderColor: f.leilao ? C.laranja : C.line, color: f.leilao ? C.laranja : C.mute, background: f.leilao ? "#FDEDE6" : "#fff" }}>Leilão / sinistro</button>
                  <button onClick={() => set("gnv", !f.gnv)} className="flex-1 rounded-md border px-3 py-2 text-[13px]"
                    style={{ borderColor: f.gnv ? C.roxo : C.line, color: f.gnv ? C.roxo : C.mute, background: f.gnv ? C.roxoFraco : "#fff" }}>GNV</button>
                </div>
                <div>
                  <Rotulo req>Opcionais</Rotulo>
                  <div className="mt-1.5 flex flex-wrap gap-1.5">
                    {OPCIONAIS.map((o) => {
                      const on = f.opcionais.includes(o);
                      return (
                        <button key={o} onClick={() => set("opcionais", on ? f.opcionais.filter((x) => x !== o) : [...f.opcionais, o])}
                          className="rounded-full px-3 py-1.5 text-[12px]"
                          style={{ background: on ? C.roxo : "#fff", color: on ? "#fff" : C.mute, border: `1px solid ${on ? C.roxo : C.line}` }}>{o}</button>
                      );
                    })}
                  </div>
                </div>
                <Campo label="Ressalvas — vai pro lojista">
                  <textarea rows={2} className={inputCls} style={inputSty} value={f.ressalvas} onChange={(e) => set("ressalvas", e.target.value)} />
                </Campo>
                <Campo label="Internas — nunca sai da loja">
                  <textarea rows={2} className={inputCls} style={{ ...inputSty, background: "#FBF7FD" }} value={f.internas} onChange={(e) => set("internas", e.target.value)} />
                </Campo>
              </div>
            </Bloco>

            <section className="rounded-lg" style={{ background: C.paper, border: `1px solid ${C.line}`, opacity: liberado ? 1 : 0.45 }}>
              <div className="flex items-center justify-between border-b px-4 py-3" style={{ borderColor: C.line }}>
                <span className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Descritivo</span>
                <button disabled={!liberado} onClick={() => copiar(descritivo, "d")} className="rounded-md px-3 py-1.5 text-[12px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                  {copiado === "d" ? "Copiado" : "Copiar"}
                </button>
              </div>
              <pre className="overflow-x-auto whitespace-pre-wrap px-4 py-3 text-[12px] leading-relaxed" style={{ fontFamily: F.body }}>{descritivo}</pre>
              <div className="border-t px-4 py-3" style={{ borderColor: C.line }}>
                <button disabled={!liberado} onClick={() => copiar(JSON.stringify(payloadShinkai(f, enviadas.length), null, 2), "s")}
                  className="w-full rounded-md border py-2 text-[12px] font-semibold" style={{ borderColor: C.line, color: C.roxo }}>
                  {copiado === "s" ? "JSON copiado" : "Copiar JSON do Shinkai"}
                </button>
              </div>
            </section>

            <section className="rounded-lg p-4" style={{ background: C.paper, border: `1px solid ${C.line}`, opacity: podeSalvar ? 1 : 0.45 }}>
              <div className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Banco</div>
              <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
                Grava a ficha no Supabase. Salvar de novo na mesma placa atualiza a ficha em avaliação em vez de criar outra.
                As fotos só sobem depois que a ficha existe no banco.
              </p>
              <button disabled={!podeSalvar || salvando} onClick={salvarNoBanco}
                className="mt-3 w-full rounded-md py-2.5 text-[13px] font-semibold"
                style={{ background: podeSalvar && !salvando ? C.roxo : C.line, color: "#fff" }}>
                {salvando ? "Salvando…" : veiculoId ? "Salvar de novo" : "Salvar no banco"}
              </button>
              {!podeSalvar && (
                <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
                  Falta {faltasFicha.map((x) => x[1]).join(" · ")}.
                </p>
              )}
              {salvo && salvoAtual && (
                <p className="mt-2 text-[12px]" style={{ color: C.verde }}>
                  {salvo.criado ? "Ficha criada" : "Ficha atualizada"} às {salvo.hora.toTimeString().slice(0, 5)}.
                </p>
              )}
              {salvo && !salvoAtual && (
                <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
                  Salva às {salvo.hora.toTimeString().slice(0, 5)} e alterada depois. Salve de novo.
                </p>
              )}
              {erroSalvar && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erroSalvar}</p>}
            </section>

            <Toggle label="Lancei o carro na plataforma" nota="Marque depois de publicar no grupo e no Shinkai." valor={f.publicado} onChange={(v) => { set("publicado", v); if (v && !f.esperaIniciadaEm) setVarios({ publicado: v, esperaIniciadaEm: Date.now() }); }} />
          </>
        )}

        {/* ---------- ESPERA ---------- */}
        {etapa === "ESP" && (
          <>
            <Bloco titulo="Enquanto as propostas chegam" sub="O carro está lançado e a rede está respondendo. Aqui não se registra nada — a primeira proposta que entra no sistema é o 1º extrato, na Negociação. Este é o tempo de conversa que decide o fechamento.">
              {restante == null ? (
                <button onClick={() => set("esperaIniciadaEm", Date.now())} className="w-full rounded-md py-3 text-[14px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>

                </button>
              ) : (

                  <div className="text-[46px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: restante === 0 ? C.verde : C.roxo }}>

                  </div>
                  <p className="mt-2 text-[12px]" style={{ color: restante === 0 ? C.verde : C.mute }}>
                    {restante === 0 ? "Tempo encerrado — siga para a negociação." : "Fique com o cliente. Não deixe ele sozinho na mesa."}
                  </p>
                  <button onClick={() => set("esperaIniciadaEm", null)} className="mt-3 text-[12px] underline" style={{ color: C.mute }}>Reiniciar</button>
                </div>
              )}
            </Bloco>

            <Bloco titulo="Anote o que ouvir" sub="O que ele falar aqui é o argumento que você usa na hora do extrato.">
              <textarea rows={5} className={inputCls} style={inputSty} value={f.notasEspera} onChange={(e) => set("notasEspera", e.target.value)}
                placeholder="Precisa do dinheiro até sexta. Mulher não sabe da dívida. Já tentou vender há 2 meses…" />
            </Bloco>

            <Bloco titulo="Escutar a conversa" sub="Transcreve o que for dito e destaca os ganchos. O cliente precisa autorizar antes — é a condição do parecer.">
              <EscutaPainel escuta={escuta} f={f} set={set} />
            </Bloco>
          </>
        )}

        {/* ---------- N ---------- */}
        {etapa === "N" && (() => {
          /* O caminho é uma fila só, e a tela mostra um passo de cada
             vez: extrato 1 → contra 1 → 5 min → extrato 2 → contra 2 →
             5 min → extrato 3 → pré-contrato. Antes disso tudo
             aparecia junto e o negociador tinha que lembrar da ordem. */
          const R = f.rodadas;
          const n = R.length;
          const atual = n ? R[n - 1] : null;
          const faltaContra = !!atual && !atual.contra;
          const podeContar = !!atual && !!atual.contra && !atual.esperaEm && n < 3;
          const sobra = atual && atual.esperaEm
            ? Math.max(0, RODADA_SEG - Math.floor((agora - atual.esperaEm) / 1000))
            : null;
          const noRelogio = sobra != null && sobra > 0;
          const liberado = n === 0 || (n < 3 && !!atual.contra && sobra === 0);
          const fim = n === 3;

          const passo = (num, rot, estado) => (
            <div className="flex items-center gap-2">
              <span className="flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[10px] font-bold"
                style={{ background: estado === "feito" ? C.verde : estado === "agora" ? C.roxo : "#E7E3EC",
                         color: estado === "espera" ? C.mute : "#fff" }}>
                {estado === "feito" ? "✓" : num}
              </span>
              <span className="text-[11px]" style={{ color: estado === "espera" ? C.mute : C.ink, fontWeight: estado === "agora" ? 700 : 400 }}>{rot}</span>
            </div>
          );

          return (
          <>
            {gap != null && (
              <div className="rounded-lg p-3" style={{ background: C.roxoFraco, border: `1px solid ${C.line}` }}>
                <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Gap de abertura</div>
                <div className="mt-0.5 text-[22px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>{gap}%</div>
                <div className="mt-1 text-[11px]" style={{ color: C.mute }}>
                  Primeiro extrato {brl(f.rodadas[0].impresso)} contra pretensão de {brl(f.pretensao)}.
                </div>
              </div>
            )}

            {/* o caminho, sempre à vista */}
            <div className="rounded-lg p-3" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
              <div className="flex flex-wrap gap-x-4 gap-y-1.5">
                {[1, 2, 3].map((k) => (
                  <React.Fragment key={k}>
                    {passo(k, `Extrato ${k}`, n >= k ? "feito" : (liberado && n === k - 1 ? "agora" : "espera"))}
                    {k < 3 && passo("↓", `Contra ${k}`, (R[k - 1] && R[k - 1].contra) ? "feito" : (faltaContra && n === k ? "agora" : "espera"))}
                    {k < 3 && passo("⏱", "5 min", (R[k - 1] && R[k - 1].esperaEm && (n > k || sobra === 0)) ? "feito" : ((podeContar || noRelogio) && n === k ? "agora" : "espera"))}
                  </React.Fragment>
                ))}
                {passo("✎", "Pré-contrato", fim ? "agora" : "espera")}
              </div>
            </div>

            {/* 1. o extrato da vez */}
            {liberado && (
              <Bloco titulo={`Extrato de ofertas — ${n + 1}º de três`}
                sub="Sorteie a rodada e imprima. A folha sai igual ao que está aqui.">
                <SimuladorPropostas
                  alvoPadrao={f.por || f.fipe} veiculo={f.modelo} negociador={f.negociador}
                  rotuloImprimir={`Imprimir o ${n + 1}º extrato e seguir`}
                  aoImprimir={(r) => {
                    set("rodadas", [...f.rodadas, { impresso: String(r.melhor), contra: "", esperaEm: null }]);
                    gerarDocumento("extrato_ofertas", `Extrato de ofertas ${n + 1}`, extratoOfertas(dadosDoc, r, n + 1), n + 1);
                  }} />
              </Bloco>
            )}

            {/* 2. a contraproposta do cliente */}
            {faltaContra && (
              <Bloco titulo={`Contraproposta ${n}`}
                sub={`Você levou ${brl(atual.impresso)} para a mesa. Quanto ele pediu?`}>
                <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 18 }}
                  inputMode="numeric" placeholder="Quanto o cliente pediu"
                  value={novaRodada.contra}
                  onChange={(e) => setNovaRodada({ ...novaRodada, contra: e.target.value })} />
                <button
                  onClick={() => {
                    if (!novaRodada.contra.trim()) return;
                    const copia = f.rodadas.slice();
                    copia[n - 1] = { ...atual, contra: novaRodada.contra.trim() };
                    set("rodadas", copia);
                    setNovaRodada({ impresso: "", contra: "" });
                  }}
                  className="mt-2 w-full rounded-md py-3 text-[14px] font-semibold"
                  style={{ background: C.roxo, color: "#fff" }}>
                  Registrar a contraproposta
                </button>
                <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
                  É este número que vai para o termo de aceite — não o que a loja imprimiu.
                </p>
              </Bloco>
            )}

            {/* 3. os cinco minutos */}
            {(podeContar || noRelogio) && (
              <Bloco titulo="Cinco minutos com a mesa"
                sub="O tempo em que você some para consultar. Sem ele, o próximo extrato sai na hora e o cliente entende que o número já estava pronto.">
                {podeContar ? (
                  <button onClick={() => {
                      const copia = f.rodadas.slice();
                      copia[n - 1] = { ...atual, esperaEm: Date.now() };
                      set("rodadas", copia);
                    }}
                    className="w-full rounded-md py-3 text-[14px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                    Iniciar os 5 minutos
                  </button>
                ) : (
                  <div className="text-center">
                    <div className="text-[46px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>
                      {mmss(sobra)}
                    </div>
                    <p className="mt-2 text-[12px]" style={{ color: C.mute }}>Fique com o cliente. Volte com o próximo extrato.</p>
                    <button onClick={() => {
                        const copia = f.rodadas.slice();
                        copia[n - 1] = { ...atual, esperaEm: Date.now() - RODADA_SEG * 1000 };
                        set("rodadas", copia);
                      }}
                      className="mt-3 text-[12px] underline" style={{ color: C.mute }}>pular o tempo</button>
                  </div>
                )}
              </Bloco>
            )}

            {/* 4. acabaram as três: vai para o fechamento */}
            {fim && (
              <Bloco titulo="Três rodadas feitas" sub="Daqui o caminho é o pré-contrato, no Tome a iniciativa.">
                <button disabled={!podeImprimir}

                  className="mt-2 w-full rounded-md border py-2.5 text-[13px] font-semibold"
                  style={{ borderColor: C.roxo, color: C.roxo }}>

                </Pendente>
              </div>
            </Bloco>
          </>

        })()}

        {/* ---------- T ---------- */}
        {etapa === "T" && (
          <>
            <Bloco titulo="Aceite e cautelar">

                  <Campo label="Forma">
                    <select className={inputCls} style={inputSty} value={f.formaFechamento} onChange={(e) => set("formaFechamento", e.target.value)}>
                      {FECHAMENTO.map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </Campo>
                </div>
                <Toggle label="Aceite final assinado" valor={f.aceiteFinal} onChange={(v) => set("aceiteFinal", v)} />
                <Toggle label="Carro enviado para a cautelar" valor={f.cautelarEnviado} onChange={(v) => set("cautelarEnviado", v)} />
                <div className="grid grid-cols-2 gap-2">
                  <button disabled={!podeImprimir}

                  </p>

                {podeImprimir && !f.valorFechado && (

                    <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Documentos gerados</div>
                    <div className="mt-1.5 space-y-1">
                      {docs.map((d, k) => (
                        <div key={k} className="flex items-baseline justify-between gap-2">
                          <span className="text-[12px]">{d.rotulo}</span>
                          <span className="text-[10px]" style={{ color: d.noBanco ? C.mute : C.laranja, fontFamily: F.mono }}>

                        </div>
                      ))}
                    </div>
                  </div>

                <button disabled={!podeImprimir}
                  onClick={() => gerarDocumento("check_list", "Check list", checkList(dadosDoc, checklist), null)}
                  className="w-full rounded-md border py-2 text-[12px] font-semibold"

                <p className="text-[11px] leading-relaxed" style={{ color: C.mute }}>
                  Os documentos saem com o texto que a casa assina e com os dados do cliente preenchidos. Só os dados bancários ficam em branco: o sistema não guarda conta nem chave PIX.
                </p>
              </div>
            </Bloco>

            {/* O contrato final só faz sentido depois do laudo. Antes
                disso o negócio ainda pode voltar à mesa, e contrato
                assinado que precisa ser refeito é pior que contrato

            {f.cautelarResultado === "aprovada" && (
              <Bloco titulo="Contrato final" sub="O comprador é o lojista que leva o carro — a outra parte do contrato, não o cliente que vende.">

                  <Campo label="Nome do comprador" req>
                    <input className={inputCls} style={inputSty} value={cliente.comprador_nome}

                  <div className="grid grid-cols-2 gap-2.5">
                    <Campo label="CPF" req>
                      <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
                        value={cliente.comprador_cpf} onChange={(e) => setCliente({ ...cliente, comprador_cpf: e.target.value })} />
                    </Campo>
                    <Campo label="Nacionalidade">
                      <input className={inputCls} style={inputSty} value={cliente.comprador_nacionalidade}
                        onChange={(e) => setCliente({ ...cliente, comprador_nacionalidade: e.target.value })} />
                    </Campo>
                    <Campo label="Estado civil">
                      <input className={inputCls} style={inputSty} value={cliente.comprador_estado_civil}
                        onChange={(e) => setCliente({ ...cliente, comprador_estado_civil: e.target.value })} />
                    </Campo>
                    <Campo label="Profissão">
                      <input className={inputCls} style={inputSty} value={cliente.comprador_profissao}

                    </Campo>
                  </div>
                  <Campo label="Endereço">
                    <input className={inputCls} style={inputSty} value={cliente.comprador_endereco}
                      onChange={(e) => setCliente({ ...cliente, comprador_endereco: e.target.value })} />
                  </Campo>
                  <button onClick={salvarCliente} disabled={salvandoCliente}

                  </button>

                  {(() => {
                    const faltaCarro = [["marca", "marca"], ["modelo", "modelo"], ["placa", "placa"],
                                        ["chassi", "chassi"], ["renavam", "renavam"], ["cor", "cor"],
                                        ["km", "KM"], ["fipe", "FIPE"]]
                      .filter(([k]) => !String(f[k] || "").trim()).map((x) => x[1]);
                    const faltaComp = !String(cliente.comprador_nome || "").trim() || !String(cliente.comprador_cpf || "").trim();
                    const pronto = !faltaCarro.length && !faltaComp && !!f.valorFechado;
                    return (
                      <>
                        <button disabled={!pronto}
                          onClick={() => gerarDocumento("contrato_final", "Contrato de compra e venda",
                            contratoFinal({ ...dadosDoc, ...cliente }), null)}
                          className="w-full rounded-md py-3 text-[14px] font-semibold"
                          style={{ background: pronto ? C.roxo : "#E7E3EC", color: pronto ? "#fff" : C.mute }}>

                        {!pronto && (
                          <p className="text-[11px]" style={{ color: AMARELO.texto }}>
                            Falta{" "}
                            {[!!faltaCarro.length && `do carro: ${faltaCarro.join(", ")}`,
                              faltaComp && "nome e CPF do comprador",
                              !f.valorFechado && "o valor fechado"].filter(Boolean).join(" · ")}.
                          </p>
                        )}
                        <Pendente>
                          A assinatura pelo ZapSign entra aqui. Falta a chave da conta chegar às variáveis de ambiente da Vercel — ela não pode passar por mim nem ficar no repositório.
                        </Pendente>
                      </>
                    );
                  })()}
                </div>
              </Bloco>
            )}

            <Bloco titulo="Anexos do fechamento"
              sub="Comprovante de residência, laudo da cautelar e comprovante de pagamento.">
              <Anexos atendimentoId={atendimento ? atendimento.id : null}
                rotulos={["Comprovante de residência", "Laudo cautelar", "Comprovante de pagamento", "Outro"]} />
            </Bloco>

            {/* A cautelar pode reprovar, e aí a negociação reabre.

            {f.cautelarEnviado && (
              <Bloco titulo="Resultado da cautelar"
                sub="O laudo chegou? É aqui que o negócio confirma ou volta para a mesa.">
                {!f.cautelarResultado ? (
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => set("cautelarResultado", "aprovada")}
                      className="rounded-md py-3 text-[13px] font-semibold" style={{ background: C.verde, color: "#fff" }}>
                      Aprovada
                    </button>
                    <button onClick={() => set("cautelarResultado", "reprovada")}
                      className="rounded-md py-3 text-[13px] font-semibold" style={{ background: C.laranja, color: "#fff" }}>
                      Reprovada
                    </button>
                  </div>
                ) : (
                  <div>
                    <div className="flex items-center justify-between gap-2 rounded-md px-3 py-2"
                      style={{ background: f.cautelarResultado === "aprovada" ? "#F0F8F4" : AMARELO.fundo,
                               border: `1px solid ${f.cautelarResultado === "aprovada" ? C.verde : AMARELO.borda}` }}>
                      <span className="text-[13px] font-semibold"
                        style={{ color: f.cautelarResultado === "aprovada" ? C.verde : AMARELO.texto }}>
                        {f.cautelarResultado === "aprovada"
                          ? "Cautelar aprovada — segue para o contrato."
                          : "Cautelar reprovada — o valor precisa ser refeito."}
                      </span>
                      <button onClick={() => setVarios({ cautelarResultado: "", cautelarLaudo: "" })}
                        className="shrink-0 text-[11px] underline" style={{ color: C.mute }}>trocar</button>
                    </div>

                    {f.cautelarResultado === "reprovada" && (
                      <div className="mt-3 space-y-3">
                        <Campo label="O que apareceu no laudo">
                          <textarea rows={2} className={inputCls} style={inputSty}
                            placeholder="Estrutural na longarina direita, troca de teto…"
                            value={f.cautelarLaudo} onChange={(e) => set("cautelarLaudo", e.target.value)} />
                        </Campo>

                        <div className="rounded-md p-3" style={{ background: "#FBF7FD", border: `1px solid ${C.line}` }}>
                          <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.roxo }}>
                            Novo extrato para o cliente
                          </div>
                          <p className="mt-1 text-[11px]" style={{ color: C.mute }}>
