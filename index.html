/* ===================== sessão ===================== */

/**
 * A sessão vive aqui, fora do React, porque as funções de API são de
 * módulo e precisam do token sem receber props. Um navegador, um
 * usuário — não há risco de troca como haveria no servidor.
 */
const AUTH = { cfg: null, sessao: null, aoSair: null };

async function carregarConfig() {
  if (AUTH.cfg) return AUTH.cfg;
  const r = await fetch("/api/perfil?recurso=config");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Configuração do servidor indisponível.");
  AUTH.cfg = d;
  return d;
}

const guardarSessao = (s) => {
  AUTH.sessao = s;
  if (s) window.storage.set("vaapty:sessao", JSON.stringify(s)).catch(() => {});
  else window.storage.delete("vaapty:sessao").catch(() => {});
};

async function restaurarSessao() {
  try {
    const r = await window.storage.get("vaapty:sessao");
    if (r && r.value) AUTH.sessao = JSON.parse(r.value);
  } catch (e) {}
  return AUTH.sessao;
}

async function entrar(email, senha) {
  const cfg = await carregarConfig();
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ email: String(email).trim(), password: senha }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // A mensagem do Supabase vem em inglês e não diz nada ao negociador.
    const m = String(d.error_description || d.msg || d.error || "");
    throw new Error(/invalid/i.test(m) ? "E-mail ou senha não conferem." : m || "Não consegui entrar.");
  }
  guardarSessao(d);
  return d;
}

async function renovarSessao() {
  const cfg = await carregarConfig();
  const atual = AUTH.sessao;
  if (!atual || !atual.refresh_token) throw new Error("Sessão expirada.");
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: atual.refresh_token }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { guardarSessao(null); throw new Error("Sessão expirada. Entre de novo."); }
  guardarSessao(d);
  return d;
}

function sair() {
  guardarSessao(null);
  if (AUTH.aoSair) AUTH.aoSair();
}

/**
 * Toda chamada às funções em api/ passa por aqui. O token do Supabase
 * dura uma hora; em vez de vigiar o relógio, deixo o 401 acontecer e
 * renovo uma vez. Se falhar de novo, é sessão morta mesmo.
 */
async function fetchAut(url, opcoes) {
  if (!AUTH.sessao) throw new Error("Entre para continuar.");
  const monta = () => {
    const o = { ...(opcoes || {}) };
    o.headers = { ...(o.headers || {}), Authorization: `Bearer ${AUTH.sessao.access_token}` };
    return o;
  };
  let r = await fetch(url, monta());
  if (r.status === 401) {
    try { await renovarSessao(); } catch (e) { sair(); throw e; }
    r = await fetch(url, monta());
    if (r.status === 401) { sair(); throw new Error("Sessão expirada. Entre de novo."); }
  }
  return r;
}

/* ----------- CRM: atendimentos e propostas ----------- */

/**
 * Hoje em Joinville, aaaa-mm-dd.
 *
 * O relógio da casa é America/Sao_Paulo, e não UTC: das 21h à
 * meia-noite do dia 31 Greenwich já virou o mês, e o dashboard trocava
 * o período com a loja ainda fechando o mês anterior. O mesmo relógio
 * está em api/funil.js e api/perfil.js — quem escrever data nova usa
 * este.
 */
const hojeEmSP = () =>
  new Date().toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" });

const MESES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
                  "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

// A competência é sempre o dia 1: é assim que `desempenho` e
// `meta_loja` guardam o mês, e é a chave dos dois.
const competenciaDe = (iso) => `${String(iso).slice(0, 8)}01`;

const rotuloMes = (comp) =>
  `${MESES_PT[Number(String(comp).slice(5, 7)) - 1]} de ${String(comp).slice(0, 4)}`;

/** O período fechado do mês, para o `de`/`ate` do funil. */
const faixaDoMes = (comp) => {
  const ano = Number(String(comp).slice(0, 4));
  const mes = Number(String(comp).slice(5, 7));
  // Dia 0 do mês seguinte é o último deste — sem tabela de bissexto.
  const ultimo = new Date(Date.UTC(ano, mes, 0)).getUTCDate();
  return { de: competenciaDe(comp), ate: `${String(comp).slice(0, 8)}${String(ultimo).padStart(2, "0")}` };
};

/** Os últimos `n` meses, do atual para trás. */
const mesesRecentes = (n) => {
  const hoje = hojeEmSP();
  const ano = Number(hoje.slice(0, 4));
  const mes = Number(hoje.slice(5, 7));
  const lista = [];
  for (let i = 0; i < n; i++) {
    // Índice de mês negativo volta o ano sozinho: Date.UTC cuida disso.
    const d = new Date(Date.UTC(ano, mes - 1 - i, 1));
    lista.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-01`);
  }
  return lista;
};

const RX_AUT = /\b(AUT|AUTOM|CVT|DCT|AT)\b\.?/i;
const RX_MEC = /\b(MEC|MANUAL|MT)\b\.?/i;
function filtrarPorCambio(vs, cambio) {
  if (!cambio) return vs;
  const quer = cambio !== "Manual";
  const f = vs.filter((v) => (quer ? RX_AUT.test(v.nome) : RX_MEC.test(v.nome) || !RX_AUT.test(v.nome)));
  return f.length ? f : vs;
}
function alertaDispersao(vs) {
  if (vs.length < 2) return null;
  const a = vs.map((v) => v.valor);
  const d = Math.max(...a) - Math.min(...a);
  return d < 2000 ? null : `As versões variam ${brl(d)} entre si. Confirme no documento.`;
}

/* ===================== mercado ===================== */

/**
 * O nome que a FIPE devolve é comprido demais para busca de anúncio
 * ("CHEVROLET ONIX HATCH LTZ 1.4 8V FlexPower 5p Mec." não acha nada).
 * Tira a parte que descreve motor e câmbio e fica com marca, modelo,
 * versão e ano — que é como o anúncio costuma ser escrito.
 */
const RX_RUIDO = /^(\d+[.,]\d+|\d+v|\d+p|mec|aut|autom|automatico|flex|flexpower|power|cvt)\.?$/i;
function termoMercadoPadrao(f) {
  const toks = String(f.modelo || "").split(/\s+/).filter((t) => t && !RX_RUIDO.test(t));
  const ano = String(f.ano || "").split("/")[0];
  return [...toks.slice(0, 4), ano].filter(Boolean).join(" ").trim();
}

/**
 * Canais de anúncio. * Canais de anúncio, todos com busca própria — conferi um por um em
 * 27/08/2026 com HYUNDAI/I30.
 *
 * A OLX busca por texto livre; os outros três montam o caminho com
 * marca e modelo separados, e por isso `marca` e `modeloCurto` são
 * guardados na ficha quando a versão FIPE é escolhida.
 *
 * Chaves na Mão ficou de fora: não responde a nenhum dos dois padrões
 * e devolve "página não encontrada". Link quebrado na frente do
 * cliente é pior que canal a menos.
 */
const semAcento = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const fatia = (t) => semAcento(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const CANAIS = [
  // Anúncio: o que o dono PEDE. Serve de teto.
  { chave: "olx", nome: "OLX", familia: "anuncio", cor: "#6D1B9E", tipo: "texto",
    url: (t) => `https://www.olx.com.br/autos-e-pecas/carros-vans-e-utilitarios?q=${encodeURIComponent(t)}` },
  { chave: "webmotors", nome: "Webmotors", familia: "anuncio", tipo: "caminho",
    url: (ma, mo) => `https://www.webmotors.com.br/carros/estoque/${fatia(ma)}/${fatia(mo)}` },
  { chave: "icarros", nome: "iCarros", familia: "anuncio", tipo: "caminho",
    url: (ma, mo) => `https://www.icarros.com.br/comprar/usados/${fatia(ma)}/${fatia(mo)}` },
  { chave: "mercadolivre", nome: "Mercado Livre", familia: "anuncio", tipo: "caminho",
    url: (ma, mo) => `https://carros.mercadolivre.com.br/${fatia(ma)}/${fatia(mo)}/` },
  { chave: "facebook", nome: "Marketplace", familia: "anuncio", tipo: "texto",
    url: (t) => `https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(t)}` },

  // Tabela: o que o mercado PRATICA. Cada uma mede uma ponta.
  // KBB é varejo; AutoAvaliar é repasse — a ponta que a Vaapty vende.
  // O modelo no KBB fica sob a carroceria (/hatchback/i30/), que a FIPE
  // não devolve, então o link para na marca.
  { chave: "kbb", nome: "KBB — varejo", familia: "tabela", tipo: "marca",
    url: (ma) => `https://www.kbb.com.br/sp/marcas/${fatia(ma)}/` },
  // Tabela transacional de repasse, em consulta pública: escolhe marca,
  // modelo, ano, versão e estado. Fica em subdomínio próprio — a página
  // do produto no site institucional é outra coisa, e pede login.
  { chave: "autoavaliar", nome: "AutoAvaliar — repasse", familia: "tabela", tipo: "fixo",
    url: () => "https://tabela.autoavaliar.com.br/" },
];

const enderecoCanal = (c, termo, marca, modelo) => {
  if (c.tipo === "fixo") return c.url();
  if (c.tipo === "texto") return c.url(termo);
  if (c.tipo === "marca") return marca ? c.url(marca) : null;
  return marca && modelo ? c.url(marca, modelo) : null;
};

const marcaModeloDa = (f) => {
  const partes = String(f.modelo || "").split(/\s+/);
  return [f.marca || partes[0] || "", f.modeloCurto || partes[1] || ""];
};

/**
 * A pesquisa de mercado faz parte do processo: o negociador precisa ter
 * olhado o preço anunciado antes de sentar para negociar. Por isso a
 * etapa P só fecha depois de abrir todos os canais possíveis.
 *
 * "Possíveis" e não "todos": sem marca e modelo separados, os canais de
 * caminho não têm endereço, e exigir clique em link inexistente
 * travaria o atendimento.
 */
function canaisPossiveis(f) {
  const [ma, mo] = marcaModeloDa(f);
  return CANAIS.filter((c) => !!enderecoCanal(c, "x", ma, mo)).map((c) => c.chave);
}
function faltamCanais(f) {
  const vistos = f.canaisVistos || [];
  return canaisPossiveis(f).filter((c) => vistos.indexOf(c) < 0);
}

const AMARELO = { fundo: "#FFF6E0", borda: "#E0A800", texto: "#8A6100" };

  </div>
);

/**
 * Conferência na FIPE oficial, na ordem MARCA → ANO → MODELO.
 *
 * A FIPE navega marca → modelo → ano, mas aí a lista de modelos mistura
 * o mesmo carro de vinte anos diferentes. Escolhendo o ano antes, a
 * lista de modelos já vem curta e só com o que existiu naquele ano.
 */
function ConferirFipe({ f, set }) {
  const [marcas, setMarcas] = useState([]);
  const [marca, setMarca] = useState("");
  const [ano, setAno] = useState("");
  const [modelos, setModelos] = useState([]);
  const [escolha, setEscolha] = useState("");      // "codigo|combustivel"
  const [res, setRes] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState("");            // marcas | modelos | valor

  const anos = useMemo(() => {
    const atual = new Date().getFullYear();
    const l = [];
    for (let a = atual + 1; a >= 1985; a--) l.push(a);
    return l;
  }, []);

  useEffect(() => {
    setIndo("marcas");
    fipeOficial({ acao: "marcas" })
      .then((d) => {
        setMarcas(d.marcas || []);
        // Adianta o que já se sabe da ficha.
        const alvo = (d.marcas || []).filter((m) =>
          m.nome.toLowerCase() === String(f.marca || "").toLowerCase())[0];
        if (alvo) setMarca(String(alvo.codigo));
        const a = String(f.ano || "").split("/")[1] || String(f.ano || "").split("/")[0];
        if (a && /^\d{4}$/.test(a)) setAno(a);
      })
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  }, []);

  useEffect(() => {
    setModelos([]); setEscolha(""); setRes(null);
    if (!marca || !ano) return;
    setIndo("modelos"); setErro("");
    fipeOficial({ acao: "modelos", marca, ano })
      .then((d) => {
        setModelos(d.modelos || []);
        if (!(d.modelos || []).length) setErro("A FIPE não tem modelos dessa marca nesse ano.");
      })
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  }, [marca, ano]);

  const buscarValor = (valorEscolha) => {
    setEscolha(valorEscolha); setRes(null);
    if (!valorEscolha) return;
    const [codigo, comb] = valorEscolha.split("|");
    setIndo("valor"); setErro("");
    fipeOficial({ acao: "valor", marca, modelo: codigo, ano, combustivel: comb })
      .then(setRes)
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  };

  const usar = () => {
    set({
      fipe: String(res.valor),
      fipeCodigo: res.codigo_fipe || f.fipeCodigo,
      fipeConferida: true,
      fipeOficialCodigo: res.codigo_fipe || "",
      fipeOficialMes: res.mes_referencia || "",
      fipeAutenticacao: res.autenticacao || "",
    });
  };

  const daPlaca = Number(f.fipe) || 0;
  const diferenca = res && daPlaca ? res.valor - daPlaca : 0;

  return (
    <div className="mt-3 rounded-md p-3"
      style={{ background: f.fipeConferida ? "#F0F8F4" : AMARELO.fundo,
               border: `1px solid ${f.fipeConferida ? C.verde : AMARELO.borda}` }}>
      <div className="flex items-baseline justify-between gap-2">
        <span className="text-[10px] uppercase tracking-[0.13em]" style={{ color: f.fipeConferida ? C.verde : AMARELO.texto }}>
          {f.fipeConferida ? "✓ FIPE conferida na fonte" : "Conferir na tabela FIPE oficial"}
        </span>
      </div>

      {f.fipeConferida ? (
        <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
          {f.fipeOficialCodigo} · {f.fipeOficialMes}
          {f.fipeAutenticacao ? ` · autenticação ${f.fipeAutenticacao}` : ""}
        </p>
      ) : (
        <p className="mt-1 text-[11px] leading-relaxed" style={{ color: AMARELO.texto }}>
          A consulta de placa adivinha a versão. Aqui você confirma na fonte — marca, depois ano, depois modelo.
        </p>
      )}

      <div className="mt-2 space-y-2">
        <div className="grid grid-cols-2 gap-2">
          <Campo label="Marca">
            <select className={inputCls} style={inputSty} value={marca} onChange={(e) => setMarca(e.target.value)}>
              <option value="">{indo === "marcas" ? "carregando…" : "escolha"}</option>
              {marcas.map((m) => <option key={m.codigo} value={m.codigo}>{m.nome}</option>)}
            </select>
          </Campo>
          <Campo label="Ano do modelo">
            <select className={inputCls} style={inputSty} value={ano} onChange={(e) => setAno(e.target.value)}>
              <option value="">escolha</option>
              {anos.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Campo>
        </div>

        <Campo label={`Modelo${modelos.length ? ` — ${modelos.length} naquele ano` : ""}`}>
          <select className={inputCls} style={inputSty} value={escolha}
            disabled={!modelos.length} onChange={(e) => buscarValor(e.target.value)}>
            <option value="">
              {indo === "modelos" ? "carregando…" : !marca || !ano ? "escolha marca e ano antes" : "escolha"}
            </option>
            {modelos.map((m) => (
              <option key={`${m.codigo}-${m.combustivel}`} value={`${m.codigo}|${m.combustivel}`}>{m.nome}</option>
            ))}
          </select>

/* ===================== desvalorizômetro ===================== */

/**
 * O histórico FIPE do carro, mês a mês. Vale mais na mesa do que
 * qualquer argumento: o cliente ancora no que pagou, e a curva mostra
 * quanto custa continuar esperando.
 *
 * Gráfico em SVG na mão — o projeto não tem build nem biblioteca.
 */
function Desvalorizometro({ chave }) {
  const [d, setD] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState(false);

  useEffect(() => {
    if (!chave) { setD(null); setErro(""); return; }
    let vivo = true;
    setIndo(true); setErro("");
    consultarDesvalorizacao(chave)
      .then((x) => { if (vivo) setD(x); })
      .catch((e) => { if (vivo) setErro(e.message); })
      .then(() => { if (vivo) setIndo(false); });
    return () => { vivo = false; };
  }, [chave]);

  if (!chave) return null;
  if (indo) return <p className="mt-3 text-[11px]" style={{ color: C.mute }}>Carregando o histórico FIPE…</p>;
  if (erro) return <p className="mt-3 text-[11px]" style={{ color: C.laranja }}>{erro}</p>;
  if (!d || !d.serie || d.serie.length < 2) return null;

  const L = 300, A = 70, m = 4;
  const vals = d.serie.map((x) => x.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const faixa = max - min || 1;
  const px = (i) => m + (i * (L - 2 * m)) / (d.serie.length - 1);
  const py = (v) => m + (A - 2 * m) * (1 - (v - min) / faixa);
  const linha = d.serie.map((x, i) => `${px(i).toFixed(1)},${py(x.valor).toFixed(1)}`).join(" ");
  const area = `${m},${A - m} ${linha} ${(L - m).toFixed(1)},${A - m}`;

  const doze = d.doze_meses;

  return (
    <div className="mt-3 rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
      <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
        Desvalorizômetro · FIPE mês a mês
      </div>

      <svg viewBox={`0 0 ${L} ${A}`} className="mt-2 block w-full" style={{ height: 70 }} preserveAspectRatio="none">
        <polygon points={area} fill={C.roxoFraco} />
        <polyline points={linha} fill="none" stroke={C.roxo} strokeWidth="1.5" strokeLinejoin="round" />
        <circle cx={px(d.serie.length - 1)} cy={py(vals[vals.length - 1])} r="2.5" fill={C.roxo} />
      </svg>

      <div className="flex justify-between text-[9px]" style={{ color: C.mute, fontFamily: F.mono }}>
        <span>{d.serie[0].mes}</span>
        <span>{d.atual.mes}</span>
      </div>

      {doze && (() => {
        // Carro velho no Brasil tem subido de tabela. Tratar tudo como
        // perda seria mentira na frente do cliente — e o argumento de
        // negociação é outro em cada caso.
        const caiu = doze.reais < 0;
        const cor = caiu ? C.laranja : C.verde;
        return (
          <div className="mt-2 grid grid-cols-2 gap-2">
            <div>
              <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                {caiu ? "Perdeu em 12 meses" : "Subiu em 12 meses"}
              </div>
              <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
                {caiu ? "−" : "+"}{brl(Math.abs(doze.reais))}
              </div>
              <div className="text-[10px]" style={{ color: C.mute }}>
                {Math.abs(doze.pct)}% desde {doze.de}
              </div>
            </div>
            <div>
              <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                {caiu ? "Por mês parado" : "Por mês"}
              </div>
              <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
                {caiu ? "−" : "+"}{brl(Math.abs(doze.por_mes))}
              </div>
              <div className="text-[10px]" style={{ color: C.mute }}>
                {caiu ? "é o custo de esperar" : "acompanhando a tabela"}
              </div>
            </div>
          </div>
        );
      })()}

      <p className="mt-2 text-[10px] leading-relaxed" style={{ color: C.mute }}>
        {d.desde_o_pico.reais < 0
          ? `Do topo (${brl(d.pico.valor)}, ${d.pico.mes}) até hoje: ${brl(Math.abs(d.desde_o_pico.reais))} a menos — ${Math.abs(d.desde_o_pico.pct)}%.`
          : `Está no maior valor da série (${d.pico.mes}).`}
        {" "}São {d.meses_disponiveis} meses de tabela.
      </p>
    </div>
  );
}

function comprimir(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onerror = () => rej(new Error("Não consegui ler a imagem."));
    l.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Arquivo inválido."));
      img.onload = () => {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res({ src: cv.toDataURL("image/jpeg", q), largura: cv.width, altura: cv.height });
      };
      img.src = l.result;
    };
    l.readAsDataURL(file);
  });
}

 * folha significa entregar os dados de pagamento de um ao outro — e
 * conta bancária é dado sensível ao ponto de fraude. Foi pedido assim,
 * e está feito; se um dia isso tiver que sair, o lugar é um anexo
 * separado, que o check list já é.
 */
function contaDoNegocio(cl) {
  if (!cl) return "";
  const c = (v) => numeroBR(v);
  const descontos = CL_DESCONTOS.reduce((soma, [k]) => soma + c(cl[k]), 0);
  const venda = c(cl.valor_venda);
  const liquido = venda - descontos;

  const linhas = CL_DESCONTOS
    .filter(([k]) => c(cl[k]) > 0)
    .map(([k, r]) => `<tr><td class="r">− ${r}</td><td class="num">${brlDoc(c(cl[k]))}</td></tr>`)
    .join("");

  const banco = CL_BANCO
    .map(([k, r]) => `<tr><td class="r">${r}</td><td>${ou(cl[k], r.toLowerCase())}</td></tr>`)
    .join("");

  return `<p><strong>A CONTA DO NEGÓCIO</strong></p>
<table class="dados conta">
  <tr><td class="r">Valor de venda</td><td class="num">${brlDoc(venda)}</td></tr>
  ${linhas}
  <tr class="liquido"><td class="r">Líquido ao cliente</td><td class="num">${brlDoc(liquido)}</td></tr>
</table>

<p><strong>DADOS BANCÁRIOS PARA O PAGAMENTO</strong></p>
<table class="dados">
  ${banco}
</table>`;
}

function extratoOfertas(f, r, indice, titulo) {
  const valores = (r && r.valores) || [];
  const cem = (v) => Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const melhor = r ? r.melhor : 0;

  // Três blocos de 30, como as faixas H/I, K/L e N/O da planilha. Vão
  // lado a lado no papel, do mesmo jeito que estão na tela.
  const coluna = (inicio) => {
    let linhas = "";
    for (let k = 0; k < 30; k++) {
      const n = inicio + k;
      const v = valores[n - 1];
      linhas += `<tr><td class="n">${n}</td>` +
        `<td class="v${v != null && v === melhor ? " destaque" : ""}">${v == null ? "—" : cem(v)}</td></tr>`;
    }
    return `<table class="col"><thead><tr><th>Num</th><th class="d">Valor</th></tr></thead><tbody>${linhas}</tbody></table>`;
  };

  const corpo = `<div class="extrato">
  <div class="lado">
    <div class="tit">${titulo || `Extrato de ofertas — ${indice}ª rodada`}</div>

    <div class="linhaV"><span class="rot">Veículo</span><span class="caixa">${ou((r && r.veiculo) || f.modelo, "marca e modelo")}</span></div>

    <div class="par"><span>Quant. de propostas</span><span class="vm">${r ? r.quantidade : 0}</span></div>

    <div class="bloco">
      <div class="rotG">Valor médio das propostas</div>
      <div class="sub"><span class="vm">R$</span><span class="vm">${cem(r ? r.media : 0)}</span></div>
    </div>

    <div class="bloco">
      <div class="rotG grande">Melhor Proposta</div>
      <div class="sub"><span class="vm grande">R$</span><span class="vm grande">${cem(melhor)}</span></div>
    </div>

    <div class="caixa cheia">${ou((r && r.negociador) || f.negociador, "negociador")}</div>
    <div class="caixa cheia">JOINVILLE</div>
  </div>

  <div class="cols">${coluna(1)}${coluna(31)}${coluna(61)}</div>
</div>`;

  return moldura({
    titulo: `Extrato de ofertas ${indice}`,
    corpo,
    protocolo: protocolo(f, `EXT${indice}`),
    logo: true,
    paisagem: true,
  });
}

function abrirDocumento(html) {
  const j = window.open("", "_blank");
  if (!j) return { ok: false, erro: "O navegador bloqueou a janela. Libere pop-ups para este site." };
  j.document.write(html);
  j.document.close();
  setTimeout(() => j.print(), 400);
  return { ok: true };
}

// O protocolo vive dentro do HTML gerado, no rodapé. Tirá-lo de lá

const extrairProtocolo = (html) => {
  const m = /Protocolo ([A-Z0-9-]+)/.exec(String(html || ""));
  return m ? m[1] : null;
};

    cliente_endereco: (atendimento && atendimento.cliente_endereco) || "",
    // O contrato qualifica o cliente com estes separados (0017).

    cliente_uf: (atendimento && atendimento.cliente_uf) || "",
    cliente_cep: (atendimento && atendimento.cliente_cep) || "",

    comprador_nome: (atendimento && atendimento.comprador_nome) || "",

    comprador_nacionalidade: (atendimento && atendimento.comprador_nacionalidade) || "Brasileiro(a)",
    comprador_estado_civil: (atendimento && atendimento.comprador_estado_civil) || "",
    comprador_profissao: (atendimento && atendimento.comprador_profissao) || "",
    comprador_endereco: (atendimento && atendimento.comprador_endereco) || "",
    // Não entram no texto do contrato: são para o ZapSign chamar (0016).
    comprador_email: (atendimento && atendimento.comprador_email) || "",

  });
  const [checklist, setChecklist] = useState(null);
  const [statusAtual, setStatusAtual] = useState((atendimento && atendimento.status) || "aberto");
  const [erroStatus, setErroStatus] = useState("");

  const [erroCliente, setErroCliente] = useState("");

  useEffect(() => {

  useEffect(() => {

  // O celular não guarda foto que já está no servidor. Quando a última

  useEffect(() => {

  const guardarFicha = (n) => {

  const set = (k, v) => guardarFicha({ ...fRef.current, [k]: v });

  const escuta = useEscuta(f, set);
  // fotosRef é a versão autoritativa: o upload é assíncrono e não pode

  const aplicar = (fn) => { const n = fn(fotosRef.current); fotosRef.current = n; setFotos(n); };
  const mudarFoto = (chave, mud) =>

  const buscar = async () => {

  const enviarFoto = async (chave, vid) => {
    const alvo = fotosRef.current.find((p) => p.chave === chave);

    mudarFoto(chave, { estado: "enviando", erro: "" });
    try {
      const ordem = Math.max(0, fotosRef.current.findIndex((p) => p.chave === chave));
      const d = await subirFoto(vid, alvo, ordem);

    } catch (e) {

  };

  const receberFotos = async (ev) => {
    setErroFoto("");
    const arqs = Array.from(ev.target.files || []);
    if (!arqs.length) return;
    const espaco = MAX_FOTOS - fotosRef.current.length;
    if (espaco <= 0) { setErroFoto(`Limite de ${MAX_FOTOS} fotos.`); return; }
    const novas = [];
    for (const a of arqs.slice(0, espaco)) {
      try {
        const img = await comprimir(a);
        novas.push({
          chave: `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          local: img.src, largura: img.largura, altura: img.altura,
          id: null, url: null, estado: "aguardando", erro: "",
        });
      } catch (e) { setErroFoto(e.message); }
    }
    if (novas.length) {
      aplicar((prev) => [...prev, ...novas]);
      if (veiculoId) for (const n of novas) await enviarFoto(n.chave, veiculoId);
    }
    ev.target.value = "";
  };

  const salvarOrdem = async (lista) => {
    const ordens = lista.map((p, i) => ({ id: p.id, ordem: i })).filter((o) => o.id);
    if (!ordens.length) return;
    try { await gravarOrdemFotos(ordens); } catch (e) { setErroFoto(e.message); }
  };
  const definirCapa = async (i) => {
    const n = [...fotosRef.current];
    const [x] = n.splice(i, 1); n.unshift(x);
    aplicar(() => n);
    await salvarOrdem(n);
  };
  const removerFoto = async (i) => {
    const alvo = fotosRef.current[i];

    if (alvo.id) {

      catch (e) { setErroFoto(e.message); return; }

  /**
   * Gera, abre para impressão e registra. A abertura da janela precisa

   */
  const gerarDocumento = async (tipo, rotulo, html, rodada) => {
    setErroDoc("");
    const r = abrirDocumento(html);
    if (!r.ok) { setErroDoc(r.erro); return; }

    const reg = {
      tipo, rotulo,
      rodada: rodada == null ? null : rodada,
      protocolo: extrairProtocolo(html),
      em: new Date().toISOString(),
      noBanco: false,

    if (veiculoId) {
      try {
        await registrarDocumento({
          veiculo_id: veiculoId, tipo, rodada: reg.rodada,
          protocolo: reg.protocolo, conteudo: html, negociador: fRef.current.negociador,
        });
        reg.noBanco = true;
      } catch (e) { setErroDoc(e.message); }
    }

    guardarFicha({ ...fRef.current, documentos: [...(fRef.current.documentos || []), reg] });
  };

  // Sem estes quatro, o documento sai com lacuna. E papel com lacuna
  // volta para ser preenchido depois — que é como contrato acaba
  // assinado pela metade.
  // Só nome e CPF travam a impressão. Endereço e RG saíram a pedido do
  // Derek: ele não quer perguntar de saída o que está na CNH e no CRLV,
  // e os dois são pedidos no fechamento, junto do contrato. As cláusulas
  // continuam nos documentos — é texto assinado, não se apaga — e saem
  // com a linha em branco quando o campo estiver vazio.
  const OBRIG_CLIENTE = [
    ["cliente_nome", "Nome"], ["cliente_cpf", "CPF"],

  const faltamCliente = OBRIG_CLIENTE.filter(([k]) => !String(cliente[k] || "").trim());
  const podeImprimir = faltamCliente.length === 0;

  /**

  const mudarStatus = async (novo, manual) => {
    if (!atendimento || novo === statusAtual) return;
    if (!manual) {
      if (avancoDe(statusAtual) < 0) return;                 // status escolhido à mão: não mexe
      if (avancoDe(novo) <= avancoDe(statusAtual)) return;   // nunca volta
    }
    const antes = statusAtual;
    setStatusAtual(novo); setErroStatus("");
    try { await atualizarAtendimento(atendimento.id, { status: novo }); }
    catch (e) { setStatusAtual(antes); setErroStatus(e.message); }

  useEffect(() => {

    if (derivado) mudarStatus(derivado, false);
  }, [f.carroSubiu, f.publicado, f.aceiteFinal, f.valorFechado, f.rodadas.length]);

  const salvarCliente = async () => {

  const blocoCliente = (

  const subindo = fotos.some((p) => p.estado === "enviando");

  const faltasFicha = faltas.filter((x) => x[0] !== "fotos");
  const podeSalvar = faltasFicha.length === 0;
  const descritivo = gerarDescritivo(f, enviadas.length);

  const restante = f.esperaIniciadaEm ? Math.max(0, ESPERA_SEG - Math.floor((agora - f.esperaIniciadaEm) / 1000)) : null;
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  // O contrato precisa do cliente, que mora no atendimento e não na

  const dadosDoc = {
    ...f,
    ...cliente,
    valorFechado: f.valorFechado || (atendimento && atendimento.valor_fechado) || "",
  };

  const hhmm = (iso) => { const d = new Date(iso); return isNaN(d.getTime()) ? "—" : d.toTimeString().slice(0, 5); };
  const docsDe = (tipo, rodada) =>
    docs.filter((x) => x.tipo === tipo && (rodada == null || x.rodada === rodada));

  const gap = useMemo(() => {
    if (!f.pretensao || !f.rodadas.length) return null;
    return Math.round(((Number(f.pretensao) - Number(f.rodadas[0].impresso)) / Number(f.pretensao)) * 100);
  }, [f.pretensao, f.rodadas]);

  const idx = ETAPAS.findIndex((e) => e.id === etapa);
  const et = ETAPAS[idx];

  return (
    <div className="min-h-screen w-full pb-24" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap');
        input:focus,textarea:focus,select:focus{border-color:${C.roxo}!important;box-shadow:0 0 0 3px ${C.roxoFraco}}

      `}</style>

      {/* cabeçalho */}
      <header className="px-4 pt-4 pb-3" style={{ background: C.roxo, color: "#fff" }}>
        <div className="flex items-baseline justify-between">
          <span className="text-[10px] uppercase tracking-[0.22em]" style={{ opacity: 0.7 }}>
            {perfil ? `${perfil.nome} · ${perfil.papel}` : "Vaapty Joinville"}
          </span>
          {cota && (
            <span className="text-[10px]" style={{ fontFamily: F.mono, opacity: cota.restantes <= 3 ? 1 : 0.7, color: cota.restantes <= 3 ? "#FFC9B4" : "#fff" }}>
              {cota.usadas}/{cota.limiteDiario} consultas
            </span>
          )}
        </div>
        {(() => {
          const vBanco = (atendimento && (atendimento.veiculo || [])[0]) || null;
          const titulo = f.modelo || (vBanco && vBanco.marca_modelo) ||
            (atendimento && atendimento.carro_descricao) || "Novo atendimento";
          const placa = f.placa || (vBanco && vBanco.placa) || "";
          const ano = f.ano || (vBanco ? [vBanco.ano_fabricacao, vBanco.ano_modelo].filter(Boolean).join("/") : "");
          const fipe = f.fipe || (vBanco && vBanco.fipe_valor) || "";
          return (
            <>
              <h1 className="mt-1 text-[17px] leading-tight" style={{ fontFamily: F.disp, fontWeight: 800 }}>
                {titulo}
              </h1>
              {!!placa && (
                <div className="mt-1 text-[11px]" style={{ fontFamily: F.mono, opacity: 0.85 }}>
                  {placa}{ano ? ` · ${ano}` : ""}{fipe ? ` · FIPE ${brl(fipe)}` : ""}
                </div>
              )}
            </>

        })()}
        <div className="mt-2 flex items-center gap-3">
          {aoVoltar && (
            <button onClick={aoVoltar} className="text-[11px] font-semibold" style={{ color: "#fff" }}>‹ Atendimentos</button>
          )}
          {atendimento && atendimento.cliente_nome && (
            <span className="text-[10px]" style={{ opacity: 0.75 }}>{atendimento.cliente_nome}</span>
          )}
          <button onClick={sair} className="ml-auto text-[10px] underline" style={{ color: "#fff", opacity: 0.7 }}>Sair</button>
        </div>

      {atendimento && (

          aoMudar={(novo) => mudarStatus(novo, true)} />

      {/* trilho */}
      <div className="rolar flex gap-1.5 overflow-x-auto px-3 py-3" style={{ background: C.paper, borderBottom: `1px solid ${C.line}` }}>
        {ETAPAS.map((e) => {
          const ok = etapaConcluida(e.id, f, enviadas);
          const ativa = e.id === etapa;
          return (
            /* Onda 1: 36 px de círculo com rótulo de 9 px ficava abaixo
               do alvo de toque confortável, e o nome da etapa não se
               lia em pé. Passa a 44 px com rótulo de 11 px. */
            <button key={e.id} onClick={() => setEtapa(e.id)} className="flex shrink-0 flex-col items-center gap-1.5" style={{ width: 66 }}>
