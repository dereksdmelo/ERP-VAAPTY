/* ===================== sessão ===================== */

/**
 * A sessão vive aqui, fora do React, porque as funções de API são de
 * módulo e precisam do token sem receber props. Um navegador, um
 * usuário — não há risco de troca como haveria no servidor.
 */
const AUTH = { cfg: null, sessao: null, aoSair: null };

async function carregarConfig() {
  if (AUTH.cfg) return AUTH.cfg;
  const r = await fetch("/api/config");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Configuração do servidor indisponível.");
  AUTH.cfg = d;
  return d;
}

const guardarSessao = (s) => {
  AUTH.sessao = s;
  if (s) window.storage.set("vaapty:sessao", JSON.stringify(s)).catch(() => {});
  else window.storage.delete("vaapty:sessao").catch(() => {});
};

async function restaurarSessao() {
  try {
    const r = await window.storage.get("vaapty:sessao");
    if (r && r.value) AUTH.sessao = JSON.parse(r.value);
  } catch (e) {}
  return AUTH.sessao;
}

async function entrar(email, senha) {
  const cfg = await carregarConfig();
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ email: String(email).trim(), password: senha }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // A mensagem do Supabase vem em inglês e não diz nada ao negociador.
    const m = String(d.error_description || d.msg || d.error || "");
    throw new Error(/invalid/i.test(m) ? "E-mail ou senha não conferem." : m || "Não consegui entrar.");
  }
  guardarSessao(d);
  return d;
}

async function renovarSessao() {
  const cfg = await carregarConfig();
  const atual = AUTH.sessao;
  if (!atual || !atual.refresh_token) throw new Error("Sessão expirada.");
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: atual.refresh_token }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { guardarSessao(null); throw new Error("Sessão expirada. Entre de novo."); }
  guardarSessao(d);
  return d;
}

function sair() {
  guardarSessao(null);
  if (AUTH.aoSair) AUTH.aoSair();
}

/**
 * Toda chamada às funções em api/ passa por aqui. O token do Supabase
 * dura uma hora; em vez de vigiar o relógio, deixo o 401 acontecer e
 * renovo uma vez. Se falhar de novo, é sessão morta mesmo.
 */
async function fetchAut(url, opcoes) {
  if (!AUTH.sessao) throw new Error("Entre para continuar.");
  const monta = () => {
    const o = { ...(opcoes || {}) };
    o.headers = { ...(o.headers || {}), Authorization: `Bearer ${AUTH.sessao.access_token}` };
    return o;
  };
  let r = await fetch(url, monta());
  if (r.status === 401) {
    try { await renovarSessao(); } catch (e) { sair(); throw e; }
    r = await fetch(url, monta());
    if (r.status === 401) { sair(); throw new Error("Sessão expirada. Entre de novo."); }
  }
  return r;
}

async function consultarPerfil() {

  if (!r.ok) throw new Error(d.erro || "Não consegui ler seu perfil.");
  return d;
}

const RX_AUT = /\b(AUT|AUTOM|CVT|DCT|AT)\b\.?/i;
const RX_MEC = /\b(MEC|MANUAL|MT)\b\.?/i;
function filtrarPorCambio(vs, cambio) {
  if (!cambio) return vs;
  const quer = cambio !== "Manual";
  const f = vs.filter((v) => (quer ? RX_AUT.test(v.nome) : RX_MEC.test(v.nome) || !RX_AUT.test(v.nome)));
  return f.length ? f : vs;
}
function alertaDispersao(vs) {
  if (vs.length < 2) return null;
  const a = vs.map((v) => v.valor);
  const d = Math.max(...a) - Math.min(...a);
  return d < 2000 ? null : `As versões variam ${brl(d)} entre si. Confirme no documento.`;
}

/**
 * O nome que a FIPE devolve é comprido demais para busca de anúncio
 * ("CHEVROLET ONIX HATCH LTZ 1.4 8V FlexPower 5p Mec." não acha nada).
 * Tira a parte que descreve motor e câmbio e fica com marca, modelo,
 * versão e ano — que é como o anúncio costuma ser escrito.
 */
const RX_RUIDO = /^(\d+[.,]\d+|\d+v|\d+p|mec|aut|autom|automatico|flex|flexpower|power|cvt)\.?$/i;
function termoMercadoPadrao(f) {
  const toks = String(f.modelo || "").split(/\s+/).filter((t) => t && !RX_RUIDO.test(t));
  const ano = String(f.ano || "").split("/")[0];
  return [...toks.slice(0, 4), ano].filter(Boolean).join(" ").trim();
}

function comprimir(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onerror = () => rej(new Error("Não consegui ler a imagem."));
    l.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Arquivo inválido."));
      img.onload = () => {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res({ src: cv.toDataURL("image/jpeg", q), largura: cv.width, altura: cv.height });
      };
      img.src = l.result;
    };
    l.readAsDataURL(file);
  });
}

const OBRIGATORIOS = [
  ["modelo", "Modelo"], ["ano", "Ano / modelo"], ["cambio", "Câmbio"],
  ["km", "KM atual"], ["placa", "Placa"], ["fipe", "Valor FIPE"],
  ["por", "Valor POR"], ["pneus", "Condição dos 4 pneus"],
  ["opcionais", "Opcionais"], ["gastos", "Gastos / peças"],
];
function faltando(f, fotos) {
  const l = OBRIGATORIOS.filter(([k]) => {
    const v = f[k];
    if (k === "pneus") return v.some((p) => !p);
    if (k === "opcionais") return v.length === 0;
    return v === "" || v == null;
  });
  if (!fotos.length) l.push(["fotos", "Ao menos 1 foto"]);
  return l;
}

const ETAPAS = [
  { id: "A", letra: "A", nome: "Abordagem positiva", curto: "Abordagem" },
  { id: "P", letra: "P", nome: "Pesquise o cliente e o carro", curto: "Pesquisa" },
  { id: "O", letra: "O", nome: "Ofereça uma demonstração envolvente", curto: "Demonstração" },
  { id: "PUB", letra: "▸", nome: "Ficha, descritivo e lançamento", curto: "Lançamento" },
  { id: "ESP", letra: "⏱", nome: "Espera das propostas", curto: "Espera" },
  { id: "N", letra: "N", nome: "Negocie e neutralize objeções", curto: "Negociação" },
  { id: "T", letra: "T", nome: "Tome a iniciativa e feche", curto: "Fechamento" },
  { id: "E", letra: "E", nome: "Estenda o relacionamento", curto: "Relacionamento" },
];

function etapaConcluida(id, f, fotos) {
  switch (id) {
    case "A": return !!f.chegada && f.carroSubiu && f.tempoCombinado;
    case "P": return !!f.motivo && !!f.pretensao && f.decisorPresente;
    case "O": return f.mostrouProcesso && f.mostrouTestemunhal;
    case "PUB": return faltando(f, fotos).length === 0 && f.publicado;
    case "ESP": return !!f.esperaIniciadaEm;
    case "N": return f.rodadas.length > 0;
    case "T": return f.aceiteFinal && !!f.valorFechado;
    case "E": return f.avaliacaoGoogle || f.indicacoes.length > 0;
    default: return false;
  }
}

const mascararPlaca = (p) => (!p || p.length < 2 ? "—" : `${p[0]}-${p[p.length - 1]}`);
function resumoPneus(a) {
  const c = {};
  a.forEach((p) => p && (c[p] = (c[p] || 0) + 1));
  return Object.entries(c).map(([k, v]) => `${v} ${k.toUpperCase()}`).join(" / ") || "—";
}
function gerarDescritivo(f, n) {
  const L = ["🏦 VAAPTY / JOINVILLE 🏦", "", `🚗 Modelo: ${f.modelo}`, ""];
  L.push(`🔢 Ano ou Mod: ${f.ano}`);
  L.push(`⚙️ Câmbio: ${(f.cambio || "").toUpperCase()}.`);

  if (f.leilao) L.push("", "⚠️ LEILÃO / SINISTRO");

 * Colado de documentos.js. O ORIGINAL É ESTE BLOCO — o documentos.js
 * na raiz é cópia morta, ninguém o carrega. Editar lá não muda nada
 * na tela.
 *
 * Única alteração em relação ao arquivo: os "export" saíram e o brl()
 * daqui virou brlDoc(), porque brl já existe acima com outra regra
 * (aquele corta os centavos, este imprime linha para preencher).
 *
 * ATENÇÃO — o texto jurídico aqui é RASCUNHO, escrito só para o
 * mecanismo funcionar. Todo documento sai com uma tarja de rascunho
 * bem visível e não deve ser levado para a mesa de um cliente.
 *
 * Quando os modelos reais da Vaapty chegarem, troca-se o conteúdo das
 * funções corpo*(). O encanamento — dados da ficha, formatação,
 * impressão, registro — permanece igual.
 *
 * Cada documento é montado como HTML e aberto numa janela de impressão.
 * Sem biblioteca, sem servidor: o navegador já sabe virar PDF.
 * =================================================== */

/* ---------------- utilitários ---------------- */

const brlDoc = (n) =>
  n == null || n === "" || isNaN(n)
    ? "____________"
    : Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const dataExtenso = (d = new Date()) =>
  d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

const hora = (d = new Date()) =>
  d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

/** Campo que o modelo real vai preencher e que hoje não existe na ficha. */
const vazio = (rotulo) =>
  `<span class="falta" title="${rotulo}">________________</span>`;

const ou = (valor, rotulo) => (valor ? String(valor) : vazio(rotulo));

const protocolo = (f, sufixo) =>
  `${(f.placa || "SEMPLACA").replace(/[^A-Z0-9]/gi, "")}-${sufixo}-${Date.now().toString(36).toUpperCase()}`;

/* ---------------- abertura ---------------- */

/**
 * Abre o documento numa janela nova, pronto para imprimir ou salvar em PDF.
 * Devolve o protocolo, para registro de que foi gerado.
 */
function abrirDocumento(html) {
  const j = window.open("", "_blank");
  if (!j) return { ok: false, erro: "O navegador bloqueou a janela. Libere pop-ups para este site." };
  j.document.write(html);
  j.document.close();
  setTimeout(() => j.print(), 400);
  return { ok: true };
}

// O protocolo vive dentro do HTML gerado, no rodapé. Tirá-lo de lá
// evita mexer nas funções de documento só para devolver mais um valor.
const extrairProtocolo = (html) => {
  const m = /Protocolo ([A-Z0-9-]+)/.exec(String(html || ""));
  return m ? m[1] : null;
};

/* ===================== app ===================== */
function VaaptyAponte({ perfil }) {
  const [f, setF] = useState(VAZIO);
  const [fotos, setFotos] = useState([]);
  const [etapa, setEtapa] = useState("A");
  const [copiado, setCopiado] = useState("");
  const [agora, setAgora] = useState(Date.now());

  const [placaBusca, setPlacaBusca] = useState("");
  const [buscando, setBuscando] = useState(false);
  const [erroBusca, setErroBusca] = useState("");
  const [achado, setAchado] = useState(null);
  const [cambioBusca, setCambioBusca] = useState("");
  const [cota, setCota] = useState(null);

  const [termoMercado, setTermoMercado] = useState("");
  const [novaRodada, setNovaRodada] = useState({ impresso: "", contra: "" });
  const [novaInd, setNovaInd] = useState({ nome: "", fone: "" });
  const [erroFoto, setErroFoto] = useState("");
  const [veiculoId, setVeiculoId] = useState(null);
  const [pronto, setPronto] = useState(false);
  const fotosRef = useRef([]);
  const fRef = useRef(VAZIO);
  const [erroDoc, setErroDoc] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [salvo, setSalvo] = useState(null);
  const [erroSalvar, setErroSalvar] = useState("");
  const camRef = useRef(null); const galRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("vaapty:at");
        if (r && r.value) { const n = { ...VAZIO, ...JSON.parse(r.value) }; fRef.current = n; setF(n); }
      } catch (e) {}

      let vid = null;
      try {
        const r = await window.storage.get("vaapty:veiculo");
        if (r && r.value) { vid = JSON.parse(r.value).id || null; setVeiculoId(vid); }
      } catch (e) {}

      // No aparelho só sobra o que ainda não subiu.
      let pendentes = [];
      try { const r = await window.storage.get("vaapty:fotos"); if (r && r.value) pendentes = JSON.parse(r.value); } catch (e) {}
      pendentes = (Array.isArray(pendentes) ? pendentes : [])
        .filter((p) => p && p.local)
        .map((p, i) => ({
          chave: p.chave || `p${i}-${Math.random().toString(36).slice(2, 7)}`,
          local: p.local, largura: p.largura, altura: p.altura, id: null, url: null,
          estado: "erro", erro: p.erro || "Ficou pendente do atendimento anterior.",
        }));

      let doServidor = [];
      if (vid) {
        try {
          doServidor = (await listarFotos(vid)).map((x) => ({
            chave: `s-${x.id}`, id: x.id, caminho: x.caminho, url: x.url,
            local: null, estado: "ok", erro: "",
          }));
        } catch (e) { setErroFoto(e.message); }
      }

      aplicar(() => [...doServidor, ...pendentes]);
      setPronto(true);
      setCota(await consultarCota());
    })();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // O celular não guarda foto que já está no servidor. Quando a última
  // sobe, a chave sai do localStorage inteira.
  useEffect(() => {
    if (!pronto) return;
    const pend = fotos
      .filter((p) => p.estado !== "ok" && p.local)
      .map((p) => ({ chave: p.chave, local: p.local, largura: p.largura, altura: p.altura, erro: p.erro || "" }));
    if (!pend.length) window.storage.delete("vaapty:fotos").catch(() => {});
    else window.storage.set("vaapty:fotos", JSON.stringify(pend))
      .catch(() => setErroFoto("Não coube no armazenamento local."));
  }, [fotos, pronto]);

  const guardarFicha = (n) => {
    fRef.current = n;
    setF(n); window.storage.set("vaapty:at", JSON.stringify(n)).catch(() => {});
  };
  const set = (k, v) => guardarFicha({ ...fRef.current, [k]: v });
  const setVarios = (o) => guardarFicha({ ...fRef.current, ...o });
  // fotosRef é a versão autoritativa: o upload é assíncrono e não pode
  // ler estado velho de dentro de uma closure.
  const aplicar = (fn) => { const n = fn(fotosRef.current); fotosRef.current = n; setFotos(n); };
  const mudarFoto = (chave, mud) =>
    aplicar((prev) => prev.map((p) => (p.chave === chave ? { ...p, ...mud } : p)));

  const buscar = async () => {
    setErroBusca(""); setAchado(null); setBuscando(true); setCambioBusca(f.cambio || "");
    try { setAchado(await consultarPlaca(placaBusca)); setCota(await consultarCota()); }
    catch (e) { setErroBusca(e.message); }
    setBuscando(false);
  };
  const escolherVersao = (v) => {
    setVarios({
      placa: achado.placa, modelo: `${achado.marca} ${v.nome}`,
      ano: `${achado.anoFabricacao || ""}/${v.anoModelo || achado.anoModelo || ""}`,
      fipe: String(Math.round(v.valor)), fipeCodigo: v.codigoFipe,
      chassi: achado.chassiCompleto ? achado.chassi : "",
      cor: achado.cor || "", combustivel: v.combustivel || achado.combustivel || "",
      cambio: cambioBusca || f.cambio,
    });
    setAchado(null); setPlacaBusca("");
  };

  const enviarFoto = async (chave, vid) => {
    const alvo = fotosRef.current.find((p) => p.chave === chave);
    if (!alvo || alvo.estado === "ok" || alvo.estado === "enviando" || !alvo.local) return;
    mudarFoto(chave, { estado: "enviando", erro: "" });
    try {
      const ordem = Math.max(0, fotosRef.current.findIndex((p) => p.chave === chave));
      const d = await subirFoto(vid, alvo, ordem);
      mudarFoto(chave, { estado: "ok", id: d.id, caminho: d.caminho, url: d.url, local: null, erro: "" });
    } catch (e) {
      // A imagem continua no aparelho: "tentar de novo" reaproveita.
      mudarFoto(chave, { estado: "erro", erro: e.message });
    }
  };

  const receberFotos = async (ev) => {
    setErroFoto("");
    const arqs = Array.from(ev.target.files || []);
    if (!arqs.length) return;
    const espaco = MAX_FOTOS - fotosRef.current.length;
    if (espaco <= 0) { setErroFoto(`Limite de ${MAX_FOTOS} fotos.`); return; }
    const novas = [];
    for (const a of arqs.slice(0, espaco)) {
      try {
        const img = await comprimir(a);
        novas.push({
          chave: `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          local: img.src, largura: img.largura, altura: img.altura,
          id: null, url: null, estado: "aguardando", erro: "",
        });
      } catch (e) { setErroFoto(e.message); }
    }
    if (novas.length) {
      aplicar((prev) => [...prev, ...novas]);
      if (veiculoId) for (const n of novas) await enviarFoto(n.chave, veiculoId);
    }
    ev.target.value = "";
  };

  const salvarOrdem = async (lista) => {
    const ordens = lista.map((p, i) => ({ id: p.id, ordem: i })).filter((o) => o.id);
    if (!ordens.length) return;
    try { await gravarOrdemFotos(ordens); } catch (e) { setErroFoto(e.message); }
  };
  const definirCapa = async (i) => {
    const n = [...fotosRef.current];
    const [x] = n.splice(i, 1); n.unshift(x);
    aplicar(() => n);
    await salvarOrdem(n);
  };
  const removerFoto = async (i) => {
    const alvo = fotosRef.current[i];
    if (!alvo) return;
    if (alvo.id) {
      try { await apagarFotoServidor(alvo.id); }
      catch (e) { setErroFoto(e.message); return; }
    }
    const n = fotosRef.current.filter((_, x) => x !== i);
    aplicar(() => n);
    await salvarOrdem(n);
  };

  /**
   * Gera, abre para impressão e registra. A abertura da janela precisa
   * acontecer no mesmo passo do clique — pop-up aberto depois de um
   * await é bloqueado pelo navegador.
   */
  const gerarDocumento = async (tipo, rotulo, html, rodada) => {
    setErroDoc("");
    const r = abrirDocumento(html);
    if (!r.ok) { setErroDoc(r.erro); return; }

    const reg = {
      tipo, rotulo,
      rodada: rodada == null ? null : rodada,
      protocolo: extrairProtocolo(html),
      em: new Date().toISOString(),
      noBanco: false,
    };

    if (veiculoId) {
      try {
        await registrarDocumento({
          veiculo_id: veiculoId, tipo, rodada: reg.rodada,
          protocolo: reg.protocolo, conteudo: html, negociador: fRef.current.negociador,
        });
        reg.noBanco = true;
      } catch (e) { setErroDoc(e.message); }
    }

    guardarFicha({ ...fRef.current, documentos: [...(fRef.current.documentos || []), reg] });
  };

  const copiar = (t, tag) => {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    setCopiado(tag); setTimeout(() => setCopiado(""), 1800);
  };

  const corpoBanco = useMemo(() => JSON.stringify(fichaParaBanco(f)), [f]);
  const salvoAtual = !!salvo && salvo.corpo === corpoBanco;

  const salvarNoBanco = async () => {
    setErroSalvar(""); setSalvando(true);
    try {
      const d = await salvarFicha(JSON.parse(corpoBanco));
      const t = new Date(d.salvo_em);
      setSalvo({ hora: isNaN(t.getTime()) ? new Date() : t, criado: !!d.criado, corpo: corpoBanco });
      if (d.id) {
        setVeiculoId(d.id);
        window.storage.set("vaapty:veiculo", JSON.stringify({ id: d.id, placa: d.placa })).catch(() => {});
        // Foto tirada antes de existir veículo estava só esperando por isto.
        for (const p of fotosRef.current.filter((x) => x.estado !== "ok" && x.local)) {
          await enviarFoto(p.chave, d.id);
        }

        // Documento gerado antes de existir veículo: registra agora. O
        // HTML já se perdeu (não fica no aparelho), então a linha vai
        // sem conteúdo — dá para saber que existiu, não o que dizia.
        const feitos = [];
        for (const doc of (fRef.current.documentos || []).filter((x) => !x.noBanco)) {
          try {
            await registrarDocumento({
              veiculo_id: d.id, tipo: doc.tipo, rodada: doc.rodada,
              protocolo: doc.protocolo, conteudo: null, negociador: fRef.current.negociador,
            });
            feitos.push(doc.em);
          } catch (e) { setErroDoc(e.message); }
        }
        if (feitos.length) {
          guardarFicha({
            ...fRef.current,
            documentos: (fRef.current.documentos || []).map((x) =>
              feitos.indexOf(x.em) >= 0 ? { ...x, noBanco: true } : x),
          });
        }
      }
    } catch (e) { setErroSalvar(e.message); }
    setSalvando(false);
  };

  const enviadas = useMemo(() => fotos.filter((p) => p.estado === "ok"), [fotos]);

              </div>
            </Bloco>

            <section className="rounded-lg" style={{ background: C.paper, border: `1px solid ${C.line}`, opacity: liberado ? 1 : 0.45 }}>
              <div className="flex items-center justify-between border-b px-4 py-3" style={{ borderColor: C.line }}>
                <span className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Descritivo</span>
                <button disabled={!liberado} onClick={() => copiar(descritivo, "d")} className="rounded-md px-3 py-1.5 text-[12px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                  {copiado === "d" ? "Copiado" : "Copiar"}
                </button>
              </div>
              <pre className="overflow-x-auto whitespace-pre-wrap px-4 py-3 text-[12px] leading-relaxed" style={{ fontFamily: F.body }}>{descritivo}</pre>
              <div className="border-t px-4 py-3" style={{ borderColor: C.line }}>
                <button disabled={!liberado} onClick={() => copiar(JSON.stringify(payloadShinkai(f, enviadas.length), null, 2), "s")}
                  className="w-full rounded-md border py-2 text-[12px] font-semibold" style={{ borderColor: C.line, color: C.roxo }}>
                  {copiado === "s" ? "JSON copiado" : "Copiar JSON do Shinkai"}
                </button>
              </div>
            </section>

            <section className="rounded-lg p-4" style={{ background: C.paper, border: `1px solid ${C.line}`, opacity: podeSalvar ? 1 : 0.45 }}>
              <div className="text-[11px] uppercase tracking-[0.16em]" style={{ color: C.roxo, fontFamily: F.disp, fontWeight: 700 }}>Banco</div>
              <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
                Grava a ficha no Supabase. Salvar de novo na mesma placa atualiza a ficha em avaliação em vez de criar outra.
                As fotos só sobem depois que a ficha existe no banco.
              </p>
              <button disabled={!podeSalvar || salvando} onClick={salvarNoBanco}
                className="mt-3 w-full rounded-md py-2.5 text-[13px] font-semibold"
                style={{ background: podeSalvar && !salvando ? C.roxo : C.line, color: "#fff" }}>
                {salvando ? "Salvando…" : veiculoId ? "Salvar de novo" : "Salvar no banco"}
              </button>
              {!podeSalvar && (
                <p className="mt-2 text-[11px]" style={{ color: C.mute }}>
                  Falta {faltasFicha.map((x) => x[1]).join(" · ")}.
                </p>
              )}
              {salvo && salvoAtual && (
                <p className="mt-2 text-[12px]" style={{ color: C.verde }}>
                  {salvo.criado ? "Ficha criada" : "Ficha atualizada"} às {salvo.hora.toTimeString().slice(0, 5)}.
                </p>
              )}
              {salvo && !salvoAtual && (
                <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
                  Salva às {salvo.hora.toTimeString().slice(0, 5)} e alterada depois. Salve de novo.
                </p>
              )}
              {erroSalvar && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erroSalvar}</p>}
            </section>

            <Toggle label="Lancei o carro na plataforma" nota="Marque depois de publicar no grupo e no Shinkai." valor={f.publicado} onChange={(v) => { set("publicado", v); if (v && !f.esperaIniciadaEm) setVarios({ publicado: v, esperaIniciadaEm: Date.now() }); }} />
          </>
        )}

        {/* ---------- ESPERA ---------- */}
        {etapa === "ESP" && (
          <>
            <Bloco titulo="Enquanto as propostas chegam" sub="O carro está lançado. Este é o tempo de conversa que decide o fechamento.">
              {restante == null ? (
                <button onClick={() => set("esperaIniciadaEm", Date.now())} className="w-full rounded-md py-3 text-[14px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                  Iniciar os 15 minutos
                </button>
              ) : (
                <div className="text-center">
                  <div className="text-[46px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: restante === 0 ? C.verde : C.roxo }}>
                    {mmss(restante)}
                  </div>
                  <p className="mt-2 text-[12px]" style={{ color: restante === 0 ? C.verde : C.mute }}>
                    {restante === 0 ? "Tempo encerrado — siga para a negociação." : "Fique com o cliente. Não deixe ele sozinho na mesa."}
                  </p>
                  <button onClick={() => set("esperaIniciadaEm", null)} className="mt-3 text-[12px] underline" style={{ color: C.mute }}>Reiniciar</button>
                </div>
              )}
            </Bloco>

            <Bloco titulo="Anote o que ouvir" sub="O que ele falar aqui é o argumento que você usa na hora do extrato.">
              <textarea rows={5} className={inputCls} style={inputSty} value={f.notasEspera} onChange={(e) => set("notasEspera", e.target.value)}
                placeholder="Precisa do dinheiro até sexta. Mulher não sabe da dívida. Já tentou vender há 2 meses…" />
              <div className="mt-3">
                <Pendente>
                  A escuta por microfone com IA que você pediu entra aqui. Antes de construir, precisa passar pelo jurídico: gravar e processar conversa é tratamento de dado pessoal e exige aviso ao cliente e base legal definida.
                </Pendente>
              </div>
            </Bloco>
          </>
        )}

        {/* ---------- N ---------- */}
        {etapa === "N" && (
          <>
            {gap != null && (
              <div className="rounded-lg p-3" style={{ background: C.roxoFraco, border: `1px solid ${C.line}` }}>
                <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Gap de abertura</div>
                <div className="mt-0.5 text-[22px] leading-none" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>{gap}%</div>
                <div className="mt-1 text-[11px]" style={{ color: C.mute }}>
                  Primeiro extrato {brl(f.rodadas[0].impresso)} contra pretensão de {brl(f.pretensao)}.
                </div>
              </div>
            )}

            <Bloco titulo="Extratos e contrapropostas" sub="Cada rodada vira número comparável — é assim que se acha o valor de abertura certo por faixa de FIPE.">
              <div className="space-y-2.5">
                {f.rodadas.map((r, i) => (
                  <div key={i} className="rounded-md p-3" style={{ background: "#FBFAFC", border: `1px dashed ${C.line}` }}>
                    <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>
                      {i + 1}º extrato{i > 0 ? " · menos compradores" : ""}
                    </div>
                    <div className="mt-1 flex items-baseline justify-between">
                      <span className="text-[17px]" style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(r.impresso)}</span>
                      <span className="text-[11px]" style={{ color: C.mute }}>impresso</span>
                    </div>
                    {r.contra && (
                      <div className="mt-1 flex items-baseline justify-between">
                        <span className="text-[17px]" style={{ fontFamily: F.mono, fontWeight: 700, color: C.laranja }}>{brl(r.contra)}</span>
                        <span className="text-[11px]" style={{ color: C.mute }}>contra do cliente</span>
                      </div>
                    )}
                    <button onClick={() => gerarDocumento("termo_aceite", `Termo de aceite ${i + 1}`, termoAceite(f, r, i + 1), i + 1)}
                      className="mt-2 w-full rounded-md border py-1.5 text-[11px] font-semibold"
                      style={{ borderColor: C.roxo, color: C.roxo }}>
                      Termo de aceite
                    </button>
                    {docsDe("termo_aceite", i + 1).map((d, k) => (
                      <div key={k} className="mt-1 text-[10px]" style={{ color: C.verde }}>
                        Gerado às {hhmm(d.em)}{d.protocolo ? ` · ${d.protocolo}` : ""}{d.noBanco ? "" : " · fora do banco"}
                      </div>
                    ))}
                  </div>
                ))}
                {erroDoc && <p className="text-[12px]" style={{ color: C.laranja }}>{erroDoc}</p>}
                <div className="grid grid-cols-2 gap-2">
                  <input placeholder="Impresso" className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={novaRodada.impresso} onChange={(e) => setNovaRodada({ ...novaRodada, impresso: e.target.value })} />
                  <input placeholder="Contra" className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={novaRodada.contra} onChange={(e) => setNovaRodada({ ...novaRodada, contra: e.target.value })} />
                </div>
                <button onClick={() => { if (!novaRodada.impresso) return; set("rodadas", [...f.rodadas, novaRodada]); setNovaRodada({ impresso: "", contra: "" }); }}
                  className="w-full rounded-md py-2.5 text-[13px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>Registrar extrato</button>
                <Campo label="Objeção principal">
                  <select className={inputCls} style={inputSty} value={f.objecao} onChange={(e) => set("objecao", e.target.value)}>
                    {OBJECOES.map((o) => <option key={o}>{o}</option>)}
                  </select>
                </Campo>
                <Pendente>
                  Os argumentos sugeridos por IA para cada objeção entram aqui. Precisam da matéria-prima: quais objeções aparecem e o que funciona contra cada uma, coletado com os negociadores.
                </Pendente>
              </div>
            </Bloco>
          </>
        )}

        {/* ---------- T ---------- */}
        {etapa === "T" && (
          <>
            <Bloco titulo="Aceite e cautelar">
              <div className="space-y-2.5">
                <div className="grid grid-cols-2 gap-2.5">
                  <Campo label="Valor fechado"><input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" value={f.valorFechado} onChange={(e) => set("valorFechado", e.target.value)} /></Campo>
                  <Campo label="Forma">
                    <select className={inputCls} style={inputSty} value={f.formaFechamento} onChange={(e) => set("formaFechamento", e.target.value)}>
                      {FECHAMENTO.map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </Campo>
                </div>
                <Toggle label="Aceite final assinado" valor={f.aceiteFinal} onChange={(v) => set("aceiteFinal", v)} />
                <Toggle label="Carro enviado para a cautelar" valor={f.cautelarEnviado} onChange={(v) => set("cautelarEnviado", v)} />
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => gerarDocumento("autorizacao_cautelar", "Autorização de cautelar", autorizacaoCautelar(f), null)}
                    className="rounded-md border py-2 text-[12px] font-semibold"
                    style={{ borderColor: C.roxo, color: C.roxo }}>
                    Autorização de cautelar
                  </button>
                  <button disabled={!f.valorFechado} onClick={() => gerarDocumento("pre_contrato", "Pré-contrato", preContrato(f), null)}
                    className="rounded-md border py-2 text-[12px] font-semibold"
                    style={{ borderColor: f.valorFechado ? C.roxo : C.line, color: f.valorFechado ? C.roxo : C.mute }}>
                    Pré-contrato
                  </button>
                </div>
                {!f.valorFechado && (
                  <p className="text-[11px]" style={{ color: C.mute }}>
                    O pré-contrato precisa do valor fechado — é a cláusula que dá objeto ao documento.
                  </p>
                )}
                {erroDoc && <p className="text-[12px]" style={{ color: C.laranja }}>{erroDoc}</p>}
                {!!docs.length && (
                  <div className="rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                    <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Documentos gerados</div>
                    <div className="mt-1.5 space-y-1">
                      {docs.map((d, k) => (
                        <div key={k} className="flex items-baseline justify-between gap-2">
                          <span className="text-[12px]">{d.rotulo}</span>
                          <span className="text-[10px]" style={{ color: d.noBanco ? C.mute : C.laranja, fontFamily: F.mono }}>
                            {hhmm(d.em)}{d.noBanco ? "" : " · fora do banco"}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <Pendente>
                  O texto jurídico destes três documentos é rascunho meu, e sai com tarja de rascunho na folha — serve para testar o mecanismo, não para assinar com cliente. Me mandem os modelos que vocês usam hoje (Word ou foto do papel) que eu troco só o texto; o resto já funciona.
                </Pendente>
              </div>
            </Bloco>

            <Bloco titulo="Depois da cautelar">
              <div className="space-y-2.5">
                <Toggle label="Contrato assinado" valor={f.contratoAssinado} onChange={(v) => set("contratoAssinado", v)} />
                <Pendente>
                  Assinatura pelo ZapSign entra neste ponto, junto com o anexo dos documentos da negociação. Depende do backend: contrato assinado precisa ficar guardado e recuperável.
                </Pendente>
              </div>
            </Bloco>
          </>
        )}

        {/* ---------- E ---------- */}
        {etapa === "E" && (
          <>
            <Bloco titulo="Avaliação">
              <Toggle label="Pedi a avaliação no Google" nota="Entra no score do negociador." valor={f.avaliacaoGoogle} onChange={(v) => set("avaliacaoGoogle", v)} />
            </Bloco>

            <Bloco titulo={`Indicações — ${f.indicacoes.length} de 10`} sub="Quem ele conhece que tem carro. A lista vai para a pré-venda com a promessa do brinde.">
              <div className="space-y-2">
                {f.indicacoes.map((p, i) => (
                  <div key={i} className="flex items-center justify-between rounded-md px-3 py-2" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
                    <span className="text-[13px]">{p.nome}<span className="ml-2 text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>{p.fone}</span></span>
                    <button onClick={() => set("indicacoes", f.indicacoes.filter((_, x) => x !== i))} className="text-[11px]" style={{ color: C.laranja }}>remover</button>
                  </div>
                ))}
                {f.indicacoes.length < 10 && (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <input placeholder="Nome" className={inputCls} style={inputSty} value={novaInd.nome} onChange={(e) => setNovaInd({ ...novaInd, nome: e.target.value })} />
                      <input placeholder="Telefone" className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="tel" value={novaInd.fone} onChange={(e) => setNovaInd({ ...novaInd, fone: e.target.value })} />
                    </div>
                    <button onClick={() => { if (!novaInd.nome.trim()) return; set("indicacoes", [...f.indicacoes, novaInd]); setNovaInd({ nome: "", fone: "" }); }}
                      className="w-full rounded-md py-2.5 text-[13px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>Adicionar indicação</button>
                  </>
                )}
                <Pendente>
                  O envio automático para a fila da pré-venda depende do backend. Por enquanto a lista fica aqui e precisa ser repassada à mão.
                </Pendente>
              </div>
            </Bloco>
          </>
        )}
      </div>

      {/* navegação */}
      <div className="fixed bottom-0 left-0 right-0 flex gap-2 px-4 py-3" style={{ background: C.paper, borderTop: `1px solid ${C.line}` }}>
        <button onClick={() => idx > 0 && setEtapa(ETAPAS[idx - 1].id)} disabled={idx === 0}
          className="rounded-md border px-4 py-2.5 text-[13px] font-semibold" style={{ borderColor: C.line, color: idx === 0 ? C.line : C.mute }}>
          Voltar
        </button>
        <button onClick={() => idx < ETAPAS.length - 1 && setEtapa(ETAPAS[idx + 1].id)} disabled={idx === ETAPAS.length - 1}
          className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
          style={{ background: idx === ETAPAS.length - 1 ? C.line : C.roxo, color: "#fff" }}>
          {idx === ETAPAS.length - 1 ? "Fim do atendimento" : `Ir para ${ETAPAS[idx + 1].curto}`}
        </button>
      </div>
    </div>
  );
}


/* ===================== entrada ===================== */

function Login({ aoEntrar }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");

  const enviar = async (ev) => {
    if (ev) ev.preventDefault();
    if (!email.trim() || !senha) return;
    setErro(""); setIndo(true);
    try { await entrar(email, senha); await aoEntrar(); }
    catch (e) { setErro(e.message); setIndo(false); }
  };

  return (
    <div className="flex min-h-screen flex-col justify-center px-6" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
      <div className="mx-auto w-full" style={{ maxWidth: 380 }}>
        <div className="text-[11px] uppercase tracking-[0.22em]" style={{ color: C.mute }}>Vaapty Joinville</div>
        <h1 className="mt-1 text-[24px] leading-tight" style={{ fontFamily: F.disp, fontWeight: 800, color: C.roxo }}>
          Ficha e negociação
        </h1>

        <form onSubmit={enviar} className="mt-6 space-y-3">
          <Campo label="E-mail">
            <input type="email" autoComplete="username" inputMode="email" className={inputCls} style={inputSty}
              value={email} onChange={(e) => setEmail(e.target.value)} />
          </Campo>
          <Campo label="Senha">
            <input type="password" autoComplete="current-password" className={inputCls} style={inputSty}
              value={senha} onChange={(e) => setSenha(e.target.value)} />
          </Campo>
          <button type="submit" disabled={indo || !email.trim() || !senha}
            className="w-full rounded-md py-3 text-[14px] font-semibold"
            style={{ background: indo || !email.trim() || !senha ? C.line : C.roxo, color: "#fff" }}>
            {indo ? "Entrando…" : "Entrar"}
          </button>
          {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
        </form>

        <p className="mt-6 text-[11px] leading-relaxed" style={{ color: C.mute }}>
          Conta nova precisa ser liberada pelo gerente antes de funcionar. Se você acabou de ser cadastrado e não entra, é isso.
        </p>
      </div>
    </div>
  );
}

const Aviso = ({ titulo, children, acao }) => (
  <div className="flex min-h-screen flex-col justify-center px-6" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
    <div className="mx-auto w-full" style={{ maxWidth: 380 }}>
      <h1 className="text-[18px] leading-tight" style={{ fontFamily: F.disp, fontWeight: 800 }}>{titulo}</h1>
      <p className="mt-2 text-[13px] leading-relaxed" style={{ color: C.mute }}>{children}</p>
      {acao}
    </div>
  </div>
);

function App() {
  const [estado, setEstado] = useState("carregando");   // carregando | fora | esperando | dentro | erro
  const [perfil, setPerfil] = useState(null);
  const [erro, setErro] = useState("");

  const verQuemSou = async () => {
    try {
      const d = await consultarPerfil();
      if (!d.liberado || !d.eu) { setEstado("esperando"); return; }
      setPerfil(d.eu); setEstado("dentro");
    } catch (e) {
      setErro(e.message);
      setEstado(AUTH.sessao ? "erro" : "fora");
    }
  };

  useEffect(() => {
    AUTH.aoSair = () => { setPerfil(null); setEstado("fora"); };
    (async () => {
      try { await carregarConfig(); } catch (e) { setErro(e.message); setEstado("erro"); return; }
      await restaurarSessao();
      if (!AUTH.sessao) { setEstado("fora"); return; }
      await verQuemSou();
    })();
    return () => { AUTH.aoSair = null; };
  }, []);

  if (estado === "carregando") return <Aviso titulo="Carregando…">Um instante.</Aviso>;
  if (estado === "fora") return <Login aoEntrar={verQuemSou} />;

  if (estado === "esperando") return (
    <Aviso titulo="Acesso ainda não liberado"
      acao={<button onClick={sair} className="mt-4 text-[13px] underline" style={{ color: C.roxo }}>Sair</button>}>
      Sua conta existe, mas o gerente ainda não liberou. Enquanto isso, o sistema não mostra nada — é assim de propósito, porque aqui dentro tem dado de cliente.
    </Aviso>
  );

  if (estado === "erro") return (
    <Aviso titulo="Não consegui entrar"
      acao={<button onClick={sair} className="mt-4 text-[13px] underline" style={{ color: C.roxo }}>Sair e tentar de novo</button>}>
      {erro}
    </Aviso>
  );

  return <VaaptyAponte perfil={perfil} />;
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
