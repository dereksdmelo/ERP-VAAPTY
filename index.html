                    {td(rs(r.venda), { forte: true })}
                    {td(rs(r.compra))}
                    {td(rs(r.debitos))}
                    {td(rs(r.quitacao))}
                    {td(rs(r.deducoes))}
                    {td(rs(r.bruta), { cor: r.bruta >= 0 ? C.verde : C.laranja, forte: true })}
                    {td(rs(r.cautelar))}
                    {td(rs(r.atual))}
                    {td(rs(r.comissaoExterna))}
                    {td(semana ? `${semana}ª` : "—")}
                    {td(rs(r.liquida), { cor: r.liquida >= 0 ? C.verde : C.laranja, forte: true })}
                    {td(e.negociador_nome || "—", { dir: "left" })}
                    {td(e.meio_alcance || "—", { dir: "left" })}
                  </tr>
                );
              })}
              <tr style={{ background: "#F3F7F4" }}>
                {td("Total", { dir: "left", forte: true })}{td("")}{td("")}{td("")}{td("")}
                {td(rs(total.venda), { forte: true })}{td(rs(total.compra))}{td(rs(total.debitos))}{td(rs(total.quitacao))}{td(rs(total.deducoes))}
                {td(rs(total.bruta), { forte: true, cor: C.verde })}{td(rs(total.cautelar))}{td(rs(total.custo))}{td(rs(total.comissao))}{td("")}
                {td(rs(total.liquida), { forte: true, cor: C.verde })}{td("")}{td("")}
              </tr>
            </tbody>
          </table>
        </div>

        {/* ---- TOTAL NEGOCIADORES ---- */}
        <div className="rounded-xl p-4 self-start" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
          <div className="text-[12px] font-semibold uppercase tracking-[0.06em]" style={{ color: C.mute }}>Por negociador</div>
          <div className="mt-2 space-y-1.5">
            {negociadores.map((n) => (
              <div key={n.nome} className="flex items-baseline justify-between gap-2 text-[13px]">
                <span className="truncate">{n.nome} <span style={{ color: C.mute }}>· {n.carros}</span></span>
                <span style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums", color: n.liquida >= 0 ? C.verde : C.laranja }}>{brl(n.liquida)}</span>
              </div>
            ))}
          </div>
          <p className="mt-3 text-[11px] leading-snug" style={{ color: C.mute }}>
            Rentabilidade líquida por negociador, como a caixa TOTAL NEGOCIADORES da planilha.
          </p>
        </div>
      </div>
    </div>
  );
}

/**
 * Cola a planilha CONTROLE DE VEÍCULOS / CLIENTES. Mesmo gesto do
 * importador do CRM: seleciona no Sheets, ⌘C, cola. As colunas são
 * reconhecidas pelo cabeçalho, então a ordem não importa.
 */
const COLUNAS_RENTAB = [
  ["data", /^data$/i], ["carro", /^carro$/i], ["placa", /^placa$/i], ["renavam", /^renavam/i],
  ["chassi", /^chassi/i], ["comprador", /^comprador/i], ["telefone", /^telefone/i],
  ["valor_venda", /valor\s*de\s*venda/i], ["valor_cliente", /valor\s*cliente/i],
  ["debitos", /^d[eé]bitos/i], ["quitacao", /^quita/i], ["deducoes", /^dedu/i],
  ["cautelar", /cautelar/i], ["comissao_externa", /comiss[aã]o\s*externa/i], ["semana", /^semana/i],
  ["negociador", /^negociador/i], ["meio_alcance", /meio\s*de\s*alcance/i], ["prospector", /^prospector/i],
  ["comentarios", /^coment/i],
];

function lerRentabilidade(txt) {
  const linhas = String(txt || "").split(/\r?\n/).map((l) => l.split("\t"));
  const iCab = linhas.findIndex((l) => l.some((c) => /^placa$/i.test(c.trim())) && l.some((c) => /valor\s*de\s*venda/i.test(c)));
  if (iCab < 0) return { erro: "Não achei o cabeçalho — a linha com PLACA e VALOR DE VENDA precisa vir junto." };
  const cab = linhas[iCab].map((c) => c.trim());
  const idx = {};
  COLUNAS_RENTAB.forEach(([k, rx]) => { const i = cab.findIndex((c) => rx.test(c)); if (i >= 0) idx[k] = i; });
  const dados = linhas.slice(iCab + 1)
    .filter((l) => idx.placa != null && String(l[idx.placa] || "").trim())
    .map((l) => {
      const o = {};
      Object.keys(idx).forEach((k) => { o[k] = String(l[idx[k]] || "").trim(); });
      // R$ 1.234,56 → 1234,56 (o servidor entende a vírgula)
      ["valor_venda", "valor_cliente", "debitos", "quitacao", "deducoes", "cautelar", "comissao_externa"]
        .forEach((k) => { if (o[k]) o[k] = o[k].replace(/R\$|\s|\[.*?\]/g, "").replace(/^-$/, ""); });
      // 03/08/2026 → 2026-08-03
      const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(o.data || "");
      o.data = m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : "";
      return o;
    });
  return { dados, colunas: Object.keys(idx) };
}

function ImportarRentabilidade({ aoTerminar }) {
  const [txt, setTxt] = useState("");
  const [indo, setIndo] = useState(false);
  const [res, setRes] = useState(null);
  const [erro, setErro] = useState("");
  const previa = txt ? lerRentabilidade(txt) : null;

  const enviar = async () => {
    if (!previa || previa.erro) return;
    setIndo(true); setErro("");
    try { setRes(await importarRentabilidade(previa.dados)); }
    catch (e) { setErro(e.message); }
    setIndo(false);
  };

  return (
    <div className="rounded-xl p-4" style={{ background: C.paper, border: `1px solid ${C.roxo}` }}>
      <div className="flex items-baseline justify-between">
        <span className="text-[14px] font-semibold">Importar planilha de rentabilidade</span>
        <button onClick={aoTerminar} className="text-[12px]" style={{ color: C.mute }}>fechar</button>
      </div>
      <p className="mt-1 text-[12px]" style={{ color: C.mute }}>
        No Sheets, selecione a aba CONTROLE DE VEÍCULOS com o cabeçalho, ⌘C, e cole aqui. Carro cuja
        placa já está no estoque é pulado, não duplicado.
      </p>
      {res ? (
        <div className="mt-3 rounded-lg p-3 text-[13px]" style={{ background: "#E8F3EE" }}>
          <b>{res.inseridos}</b> carro{res.inseridos === 1 ? "" : "s"} no estoque, <b>{res.custos}</b> linhas de custo,{" "}
          {res.veiculos_criados} veículo{res.veiculos_criados === 1 ? "" : "s"} e {res.compradores_criados} comprador{res.compradores_criados === 1 ? "" : "es"} criados.
          {!!(res.pulados || []).length && <div className="mt-1" style={{ color: AMARELO.texto }}>Pulados (já estavam no estoque): {res.pulados.join(", ")}</div>}
          {!!res.sem_placa && <div className="mt-1" style={{ color: AMARELO.texto }}>{res.sem_placa} linha{res.sem_placa > 1 ? "s" : ""} sem placa válida ficaram de fora.</div>}
          <button onClick={aoTerminar} className="mt-2 text-[13px] font-semibold" style={{ color: C.roxo }}>ver o estoque</button>
        </div>
      ) : (
        <>
          <textarea className="mt-3 h-40 w-full rounded-lg border p-2 text-[12px] outline-none" style={{ ...inputSty, fontFamily: F.mono }}
            placeholder="Cole aqui" value={txt} onChange={(e) => setTxt(e.target.value)} />
          {previa && previa.erro && <p className="mt-1 text-[12px]" style={{ color: C.laranja }}>{previa.erro}</p>}
          {previa && !previa.erro && (
            <p className="mt-1 text-[12px]" style={{ color: C.mute }}>
              {previa.dados.length} linha{previa.dados.length === 1 ? "" : "s"} com placa · colunas reconhecidas: {previa.colunas.join(", ")}
              {previa.colunas.indexOf("valor_cliente") < 0 && <span style={{ color: C.laranja }}> · falta VALOR CLIENTE</span>}
            </p>
          )}
          {erro && <p className="mt-1 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
          <BotaoPrimario onClick={enviar} disabled={indo || !previa || !!previa.erro || !previa.dados.length} className="mt-2 w-full">
            {indo ? "Importando…" : "Importar"}
          </BotaoPrimario>
        </>
      )}
    </div>
  );
}

/**
 * A tela do estoque: a fila de espera em cima, o pátio embaixo.
 *
 * A fila existe porque o carro não entra sozinho. Entrar no estoque é
 * um ato — alguém confere o que foi combinado e confirma — e é nesse
 * momento que o custo previsto nasce do check list. Automatizar a
 * entrada no fechamento traria para cá todo negócio marcado como
 * fechado por engano, e o custo de desfazer é maior que o de um toque.
 */
function TelaEstoque({ perfil, comp, mes, modo }) {
  const [lista, setLista] = useState(null);
  const [fila, setFila] = useState([]);
  // "rentabilidade" é a mesma tela aberta direto na planilha do mês —
  // ganhou entrada própria no menu porque, escondida atrás de um
  // filtro dentro do Estoque, o Derek não a achou.
  const soRentab = modo === "rentabilidade";
  const [filtro, setFiltro] = useState(soRentab ? "vendido" : "em_estoque");
  const [erro, setErro] = useState("");
  const [abrindo, setAbrindo] = useState(null);
  const [entrando, setEntrando] = useState("");
  const [mostrarFila, setMostrarFila] = useState(8);
  const [filaAberta, setFilaAberta] = useState(false);
  const [importando, setImportando] = useState(false);
  const eGerente = !!(perfil && perfil.papel === "gerente");

  const carregar = async () => {
    setErro("");
    try {
      const e = await listarEstoque();
      setLista(e);
      // Quem já fechou e ainda não entrou. Compara por veículo porque é
      // o veículo que tem o índice único no banco.
      const dentro = {};
      e.forEach((x) => { if (x.veiculo_id) dentro[x.veiculo_id] = true; });
      const fechados = await listarAtendimentos({ status: "fechado", limite: 200 });
      setFila(fechados.filter((a) => {
        const v = (a.veiculo || [])[0];
        return v && v.id && !dentro[v.id];
      }));
    } catch (ex) { setErro(ex.message); }
  };
  useEffect(() => { carregar(); }, []);

  const entrar = async (a) => {
    const v = (a.veiculo || [])[0];
    if (!v) return;
    setEntrando(a.id); setErro("");
    try {
      const cl = Array.isArray(a.checklist) ? a.checklist[0] : a.checklist;
      // O previsto sai do check list, que é onde esses números já foram
      // digitados uma vez. A comissão não entra: ela é retida do
      // cliente, não paga por nós — somar viraria custo inventado.
      const custos = [
        { tipo: "quitacao", descricao: "Quitação do financiamento", previsto: cl && cl.valor_quitacao },
        { tipo: "debitos", descricao: "Débitos do veículo", previsto: cl && cl.valor_debitos },
        { tipo: "cautelar", descricao: "Perícia cautelar", previsto: cl && cl.valor_cautelar },
      ];
      await entrarNoEstoque({
        veiculo_id: v.id,
        atendimento_id: a.id,
        // O que saiu para o cliente. `valor_cliente` é o líquido do
        // check list; sem check list, cai no valor fechado.
        valor_compra: (cl && cl.valor_cliente) || a.valor_fechado,
        negociador_nome: a.negociador_nome,
        meio_alcance: a.origem,
        prospector: a.prospec,
        custos,
      });
      await carregar();
    } catch (ex) { setErro(ex.message); }
    setEntrando("");
  };

  if (abrindo) {
    return <FichaEstoque id={abrindo} perfil={perfil}
      aoVoltar={() => { setAbrindo(null); carregar(); }} />;
  }

  const visivel = (lista || []).filter((e) => filtro === "todos" || e.situacao === filtro);
  const soma = visivel.reduce((t, e) => {
    const c = contaDoEstoque(e);
    return { custo: t.custo + c.atual, margem: t.margem + (c.margem || 0) };
  }, { custo: 0, margem: 0 });

  return (
    <div className="space-y-3">
      <Cabecalho titulo={soRentab ? "Rentabilidade" : "Estoque"} mes={filtro === "vendido" ? mes : null}
        sub={lista === null ? "Carregando…"
          : soRentab ? `${rotuloMes(comp)} · a planilha CONTROLE DE VEÍCULOS, por carro vendido`
          : `${lista.filter((e) => e.situacao === "em_estoque").length} no pátio · ${lista.filter((e) => e.situacao === "vendido").length} vendidos`} />

      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      {/* ---- a fila de entrada ----
          Recolhida por padrão. São 55 negócios fechados vindos da
          planilha, e a maioria foi vendida há meses: aberta, a fila
          empurraria o pátio — que é o assunto da tela — para baixo da
          dobra todo dia. */}
      {!soRentab && !!fila.length && !filaAberta && (
        <button onClick={() => setFilaAberta(true)}
          className="flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left"
          style={{ background: AMARELO.fundo, border: `1px solid ${C.line}` }}>
          <span className="flex-1 text-[12px]" style={{ color: AMARELO.texto }}>
            <b>{fila.length}</b> negócio{fila.length > 1 ? "s" : ""} fechado{fila.length > 1 ? "s" : ""} fora do estoque
          </span>
          <span className="text-[12px] font-semibold" style={{ color: AMARELO.texto }}>ver ▾</span>
        </button>
      )}
      {!soRentab && !!fila.length && filaAberta && (
        <div className="rounded-lg p-3" style={{ background: AMARELO.fundo, border: `1px solid ${C.line}` }}>
          <div className="flex items-baseline justify-between gap-2">
            <span className="text-[11px] uppercase tracking-[0.12em]" style={{ color: AMARELO.texto, fontWeight: 700 }}>
              {fila.length} fechado{fila.length > 1 ? "s" : ""} fora do estoque
            </span>
            <button onClick={() => setFilaAberta(false)} className="text-[11px]" style={{ color: AMARELO.texto }}>fechar</button>
          </div>
          <p className="mt-1 text-[11px] leading-snug" style={{ color: AMARELO.texto }}>
            O custo previsto entra do check list. Ponha no estoque só o que está de fato no pátio —
            negócio antigo, importado da planilha, também aparece aqui.
          </p>
          <div className="mt-2 space-y-1.5">
            {/* Só os mais recentes, e a lista já vem por data decrescente.
                Mostrar 55 linhas de negócio fechado em agosto esconderia
                o carro que fechou hoje no meio delas. */}
            {fila.slice(0, mostrarFila).map((a) => {
              const v = (a.veiculo || [])[0] || {};
              return (
                <div key={a.id} className="flex items-center gap-2 rounded-md px-2.5 py-2" style={{ background: "#fff" }}>
                  <span className="flex-1 text-[13px]">
                    <b>{v.placa || "sem placa"}</b>
                    <span style={{ color: C.mute }}> · {v.marca_modelo || a.carro_descricao || "—"}</span>
                  </span>
                  <button onClick={() => entrar(a)} disabled={entrando === a.id}
                    className="rounded-md px-3 py-1.5 text-[12px] font-semibold"
                    style={{ background: C.roxo, color: "#fff", opacity: entrando === a.id ? 0.5 : 1 }}>
                    {entrando === a.id ? "entrando…" : "pôr no estoque"}
                  </button>
                </div>
              );
            })}
          </div>
          {fila.length > mostrarFila && (
            <button onClick={() => setMostrarFila(mostrarFila + 20)} className="mt-2 text-[12px]"
              style={{ color: AMARELO.texto, fontWeight: 600 }}>
              ver mais {Math.min(20, fila.length - mostrarFila)} de {fila.length - mostrarFila} restantes
            </button>
          )}
        </div>
      )}

      {/* ---- filtro e totais ---- */}
      <div className="flex flex-wrap items-center gap-2">
        {!soRentab && [["em_estoque", "No pátio"], ["vendido", "Rentabilidade"]].map(([v, r]) => (
          <button key={v} onClick={() => setFiltro(v)}
            className="rounded-full px-3 py-1 text-[12px] font-semibold"
            style={{
              background: filtro === v ? C.roxo : "#fff",
              color: filtro === v ? "#fff" : C.mute,
              border: `1px solid ${filtro === v ? C.roxo : C.line}`,
            }}>{r}</button>
        ))}
        {filtro === "em_estoque" && !!visivel.length && (
          <span className="ml-auto text-[11px]" style={{ color: C.mute }}>
            {visivel.length} carro{visivel.length > 1 ? "s" : ""} · custo {brl(soma.custo)}
          </span>
        )}
        {eGerente && !importando && (
          <button onClick={() => setImportando(true)} className="ml-auto text-[12px] font-semibold" style={{ color: C.roxo }}>
            importar planilha
          </button>
        )}
      </div>

      {importando && <ImportarRentabilidade aoTerminar={() => { setImportando(false); carregar(); }} />}

      {/* A rentabilidade é a planilha do mês: só carros vendidos, do mês
          escolhido no cabeçalho. Vendido sem data cai no mês de entrada. */}
      {filtro === "vendido" && lista !== null && (
        <Rentabilidade comp={comp}
          vendidos={lista.filter((e) => e.situacao === "vendido" && String(e.vendido_em || e.entrou_em || "").slice(0, 7) === String(comp).slice(0, 7))} />
      )}

      {lista === null && <p className="text-[13px]" style={{ color: C.mute }}>Carregando…</p>}

      {lista !== null && filtro === "em_estoque" && !visivel.length && (
        <p className="text-[14px] leading-relaxed" style={{ color: C.mute }}>
          Nenhum carro no pátio. O primeiro entra pela fila acima, quando um negócio fecha.
        </p>
      )}

      <div className="grid gap-2">
        {filtro === "em_estoque" && visivel.map((e) => {
          const v = e.veiculo || {};
          const c = contaDoEstoque(e);
          const dias = diasNoPatio(e);
          return (
            <button key={e.id} onClick={() => setAbrindo(e.id)} className="w-full rounded-lg p-3.5 text-left"
              style={{ background: C.paper, border: `1px solid ${C.line}` }}>
              <div className="flex items-start justify-between gap-3">
                <span className="text-[15px] font-semibold leading-tight">
                  {v.placa || "sem placa"}
                  <span className="block text-[13px] font-normal" style={{ color: C.mute }}>
                    {v.marca_modelo || "—"}{v.ano_modelo ? ` ${v.ano_modelo}` : ""}
                  </span>
                </span>
                <span className="text-right">
                  <span className="block text-[15px]" style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(c.atual)}</span>
                  <span className="block text-[10px]" style={{ color: C.mute }}>custo</span>
                </span>
              </div>

              <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px]" style={{ color: C.mute }}>
                <span>entrou {diaBR(e.entrou_em)}</span>
                {dias != null && <span>{dias} dia{dias === 1 ? "" : "s"} {e.situacao === "vendido" ? "até vender" : "no pátio"}</span>}
                {!!c.aberto && <span style={{ color: AMARELO.texto }}>{c.aberto} conta{c.aberto > 1 ? "s" : ""} em aberto</span>}
                {c.desvio !== 0 && (
                  <span style={{ color: c.desvio > 0 ? C.laranja : C.verde, fontWeight: 600 }}>
                    {c.desvio > 0 ? "+" : "−"}{brl(Math.abs(c.desvio))} vs. previsto
                  </span>
                )}
              </div>

              {e.situacao === "vendido" && (
                <div className="mt-2 rounded-md px-2.5 py-1.5 text-[12px]"
                  style={{ background: c.margem >= 0 ? "#E8F3EE" : "#FDECE8" }}>
                  Vendido {diaBR(e.vendido_em)}{e.comprador ? ` para ${e.comprador.nome}` : ""} por {brl(c.venda)} ·
                  margem <b style={{ color: c.margem >= 0 ? C.verde : C.laranja }}>{brl(c.margem)}</b>
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/**
 * A ficha do carro no pátio: o custo linha a linha, e a venda.
 *
 * Cada linha tem previsto, realizado e comprovante. É a estrutura que
 * responde à pergunta que importa quando a margem sai diferente do
 * combinado: onde, exatamente, ela mudou.
 */
function FichaEstoque({ id, perfil, aoVoltar }) {
  const [e, setE] = useState(null);
  const [erro, setErro] = useState("");
  const [novo, setNovo] = useState(null);
  const [vendendo, setVendendo] = useState(false);
  const eGerente = !!(perfil && perfil.papel === "gerente");

  const carregar = async () => {
    try { setE(await lerEstoqueItem(id)); }
    catch (ex) { setErro(ex.message); }
  };
  useEffect(() => { carregar(); }, [id]);

  if (!e) {
    return (
      <div>
        <button onClick={aoVoltar} className="text-[14px]" style={{ color: C.roxo, fontWeight: 600 }}>‹ Estoque</button>
        <p className="mt-3 text-[13px]" style={{ color: erro ? C.laranja : C.mute }}>{erro || "Carregando…"}</p>
      </div>
    );
  }

  const v = e.veiculo || {};
  const c = contaDoEstoque(e);
  const custos = (e.estoque_custo || []).slice().sort((a, b) => (a.do_fechamento === b.do_fechamento ? 0 : a.do_fechamento ? -1 : 1));
  const dias = diasNoPatio(e);

  const salvarLinha = async (linha, mud) => {
    setErro("");
    try { await atualizarCusto(linha.id, mud); await carregar(); }
    catch (ex) { setErro(ex.message); }
  };

  const anexarComprovante = async (linha, arquivo) => {
    if (!arquivo) return;
    setErro("");
    try {
      if (!e.atendimento_id) throw new Error("Este carro não tem atendimento de origem — o comprovante precisa de um.");
      const anexo = await enviarAnexo(e.atendimento_id, arquivo, `Comprovante · ${linha.descricao}`);
      await atualizarCusto(linha.id, { anexo_id: anexo.id });
      await carregar();
    } catch (ex) { setErro(ex.message); }
  };

  const adicionar = async () => {
    if (!novo || !String(novo.descricao || "").trim()) return;
    setErro("");
    try {
      await criarCusto({ ...novo, estoque_id: e.id });
      setNovo(null);
      await carregar();
    } catch (ex) { setErro(ex.message); }
  };

  const num = (rot, valor, cor, forte) => (
    <div>
      <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>{rot}</div>
      <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: forte ? 700 : 500, color: cor || C.ink }}>
        {valor}
      </div>
    </div>
  );

  return (
    <div className="space-y-3">
      <button onClick={aoVoltar} className="text-[14px]" style={{ color: C.roxo, fontWeight: 600 }}>‹ Estoque</button>
      <Cabecalho titulo={v.placa || "Carro"} sub={`${v.marca_modelo || "—"}${v.ano_modelo ? ` ${v.ano_modelo}` : ""}`} />

      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      <div className="rounded-lg p-3.5" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
        <div className="text-[15px] font-semibold">{v.marca_modelo || "—"}{v.ano_modelo ? ` ${v.ano_modelo}` : ""}</div>
        <div className="mt-0.5 text-[12px]" style={{ color: C.mute }}>
          {[v.cor, v.km_atual ? `${Number(v.km_atual).toLocaleString("pt-BR")} km` : null,
            v.fipe_valor ? `FIPE ${brl(v.fipe_valor)}` : null].filter(Boolean).join(" · ") || "sem ficha"}
        </div>
        <div className="mt-1 text-[11px]" style={{ color: C.mute }}>
          Entrou {diaBR(e.entrou_em)}{dias != null ? ` · ${dias} dia${dias === 1 ? "" : "s"} ${e.situacao === "vendido" ? "até vender" : "no pátio"}` : ""}
        </div>

        <div className="mt-3 grid grid-cols-3 gap-2">
          {num("Previsto", brl(c.previsto))}
          {num("Custo hoje", brl(c.atual), c.desvio > 0 ? C.laranja : c.desvio < 0 ? C.verde : C.ink, true)}
          {e.situacao === "vendido"
            ? num("Margem", brl(c.margem), c.margem >= 0 ? C.verde : C.laranja, true)
            : num("Diferença", `${c.desvio > 0 ? "+" : c.desvio < 0 ? "−" : ""}${brl(Math.abs(c.desvio))}`,
                c.desvio > 0 ? C.laranja : c.desvio < 0 ? C.verde : C.mute)}
        </div>

        {!!c.aberto && (
          <p className="mt-2 text-[11px]" style={{ color: AMARELO.texto }}>
            {c.aberto} conta{c.aberto > 1 ? "s" : ""} sem valor pago — o custo de hoje usa o previsto {c.aberto > 1 ? "delas" : "dela"}.
          </p>
        )}
      </div>

      {/* ---- as linhas ---- */}
      <div className="rounded-lg p-3.5" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
        <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>O que o carro custou</div>

        <div className="mt-2 flex items-center gap-2 border-b pb-2 text-[13px]" style={{ borderColor: C.line }}>
          <span className="flex-1 font-semibold">Compra — pago ao cliente</span>
          <span style={{ fontFamily: F.mono, fontWeight: 700 }}>{brl(c.compra)}</span>
        </div>

        {custos.map((l) => (
          <LinhaCusto key={l.id} l={l} eGerente={eGerente}
            aoSalvar={(mud) => salvarLinha(l, mud)}
            aoAnexar={(arq) => anexarComprovante(l, arq)}
            aoApagar={async () => {
              setErro("");
              try { await apagarCusto(l.id); await carregar(); } catch (ex) { setErro(ex.message); }
            }} />
        ))}

        {!custos.length && (
          <p className="mt-2 text-[12px]" style={{ color: C.mute }}>
            Nenhum custo além da compra. Débitos, quitação e cautelar entram do check list quando existem.
          </p>
        )}

        {novo ? (
          <div className="mt-3 space-y-2 rounded-md p-2.5" style={{ background: C.roxoFraco }}>
            <div className="flex gap-2">
              <select className="rounded-md border px-2 py-1.5 text-[13px] outline-none" style={inputSty}
                value={novo.tipo} onChange={(ev) => setNovo({ ...novo, tipo: ev.target.value })}>
                {TIPOS_CUSTO.map(([v2, r]) => <option key={v2} value={v2}>{r}</option>)}
              </select>
              <input className="flex-1 rounded-md border px-2 py-1.5 text-[16px] outline-none" style={inputSty}
                placeholder="O que é" value={novo.descricao}
                onChange={(ev) => setNovo({ ...novo, descricao: ev.target.value })} />
            </div>
            <div className="flex gap-2">
              <label className="flex-1">
                <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Previsto</span>
                <input className="mt-[2px] w-full rounded-md border px-2 py-1.5 text-right text-[16px] outline-none"
                  style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal" value={novo.previsto}
                  onChange={(ev) => setNovo({ ...novo, previsto: ev.target.value })} />
              </label>
              <label className="flex-1">
                <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Pago</span>
                <input className="mt-[2px] w-full rounded-md border px-2 py-1.5 text-right text-[16px] outline-none"
                  style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal" value={novo.realizado}
                  onChange={(ev) => setNovo({ ...novo, realizado: ev.target.value })} />
              </label>
            </div>
            <div className="flex gap-2">
              <button onClick={adicionar} className="flex-1 rounded-md py-2 text-[14px] font-semibold"
                style={{ background: C.roxo, color: "#fff" }}>Lançar</button>
              <button onClick={() => setNovo(null)} className="px-3 text-[13px]" style={{ color: C.mute }}>cancelar</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setNovo({ tipo: "reparo", descricao: "", previsto: "", realizado: "" })}
            className="mt-3 w-full rounded-md border py-2 text-[13px] font-semibold"
            style={{ borderColor: C.line, color: C.roxo }}>
            + lançar um custo
          </button>
        )}
      </div>

      {/* ---- a venda ---- */}
      {e.situacao === "vendido" ? (
        <div className="rounded-lg p-3.5" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
          <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>Venda</div>
          <div className="mt-1 text-[15px]">
            {e.comprador ? <b>{e.comprador.nome}</b> : "Comprador não informado"} · {brl(c.venda)} em {diaBR(e.vendido_em)}
          </div>
          {e.comprador && e.comprador.telefone && (
            <a href={`tel:${String(e.comprador.telefone).replace(/\D/g, "")}`} className="text-[13px]" style={{ color: C.roxo }}>
              {e.comprador.telefone}
            </a>
          )}
          <div className="mt-2 text-[13px]">
            Margem <b style={{ color: c.margem >= 0 ? C.verde : C.laranja, fontFamily: F.mono }}>{brl(c.margem)}</b>
            <span style={{ color: C.mute }}> sobre um custo de {brl(c.atual)}</span>
          </div>
          {e.nota_venda && <p className="mt-1 text-[12px]" style={{ color: C.mute }}>{e.nota_venda}</p>}
        </div>
      ) : vendendo ? (
        <VenderCarro e={e} aoFechar={() => setVendendo(false)}
          aoVender={async (dados) => {
            setErro("");
            try { await atualizarEstoque(e.id, dados); setVendendo(false); await carregar(); }
            catch (ex) { setErro(ex.message); }
          }} />
      ) : (
        <button onClick={() => setVendendo(true)} className="w-full rounded-md py-3 text-[15px] font-semibold"
          style={{ background: C.roxo, color: "#fff" }}>
          Vender carro
        </button>
      )}
    </div>
  );
}

/**
 * Uma linha de custo.
 *
 * O campo de pago fica sempre visível, e vazio quando ainda não pagou.
 * Escondê-lo atrás de um botão faria a conta em aberto se parecer com
 * conta fechada — e é a conta em aberto que precisa saltar aos olhos.
 */
function LinhaCusto({ l, eGerente, aoSalvar, aoAnexar, aoApagar }) {
  const [subindo, setSubindo] = useState(false);
  const pago = l.realizado != null;
  const dif = pago ? (Number(l.realizado) || 0) - (Number(l.previsto) || 0) : 0;

  return (
    <div className="border-b py-2" style={{ borderColor: C.line }}>
      <div className="flex items-center gap-2">
        <span className="flex-1 text-[13px] leading-tight">
          {l.descricao}
          <span className="block text-[10px] uppercase tracking-[0.08em]" style={{ color: C.mute }}>
            {rotuloCusto(l.tipo)}{l.do_fechamento ? " · do fechamento" : ""}
          </span>
        </span>
        {eGerente && !l.do_fechamento && (
          <button onClick={aoApagar} className="text-[11px]" style={{ color: C.mute }}>apagar</button>
        )}
      </div>

      <div className="mt-1.5 flex items-end gap-2">
        <label style={{ width: 92, flex: "0 0 92px" }}>
          <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Previsto</span>
          <input className="mt-[2px] w-full rounded-md border px-2 py-1 text-right text-[13px] outline-none"
            style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal"
            defaultValue={Number(l.previsto) ? Math.round(l.previsto) : ""}
            onBlur={(ev) => {
              const n = Number(String(ev.target.value).replace(/\./g, "").replace(",", ".")) || 0;
              if (n !== (Number(l.previsto) || 0)) aoSalvar({ previsto: ev.target.value });
            }} />
        </label>
        <label style={{ width: 92, flex: "0 0 92px" }}>
          <span className="block text-[9px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Pago</span>
          <input className="mt-[2px] w-full rounded-md border px-2 py-1 text-right text-[13px] outline-none"
            style={{ ...inputSty, fontFamily: F.mono, background: pago ? "#fff" : "#FBFAFC" }} inputMode="decimal"
            placeholder="—" defaultValue={pago ? Math.round(l.realizado) : ""}
            onBlur={(ev) => {
              const bruto = String(ev.target.value).trim();
              const antes = pago ? Number(l.realizado) || 0 : null;
              const agora = bruto === "" ? null : Number(bruto.replace(/\./g, "").replace(",", ".")) || 0;
              if (agora !== antes) {
                // Quem informa o valor pago sem data ganha a data de
                // hoje: sem ela a conta some do contas a pagar futuro.
                aoSalvar({ realizado: bruto, pago_em: agora == null ? null : (l.pago_em || hojeEmSP()) });
              }
            }} />
        </label>
        <span className="flex-1 pb-1 text-right text-[11px]">
          {pago
            ? (dif === 0
                ? <span style={{ color: C.mute }}>igual ao previsto</span>
                : <span style={{ color: dif > 0 ? C.laranja : C.verde, fontWeight: 600 }}>
                    {dif > 0 ? "+" : "−"}{brl(Math.abs(dif))}
                  </span>)
            : <span style={{ color: AMARELO.texto }}>em aberto</span>}
        </span>
      </div>

      <div className="mt-1 flex items-center gap-3 text-[11px]">
        {pago && l.pago_em && <span style={{ color: C.mute }}>pago {diaBR(l.pago_em)}</span>}
        {l.anexo_id ? (
          <span style={{ color: C.verde }}>comprovante anexado</span>
        ) : (
          <label style={{ color: C.roxo, cursor: "pointer" }}>
            {subindo ? "enviando…" : "anexar comprovante"}
            <input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" className="hidden"
              onChange={async (ev) => {
                const arq = ev.target.files && ev.target.files[0];
                ev.target.value = "";
                if (!arq) return;
                setSubindo(true);
                await aoAnexar(arq);
                setSubindo(false);
              }} />
          </label>
        )}
      </div>
    </div>
  );
}

/* ==================================================================
 * PRÉ-VENDAS (0022)
 *
 * A tela é feita para uma coisa só: o telefone está tocando, e a
 * pessoa precisa sair da ligação com o cliente agendado. Tudo aqui
 * responde a isso — a barra de captura sempre visível, os dias e
 * horários como botões, e nenhum campo que dê para preencher depois.
 * ================================================================== */

async function listarLeads(f) {
  const r = await fetchAut(`/api/atendimento?${comoQuery({ recurso: "lead", ...(f || {}) })}`);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui carregar os leads.");
  return d.leads || [];
}
async function criarLead(dados) {
  const r = await fetchAut("/api/atendimento?recurso=lead", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui gravar o lead.");
  return d.lead;
}
async function atualizarLead(id, dados) {
  const r = await fetchAut(`/api/atendimento?recurso=lead&id=${encodeURIComponent(id)}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui salvar.");
  return d.lead;
}
async function leadCompareceu(id, dados) {
  const r = await fetchAut(`/api/atendimento?recurso=lead&acao=compareceu&id=${encodeURIComponent(id)}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados || {}),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui abrir o atendimento.");
  return d;
}

const LEAD_ROT = {
  novo: "Novo", em_contato: "Em contato", agendado: "Agendado", confirmado: "Confirmado",
  compareceu: "Compareceu", nao_compareceu: "Não veio", perdido: "Perdido",
};
const HORARIOS = ["09:00", "10:00", "11:00", "13:30", "14:30", "15:30", "16:30", "17:30", "18:30"];

const soDigitos = (t) => String(t || "").replace(/\D/g, "");
const telBR = (t) => {
  const d = soDigitos(t);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return String(t || "");
};
// O celular do país é 55 e a loja é de Joinville: número sem DDI vira
// wa.me com 55 na frente, senão o link abre uma conversa vazia.
const zap = (tel, msg) => {
  const d = soDigitos(tel);
  const num = d.length <= 11 ? `55${d}` : d;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
};
const horaBR = (iso) => (iso ? String(iso).slice(11, 16) : "");
const diaDaSemana = (iso) => ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"][new Date(`${String(iso).slice(0, 10)}T12:00:00`).getDay()];

/** Os próximos sete dias, para o agendamento de dois toques. */
function proximosDias(n) {
  const hoje = hojeEmSP();
  const [a, m, d] = hoje.split("-").map(Number);
  const lista = [];
  for (let i = 0; i < n; i++) {
    const x = new Date(Date.UTC(a, m - 1, d + i));
    const iso = x.toISOString().slice(0, 10);
    lista.push({ iso, rot: i === 0 ? "Hoje" : i === 1 ? "Amanhã" : `${String(x.getUTCDate()).padStart(2, "0")}/${String(x.getUTCMonth() + 1).padStart(2, "0")}`, dia: diaDaSemana(iso).slice(0, 3) });
  }
  return lista;
}

/**
 * O agendador: dia, hora e negociador em três toques.
 *
 * Aparece como sobreposição porque é o momento em que a ligação está
 * acontecendo — qualquer coisa a mais na tela é uma chance de errar.
 */
function Agendador({ lead, equipe, aoFechar, aoAgendar }) {
  const [dia, setDia] = useState(String(lead.agendado_para || "").slice(0, 10) || hojeEmSP());
  const [hora, setHora] = useState(horaBR(lead.agendado_para) || "");
  const [neg, setNeg] = useState(lead.negociador_id || "");
  const [outra, setOutra] = useState("");
  const dias = proximosDias(7);
  const pronto = dia && (hora || outra);
  const chip = (ativo) => ({
    background: ativo ? C.roxo : C.bg, color: ativo ? "#fff" : C.ink,
    border: `1px solid ${ativo ? C.roxo : C.line}`, fontWeight: ativo ? 700 : 500,
  });
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center lg:items-center" style={{ background: "rgba(24,18,33,0.45)" }} onClick={aoFechar}>
      <div className="w-full max-w-lg rounded-t-2xl p-4 lg:rounded-2xl" style={{ background: C.paper }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-baseline justify-between">
          <span className="text-[17px] font-bold">{lead.agendado_para ? "Remarcar" : "Agendar"} · {lead.nome}</span>
          <button onClick={aoFechar} className="text-[13px]" style={{ color: C.mute }}>fechar</button>
        </div>

        <div className="mt-3 text-[11px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Dia</div>
        <div className="rolar mt-1 flex gap-1.5 overflow-x-auto pb-1">
          {dias.map((d) => (
            <button key={d.iso} onClick={() => setDia(d.iso)} className="shrink-0 rounded-lg px-3 py-2 text-[13px]" style={chip(dia === d.iso)}>
              {d.rot}<span className="block text-[10px] font-normal" style={{ opacity: 0.75 }}>{d.dia}</span>
            </button>
          ))}
          <input type="date" value={dia} onChange={(e) => setDia(e.target.value)} className="shrink-0 rounded-lg border px-2 text-[13px] outline-none" style={inputSty} />
        </div>

        <div className="mt-3 text-[11px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Hora</div>
        <div className="mt-1 flex flex-wrap gap-1.5">
          {HORARIOS.map((h) => (
            <button key={h} onClick={() => { setHora(h); setOutra(""); }} className="rounded-lg px-3 py-2 text-[14px]" style={chip(hora === h && !outra)}>{h}</button>
          ))}
          <input type="time" value={outra} onChange={(e) => { setOutra(e.target.value); setHora(""); }}
            className="rounded-lg border px-2 py-1 text-[14px] outline-none" style={inputSty} />
        </div>

        <div className="mt-3 text-[11px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Negociador</div>
        <select className={`${inputCls} mt-1`} style={inputSty} value={neg} onChange={(e) => setNeg(e.target.value)}>
          <option value="">A definir</option>
          {(equipe || []).filter((n) => n.ativo && n.papel === "negociador").map((n) => <option key={n.id} value={n.id}>{n.nome}</option>)}
        </select>

        <BotaoPrimario className="mt-4 w-full" disabled={!pronto}
          onClick={() => {
            const n = (equipe || []).filter((x) => x.id === neg)[0];
            aoAgendar({ agendado_para: `${dia}T${outra || hora}:00`, negociador_id: neg || null, negociador_nome: n ? n.nome : null });
          }}>
          {lead.agendado_para ? "Remarcar" : "Agendar"} {dia && (hora || outra) ? `· ${dias.filter((d) => d.iso === dia)[0] ? dias.filter((d) => d.iso === dia)[0].rot : diaBR(dia)} ${outra || hora}` : ""}
        </BotaoPrimario>
      </div>
    </div>
  );
}

/**
 * A agenda: por dia, com duas ações grandes por linha.
 *
 * A confirmação é um toque e o WhatsApp já abre com a mensagem
 * pronta — é o que a pré-venda faz na véspera, sessenta vezes seguidas.
 * "Chegou" cria o atendimento com o que já foi perguntado ao telefone.
 */
function Agendamentos({ perfil, equipe, aoAbrirAtendimento }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [agendando, setAgendando] = useState(null);
  const [indo, setIndo] = useState("");

  const carregar = () => {
    setErro("");
    listarLeads({ fila: "agenda" }).then(setLista).catch((e) => setErro(e.message));
  };
  useEffect(carregar, []);

  const mexer = async (l, mud) => {
    setLista((ls) => ls.map((x) => (x.id === l.id ? { ...x, ...mud } : x)));
    try { await atualizarLead(l.id, mud); carregar(); }
    catch (e) { setErro(e.message); carregar(); }
  };
  const chegou = async (l) => {
    setIndo(l.id); setErro("");
    try {
      const d = await leadCompareceu(l.id, { negociador_id: l.negociador_id, negociador_nome: l.negociador_nome });
      carregar();
      if (aoAbrirAtendimento && d.atendimento_id) aoAbrirAtendimento(d.atendimento_id);
    } catch (e) { setErro(e.message); }
    setIndo("");
  };

  const hoje = hojeEmSP();
  const grupos = {};
  (lista || []).forEach((l) => {
    const d = String(l.agendado_para || "").slice(0, 10);
    (grupos[d] = grupos[d] || []).push(l);
  });
  const dias = Object.keys(grupos).sort();
  const rotuloDia = (d) => {
    const p = proximosDias(2);
    if (d === p[0].iso) return "Hoje";
    if (d === p[1].iso) return "Amanhã";
    return `${diaBR(d)} · ${diaDaSemana(d)}`;
  };

  return (
    <div className="space-y-4">
      {erro && <p className="text-[13px]" style={{ color: C.laranja }}>{erro}</p>}
      {lista === null && <p className="text-[13px]" style={{ color: C.mute }}>Carregando…</p>}
      {lista && !lista.length && (
        <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.paper, border: `1px dashed ${C.line}` }}>
          <p className="text-[15px] font-semibold">Nenhum agendamento em aberto.</p>
          <p className="mt-1 text-[13px]" style={{ color: C.mute }}>Agende alguém em <b>Leads</b> e ele aparece aqui.</p>
        </div>
      )}

      {dias.map((d) => {
        const atrasado = d < hoje;
        return (
          <div key={d}>
            <div className="mb-1.5 flex items-baseline gap-2">
              <span className="text-[13px] font-bold uppercase tracking-[0.06em]" style={{ color: atrasado ? C.laranja : C.ink }}>{rotuloDia(d)}</span>
              <span className="text-[12px]" style={{ color: C.mute }}>{grupos[d].length} agendado{grupos[d].length > 1 ? "s" : ""}</span>
              {atrasado && <span className="text-[12px]" style={{ color: C.laranja }}>· passou e ninguém marcou</span>}
            </div>
            <div className="grid gap-2">
              {grupos[d].map((l) => {
                const conf = l.status === "confirmado";
                const remarcou = (l.remarcacoes || []).length;
                return (
                  <div key={l.id} className="rounded-xl p-3.5" style={{ background: C.paper, border: `1px solid ${conf ? C.verde : C.line}` }}>
                    <div className="flex flex-wrap items-start justify-between gap-2">
                      <div className="min-w-0">
                        <div className="text-[15px] font-semibold">
                          <span style={{ fontVariantNumeric: "tabular-nums" }}>{horaBR(l.agendado_para)}</span> · {l.nome}
                        </div>
                        <div className="text-[13px]" style={{ color: C.mute }}>
                          {[l.carro, l.negociador_nome || (l.negociador && l.negociador.nome) || "sem negociador"].filter(Boolean).join(" · ")}
                          {!!remarcou && <span style={{ color: AMARELO.texto }}> · remarcou {remarcou}×</span>}
                        </div>
                      </div>
                      <span className="rounded-full px-2.5 py-1 text-[11px] font-bold uppercase"
                        style={{ background: conf ? "#E8F3EE" : AMARELO.fundo, color: conf ? C.verde : AMARELO.texto }}>
                        {conf ? "confirmado" : "a confirmar"}
                      </span>
                    </div>

                    <div className="mt-2.5 flex flex-wrap items-center gap-2 text-[13px]">
                      {!conf ? (
                        <button onClick={() => mexer(l, { confirmado: true })} className="rounded-lg px-3.5 py-2 font-semibold" style={{ background: C.verde, color: "#fff" }}>Confirmou</button>
                      ) : (
                        <button onClick={() => mexer(l, { confirmado: false })} className="rounded-lg px-3 py-2" style={{ color: C.mute, border: `1px solid ${C.line}` }}>desfazer</button>
                      )}
                      {l.telefone && (
                        <a href={zap(l.telefone, `Olá ${l.nome}! Confirmando sua avaliação na Vaapty Joinville ${rotuloDia(d).toLowerCase()} às ${horaBR(l.agendado_para)}. Podemos contar com você?`)}
                          target="_blank" rel="noreferrer" className="rounded-lg px-3 py-2 font-semibold" style={{ border: `1px solid ${C.verde}`, color: C.verde }}>
                          WhatsApp
                        </a>
                      )}
                      {l.telefone && <a href={`tel:${soDigitos(l.telefone)}`} style={{ color: C.roxo, fontWeight: 600 }}>{telBR(l.telefone)}</a>}
                      <button onClick={() => setAgendando(l)} style={{ color: C.mute }}>remarcar</button>
                      <button onClick={() => mexer(l, { status: "nao_compareceu" })} style={{ color: C.mute }}>não veio</button>
                      <button onClick={() => chegou(l)} disabled={indo === l.id}
                        className="ml-auto rounded-lg px-4 py-2 font-semibold" style={{ background: C.roxo, color: "#fff", opacity: indo === l.id ? 0.5 : 1 }}>
                        {indo === l.id ? "abrindo…" : "Chegou"}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {agendando && (
        <Agendador lead={agendando} equipe={equipe} aoFechar={() => setAgendando(null)}
          aoAgendar={async (dados) => { await mexer(agendando, dados); setAgendando(null); }} />
      )}
    </div>
  );
}

/* ==================================================================
 * VENDA PARA LOJISTAS
 *
 * O pátio visto do lado de quem precisa esvaziá-lo. A pergunta aqui
 * não é quanto o carro custou — isso é o Estoque — é: por quanto está
 * sendo oferecido, há quantos dias, e já foi anunciado.
 *
 * O carro sai daqui por três caminhos, e os três reaproveitam o que a
 * avaliação já produziu: o descritivo do WhatsApp, o JSON do Shinkai e
 * o WhatsApp direto para um lojista do cadastro.
 * ================================================================== */

const SHINKAI_PAINEL = "https://www.shinkai.com.br/painel";

/**
 * A linha do estoque no formato que `gerarDescritivo` e
 * `payloadShinkai` esperam.
 *
 * As duas funções nasceram para a ficha do atendimento, que vive no
 * `localStorage` com nomes próprios. Traduzir aqui é o que evita ter
 * dois descritivos diferentes no sistema — um para o carro que está
 * sendo avaliado e outro para o que está no pátio.
 */
function fichaDoEstoque(e) {
  const v = e.veiculo || {};
  const ano = v.ano_fabricacao && v.ano_modelo && v.ano_fabricacao !== v.ano_modelo
    ? `${v.ano_fabricacao}/${v.ano_modelo}` : String(v.ano_modelo || v.ano_fabricacao || "");
  const cap = (p) => (p ? p.charAt(0).toUpperCase() + p.slice(1) : "");
  return {
    placa: v.placa || "", chassi: v.chassi || "", modelo: v.marca_modelo || "", ano,
    cor: v.cor || "", combustivel: v.combustivel || "", cambio: v.cambio || "",
    km: v.km_atual || 0, kmEntrada: v.km_entrada || 0,
    fipe: v.fipe_valor, fipeCodigo: v.fipe_codigo,
    // O preço pedido manda; o valor_por da avaliação é o padrão.
    por: e.preco_pedido != null ? e.preco_pedido : v.valor_por,
    gastos: v.gastos_descricao || "",
    pneus: [cap(v.pneu_de), cap(v.pneu_dd), cap(v.pneu_te), cap(v.pneu_td)],
    leilao: !!v.leilao_sinistro, gnv: !!v.gnv, opcionais: v.opcionais || [],
    lataria: v.detalhes_lataria || "", mecanica: v.detalhes_mecanica || "",
    positivos: (v.pontos_positivos || []).join("\n"),
    ressalvas: (v.ressalvas_lojista || []).join("\n"),
    internas: "", negociador: e.negociador_nome || "",
  };
}

  };
  const copiar = async (texto, marca) => {
    try { await navigator.clipboard.writeText(texto); }
    catch (ex) {
      // Safari sem permissão: cai no textarea escondido, que é o que
      // sempre funcionou no celular da loja.
      const t = document.createElement("textarea");
      t.value = texto; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (e2) { setErro("Não consegui copiar. Selecione o texto à mão."); }
      document.body.removeChild(t);
    }
    setCopiado(marca); setTimeout(() => setCopiado(""), 2000);
  };

  const carros = (lista || []).slice().sort((a, b) =>
    ordem === "patio" ? String(a.entrou_em).localeCompare(String(b.entrou_em))
      : (Number(b.preco_pedido || 0) - Number(a.preco_pedido || 0)));
  const semAnuncio = carros.filter((e) => !e.anunciado_em).length;
  const custoTotal = carros.reduce((t, e) => t + contaDoEstoque(e).atual, 0);
  const pedidoTotal = carros.reduce((t, e) => t + (Number(e.preco_pedido) || 0), 0);

  return (
    <div className="space-y-3">
      <Cabecalho titulo="Venda para lojistas"
        sub={lista === null ? "Carregando…"
          : `${carros.length} no pátio · ${semAnuncio} sem anúncio · custo ${brl(custoTotal)}${pedidoTotal ? ` · pedido ${brl(pedidoTotal)}` : ""}`}
        acao={<a href={SHINKAI_PAINEL} target="_blank" rel="noreferrer"
          className="rounded-lg px-4 py-2.5 text-[14px] font-semibold" style={{ background: C.roxo, color: "#fff" }}>
          Abrir o Shinkai
        </a>} />

      {erro && <p className="text-[13px]" style={{ color: C.laranja }}>{erro}</p>}

      <div className="flex flex-wrap items-center gap-2 text-[13px]">
        {[["patio", "Mais tempo no pátio"], ["preco", "Maior preço"]].map(([v, r]) => (
          <button key={v} onClick={() => setOrdem(v)} className="rounded-full px-3 py-1 font-semibold"
            style={{ background: ordem === v ? C.roxoFraco : "transparent", color: ordem === v ? C.roxo : C.mute }}>{r}</button>
        ))}
      </div>

      {lista && !carros.length && (
        <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.paper, border: `1px dashed ${C.line}` }}>
          <p className="text-[15px] font-semibold">Nenhum carro no pátio.</p>
          <p className="mt-1 text-[13px]" style={{ color: C.mute }}>Assim que um negócio fechar e o carro entrar no estoque, ele aparece aqui para ser anunciado.</p>
        </div>
      )}

      <div className="grid gap-2">
        {carros.map((e) => {
          const v = e.veiculo || {};
          const c = contaDoEstoque(e);
          const dias = diasNoPatio(e);
          const f = fichaDoEstoque(e);
          const fotos = (e.foto || []).length;
          const pedido = Number(e.preco_pedido) || 0;
          const margem = pedido ? pedido - c.atual : null;
          // Trinta dias é quando o carro deixa de ser estoque e vira
          // dinheiro parado. A cor é o único aviso que a tela dá.
          const corDias = dias == null ? C.mute : dias >= 60 ? C.laranja : dias >= 30 ? AMARELO.texto : C.mute;
          return (
            <div key={e.id} className="rounded-xl p-3.5" style={{ background: C.paper, border: `1px solid ${e.anunciado_em ? C.line : C.roxo}` }}>
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[15px] font-semibold">
                    {v.placa || "sem placa"} <span style={{ color: C.mute, fontWeight: 400 }}>· {v.marca_modelo || "—"}{v.ano_modelo ? ` ${v.ano_modelo}` : ""}</span>
                  </div>
                  <div className="mt-0.5 text-[12px]" style={{ color: C.mute }}>
                    {[v.cor, v.km_atual ? `${Number(v.km_atual).toLocaleString("pt-BR")} km` : null, v.cambio,
                      v.fipe_valor ? `FIPE ${brl(v.fipe_valor)}` : null, `${fotos} foto${fotos === 1 ? "" : "s"}`].filter(Boolean).join(" · ")}
                  </div>
                  <div className="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-[12px]">
                    <span style={{ color: corDias, fontWeight: dias >= 30 ? 700 : 400 }}>
                      {dias == null ? "" : `${dias} dia${dias === 1 ? "" : "s"} no pátio`}
                    </span>
                    <span style={{ color: C.mute }}>custo {brl(c.atual)}</span>
                    {margem != null && (
                      <span style={{ color: margem >= 0 ? C.verde : C.laranja, fontWeight: 600 }}>margem prevista {brl(margem)}</span>
                    )}
                    {!!(e.precos || []).length && <span style={{ color: AMARELO.texto }}>preço mudou {(e.precos || []).length}×</span>}
                  </div>
                </div>
                <label className="shrink-0 text-right">
                  <span className="block text-[10px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Preço pedido</span>
                  <input className="mt-[2px] w-32 rounded-lg border px-2 py-1.5 text-right text-[15px] outline-none"
                    style={{ ...inputSty, fontFamily: F.mono, fontWeight: 700, borderColor: pedido ? C.line : C.laranja }}
                    inputMode="decimal" placeholder="—"
                    defaultValue={pedido ? Math.round(pedido) : ""}
                    onBlur={(ev) => {
                      const n = Number(String(ev.target.value).replace(/\./g, "").replace(",", ".")) || 0;
                      if (n !== pedido) mexer(e, { preco_pedido: n || null });
                    }} />
                </label>
              </div>

              <div className="mt-2.5 flex flex-wrap items-center gap-2 text-[13px]">
                <button onClick={() => copiar(gerarDescritivo(f, fotos), `d${e.id}`)}
                  className="rounded-lg px-3 py-2 font-semibold" style={{ border: `1px solid ${C.verde}`, color: C.verde }}>
                  {copiado === `d${e.id}` ? "descritivo copiado" : "Copiar descritivo"}
                </button>
                <button onClick={async () => {
                    await copiar(JSON.stringify(payloadShinkai(f, fotos), null, 2), `s${e.id}`);
                    window.open(SHINKAI_PAINEL, "_blank", "noopener");
                    if (!e.anunciado_em) mexer(e, { anunciado_em: true });
                  }}
                  className="rounded-lg px-3 py-2 font-semibold" style={{ background: C.roxo, color: "#fff" }}>
                  {copiado === `s${e.id}` ? "JSON copiado · Shinkai aberto" : "Levar para o Shinkai"}
                </button>
                <button onClick={() => setEnviando(enviando === e.id ? null : e.id)} style={{ color: C.roxo, fontWeight: 600 }}>
                  mandar para um lojista
                </button>
                {e.anunciado_em ? (
                  <span className="text-[12px]" style={{ color: C.verde }}>anunciado {diaBR(e.anunciado_em)}</span>
                ) : (
                  <span className="text-[12px]" style={{ color: C.laranja, fontWeight: 600 }}>ainda não anunciado</span>
                )}
                <button onClick={() => setVendendo(vendendo === e.id ? null : e.id)}
                  className="ml-auto rounded-lg px-4 py-2 font-semibold" style={{ background: C.verde, color: "#fff" }}>
                  Vender
                </button>
              </div>

              {/* ---- mandar para um lojista do cadastro ---- */}
              {enviando === e.id && (
                <div className="mt-2 rounded-lg p-2.5" style={{ background: C.bg }}>
                  {compradores.length ? (
                    <>
                      <div className="text-[11px] uppercase tracking-[0.1em]" style={{ color: C.mute }}>Abrir o WhatsApp com o descritivo pronto</div>
                      <div className="mt-1.5 flex flex-wrap gap-1.5">
                        {compradores.filter((k) => k.ativo !== false && k.telefone).map((k) => (
                          <a key={k.id} href={zap(k.telefone, gerarDescritivo(f, fotos))} target="_blank" rel="noreferrer"
                            onClick={() => { if (!e.anunciado_em) mexer(e, { anunciado_em: true }); }}
                            className="rounded-lg px-3 py-1.5 text-[13px] font-semibold"
                            style={{ background: "#fff", border: `1px solid ${C.verde}`, color: C.verde }}>
                            {k.nome}
                          </a>
                        ))}
                      </div>
                      {!compradores.filter((k) => k.telefone).length && (
                        <p className="mt-1 text-[12px]" style={{ color: C.mute }}>Nenhum lojista com telefone no cadastro. O telefone entra quando você cadastra o comprador numa venda.</p>
                      )}
                    </>
                  ) : (
                    <p className="text-[12px]" style={{ color: C.mute }}>Nenhum lojista cadastrado ainda. Eles entram no cadastro quando você registra a primeira venda.</p>
                  )}
                </div>
              )}

              {vendendo === e.id && (
                <div className="mt-2">
                  <VenderCarro e={e} aoFechar={() => setVendendo(null)}
                    aoVender={async (dados) => {
                      try { await atualizarEstoque(e.id, dados); setVendendo(null); carregar(); }
                      catch (ex) { setErro(ex.message); }
                    }} />
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

async function fin(recurso, q, opcoes) {
  const qs = comoQuery({ recurso, ...(q || {}) });
  const r = await fetchAut(`/api/financeiro?${qs}`, opcoes);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "O financeiro não respondeu.");
  return d;
}
const finJson = (metodo, corpo) => ({ method: metodo, headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });

const rs2 = (v) => (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// CSV com ; e vírgula decimal: abre direto no Excel em português.
function baixarCSV(nome, cabecalho, linhas) {
  const esc = (v) => { const t = String(v == null ? "" : v); return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const num = (v) => (typeof v === "number" ? v.toFixed(2).replace(".", ",") : esc(v));
  const txt = "\ufeff" + [cabecalho.map(esc).join(";")].concat(linhas.map((l) => l.map(num).join(";"))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const TIPOS_NEG_ROT = { pagto_cliente: "Pagto cliente", quitacao: "Quitação", debitos: "Débitos", pagto_lojista: "Pagto lojista", reembolso: "Reembolso", outro: "Outro" };

function TelaFinanceiro({ perfil, comp, mes }) {

  return (
    <div>

        sub="Área restrita: extrato conciliado, DRE, conferência dos carros e folha." />
      <div className="mb-4 flex flex-wrap gap-1.5">
        {ABAS.map(([v, r]) => (
          <button key={v} onClick={() => setAba(v)} className="rounded-full px-3.5 py-1.5 text-[13px] font-semibold"
            style={{ background: aba === v ? C.roxo : C.paper, color: aba === v ? "#fff" : C.ink, border: `1px solid ${aba === v ? C.roxo : C.line}` }}>{r}</button>
        ))}
      </div>
      {aba === "lancamentos" && <FinLancamentos comp={comp} />}
      {aba === "dre" && <FinDRE comp={comp} />}
      {aba === "carros" && <FinCarros comp={comp} />}

    </div>
  );
}

/* ---------------- lançamentos ---------------- */

function FinLancamentos({ comp }) {
  const [contas, setContas] = useState([]);
  const [conta, setConta] = useState("");
  const [cats, setCats] = useState([]);
  const [d, setD] = useState(null);
  const [erro, setErro] = useState("");
  const [novo, setNovo] = useState(null);
  const [importando, setImportando] = useState(false);
  const [filtroCat, setFiltroCat] = useState("");
  const [soPendentes, setSoPendentes] = useState(false);
  const [fech, setFech] = useState(null);
  const [carros, setCarros] = useState([]);

  useEffect(() => {
    fin("conta").then((x) => { setContas(x.lista); if (!conta && x.lista[0]) setConta(x.lista[0].id); }).catch((e) => setErro(e.message));
    fin("categoria").then((x) => setCats(x.lista)).catch(() => {});
    fin("estoque").then((x) => setCarros(x.estoque)).catch(() => {});
  }, []);
  const carregar = () => {
    if (!conta) return;
    setD(null); setErro("");
    fin("lancamento", { competencia: comp, conta_id: conta }).then(setD).catch((e) => setErro(e.message));
    fin("fechamento", { competencia: comp, conta_id: conta }).then(setFech).catch(() => setFech(null));
  };
  useEffect(carregar, [conta, comp]);

  const lote = async (itens) => {
    if (!itens.length) return;
    try { await fin("lancamento", { acao: "lote" }, finJson("PATCH", { itens })); carregar(); }
    catch (e) { setErro(e.message); }
  };
  const gravarFech = async (mud) => {
    try { await fin("fechamento", { competencia: comp, conta_id: conta }, finJson("PUT", mud)); carregar(); }
    catch (e) { setErro(e.message); }
  };
  const exportar = () => {
    if (!d) return;
    let sal = d.saldo_anterior || 0;
    baixarCSV(`lancamentos-${String(comp).slice(0, 7)}.csv`,
      ["Data", "Competência", "Categoria", "Descrição", "Carro", "Débito", "Crédito", "Saldo", "Conciliado"],
      d.lancamentos.map((l) => { sal += (Number(l.credito) || 0) - (Number(l.debito) || 0);
        return [diaBR(l.data) + "/" + String(l.data).slice(0, 4), String(l.competencia).slice(0, 7), l.fin_categoria ? l.fin_categoria.nome : "", l.descricao || "",
          l.estoque && l.estoque.veiculo ? l.estoque.veiculo.placa : "", Number(l.debito) || 0, Number(l.credito) || 0, sal, l.conciliado ? "sim" : "não"]; }));
  };

  const mudar = async (l, mud) => {
    try { await fin("lancamento", { id: l.id }, finJson("PATCH", mud)); carregar(); }
    catch (e) { setErro(e.message); }
  };
  const apagar = async (l) => {
    if (!window.confirm(`Apagar "${l.descricao || "lançamento"}" de ${rs2(l.debito || l.credito)}?`)) return;
    try { await fin("lancamento", { id: l.id }, { method: "DELETE" }); carregar(); }
    catch (e) { setErro(e.message); }
  };
  // Enter grava e deixa o formulário aberto com a mesma data e
  // categoria: lançar vinte linhas do dia é o trabalho, e vinte cliques
  // em "+ lançamento" não são.
  const gravarNovo = async () => {
    if (!novo) return;
    try {
      await fin("lancamento", null, finJson("POST", { ...novo, conta_id: conta }));
      setNovo({ ...novo, descricao: "", debito: "", credito: "" }); carregar();
    } catch (e) { setErro(e.message); }
  };
  const aoEnter = (e) => { if (e.key === "Enter") { e.preventDefault(); gravarNovo(); } };

  const lista = (d ? d.lancamentos : []).filter((l) => (!filtroCat || (l.fin_categoria && l.fin_categoria.id === filtroCat)) && (!soPendentes || !l.categoria_id || !l.conciliado));
  const sug = (d && d.sugestoes) || {};
  const comSugestao = (d ? d.lancamentos : []).filter((l) => !l.categoria_id && sug[l.id]);
  const semCategoria = (d ? d.lancamentos : []).filter((l) => !l.categoria_id).length;
  const catNome = (id) => { const c = cats.filter((x) => x.id === id)[0]; return c ? c.nome : ""; };
  let saldo = d && d.saldo_anterior != null ? d.saldo_anterior : 0;
  const totais = (d ? d.lancamentos : []).reduce((t, l) => ({ deb: t.deb + (Number(l.debito) || 0), cred: t.cred + (Number(l.credito) || 0) }), { deb: 0, cred: 0 });
  const catSel = (l) => (
    <select value={(l.fin_categoria && l.fin_categoria.id) || ""} onChange={(e) => mudar(l, { categoria_id: e.target.value || null })}
      className="max-w-[140px] rounded border px-1 py-0.5 text-[12px] outline-none"
      style={{ ...inputSty, borderColor: l.fin_categoria ? C.line : C.laranja }}>
      <option value="">— sem categoria —</option>
      {cats.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
    </select>
  );

  return (
    <div className="space-y-3">
      <div className="flex flex-wrap items-center gap-2">
        <select className="rounded-lg border px-3 py-2 text-[14px] outline-none" style={{ ...inputSty, fontWeight: 600 }}
          value={conta} onChange={(e) => setConta(e.target.value)}>
          {contas.map((c) => <option key={c.id} value={c.id}>{c.nome}{c.empresa ? ` · ${c.empresa}` : ""}</option>)}
        </select>
        <select className="rounded-lg border px-3 py-2 text-[13px] outline-none" style={inputSty} value={filtroCat} onChange={(e) => setFiltroCat(e.target.value)}>
          <option value="">Todas as categorias</option>
          {cats.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
        <label className="flex items-center gap-1 text-[12px]" style={{ color: C.mute }}>
          <input type="checkbox" checked={soPendentes} onChange={(e) => setSoPendentes(e.target.checked)} /> só pendentes
        </label>
        <span className="ml-auto flex flex-wrap gap-3 text-[13px]">
          {!!comSugestao.length && (
            <button onClick={() => lote(comSugestao.map((l) => ({ id: l.id, categoria_id: sug[l.id] })))} style={{ color: C.verde, fontWeight: 600 }}>
              aplicar {comSugestao.length} sugest{comSugestao.length === 1 ? "ão" : "ões"}
            </button>
          )}
          <button onClick={exportar} style={{ color: C.mute, fontWeight: 600 }}>CSV</button>
          <button onClick={() => setImportando(!importando)} style={{ color: C.roxo, fontWeight: 600 }}>importar extrato</button>
          <button onClick={() => setNovo({ data: hojeEmSP(), competencia: comp, descricao: "", debito: "", credito: "", categoria_id: "" })} style={{ color: C.roxo, fontWeight: 600 }}>+ lançamento</button>
        </span>
      </div>

      {/* ---- o fechamento: o número do banco contra o número da casa ---- */}
      {d && fech && (
        <div className="flex flex-wrap items-center gap-x-5 gap-y-2 rounded-xl px-4 py-3 text-[13px]"
          style={{ background: fech.diferenca != null && Math.abs(fech.diferenca) < 0.005 ? "#E8F3EE" : C.paper, border: `1px solid ${C.line}` }}>
          <span><span style={{ color: C.mute }}>Saldo calculado em {diaBR(faixaDoMes(comp).ate)}</span> <b style={{ fontVariantNumeric: "tabular-nums" }}>{rs2(fech.saldo_calculado)}</b></span>
          <label className="flex items-center gap-1.5"><span style={{ color: C.mute }}>Saldo no banco</span>
            <input className="w-32 rounded border px-2 py-1 text-right text-[13px] outline-none" style={{ ...inputSty, fontFamily: F.mono }} inputMode="decimal"
              defaultValue={fech.saldo_banco == null ? "" : rs2(fech.saldo_banco)}
              onBlur={(e) => { const v = e.target.value.trim(); if ((v === "" ? null : v) !== (fech.saldo_banco == null ? null : rs2(fech.saldo_banco))) gravarFech({ saldo_banco: v === "" ? null : v }); }} />
          </label>
          {fech.diferenca != null && (
            <span style={{ fontWeight: 700, color: Math.abs(fech.diferenca) < 0.005 ? C.verde : C.laranja, fontVariantNumeric: "tabular-nums" }}>
              {Math.abs(fech.diferenca) < 0.005 ? "conciliado" : `diferença ${rs2(fech.diferenca)}`}
            </span>
          )}
          <span style={{ color: semCategoria ? C.laranja : C.mute }}>{semCategoria} sem categoria</span>
          <span style={{ color: fech.nao_conciliados ? AMARELO.texto : C.mute }}>{fech.nao_conciliados} não conciliado{fech.nao_conciliados === 1 ? "" : "s"}</span>
          {!!d.lancamentos.filter((l) => !l.conciliado).length && (
            <button onClick={() => lote(d.lancamentos.filter((l) => !l.conciliado).map((l) => ({ id: l.id, conciliado: true })))} className="font-semibold" style={{ color: C.roxo }}>conciliar o mês</button>
          )}
          <button onClick={() => gravarFech({ fechar: !fech.fechado_em })} className="ml-auto font-semibold" style={{ color: fech.fechado_em ? C.mute : C.roxo }}>
            {fech.fechado_em ? `fechado em ${diaBR(fech.fechado_em)} · reabrir` : "fechar o mês"}
          </button>
        </div>
      )}

      {erro && <p className="text-[13px]" style={{ color: C.laranja }}>{erro}</p>}
      {importando && <FinImportar contaId={conta} aoTerminar={() => { setImportando(false); carregar(); fin("categoria").then((x) => setCats(x.lista)).catch(() => {}); }} />}

      {novo && (
        <div className="rounded-xl p-4" style={{ background: C.paper, border: `1px solid ${C.roxo}` }} onKeyDown={aoEnter}>
          <div className="grid gap-2 lg:grid-cols-6">
            <label><Rotulo>Data</Rotulo><input type="date" className={inputCls} style={inputSty} value={novo.data} onChange={(e) => setNovo({ ...novo, data: e.target.value })} /></label>
            <label><Rotulo>Competência</Rotulo><input type="month" className={inputCls} style={inputSty} value={String(novo.competencia).slice(0, 7)} onChange={(e) => setNovo({ ...novo, competencia: `${e.target.value}-01` })} /></label>

/**
 * Lê o OFX do Itaú — e de qualquer banco: é o padrão OFX 1.x, que é
 * SGML (tag sem fechamento), não XML. Cada <STMTTRN> vira um
 * movimento: DTPOSTED (aaaammdd…), TRNAMT (negativo é débito), MEMO e
 * FITID, o identificador do banco. <LEDGERBAL> traz o saldo final e a
 * data dele.
 *
 * O arquivo costuma vir em Windows-1252, não UTF-8: "TRANSFERÊNCIA"
 * lido como UTF-8 vira "TRANSFER�NCIA". Por isso o arquivo é lido em
 * bytes e decodificado conforme o cabeçalho CHARSET.
 */
function lerOFX(txt) {
  const bloco = (tag, src) => {
    const m = new RegExp("<" + tag + ">([\\s\\S]*?)(?=<\\/" + tag + ">|<" + tag + ">|$)", "gi");
    const r = []; let x; while ((x = m.exec(src))) r.push(x[1]); return r;
  };
  const campo = (tag, src) => { const m = new RegExp("<" + tag + ">([^<\\r\\n]*)", "i").exec(src); return m ? m[1].trim() : ""; };
  const dataDe = (v) => { const m = /^(\d{4})(\d{2})(\d{2})/.exec(String(v || "")); return m ? `${m[1]}-${m[2]}-${m[3]}` : ""; };
  const numero = (v) => { const n = Number(String(v || "").trim().replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const trns = bloco("STMTTRN", txt);
  if (!trns.length) return { erro: "Não achei movimentos (<STMTTRN>) no arquivo. É um OFX de extrato?" };
  const dados = trns.map((b) => {
    const v = numero(campo("TRNAMT", b));
    const memo = campo("MEMO", b) || campo("NAME", b) || campo("TRNTYPE", b);
    return { data: dataDe(campo("DTPOSTED", b)), descricao: memo, debito: v < 0 ? String(-v) : "", credito: v > 0 ? String(v) : "", fitid: campo("FITID", b) };
  }).filter((l) => l.data && (l.debito || l.credito));
  const led = bloco("LEDGERBAL", txt)[0] || "";
  const de = dataDe(campo("DTSTART", txt)), ate = dataDe(campo("DTEND", txt));
  const datas = dados.map((l) => l.data).sort();
  return {
    dados, de: de || datas[0], ate: ate || datas[datas.length - 1],
    saldo_final: led ? numero(campo("BALAMT", led)) : null, saldo_final_em: led ? dataDe(campo("DTASOF", led)) : "",
    banco: campo("ORG", txt) || campo("BANKID", txt), conta: campo("ACCTID", txt),
  };
}
async function lerArquivoOFX(arquivo) {
  const bytes = new Uint8Array(await arquivo.arrayBuffer());
  const cabecalho = new TextDecoder("latin1").decode(bytes.slice(0, 600));
  const utf8 = /CHARSET:\s*UTF-?8|ENCODING:\s*UTF-?8|encoding="utf-8"/i.test(cabecalho);
  try { return lerOFX(new TextDecoder(utf8 ? "utf-8" : "windows-1252").decode(bytes)); }
  catch (e) { return lerOFX(new TextDecoder("latin1").decode(bytes)); }
}

const COLS_EXTRATO = [["data", /^data$/i], ["competencia", /^compet/i], ["categoria", /^tipo|^categoria/i], ["descricao", /^descri/i], ["debito", /^d[eé]bito/i], ["credito", /^cr[eé]dito/i]];
function lerExtrato(txt) {
  const linhas = String(txt || "").split(/\r?\n/).map((l) => l.split("\t"));
  const iCab = linhas.findIndex((l) => l.some((c) => /^descri/i.test(c.trim())) && l.some((c) => /^d[eé]bito/i.test(c.trim())));
  if (iCab < 0) return { erro: "Não achei o cabeçalho — precisa da linha com Descrição, Débito e Crédito." };
  const cab = linhas[iCab].map((c) => c.trim()); const idx = {};
  COLS_EXTRATO.forEach(([k, rx]) => { const i = cab.findIndex((c) => rx.test(c)); if (i >= 0) idx[k] = i; });
  const dados = linhas.slice(iCab + 1).filter((l) => l.some((c) => c.trim())).map((l) => {
    const o = {}; Object.keys(idx).forEach((k) => { o[k] = String(l[idx[k]] || "").trim(); }); return o;
  }).filter((o) => o.data);
  return { dados, colunas: Object.keys(idx) };
}

function FinImportar({ contaId, aoTerminar }) {
  const [modo, setModo] = useState("ofx");
  const [txt, setTxt] = useState(""); const [ofx, setOfx] = useState(null); const [nomeArq, setNomeArq] = useState("");
  const [indo, setIndo] = useState(false); const [res, setRes] = useState(null); const [erro, setErro] = useState("");
  const previa = modo === "ofx" ? ofx : (txt ? lerExtrato(txt) : null);
  const enviar = async () => {
    setIndo(true); setErro("");
    try {
      const corpo = { conta_id: contaId, linhas: previa.dados };
      if (modo === "ofx" && previa.saldo_final != null) { corpo.saldo_final = previa.saldo_final; corpo.saldo_final_em = previa.saldo_final_em; }
      setRes(await fin("importar", null, finJson("POST", corpo)));
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };
  const escolher = async (arq) => {
    if (!arq) return;
    setNomeArq(arq.name); setErro("");
    try { setOfx(await lerArquivoOFX(arq)); } catch (e) { setOfx({ erro: "Não consegui ler o arquivo: " + e.message }); }
  };
  const aba = (v, r) => (
    <button onClick={() => setModo(v)} className="rounded-full px-3 py-1 text-[12px] font-semibold"
      style={{ background: modo === v ? C.roxoFraco : "transparent", color: modo === v ? C.roxo : C.mute }}>{r}</button>
  );
  return (
    <div className="rounded-xl p-4" style={{ background: C.paper, border: `1px solid ${C.roxo}` }}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <span className="flex items-center gap-1"><span className="mr-2 text-[14px] font-semibold">Importar extrato</span>{aba("ofx", "Arquivo OFX (Itaú)")}{aba("colar", "Colar da planilha")}</span>
        <button onClick={aoTerminar} className="text-[12px]" style={{ color: C.mute }}>fechar</button>
      </div>
      {res ? (
        <div className="mt-3 rounded-lg p-3 text-[13px]" style={{ background: "#E8F3EE" }}>
          <b>{res.inseridos}</b> lançamentos novos · {res.repetidos} já existiam · {res.ligados_a_carro} ligados a carro
          {!!res.sem_categoria && <span style={{ color: AMARELO.texto }}> · {res.sem_categoria} sem categoria (a memória vai sugerindo)</span>}
          {!!res.invalidas && <span style={{ color: AMARELO.texto }}> · {res.invalidas} linhas inválidas</span>}
          {res.saldo_inicial != null && <div>Saldo inicial da conta: {rs2(res.saldo_inicial)}</div>}
          {res.fechamento_gravado && <div>Saldo do banco gravado no fechamento de {rotuloMes(res.fechamento_gravado)}.</div>}
          {!!(res.categorias_criadas || []).length && <div>Categorias criadas como despesa: {res.categorias_criadas.join(", ")} — confira o grupo delas.</div>}
          <button onClick={aoTerminar} className="mt-2 font-semibold" style={{ color: C.roxo }}>ver os lançamentos</button>
        </div>
      ) : modo === "ofx" ? (
        <>
          <p className="mt-1 text-[12px]" style={{ color: C.mute }}>No Itaú: Extrato → período → <b>Salvar</b> → OFX. O identificador do banco impede repetição; se o arquivo terminar no último dia do mês, o saldo final já entra na conciliação.</p>
          <label className="mt-3 flex cursor-pointer items-center justify-center rounded-lg border border-dashed px-3 py-6 text-[13px]" style={{ borderColor: C.roxo, color: C.roxo, fontWeight: 600 }}>
            {nomeArq || "Escolher o arquivo .ofx"}
            <input type="file" accept=".ofx,.OFX,.txt,application/x-ofx,text/plain" className="hidden" onChange={(e) => { escolher(e.target.files && e.target.files[0]); e.target.value = ""; }} />
          </label>
          {ofx && ofx.erro && <p className="mt-1 text-[12px]" style={{ color: C.laranja }}>{ofx.erro}</p>}
          {ofx && !ofx.erro && (
            <div className="mt-2 text-[12px]" style={{ color: C.mute }}>
              <b style={{ color: C.ink }}>{ofx.dados.length}</b> movimentos de {diaBR(ofx.de)} a {diaBR(ofx.ate)}{ofx.conta ? ` · conta ${ofx.conta}` : ""}
              {ofx.saldo_final != null && <> · saldo final <b style={{ color: C.ink }}>{rs2(ofx.saldo_final)}</b> em {diaBR(ofx.saldo_final_em)}</>}
              <div className="mt-1 max-h-32 overflow-y-auto rounded border p-2" style={{ borderColor: C.line, fontFamily: F.mono, fontSize: 11 }}>
                {ofx.dados.slice(0, 8).map((l, i) => <div key={i}>{diaBR(l.data)} {String(l.descricao).slice(0, 40)} {l.debito ? "−" + rs2(l.debito) : "+" + rs2(l.credito)}</div>)}
                {ofx.dados.length > 8 && <div>… mais {ofx.dados.length - 8}</div>}
              </div>
            </div>
          )}
        </>
      ) : (
        <>
          <p className="mt-1 text-[12px]" style={{ color: C.mute }}>A aba Lançamentos da planilha (Data, Competência, Tipo pgt, Descrição, Débito, Crédito), com o cabeçalho. "Saldo Anterior" vira o saldo inicial da conta; placa na descrição liga ao carro.</p>
          <textarea className="mt-3 h-40 w-full rounded-lg border p-2 text-[12px] outline-none" style={{ ...inputSty, fontFamily: F.mono }} placeholder="Cole aqui" value={txt} onChange={(e) => setTxt(e.target.value)} />
          {previa && previa.erro && <p className="mt-1 text-[12px]" style={{ color: C.laranja }}>{previa.erro}</p>}
          {previa && !previa.erro && <p className="mt-1 text-[12px]" style={{ color: C.mute }}>{previa.dados.length} linhas · colunas: {previa.colunas.join(", ")}</p>}
        </>
      )}
      {!res && erro && <p className="mt-1 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {!res && <BotaoPrimario onClick={enviar} disabled={indo || !contaId || !previa || !!previa.erro || !previa.dados.length} className="mt-2 w-full">{indo ? "Importando…" : `Importar${previa && !previa.erro ? ` ${previa.dados.length} movimentos` : ""}`}</BotaoPrimario>}
    </div>
  );
}
