/* ===================== sessão ===================== */

/**
 * A sessão vive aqui, fora do React, porque as funções de API são de
 * módulo e precisam do token sem receber props. Um navegador, um
 * usuário — não há risco de troca como haveria no servidor.
 */
const AUTH = { cfg: null, sessao: null, aoSair: null };

async function carregarConfig() {
  if (AUTH.cfg) return AUTH.cfg;
  const r = await fetch("/api/config");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Configuração do servidor indisponível.");
  AUTH.cfg = d;
  return d;
}

const guardarSessao = (s) => {
  AUTH.sessao = s;
  if (s) window.storage.set("vaapty:sessao", JSON.stringify(s)).catch(() => {});
  else window.storage.delete("vaapty:sessao").catch(() => {});
};

async function restaurarSessao() {
  try {
    const r = await window.storage.get("vaapty:sessao");
    if (r && r.value) AUTH.sessao = JSON.parse(r.value);
  } catch (e) {}
  return AUTH.sessao;
}

async function entrar(email, senha) {
  const cfg = await carregarConfig();
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ email: String(email).trim(), password: senha }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // A mensagem do Supabase vem em inglês e não diz nada ao negociador.
    const m = String(d.error_description || d.msg || d.error || "");
    throw new Error(/invalid/i.test(m) ? "E-mail ou senha não conferem." : m || "Não consegui entrar.");
  }
  guardarSessao(d);
  return d;
}

async function renovarSessao() {
  const cfg = await carregarConfig();
  const atual = AUTH.sessao;
  if (!atual || !atual.refresh_token) throw new Error("Sessão expirada.");
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: cfg.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: atual.refresh_token }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { guardarSessao(null); throw new Error("Sessão expirada. Entre de novo."); }
  guardarSessao(d);
  return d;
}

function sair() {
  guardarSessao(null);
  if (AUTH.aoSair) AUTH.aoSair();
}

/**
 * Toda chamada às funções em api/ passa por aqui. O token do Supabase
 * dura uma hora; em vez de vigiar o relógio, deixo o 401 acontecer e
 * renovo uma vez. Se falhar de novo, é sessão morta mesmo.
 */
async function fetchAut(url, opcoes) {
  if (!AUTH.sessao) throw new Error("Entre para continuar.");
  const monta = () => {
    const o = { ...(opcoes || {}) };
    o.headers = { ...(o.headers || {}), Authorization: `Bearer ${AUTH.sessao.access_token}` };
    return o;
  };
  let r = await fetch(url, monta());
  if (r.status === 401) {
    try { await renovarSessao(); } catch (e) { sair(); throw e; }
    r = await fetch(url, monta());
    if (r.status === 401) { sair(); throw new Error("Sessão expirada. Entre de novo."); }
  }
  return r;
}

const RX_AUT = /\b(AUT|AUTOM|CVT|DCT|AT)\b\.?/i;
const RX_MEC = /\b(MEC|MANUAL|MT)\b\.?/i;
function filtrarPorCambio(vs, cambio) {
  if (!cambio) return vs;
  const quer = cambio !== "Manual";
  const f = vs.filter((v) => (quer ? RX_AUT.test(v.nome) : RX_MEC.test(v.nome) || !RX_AUT.test(v.nome)));
  return f.length ? f : vs;
}
function alertaDispersao(vs) {
  if (vs.length < 2) return null;
  const a = vs.map((v) => v.valor);
  const d = Math.max(...a) - Math.min(...a);
  return d < 2000 ? null : `As versões variam ${brl(d)} entre si. Confirme no documento.`;
}

/**
 * O nome que a FIPE devolve é comprido demais para busca de anúncio
 * ("CHEVROLET ONIX HATCH LTZ 1.4 8V FlexPower 5p Mec." não acha nada).
 * Tira a parte que descreve motor e câmbio e fica com marca, modelo,
 * versão e ano — que é como o anúncio costuma ser escrito.
 */
const RX_RUIDO = /^(\d+[.,]\d+|\d+v|\d+p|mec|aut|autom|automatico|flex|flexpower|power|cvt)\.?$/i;
function termoMercadoPadrao(f) {
  const toks = String(f.modelo || "").split(/\s+/).filter((t) => t && !RX_RUIDO.test(t));
  const ano = String(f.ano || "").split("/")[0];
  return [...toks.slice(0, 4), ano].filter(Boolean).join(" ").trim();
}

/**
 * Canais de anúncio. * Canais de anúncio, todos com busca própria — conferi um por um em
 * 27/08/2026 com HYUNDAI/I30.
 *
 * A OLX busca por texto livre; os outros três montam o caminho com
 * marca e modelo separados, e por isso `marca` e `modeloCurto` são
 * guardados na ficha quando a versão FIPE é escolhida.
 *
 * Chaves na Mão ficou de fora: não responde a nenhum dos dois padrões
 * e devolve "página não encontrada". Link quebrado na frente do
 * cliente é pior que canal a menos.
 */

    url: (t) => `https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(t)}` },

  // Tabela: o que o mercado PRATICA. Cada uma mede uma ponta.
  // KBB é varejo; AutoAvaliar é repasse — a ponta que a Vaapty vende.
  // O modelo no KBB fica sob a carroceria (/hatchback/i30/), que a FIPE
  // não devolve, então o link para na marca.
  { chave: "kbb", nome: "KBB — varejo", familia: "tabela", tipo: "marca",
    url: (ma) => `https://www.kbb.com.br/sp/marcas/${fatia(ma)}/` },
  // Tabela transacional de repasse, em consulta pública: escolhe marca,
  // modelo, ano, versão e estado. Fica em subdomínio próprio — a página
  // do produto no site institucional é outra coisa, e pede login.
  { chave: "autoavaliar", nome: "AutoAvaliar — repasse", familia: "tabela", tipo: "fixo",
    url: () => "https://tabela.autoavaliar.com.br/" },
];

const enderecoCanal = (c, termo, marca, modelo) => {
  if (c.tipo === "fixo") return c.url();
  if (c.tipo === "texto") return c.url(termo);
  if (c.tipo === "marca") return marca ? c.url(marca) : null;
  return marca && modelo ? c.url(marca, modelo) : null;
};

const marcaModeloDa = (f) => {
  const partes = String(f.modelo || "").split(/\s+/);
  return [f.marca || partes[0] || "", f.modeloCurto || partes[1] || ""];
};

/**
 * A pesquisa de mercado faz parte do processo: o negociador precisa ter
 * olhado o preço anunciado antes de sentar para negociar. Por isso a
 * etapa P só fecha depois de abrir todos os canais possíveis.
 *
 * "Possíveis" e não "todos": sem marca e modelo separados, os canais de
 * caminho não têm endereço, e exigir clique em link inexistente
 * travaria o atendimento.
 */
function canaisPossiveis(f) {
  const [ma, mo] = marcaModeloDa(f);
  return CANAIS.filter((c) => !!enderecoCanal(c, "x", ma, mo)).map((c) => c.chave);
}
function faltamCanais(f) {
  const vistos = f.canaisVistos || [];
  return canaisPossiveis(f).filter((c) => vistos.indexOf(c) < 0);
}

/**
 * Conferência na FIPE oficial, na ordem MARCA → ANO → MODELO.
 *
 * A FIPE navega marca → modelo → ano, mas aí a lista de modelos mistura
 * o mesmo carro de vinte anos diferentes. Escolhendo o ano antes, a
 * lista de modelos já vem curta e só com o que existiu naquele ano.
 */
function ConferirFipe({ f, set }) {
  const [marcas, setMarcas] = useState([]);
  const [marca, setMarca] = useState("");
  const [ano, setAno] = useState("");
  const [modelos, setModelos] = useState([]);
  const [escolha, setEscolha] = useState("");      // "codigo|combustivel"
  const [res, setRes] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState("");            // marcas | modelos | valor

  const anos = useMemo(() => {
    const atual = new Date().getFullYear();
    const l = [];
    for (let a = atual + 1; a >= 1985; a--) l.push(a);
    return l;
  }, []);

  useEffect(() => {
    setIndo("marcas");
    fipeOficial({ acao: "marcas" })
      .then((d) => {
        setMarcas(d.marcas || []);
        // Adianta o que já se sabe da ficha.
        const alvo = (d.marcas || []).filter((m) =>
          m.nome.toLowerCase() === String(f.marca || "").toLowerCase())[0];
        if (alvo) setMarca(String(alvo.codigo));
        const a = String(f.ano || "").split("/")[1] || String(f.ano || "").split("/")[0];
        if (a && /^\d{4}$/.test(a)) setAno(a);
      })
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  }, []);

  useEffect(() => {
    setModelos([]); setEscolha(""); setRes(null);
    if (!marca || !ano) return;
    setIndo("modelos"); setErro("");
    fipeOficial({ acao: "modelos", marca, ano })
      .then((d) => {
        setModelos(d.modelos || []);
        if (!(d.modelos || []).length) setErro("A FIPE não tem modelos dessa marca nesse ano.");
      })
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  }, [marca, ano]);

  const buscarValor = (valorEscolha) => {
    setEscolha(valorEscolha); setRes(null);
    if (!valorEscolha) return;
    const [codigo, comb] = valorEscolha.split("|");
    setIndo("valor"); setErro("");
    fipeOficial({ acao: "valor", marca, modelo: codigo, ano, combustivel: comb })
      .then(setRes)
      .catch((e) => setErro(e.message))
      .then(() => setIndo(""));
  };

  const usar = () => {
    set({
      fipe: String(res.valor),
      fipeCodigo: res.codigo_fipe || f.fipeCodigo,
      fipeConferida: true,
      fipeOficialCodigo: res.codigo_fipe || "",
      fipeOficialMes: res.mes_referencia || "",
      fipeAutenticacao: res.autenticacao || "",
    });
  };

  const daPlaca = Number(f.fipe) || 0;
  const diferenca = res && daPlaca ? res.valor - daPlaca : 0;

  return (
    <div className="mt-3 rounded-md p-3"
      style={{ background: f.fipeConferida ? "#F0F8F4" : AMARELO.fundo,
               border: `1px solid ${f.fipeConferida ? C.verde : AMARELO.borda}` }}>
      <div className="flex items-baseline justify-between gap-2">
        <span className="text-[10px] uppercase tracking-[0.13em]" style={{ color: f.fipeConferida ? C.verde : AMARELO.texto }}>
          {f.fipeConferida ? "✓ FIPE conferida na fonte" : "Conferir na tabela FIPE oficial"}
        </span>
      </div>

      {f.fipeConferida ? (
        <p className="mt-1 text-[11px] leading-relaxed" style={{ color: C.mute }}>
          {f.fipeOficialCodigo} · {f.fipeOficialMes}
          {f.fipeAutenticacao ? ` · autenticação ${f.fipeAutenticacao}` : ""}
        </p>
      ) : (
        <p className="mt-1 text-[11px] leading-relaxed" style={{ color: AMARELO.texto }}>
          A consulta de placa adivinha a versão. Aqui você confirma na fonte — marca, depois ano, depois modelo.
        </p>
      )}

      <div className="mt-2 space-y-2">
        <div className="grid grid-cols-2 gap-2">
          <Campo label="Marca">
            <select className={inputCls} style={inputSty} value={marca} onChange={(e) => setMarca(e.target.value)}>
              <option value="">{indo === "marcas" ? "carregando…" : "escolha"}</option>
              {marcas.map((m) => <option key={m.codigo} value={m.codigo}>{m.nome}</option>)}
            </select>
          </Campo>
          <Campo label="Ano do modelo">
            <select className={inputCls} style={inputSty} value={ano} onChange={(e) => setAno(e.target.value)}>
              <option value="">escolha</option>
              {anos.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Campo>
        </div>

        <Campo label={`Modelo${modelos.length ? ` — ${modelos.length} naquele ano` : ""}`}>
          <select className={inputCls} style={inputSty} value={escolha}
            disabled={!modelos.length} onChange={(e) => buscarValor(e.target.value)}>
            <option value="">
              {indo === "modelos" ? "carregando…" : !marca || !ano ? "escolha marca e ano antes" : "escolha"}
            </option>
            {modelos.map((m) => (
              <option key={`${m.codigo}-${m.combustivel}`} value={`${m.codigo}|${m.combustivel}`}>{m.nome}</option>
            ))}
          </select>
        </Campo>
      </div>

      {indo === "valor" && <p className="mt-2 text-[11px]" style={{ color: C.mute }}>Consultando a FIPE…</p>}
      {erro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      {res && (
        <div className="mt-2 rounded-md p-3" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
          <div className="text-[19px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: C.roxo }}>
            {res.valor_texto}
          </div>
          <div className="mt-0.5 text-[11px]" style={{ color: C.mute }}>
            {res.modelo} · {res.combustivel} · {res.ano_modelo}
          </div>
          <div className="mt-0.5 text-[10px]" style={{ color: C.mute, fontFamily: F.mono }}>
            {res.codigo_fipe} · {res.mes_referencia} · autenticação {res.autenticacao}
          </div>

          {!!daPlaca && diferenca !== 0 && (
            <div className="mt-2 rounded px-2 py-1.5 text-[11px]"
              style={{ background: AMARELO.fundo, color: AMARELO.texto }}>
              A consulta de placa trouxe {brl(daPlaca)} — diferença de {brl(Math.abs(diferenca))}.
              {" "}Confira se a versão bate antes de usar.
            </div>
          )}
          {!!daPlaca && diferenca === 0 && (
            <div className="mt-2 text-[11px]" style={{ color: C.verde }}>Bate com o valor da consulta de placa.</div>
          )}

          <button onClick={usar} className="mt-2 w-full rounded-md py-2 text-[13px] font-semibold"
            style={{ background: C.roxo, color: "#fff" }}>
            Usar este valor na ficha
          </button>
        </div>
      )}
    </div>
  );
}

/* ===================== desvalorizômetro ===================== */

/**
 * O histórico FIPE do carro, mês a mês. Vale mais na mesa do que
 * qualquer argumento: o cliente ancora no que pagou, e a curva mostra
 * quanto custa continuar esperando.
 *
 * Gráfico em SVG na mão — o projeto não tem build nem biblioteca.
 */
function Desvalorizometro({ chave }) {
  const [d, setD] = useState(null);
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState(false);

  useEffect(() => {
    if (!chave) { setD(null); setErro(""); return; }
    let vivo = true;
    setIndo(true); setErro("");
    consultarDesvalorizacao(chave)
      .then((x) => { if (vivo) setD(x); })
      .catch((e) => { if (vivo) setErro(e.message); })
      .then(() => { if (vivo) setIndo(false); });
    return () => { vivo = false; };
  }, [chave]);

  if (!chave) return null;
  if (indo) return <p className="mt-3 text-[11px]" style={{ color: C.mute }}>Carregando o histórico FIPE…</p>;
  if (erro) return <p className="mt-3 text-[11px]" style={{ color: C.laranja }}>{erro}</p>;
  if (!d || !d.serie || d.serie.length < 2) return null;

  const L = 300, A = 70, m = 4;
  const vals = d.serie.map((x) => x.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const faixa = max - min || 1;
  const px = (i) => m + (i * (L - 2 * m)) / (d.serie.length - 1);
  const py = (v) => m + (A - 2 * m) * (1 - (v - min) / faixa);
  const linha = d.serie.map((x, i) => `${px(i).toFixed(1)},${py(x.valor).toFixed(1)}`).join(" ");
  const area = `${m},${A - m} ${linha} ${(L - m).toFixed(1)},${A - m}`;

  const doze = d.doze_meses;

  return (
    <div className="mt-3 rounded-md p-3" style={{ background: "#FBFAFC", border: `1px solid ${C.line}` }}>
      <div className="text-[10px] uppercase tracking-[0.13em]" style={{ color: C.mute }}>
        Desvalorizômetro · FIPE mês a mês
      </div>

      <svg viewBox={`0 0 ${L} ${A}`} className="mt-2 block w-full" style={{ height: 70 }} preserveAspectRatio="none">
        <polygon points={area} fill={C.roxoFraco} />
        <polyline points={linha} fill="none" stroke={C.roxo} strokeWidth="1.5" strokeLinejoin="round" />
        <circle cx={px(d.serie.length - 1)} cy={py(vals[vals.length - 1])} r="2.5" fill={C.roxo} />
      </svg>

      <div className="flex justify-between text-[9px]" style={{ color: C.mute, fontFamily: F.mono }}>
        <span>{d.serie[0].mes}</span>
        <span>{d.atual.mes}</span>
      </div>

      {doze && (() => {
        // Carro velho no Brasil tem subido de tabela. Tratar tudo como
        // perda seria mentira na frente do cliente — e o argumento de
        // negociação é outro em cada caso.
        const caiu = doze.reais < 0;
        const cor = caiu ? C.laranja : C.verde;
        return (
          <div className="mt-2 grid grid-cols-2 gap-2">
            <div>
              <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                {caiu ? "Perdeu em 12 meses" : "Subiu em 12 meses"}
              </div>
              <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
                {caiu ? "−" : "+"}{brl(Math.abs(doze.reais))}
              </div>
              <div className="text-[10px]" style={{ color: C.mute }}>
                {Math.abs(doze.pct)}% desde {doze.de}
              </div>
            </div>
            <div>
              <div className="text-[9px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>
                {caiu ? "Por mês parado" : "Por mês"}
              </div>
              <div className="text-[17px] leading-tight" style={{ fontFamily: F.mono, fontWeight: 700, color: cor }}>
                {caiu ? "−" : "+"}{brl(Math.abs(doze.por_mes))}
              </div>
              <div className="text-[10px]" style={{ color: C.mute }}>
                {caiu ? "é o custo de esperar" : "acompanhando a tabela"}
              </div>
            </div>
          </div>
        );
      })()}

      <p className="mt-2 text-[10px] leading-relaxed" style={{ color: C.mute }}>
        {d.desde_o_pico.reais < 0
          ? `Do topo (${brl(d.pico.valor)}, ${d.pico.mes}) até hoje: ${brl(Math.abs(d.desde_o_pico.reais))} a menos — ${Math.abs(d.desde_o_pico.pct)}%.`
          : `Está no maior valor da série (${d.pico.mes}).`}
        {" "}São {d.meses_disponiveis} meses de tabela.
      </p>
    </div>
  );
}

function comprimir(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onerror = () => rej(new Error("Não consegui ler a imagem."));
    l.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Arquivo inválido."));
      img.onload = () => {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res({ src: cv.toDataURL("image/jpeg", q), largura: cv.width, altura: cv.height });
      };
      img.src = l.result;
    };
    l.readAsDataURL(file);
  });
}

const OBRIGATORIOS = [
  ["modelo", "Modelo"], ["ano", "Ano / modelo"], ["cambio", "Câmbio"],
  ["km", "KM atual"], ["placa", "Placa"], ["fipe", "Valor FIPE"],
  ["por", "Valor POR"], ["pneus", "Condição dos 4 pneus"],
  ["opcionais", "Opcionais"], ["gastos", "Gastos / peças"],
];
function faltando(f, fotos) {
  const l = OBRIGATORIOS.filter(([k]) => {
    const v = f[k];
    if (k === "pneus") return v.some((p) => !p);
    if (k === "opcionais") return v.length === 0;
    return v === "" || v == null;
  });
  if (!fotos.length) l.push(["fotos", "Ao menos 1 foto"]);
  return l;
}

const ETAPAS = [
  { id: "A", letra: "A", nome: "Abordagem positiva", curto: "Abordagem" },
  { id: "P", letra: "P", nome: "Pesquise o cliente e o carro", curto: "Pesquisa" },
  { id: "O", letra: "O", nome: "Ofereça uma demonstração envolvente", curto: "Demonstração" },
  { id: "PUB", letra: "▸", nome: "Ficha, descritivo e lançamento", curto: "Lançamento" },
  { id: "ESP", letra: "⏱", nome: "Espera das propostas", curto: "Espera" },
  { id: "N", letra: "N", nome: "Negocie e neutralize objeções", curto: "Negociação" },
  { id: "T", letra: "T", nome: "Tome a iniciativa e feche", curto: "Fechamento" },
  { id: "E", letra: "E", nome: "Estenda o relacionamento", curto: "Relacionamento" },
];

function etapaConcluida(id, f, fotos) {
  switch (id) {
    case "A": return !!f.chegada && f.carroSubiu && f.tempoCombinado;
    case "P": return !!f.motivo && !!f.pretensao && f.decisorPresente && faltamCanais(f).length === 0;
    case "O": return f.mostrouProcesso && f.mostrouTestemunhal;
    case "PUB": return faltando(f, fotos).length === 0 && f.publicado;
    case "ESP": return !!f.esperaIniciadaEm;
    case "N": return f.rodadas.length > 0;
    case "T": return f.aceiteFinal && !!f.valorFechado;
    case "E": return f.avaliacaoGoogle || f.indicacoes.length > 0;
    default: return false;
  }
}

function gerarDescritivo(f, n) {
  const L = ["🏦 VAAPTY / JOINVILLE 🏦", "", `🚗 Modelo: ${f.modelo}`, ""];
  L.push(`🔢 Ano ou Mod: ${f.ano}`);
  L.push(`⚙️ Câmbio: ${(f.cambio || "").toUpperCase()}.`);
  L.push(`⭕ Km: ${Number(f.km).toLocaleString("pt-BR")}${f.kmEntrada ? ` (Pegou c/${Math.round(f.kmEntrada / 1000)}k)` : ""}`);
  L.push(`🗺 Placa: ${mascararPlaca(f.placa)}`);
  L.push(`🍩 Pneus: ${resumoPneus(f.pneus)}`);
  L.push(`💵 FIPE: ${brl(f.fipe)}`);
  L.push(`💵 POR: ${brl(f.por)}`, "");
  L.push(`🛠 GASTOS: ${(f.gastos || "").toUpperCase()}`, "");
  L.push(`❎ OPCIONAIS: ${f.opcionais.join(" / ").toUpperCase()}`);
  if (f.leilao) L.push("", "⚠️ LEILÃO / SINISTRO");
  if (f.gnv) L.push("⛽ GNV");
  if ((f.ressalvas || "").trim()) {
    L.push("", "📌 RESSALVAS:");
    f.ressalvas.split("\n").filter(Boolean).forEach((r) => L.push(`• ${r}`));
  }
  L.push("", `📷 ${n} fotos`, "", "💥💥💥💥💥💥💥💥💥💥", "");
  L.push("💼 NEGOCIADOR", `📲 ${f.negociador || "—"}`, "");
  L.push("☑️ Gerente: THIAGO", "📲 Whats/ligação: (21) 96467-3445", "");
  L.push("☑️ Gerente: WEBERT", "📲 Whats/ligação: (47) 9213-2434");
  return L.join("\n");
}

/* ---------------- utilitários ---------------- */

const brlDoc = (n) =>
  n == null || n === "" || isNaN(n)
    ? "____________"
    : Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const dataExtenso = (d = new Date()) =>
  d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

const hora = (d = new Date()) =>

  const corpo = `<h1>Check list do negócio</h1>

<table class="dados">

${assinaturas("Administrativo", "Financeiro")}

  return moldura({ titulo: "Check list", corpo, protocolo: protocolo(f, "CHK") });
}

function abrirDocumento(html) {
  const j = window.open("", "_blank");
  if (!j) return { ok: false, erro: "O navegador bloqueou a janela. Libere pop-ups para este site." };
  j.document.write(html);
  j.document.close();
  setTimeout(() => j.print(), 400);
  return { ok: true };
}

// O protocolo vive dentro do HTML gerado, no rodapé. Tirá-lo de lá
// evita mexer nas funções de documento só para devolver mais um valor.
const extrairProtocolo = (html) => {
  const m = /Protocolo ([A-Z0-9-]+)/.exec(String(html || ""));
  return m ? m[1] : null;
};

/* ===================== app ===================== */
function VaaptyAponte({ perfil, atendimento, aoVoltar }) {
  // Cada atendimento tem o seu canto no aparelho. Sem isto, abrir o
  // segundo carro sobrescreveria a ficha do primeiro.
  const aid = (atendimento && atendimento.id) || "solto";
  const CH_AT = `vaapty:at:${aid}`;
  const CH_FOTOS = `vaapty:fotos:${aid}`;
  const CH_VEIC = `vaapty:veiculo:${aid}`;

  const [f, setF] = useState(VAZIO);
  const [fotos, setFotos] = useState([]);
  const [etapa, setEtapa] = useState("A");
  const [copiado, setCopiado] = useState("");
  const [agora, setAgora] = useState(Date.now());

  const [placaBusca, setPlacaBusca] = useState("");
  const [buscando, setBuscando] = useState(false);
  const [erroBusca, setErroBusca] = useState("");
  const [achado, setAchado] = useState(null);
  const [cambioBusca, setCambioBusca] = useState("");
  const [cota, setCota] = useState(null);

  const [termoMercado, setTermoMercado] = useState("");
  const [cliente, setCliente] = useState({
    cliente_nome: (atendimento && atendimento.cliente_nome) || "",
    cliente_telefone: (atendimento && atendimento.cliente_telefone) || "",
    cliente_cpf: (atendimento && atendimento.cliente_cpf) || "",
    cliente_rg: (atendimento && atendimento.cliente_rg) || "",
    cliente_endereco: (atendimento && atendimento.cliente_endereco) || "",
  });
  const [checklist, setChecklist] = useState(null);
  const [statusAtual, setStatusAtual] = useState((atendimento && atendimento.status) || "aberto");
  const [erroStatus, setErroStatus] = useState("");
  const [salvandoCliente, setSalvandoCliente] = useState(false);
  const [erroCliente, setErroCliente] = useState("");
  const [erroCanais, setErroCanais] = useState("");
  const [propostas, setPropostas] = useState((atendimento && atendimento.proposta) || []);
  const melhorProposta = useMemo(() => {
    const v = propostas.map((p) => Number(p.valor) || 0);
    return v.length ? Math.max(...v) : 0;
  }, [propostas]);
  const [novaRodada, setNovaRodada] = useState({ impresso: "", contra: "" });
  const [novaInd, setNovaInd] = useState({ nome: "", fone: "" });
  const [erroFoto, setErroFoto] = useState("");
  const [veiculoId, setVeiculoId] = useState(null);
  const [pronto, setPronto] = useState(false);
  const fotosRef = useRef([]);
  const fRef = useRef(VAZIO);
  const [erroDoc, setErroDoc] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [salvo, setSalvo] = useState(null);
  const [erroSalvar, setErroSalvar] = useState("");
  const camRef = useRef(null); const galRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(CH_AT);
        if (r && r.value) { const n = { ...VAZIO, ...JSON.parse(r.value) }; fRef.current = n; setF(n); }
      } catch (e) {}

      let vid = null;
      const vEmbutido = atendimento && (atendimento.veiculo || [])[0];
      if (vEmbutido && vEmbutido.id) { vid = vEmbutido.id; setVeiculoId(vid); }
      else {
        try {
          const r = await window.storage.get(CH_VEIC);
          if (r && r.value) { vid = JSON.parse(r.value).id || null; setVeiculoId(vid); }
        } catch (e) {}
      }

      // No aparelho só sobra o que ainda não subiu.
      let pendentes = [];
      try { const r = await window.storage.get(CH_FOTOS); if (r && r.value) pendentes = JSON.parse(r.value); } catch (e) {}
      pendentes = (Array.isArray(pendentes) ? pendentes : [])
        .filter((p) => p && p.local)
        .map((p, i) => ({
          chave: p.chave || `p${i}-${Math.random().toString(36).slice(2, 7)}`,
          local: p.local, largura: p.largura, altura: p.altura, id: null, url: null,
          estado: "erro", erro: p.erro || "Ficou pendente do atendimento anterior.",
        }));

      let doServidor = [];
      if (vid) {
        try {
          doServidor = (await listarFotos(vid)).map((x) => ({
            chave: `s-${x.id}`, id: x.id, caminho: x.caminho, url: x.url,
            local: null, estado: "ok", erro: "",
          }));
        } catch (e) { setErroFoto(e.message); }
      }

      aplicar(() => [...doServidor, ...pendentes]);
      setPronto(true);
      setCota(await consultarCota());
    })();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // O celular não guarda foto que já está no servidor. Quando a última
  // sobe, a chave sai do localStorage inteira.
  useEffect(() => {
    if (!pronto) return;
    const pend = fotos
      .filter((p) => p.estado !== "ok" && p.local)
      .map((p) => ({ chave: p.chave, local: p.local, largura: p.largura, altura: p.altura, erro: p.erro || "" }));
    if (!pend.length) window.storage.delete(CH_FOTOS).catch(() => {});
    else window.storage.set(CH_FOTOS, JSON.stringify(pend))
      .catch(() => setErroFoto("Não coube no armazenamento local."));
  }, [fotos, pronto]);

  const guardarFicha = (n) => {
    fRef.current = n;
    setF(n); window.storage.set(CH_AT, JSON.stringify(n)).catch(() => {});
  };
  const set = (k, v) => guardarFicha({ ...fRef.current, [k]: v });
  const setVarios = (o) => guardarFicha({ ...fRef.current, ...o });
  // fotosRef é a versão autoritativa: o upload é assíncrono e não pode
  // ler estado velho de dentro de uma closure.
  const aplicar = (fn) => { const n = fn(fotosRef.current); fotosRef.current = n; setFotos(n); };
  const mudarFoto = (chave, mud) =>
    aplicar((prev) => prev.map((p) => (p.chave === chave ? { ...p, ...mud } : p)));

  const buscar = async () => {
    setErroBusca(""); setAchado(null); setBuscando(true); setCambioBusca(f.cambio || "");
    try { setAchado(await consultarPlaca(placaBusca)); setCota(await consultarCota()); }
    catch (e) { setErroBusca(e.message); }
    setBuscando(false);
  };
  const escolherVersao = (v) => {
    setVarios({
      placa: achado.placa, modelo: `${achado.marca} ${v.nome}`,
      ano: `${achado.anoFabricacao || ""}/${v.anoModelo || achado.anoModelo || ""}`,
      fipe: String(Math.round(v.valor)), fipeCodigo: v.codigoFipe,
      fipeDesval: v.desvalorizometro || "",
      marca: achado.marca || "",
      modeloCurto: String(achado.modeloAbreviado || "").split(/\s+/)[0] || "",
      chassi: achado.chassiCompleto ? achado.chassi : "",
      cor: achado.cor || "", combustivel: v.combustivel || achado.combustivel || "",
      cambio: cambioBusca || f.cambio,
    });
    setAchado(null); setPlacaBusca("");
  };

  const enviarFoto = async (chave, vid) => {
    const alvo = fotosRef.current.find((p) => p.chave === chave);
    if (!alvo || alvo.estado === "ok" || alvo.estado === "enviando" || !alvo.local) return;
    mudarFoto(chave, { estado: "enviando", erro: "" });
    try {
      const ordem = Math.max(0, fotosRef.current.findIndex((p) => p.chave === chave));
      const d = await subirFoto(vid, alvo, ordem);
      mudarFoto(chave, { estado: "ok", id: d.id, caminho: d.caminho, url: d.url, local: null, erro: "" });
    } catch (e) {
      // A imagem continua no aparelho: "tentar de novo" reaproveita.
      mudarFoto(chave, { estado: "erro", erro: e.message });
    }
  };

  const receberFotos = async (ev) => {
    setErroFoto("");
    const arqs = Array.from(ev.target.files || []);
    if (!arqs.length) return;
    const espaco = MAX_FOTOS - fotosRef.current.length;
    if (espaco <= 0) { setErroFoto(`Limite de ${MAX_FOTOS} fotos.`); return; }
    const novas = [];
    for (const a of arqs.slice(0, espaco)) {
      try {
        const img = await comprimir(a);
        novas.push({
          chave: `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          local: img.src, largura: img.largura, altura: img.altura,
          id: null, url: null, estado: "aguardando", erro: "",
        });
      } catch (e) { setErroFoto(e.message); }
    }
    if (novas.length) {
      aplicar((prev) => [...prev, ...novas]);
      if (veiculoId) for (const n of novas) await enviarFoto(n.chave, veiculoId);
    }
    ev.target.value = "";
  };

  const salvarOrdem = async (lista) => {
    const ordens = lista.map((p, i) => ({ id: p.id, ordem: i })).filter((o) => o.id);
    if (!ordens.length) return;
    try { await gravarOrdemFotos(ordens); } catch (e) { setErroFoto(e.message); }
  };
  const definirCapa = async (i) => {
    const n = [...fotosRef.current];
    const [x] = n.splice(i, 1); n.unshift(x);
    aplicar(() => n);
    await salvarOrdem(n);
  };
  const removerFoto = async (i) => {
    const alvo = fotosRef.current[i];
    if (!alvo) return;
    if (alvo.id) {
      try { await apagarFotoServidor(alvo.id); }
      catch (e) { setErroFoto(e.message); return; }
    }
    const n = fotosRef.current.filter((_, x) => x !== i);
    aplicar(() => n);
    await salvarOrdem(n);
  };

  /**
   * Gera, abre para impressão e registra. A abertura da janela precisa
   * acontecer no mesmo passo do clique — pop-up aberto depois de um
   * await é bloqueado pelo navegador.
   */
  const gerarDocumento = async (tipo, rotulo, html, rodada) => {
    setErroDoc("");
    const r = abrirDocumento(html);
    if (!r.ok) { setErroDoc(r.erro); return; }

    const reg = {
      tipo, rotulo,
      rodada: rodada == null ? null : rodada,
      protocolo: extrairProtocolo(html),
      em: new Date().toISOString(),
      noBanco: false,
    };

    if (veiculoId) {
      try {
        await registrarDocumento({
          veiculo_id: veiculoId, tipo, rodada: reg.rodada,
          protocolo: reg.protocolo, conteudo: html, negociador: fRef.current.negociador,
        });
        reg.noBanco = true;
      } catch (e) { setErroDoc(e.message); }
    }

    guardarFicha({ ...fRef.current, documentos: [...(fRef.current.documentos || []), reg] });
  };

  // Sem estes quatro, o documento sai com lacuna. E papel com lacuna
  // volta para ser preenchido depois — que é como contrato acaba
  // assinado pela metade.
  const OBRIG_CLIENTE = [
    ["cliente_nome", "Nome"], ["cliente_cpf", "CPF"],
    ["cliente_rg", "RG"], ["cliente_endereco", "Endereço"],
  ];
  const faltamCliente = OBRIG_CLIENTE.filter(([k]) => !String(cliente[k] || "").trim());
  const podeImprimir = faltamCliente.length === 0;

  /**
   * `manual` distingue o clique do negociador da transição automática.
   * Escolha à mão vale sempre; a automática só empurra para frente e só
   * enquanto ninguém escolheu um status que o sistema não sabe deduzir.
   */
  const mudarStatus = async (novo, manual) => {
    if (!atendimento || novo === statusAtual) return;
    if (!manual) {
      if (avancoDe(statusAtual) < 0) return;                 // status escolhido à mão: não mexe
      if (avancoDe(novo) <= avancoDe(statusAtual)) return;   // nunca volta
    }
    const antes = statusAtual;
    setStatusAtual(novo); setErroStatus("");
    try { await atualizarAtendimento(atendimento.id, { status: novo }); }
    catch (e) { setStatusAtual(antes); setErroStatus(e.message); }
  };

  // Segue o preenchimento: carro no pátio, lançamento, propostas,
  // rodadas, fechamento.
  useEffect(() => {
    const derivado = statusDerivado(f, propostas);
    if (derivado) mudarStatus(derivado, false);
  }, [f.carroSubiu, f.publicado, f.aceiteFinal, f.valorFechado, f.rodadas.length, propostas.length]);

  const salvarCliente = async () => {
    if (!atendimento) { setErroCliente("Abra o atendimento pela lista para salvar."); return; }
    setErroCliente(""); setSalvandoCliente(true);
    try { await atualizarAtendimento(atendimento.id, cliente); }
    catch (e) { setErroCliente(e.message); }
    setSalvandoCliente(false);
  };

  const blocoCliente = (
    <Bloco titulo="Dados do cliente" sub="O documento só imprime com os quatro preenchidos. Papel com lacuna volta para ser completado depois — e é assim que contrato acaba assinado pela metade.">
      <div className="space-y-2.5">
        <Campo label="Nome completo" req>
          <input className={inputCls} style={inputSty} value={cliente.cliente_nome}
            onChange={(e) => setCliente({ ...cliente, cliente_nome: e.target.value })} />
        </Campo>
        <div className="grid grid-cols-2 gap-2.5">
          <Campo label="CPF" req>
            <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
              value={cliente.cliente_cpf} onChange={(e) => setCliente({ ...cliente, cliente_cpf: e.target.value })} />
          </Campo>
          <Campo label="RG" req>
            <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }}
              value={cliente.cliente_rg} onChange={(e) => setCliente({ ...cliente, cliente_rg: e.target.value })} />
          </Campo>
        </div>
        <Campo label="Endereço completo" req>
          <input className={inputCls} style={inputSty} placeholder="Rua, número, bairro, cidade"
            value={cliente.cliente_endereco} onChange={(e) => setCliente({ ...cliente, cliente_endereco: e.target.value })} />
        </Campo>
        <Campo label="Telefone">
          <input className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="tel"
            value={cliente.cliente_telefone} onChange={(e) => setCliente({ ...cliente, cliente_telefone: e.target.value })} />
        </Campo>

        <button onClick={salvarCliente} disabled={salvandoCliente}
          className="w-full rounded-md py-2.5 text-[13px] font-semibold"
          style={{ background: salvandoCliente ? C.line : C.roxo, color: "#fff" }}>
          {salvandoCliente ? "Salvando…" : "Salvar dados do cliente"}
        </button>
        {erroCliente && <p className="text-[12px]" style={{ color: C.laranja }}>{erroCliente}</p>}
        {!podeImprimir && (
          <p className="text-[11px]" style={{ color: AMARELO.texto }}>
            Falta {faltamCliente.map((x) => x[1]).join(" · ")} para liberar a impressão.
          </p>
        )}
      </div>
    </Bloco>
  );

  const copiar = (t, tag) => {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    setCopiado(tag); setTimeout(() => setCopiado(""), 1800);
  };

  const corpoBanco = useMemo(() => JSON.stringify(fichaParaBanco(f)), [f]);
  const salvoAtual = !!salvo && salvo.corpo === corpoBanco;

  const salvarNoBanco = async () => {
    setErroSalvar(""); setSalvando(true);
    try {
      const d = await salvarFicha({ ...JSON.parse(corpoBanco), atendimento_id: atendimento ? atendimento.id : null });
      const t = new Date(d.salvo_em);
      setSalvo({ hora: isNaN(t.getTime()) ? new Date() : t, criado: !!d.criado, corpo: corpoBanco });
      if (d.id) {
        setVeiculoId(d.id);
        window.storage.set(CH_VEIC, JSON.stringify({ id: d.id, placa: d.placa })).catch(() => {});
        // Foto tirada antes de existir veículo estava só esperando por isto.
        for (const p of fotosRef.current.filter((x) => x.estado !== "ok" && x.local)) {
          await enviarFoto(p.chave, d.id);
        }

        // Documento gerado antes de existir veículo: registra agora. O
        // HTML já se perdeu (não fica no aparelho), então a linha vai
        // sem conteúdo — dá para saber que existiu, não o que dizia.
        const feitos = [];
        for (const doc of (fRef.current.documentos || []).filter((x) => !x.noBanco)) {
          try {
            await registrarDocumento({
              veiculo_id: d.id, tipo: doc.tipo, rodada: doc.rodada,
              protocolo: doc.protocolo, conteudo: null, negociador: fRef.current.negociador,
            });
            feitos.push(doc.em);
          } catch (e) { setErroDoc(e.message); }
        }
        if (feitos.length) {
          guardarFicha({
            ...fRef.current,
            documentos: (fRef.current.documentos || []).map((x) =>
              feitos.indexOf(x.em) >= 0 ? { ...x, noBanco: true } : x),
          });
        }
      }
    } catch (e) { setErroSalvar(e.message); }
    setSalvando(false);
  };

  const enviadas = useMemo(() => fotos.filter((p) => p.estado === "ok"), [fotos]);
  const subindo = fotos.some((p) => p.estado === "enviando");
  const faltas = useMemo(() => faltando(f, enviadas), [f, enviadas]);
  const liberado = faltas.length === 0;
  // A ficha precisa ir ao banco antes das fotos: é o id dela que dá
  // destino ao upload. Por isso o botão de salvar não espera foto.

/**
 * As ofertas dos lojistas, registradas conforme chegam durante a
 * espera. Na planilha isso eram quatro pares de colunas; aqui não tem
 * teto.
 *
 * A melhor proposta é o número que vai impresso para a mesa, então ela
 * fica destacada — é o que o negociador procura com o cliente olhando.
 */
function Propostas({ atendimentoId, iniciais, aoMudar }) {
  const [lista, setLista] = useState(iniciais || []);
  const [nova, setNova] = useState({ lojista: "", valor: "" });
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");

  const ordenada = [...lista].sort((a, b) => (Number(b.valor) || 0) - (Number(a.valor) || 0));
  const melhor = ordenada.length ? Number(ordenada[0].valor) || 0 : 0;

  const avisar = (n) => { setLista(n); if (aoMudar) aoMudar(n); };

  const adicionar = async () => {
    if (!nova.lojista.trim()) { setErro("Diga de qual lojista é."); return; }
    setErro(""); setIndo(true);
    try {
      const p = await criarProposta({ atendimento_id: atendimentoId, lojista: nova.lojista, valor: nova.valor });
      avisar([...lista, p]);
      setNova({ lojista: "", valor: "" });
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };

  const remover = async (id) => {
    setErro("");
    try { await apagarProposta(id); avisar(lista.filter((x) => x.id !== id)); }
    catch (e) { setErro(e.message); }
  };

  if (!atendimentoId) {
    return (
      <p className="text-[11px] leading-relaxed" style={{ color: C.mute }}>
        As propostas ficam presas ao atendimento. Abra este carro pela lista de atendimentos para registrá-las.
      </p>
    );
  }

  return (
    <div className="space-y-2.5">
      {ordenada.map((p, i) => (
        <div key={p.id} className="flex items-center justify-between gap-2 rounded-md px-3 py-2.5"
          style={{ background: i === 0 ? "#F0F8F4" : "#FBFAFC", border: `1px solid ${i === 0 ? C.verde : C.line}` }}>
          <span>
            <span className="block text-[13px] font-medium">{p.lojista}</span>
            {i === 0 && <span className="text-[9px] uppercase tracking-[0.1em]" style={{ color: C.verde }}>maior oferta</span>}
          </span>
          <span className="flex items-center gap-3">
            <span className="text-[15px]" style={{ fontFamily: F.mono, fontWeight: 700, color: i === 0 ? C.verde : C.ink }}>
              {brl(p.valor)}
            </span>
            <button onClick={() => remover(p.id)} className="text-[11px]" style={{ color: C.laranja }}>remover</button>
          </span>
        </div>
      ))}

      <div className="grid grid-cols-2 gap-2">
        <input placeholder="Lojista" className={inputCls} style={inputSty}
          value={nova.lojista} onChange={(e) => setNova({ ...nova, lojista: e.target.value })} />
        <input placeholder="Valor" className={inputCls} style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric"
          value={nova.valor} onChange={(e) => setNova({ ...nova, valor: e.target.value })} />
      </div>
      <button onClick={adicionar} disabled={indo}
        className="w-full rounded-md py-2.5 text-[13px] font-semibold"
        style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
        {indo ? "Registrando…" : "Registrar proposta"}
      </button>
      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {!!melhor && (
        <p className="text-[11px]" style={{ color: C.mute }}>
          {ordenada.length} proposta{ordenada.length > 1 ? "s" : ""} · maior {brl(melhor)}. É este o número que vai impresso.
        </p>
      )}
    </div>
  );
}

// Aceita 8000, 8.000 e 8.000,00 — o mesmo que o servidor entende.
const numeroBR = (v) => {
  let t = String(v == null ? "" : v).replace(/R\$|\s/g, "").trim();
  if (!t) return 0;
  if (t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  const n = Number(t);
  return Number.isFinite(n) ? n : 0;
};

/**
 * ===== escuta da conversa =====
 *
 * O parecer jurídico saiu em 28/08/2026 e a condição é uma só: o
 * consentimento do cliente vem antes. Por isso o botão do microfone
 * nasce desligado e só acende depois do toggle — não é enfeite, é a
 * base legal. Quem trocar a ordem, ou ligar a escuta sem o toggle,
 * derruba o parecer inteiro.
 *
 * O consentimento fica registrado com data e hora (`escutaEm`), que é
 * o que se mostra se alguém perguntar quando o cliente autorizou.
 *
 * O QUE ISTO É, EXATAMENTE:
 *   · a transcrição usa o reconhecimento de voz do próprio navegador
 *     (`SpeechRecognition`). Sem biblioteca, sem endpoint novo — e a
 *     Vercel já está em 12 de 12 funções.
 *   · **o áudio vai para o serviço de voz da Google ou da Apple**,
 *     conforme o navegador. Não é processamento local, e está escrito
 *     na tela de consentimento porque o cliente precisa saber disso.
 *   · nós não gravamos áudio em lugar nenhum. Só o texto fica, e fica
 *     no aparelho, junto com o resto do atendimento.
 *   · os "sinais" abaixo são busca por palavra, não modelo de
 *     linguagem. Chamar isso de IA na frente de quem decide seria
 *     mentira. Um resumo de verdade precisa de um LLM, o que pede uma
 *     chave paga e uma função — hoje não cabe.
 *
 * Vale como está porque o que trava o negociador não é a falta de
 * resumo: é que ele não anota. O texto corrido mais o destaque de
 * "tem pressa" e "tem outra proposta" já é mais do que ele levaria
 * para a mesa de memória.
 */

const SINAIS = [
  { id: "pressa", rotulo: "Tem pressa", cor: "#C2410C",
    termos: ["preciso do dinheiro", "urgente", "com pressa", "essa semana", "ate sexta", "o quanto antes", "rapido", "hoje mesmo"] },
  { id: "concorrencia", rotulo: "Tem outra proposta", cor: "#B91C1C",
    termos: ["outra proposta", "me ofereceram", "outro lugar", "outra loja", "ja fui em", "olx", "webmotors", "na concorrencia"] },
  { id: "decisor", rotulo: "Decisor não está na mesa", cor: "#A16207",
    termos: ["minha esposa", "meu marido", "meu socio", "vou falar com", "preciso conversar com", "nao decido sozinho"] },
  { id: "divida", rotulo: "Tem dívida no carro", cor: "#7C3AED",
    termos: ["financiado", "financiamento", "parcelas", "devo", "quitar", "banco", "alienado", "em nome do banco"] },
  { id: "objecao", rotulo: "Achou pouco", cor: "#BE123C",
    termos: ["muito pouco", "ta baixo", "esta baixo", "esperava mais", "nao da", "vale mais", "e pouco"] },
  { id: "recuo", rotulo: "Está recuando", cor: "#4B5563",
    termos: ["vou pensar", "depois eu volto", "dar uma olhada", "outro dia", "te aviso"] },
  { id: "fechamento", rotulo: "Sinal de fechamento", cor: "#15803D",
    termos: ["se der", "eu fecho", "aceito", "pode ser", "fechado", "vamos fazer", "topo"] },
];

// O reconhecimento devolve "até" ou "ate" conforme o serviço, e a
// busca não pode depender disso. `semAcento` já existe lá em cima —
// declarar de novo aqui derrubaria a aplicação inteira, como quase
// aconteceu com o `brl` dos documentos.
const sinaisDe = (texto) => {
  const t = semAcento(texto).toLowerCase();
  return SINAIS.filter((s) => s.termos.some((termo) => t.indexOf(termo) >= 0));
};

function Escuta({ f, set }) {
  const Rec = (typeof window !== "undefined") &&
    (window.SpeechRecognition || window.webkitSpeechRecognition);

  const [ouvindo, setOuvindo] = useState(false);
  const [parcial, setParcial] = useState("");
  const [erro, setErro] = useState("");
  const recRef = useRef(null);
  const ligadoRef = useRef(false);
  const textoRef = useRef(f.transcricao || "");

  // O navegador encerra a sessão sozinho depois de um silêncio. Se
  // ainda estamos ligados, religa — senão a escuta morre no meio da
  // conversa sem ninguém perceber.
  const criar = () => {
    const r = new Rec();
    r.lang = "pt-BR";
    r.continuous = true;
    r.interimResults = true;
    r.onresult = (ev) => {
      let novoFinal = "", emAndamento = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const trecho = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) novoFinal += trecho + " ";
        else emAndamento += trecho;
      }
      setParcial(emAndamento);
      if (novoFinal) {
        // Só o trecho fechado vai para a ficha: gravar a cada palavra
        // provisória escreveria no localStorage dezenas de vezes por
        // minuto.
        textoRef.current = (textoRef.current + novoFinal).slice(-8000);
        set("transcricao", textoRef.current);
      }
    };
    r.onerror = (ev) => {
      const c = ev && ev.error;
      if (c === "not-allowed" || c === "service-not-allowed") {
        setErro("O navegador negou o microfone. Libere nas permissões do site.");
        ligadoRef.current = false;
        setOuvindo(false);
      } else if (c !== "no-speech" && c !== "aborted") {
        setErro("A escuta falhou: " + c);
      }
    };
    r.onend = () => {
      if (ligadoRef.current) { try { r.start(); } catch (e) { /* já rodando */ } }
      else setOuvindo(false);
    };
    return r;
  };

  const ligar = () => {
    if (!Rec || !f.escutaOk) return;
    setErro("");
    ligadoRef.current = true;
    recRef.current = criar();
    try { recRef.current.start(); setOuvindo(true); }
    catch (e) { setErro("Não consegui abrir o microfone."); ligadoRef.current = false; }
  };

  const desligar = () => {
    ligadoRef.current = false;
    setParcial("");
    if (recRef.current) { try { recRef.current.stop(); } catch (e) {} }
    setOuvindo(false);
  };

  // Sair da etapa com o microfone aberto seria escuta sem ninguém
  // olhando. Desliga junto.
  useEffect(() => () => { ligadoRef.current = false; if (recRef.current) { try { recRef.current.stop(); } catch (e) {} } }, []);

  const achados = sinaisDe((f.transcricao || "") + " " + parcial);

  return (
    <div>
      <div className="rounded-md p-3" style={{ background: "#FBF7FD", border: `1px solid ${C.line}` }}>
        <Toggle
          label="O cliente foi avisado e autorizou a escuta"
          nota="Leia em voz alta: a conversa vai ser transcrita para texto, o áudio não fica gravado, e a transcrição passa pelo serviço de voz do celular (Google ou Apple). Sem esse aceite o microfone não liga."
          valor={f.escutaOk}
          onChange={(v) => { if (!v) desligar(); set("escutaOk", v); set("escutaEm", v ? new Date().toISOString() : null); }} />
        {f.escutaOk && f.escutaEm && (
          <p className="mt-2 text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>
            autorizado em {new Date(f.escutaEm).toLocaleString("pt-BR")}
          </p>
        )}
      </div>

      {!Rec && (
        <p className="mt-3 text-[12px]" style={{ color: C.laranja }}>
          Este navegador não tem reconhecimento de voz. No celular, use o Chrome (Android) ou o Safari (iPhone).
        </p>
      )}

      {Rec && (
        <button onClick={ouvindo ? desligar : ligar} disabled={!f.escutaOk}
          className="mt-3 w-full rounded-md py-3 text-[14px] font-semibold"
          style={{
            background: ouvindo ? C.laranja : (f.escutaOk ? C.roxo : "#E7E3EC"),
            color: f.escutaOk ? "#fff" : C.mute,
            cursor: f.escutaOk ? "pointer" : "not-allowed",
          }}>
          {ouvindo ? "● Ouvindo — tocar para parar" : "Começar a escutar"}
        </button>
      )}

      {erro && <p className="mt-2 text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

      {achados.length > 0 && (
        <div className="mt-3 flex flex-wrap gap-1.5">
          {achados.map((s) => (
            <span key={s.id} className="rounded-full px-2.5 py-1 text-[11px] font-semibold"
              style={{ background: s.cor + "1A", color: s.cor }}>{s.rotulo}</span>
          ))}
        </div>
      )}

      {(f.transcricao || parcial) && (
        <div className="mt-3">
          <div className="rounded-md px-3 py-2 text-[12px] leading-relaxed"
            style={{ background: "#FAFAFB", border: `1px solid ${C.line}`, maxHeight: 160, overflowY: "auto" }}>
            <span>{f.transcricao}</span>
            <span style={{ color: C.mute }}>{parcial}</span>
          </div>
          <div className="mt-2 flex gap-2">
            <button onClick={() => { textoRef.current = ""; set("transcricao", ""); setParcial(""); }}
              className="text-[11px] underline" style={{ color: C.mute }}>limpar a transcrição</button>
            <button onClick={() => set("notasEspera", (f.notasEspera ? f.notasEspera + "\n\n" : "") + f.transcricao)}
              className="text-[11px] underline" style={{ color: C.roxo }}>copiar para as anotações</button>
          </div>
        </div>
      )}

      <p className="mt-3 text-[11px]" style={{ color: C.mute }}>
        Os destaques acima são busca por palavra, não resumo por IA. Servem para você não perder o gancho — ler a conversa continua sendo seu trabalho.
      </p>
    </div>
  );
}

/**
 * ===== simulador de propostas =====
 *
 * Reproduz, célula por célula, a planilha "Simulador de Proposta" do
 * Derek. Dado o valor de referência do carro e quantas propostas se
 * quer ver, devolve a nuvem de valores no desenho que a rede costuma
 * responder — para treinar negociador novo e para demonstrar o
 * processo ao cliente sem esperar a rede real.
 *
 * A conta da planilha:
 *   Vmax      = arredonda(referência × 0,90)      teto do repasse
 *   Vmedio    = arredonda(Vmax × 0,90)            centro da nuvem
 *   intervalo = arredonda((Vmax − Vmedio) ÷ 5)    largura de um degrau
 *   V0        = Vmedio − 10 × intervalo           piso
 *   proposta  = V0 + sorteio(0..16) × intervalo × |sen(π·n/45)|
 * Tudo arredondado à centena, como lá.
 *
 * O seno é o que dá forma à nuvem, e é a parte que ninguém adivinha
 * olhando o resultado: a proposta nº 1 e a nº 45 nascem coladas no
 * piso, as do meio abrem até o teto. Não é sorteio uniforme — é a
 * curva que a planilha desenha. Quem "simplificar" para um
 * Math.random() entre piso e teto muda o formato da nuvem, e o valor
 * médio para de bater com o da planilha.
 *
 * NADA daqui vira proposta de verdade. O resultado não é gravado na
 * tabela `proposta` e não entra no funil do mês. Se um dia precisar
 * ser gravado, tem que nascer com coluna marcando que é simulação —
 * proposta inventada contada como real estraga a conversão e, pior,
 * pode ir para a mesa do cliente como se um lojista tivesse oferecido.
 */

const cem = (n) => Math.round(n / 100) * 100;

function simularPropostas(referencia, quantidade) {
  const ref = Number(referencia) || 0;
  const qtd = Math.max(1, Math.min(90, Math.round(Number(quantidade) || 0)));
  if (ref <= 0) return null;

  const vmax = cem(ref * 0.9);
  const vmedio = cem(vmax * 0.9);
  const intervalo = cem((vmax - vmedio) / 5);
  const v0 = vmedio - 10 * intervalo;

  const valores = [];
  for (let n = 1; n <= qtd; n++) {
    const sorteio = Math.round(Math.random() * 16);
    const onda = Math.abs(Math.sin((Math.PI * n) / 45));
    valores.push(cem(v0 + sorteio * intervalo * onda));
  }

  const soma = valores.reduce((a, b) => a + b, 0);
  const melhor = valores.reduce((a, b) => (b > a ? b : a), 0);

  // As 17 faixas da planilha (v1..v17), uma barra por degrau.
  const faixas = [];
  for (let i = 0; i < 17; i++) {
    const de = v0 + i * intervalo;
    const ate = de + intervalo;
    faixas.push({ de, ate, quantas: valores.filter((v) => v > de && v <= ate).length });
  }

  return {
    valores, quantidade: qtd, media: soma / qtd, melhor,
    vmax, vmedio, intervalo, v0, faixas,
  };
}

/**
 * O funil da aba PIPELINE: quantos entraram, quantos viraram ficha,
 * quantos receberam proposta e quantos fecharam — no mês e por origem.
 *
 * É o número que diz onde o dinheiro está sendo perdido: fluxo alto com
 * avaliação baixa é problema de abordagem; avaliação alta com proposta
 * baixa é problema de ficha; proposta alta com venda baixa é preço.
 */
/* ----------- importação da planilha ----------- */

const semAcentoMaiusc = (t) =>
  String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();

const DE_ORIGEM = {
  "FLUXO LOJA": "fluxo_loja", "FLUXO DE LOJA": "fluxo_loja", "FLUXO": "fluxo_loja",
  "PROSPECCAO": "prospeccao", "INDICACAO": "indicacao", "TV": "tv",
  "GOOGLE": "google", "GOOGLE/SITE": "google", "SITE": "google",
  "FACEBOOK": "facebook", "FACELEADS": "faceleads", "INSTAGRAM": "facebook",
  "OUTDOOR": "outdoor", "RECUPERACAO": "recuperacao",
  "TELEFONE RECEPTIVO": "outro", "RADIO": "outro",
};
const DE_STATUS = {
  "AGUARDANDO PROPOSTAS": "aguardando_propostas",
  "EM NEGOCIACAO": "em_negociacao",
  "FECHADO": "fechado", "PERDIDO": "perdido",
};

const ehNumero = (v) => {
  const s = String(v || "").replace(/R\$|\s|\./g, "").replace(",", ".");
  return s !== "" && Number.isFinite(Number(s));
};

/**
 * Lê o que o Google Sheets põe na área de transferência: colunas
 * separadas por tabulação.
 *
 * Duas coisas da planilha real que o leitor precisa aguentar:
 *
 *  - PROPOSTAS e LOJISTA se repetem quatro vezes. As colunas são
 *    pareadas na ordem em que aparecem.
 *  - Essas células misturam valor com recado ("02/06/23/Não atendeu",
 *    "Vendeu", "Carro está no Mato Grosso"). O que não é número vira
 *    observação em vez de proposta — e nada se perde.
 */
function lerPlanilha(texto) {
  const linhas = String(texto || "").split(/\r?\n/).map((l) => l.split("\t"));
  const iCab = linhas.findIndex((l) => {
    const c = l.map(semAcentoMaiusc);
    return c.indexOf("PLACA") >= 0 && c.indexOf("CLIENTE") >= 0;
  });
  if (iCab < 0) return { erro: "Não achei o cabeçalho. Copie incluindo a linha com DATA, NEGOCIADOR, CARRO, PLACA…" };

  const cab = linhas[iCab].map(semAcentoMaiusc);
  const um = (nome) => cab.indexOf(nome);
  const todos = (nome) => cab.map((c, i) => (c === nome ? i : -1)).filter((i) => i >= 0);

  const iProp = todos("PROPOSTAS");
  const iLoj = todos("LOJISTA");

  const col = {
    data: um("DATA"), negociador: um("NEGOCIADOR"), prospec: um("PROSPEC"),
    carro: um("CARRO"), placa: um("PLACA"), ano: um("ANO/MOD"), km: um("KM"),
    cliente: um("CLIENTE"), telefone: um("TELEFONE"), origem: um("ORIGEM"),
    status: um("STATUS"), fipe: um("FIPE"), pretensao: um("PRETENSAO"),
  };
  const pega = (l, i) => (i >= 0 && l[i] != null ? String(l[i]).trim() : "");

  const fora = [];
  const prontas = [];

  linhas.slice(iCab + 1).forEach((l) => {
    if (!l.length || l.every((c) => !String(c || "").trim())) return;
    const cliente = pega(l, col.cliente);
    const carro = pega(l, col.carro);
    if (!cliente && !carro) return;   // linha de rodapé ou de total

    const propostas = [];
    const recados = [];
    iProp.forEach((ip, k) => {
      const valor = pega(l, ip);
      const lojista = pega(l, iLoj[k] >= 0 ? iLoj[k] : -1);
      if (valor && ehNumero(valor)) propostas.push({ valor, lojista });
      else if (valor) recados.push(valor);
      if (lojista && !ehNumero(valor) && !propostas.some((p) => p.lojista === lojista)) {
        if (lojista.length > 3) recados.push(lojista);
      }
    });

    const origemBruta = semAcentoMaiusc(pega(l, col.origem));
    const statusBruto = semAcentoMaiusc(pega(l, col.status));
    if (origemBruta && !DE_ORIGEM[origemBruta]) fora.push(`origem "${pega(l, col.origem)}"`);
    if (statusBruto && !DE_STATUS[statusBruto]) fora.push(`status "${pega(l, col.status)}"`);

    prontas.push({
      data: pega(l, col.data),
      negociador_nome: pega(l, col.negociador),
      prospec: pega(l, col.prospec),
      cliente_nome: cliente,
      cliente_telefone: pega(l, col.telefone),
      carro_descricao: carro,
      placa: pega(l, col.placa),
      ano: pega(l, col.ano),
      km: pega(l, col.km),
      fipe: pega(l, col.fipe),
      pretensao: pega(l, col.pretensao),
      origem: DE_ORIGEM[origemBruta] || "outro",
      status: DE_STATUS[statusBruto] || "aberto",
      observacoes: recados.join(" · ") || "",
      propostas,
    });
  });

  return { linhas: prontas, desconhecidos: [...new Set(fora)] };
}

function Importar({ aoTerminar }) {
  const [texto, setTexto] = useState("");
  const [lido, setLido] = useState(null);
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");
  const [feito, setFeito] = useState(null);

  const ler = () => {
    setErro(""); setFeito(null);
    const r = lerPlanilha(texto);
    if (r.erro) { setErro(r.erro); setLido(null); return; }
    if (!r.linhas.length) { setErro("Achei o cabeçalho, mas nenhuma linha com cliente ou carro."); setLido(null); return; }
    setLido(r);
  };

  const enviar = async () => {
    setErro(""); setIndo(true);
    try {
      const lotes = [];
      for (let i = 0; i < lido.linhas.length; i += 400) lotes.push(lido.linhas.slice(i, i + 400));
      const soma = { atendimentos: 0, veiculos: 0, propostas: 0, sem_data: 0 };
      for (const lote of lotes) {
        const r = await importarLinhas(lote);
        soma.atendimentos += r.atendimentos; soma.veiculos += r.veiculos;
        soma.propostas += r.propostas; soma.sem_data += r.sem_data;
      }
      setFeito(soma); setLido(null); setTexto("");
      if (aoTerminar) await aoTerminar();
    } catch (e) { setErro(e.message); }
    setIndo(false);
  };

  const comData = lido ? lido.linhas.filter((l) => l.data).length : 0;
  const comPlaca = lido ? lido.linhas.filter((l) => /^[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}$/.test(String(l.placa).replace(/[^A-Za-z0-9]/g, ""))).length : 0;
  const nProp = lido ? lido.linhas.reduce((a, l) => a + l.propostas.length, 0) : 0;

  return (
    <Bloco titulo="Importar a planilha" sub="No Google Sheets: selecione da linha de cabeçalho até a última, ⌘C, e cole aqui.">
      <div className="space-y-2.5">
        <textarea rows={4} className={inputCls} style={{ ...inputSty, fontFamily: F.mono, fontSize: 11 }}
          placeholder="Cole aqui" value={texto} onChange={(e) => setTexto(e.target.value)} />

        <div className="flex gap-2">
          <button onClick={ler} disabled={!texto.trim()}
            className="flex-1 rounded-md border py-2.5 text-[13px] font-semibold"
            style={{ borderColor: C.line, color: texto.trim() ? C.roxo : C.mute }}>
            Conferir
          </button>
          {lido && (
            <button onClick={enviar} disabled={indo}
              className="flex-1 rounded-md py-2.5 text-[13px] font-semibold"
              style={{ background: indo ? C.line : C.roxo, color: "#fff" }}>
              {indo ? "Importando…" : `Importar ${lido.linhas.length}`}
            </button>
          )}
        </div>

        {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}

        {lido && (
          <div className="rounded-md p-3 text-[11px] leading-relaxed" style={{ background: "#FBFAFC", border: `1px solid ${C.line}`, color: C.mute }}>
            <b style={{ color: C.ink }}>{lido.linhas.length} linhas</b> · {comData} com data válida ·
            {" "}{comPlaca} com placa válida · {nProp} propostas com valor.
            {comData < lido.linhas.length && (
              <div className="mt-1" style={{ color: C.laranja }}>
                {lido.linhas.length - comData} sem data legível entram sem data — a planilha tem "06/052022" e "18/05/0202". Inventar dia seria pior.
              </div>
            )}
            {comPlaca < lido.linhas.length && (
              <div className="mt-1">
                {lido.linhas.length - comPlaca} sem placa válida entram só como atendimento, sem ficha de veículo.
              </div>
            )}
            {!!lido.desconhecidos.length && (
              <div className="mt-1">Valores fora da lista viram "outro"/"aberto": {lido.desconhecidos.slice(0, 6).join(", ")}.</div>
            )}
            <div className="mt-1">Texto que estava nas colunas de proposta e não era número virou observação.</div>
          </div>
        )}

        {feito && (
          <div className="rounded-md p-3 text-[12px]" style={{ background: "#E7F4EE", border: `1px solid ${C.verde}`, color: C.verde }}>
            {feito.atendimentos} atendimentos, {feito.veiculos} veículos e {feito.propostas} propostas gravados.
          </div>
        )}
      </div>
    </Bloco>
  );
}

/**
 * O cadastro de gente: quem atende e quem prospecta. É o que faz o
 * dashboard existir — sem nome no atendimento, não há por quem medir.
 *
 * Só gerente edita (a RLS da 0010 recusa o resto), e a tela reflete
 * isso em vez de deixar o negociador clicar e tomar erro.
 */
function CadastroNegociadores({ perfil }) {
  const [lista, setLista] = useState([]);
  const [novo, setNovo] = useState({ nome: "", papel: "negociador" });
  const [erro, setErro] = useState("");
  const [indo, setIndo] = useState(false);
  const eGerente = perfil && perfil.papel === "gerente";

  const carregar = () => listarNegociadores().then(setLista).catch((e) => setErro(e.message));
  useEffect(() => { carregar(); }, []);

  const cadastrar = async () => {
    if (!novo.nome.trim()) return;
    setErro(""); setIndo(true);
    try { await criarNegociador(novo); setNovo({ nome: "", papel: novo.papel }); await carregar(); }
    catch (e) { setErro(e.message); }
    setIndo(false);
  };

  const mexer = async (id, mud) => {
    setErro("");
    try { await atualizarNegociador(id, mud); await carregar(); }
    catch (e) { setErro(e.message); }
  };

  const grupo = (papel, titulo) => {
    const gente = lista.filter((n) => n.papel === papel);
    if (!gente.length) return null;
    return (
      <div className="mt-3">
        <div className="text-[10px] uppercase tracking-[0.12em]" style={{ color: C.mute }}>{titulo}</div>
        <div className="mt-1.5 space-y-1.5">
          {gente.map((n) => (
            <div key={n.id} className="flex items-center gap-2 rounded-md px-3 py-2"
              style={{ background: n.ativo ? "#fff" : "#FBFAFC", border: `1px solid ${C.line}`, opacity: n.ativo ? 1 : 0.55 }}>
              <span className="flex-1 text-[13px] font-medium">{n.nome}</span>
              {eGerente ? (
                <>
                  <input className="w-24 rounded-md border px-2 py-1 text-right text-[12px] outline-none"
                    style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" title="Meta do mês em R$"
                    defaultValue={n.meta_valor == null ? "" : Math.round(n.meta_valor)}
                    onBlur={(e) => e.target.value != Math.round(n.meta_valor) && mexer(n.id, { meta_valor: e.target.value })} />
                  <input className="w-14 rounded-md border px-2 py-1 text-right text-[12px] outline-none"
                    style={{ ...inputSty, fontFamily: F.mono }} inputMode="numeric" title="Meta de carros no mês"
                    defaultValue={n.meta_volume == null ? "" : n.meta_volume}
                    onBlur={(e) => e.target.value != n.meta_volume && mexer(n.id, { meta_volume: e.target.value })} />
                  <button onClick={() => mexer(n.id, { ativo: !n.ativo })} className="text-[11px]"
                    style={{ color: n.ativo ? C.laranja : C.verde }}>
                    {n.ativo ? "desativar" : "ativar"}
                  </button>
                </>
              ) : (
                <span className="text-[11px]" style={{ color: C.mute, fontFamily: F.mono }}>
                  {brl(n.meta_valor)} · {n.meta_volume} carros
                </span>
              )}
            </div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div>
      {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
      {grupo("negociador", "Negociadores")}
      {grupo("prospeccao", "Prospecção")}

      {eGerente && (
        <div className="mt-3 space-y-2">
          <div className="grid grid-cols-3 gap-2">
            <input className={`${inputCls} col-span-2`} style={inputSty} placeholder="Nome"
              value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} />
            <select className={inputCls} style={inputSty} value={novo.papel}
              onChange={(e) => setNovo({ ...novo, papel: e.target.value })}>
              <option value="negociador">Negociador</option>
              <option value="prospeccao">Prospecção</option>
            </select>
          </div>
          <button onClick={cadastrar} disabled={indo || !novo.nome.trim()}
            className="w-full rounded-md py-2.5 text-[13px] font-semibold"
            style={{ background: indo || !novo.nome.trim() ? C.line : C.roxo, color: "#fff" }}>
            {indo ? "Cadastrando…" : "Cadastrar"}
          </button>
          <p className="text-[10px] leading-relaxed" style={{ color: C.mute }}>
            Os dois números são a meta do mês: valor e quantidade de carros. Saem do campo e já salvam.
          </p>
        </div>
      )}
    </div>
  );
}

                  const num = { fontFamily: F.mono, textAlign: "right" };
                  return (
                    <tr key={a.id} onClick={() => aoAbrir(a.id)} style={{ borderBottom: `1px solid ${C.line}`, cursor: "pointer" }}>
                      <td className={td} style={{ fontFamily: F.mono, color: C.mute }}>{soData(a.data)}</td>
                      <td className={td}>{a.negociador_nome || "—"}</td>
                      <td className={td} style={{ color: C.mute }}>{a.prospec || "—"}</td>
                      <td className={td} style={{ fontWeight: 600 }}>
                        {v.marca_modelo || a.carro_descricao || "—"}
                      </td>
                      <td className={td} style={{ fontFamily: F.mono }}>{v.placa || "—"}</td>
                      <td className={td} style={{ fontFamily: F.mono, color: C.mute }}>{anoMod || "—"}</td>
                      <td className={td} style={num}>{v.km_atual ? Number(v.km_atual).toLocaleString("pt-BR") : "—"}</td>
                      <td className={td}>{a.cliente_nome || "—"}</td>
                      <td className={td} style={{ fontFamily: F.mono, color: C.mute }}>{a.cliente_telefone || "—"}</td>
                      <td className={td} style={{ color: C.mute }}>{rotulo(ORIGENS, a.origem)}</td>
                      <td className={td}><Etiqueta status={a.status} /></td>
                      <td className={td} style={num}>{v.fipe_valor ? brl(v.fipe_valor) : "—"}</td>
                      <td className={td} style={num}>{a.pretensao ? brl(a.pretensao) : "—"}</td>
                      <td className={td} style={{ ...num, color: melhor ? C.verde : C.mute }}>
                        {melhor ? brl(melhor) : "—"}
                        {props.length > 1 ? <span style={{ color: C.mute }}> ({props.length})</span> : null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        {!!lista.length && (
          <p className="text-[10px]" style={{ color: C.mute }}>
            Arraste a tabela para o lado para ver o resto das colunas. Toque na linha para abrir o atendimento.
          </p>
        )}
      </div>
    </div>
  );
}

/* ===================== entrada ===================== */

function Login({ aoEntrar }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [indo, setIndo] = useState(false);
  const [erro, setErro] = useState("");

  const enviar = async (ev) => {
    if (ev) ev.preventDefault();
    if (!email.trim() || !senha) return;
    setErro(""); setIndo(true);
    try { await entrar(email, senha); await aoEntrar(); }
    catch (e) { setErro(e.message); setIndo(false); }
  };

  return (
    <div className="flex min-h-screen flex-col justify-center px-6" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
      <div className="mx-auto w-full" style={{ maxWidth: 380 }}>
        <div className="text-[11px] uppercase tracking-[0.22em]" style={{ color: C.mute }}>Vaapty Joinville</div>
        <h1 className="mt-1 text-[24px] leading-tight" style={{ fontFamily: F.disp, fontWeight: 800, color: C.roxo }}>
          Ficha e negociação
        </h1>

        <form onSubmit={enviar} className="mt-6 space-y-3">
          <Campo label="E-mail">
            <input type="email" autoComplete="username" inputMode="email" className={inputCls} style={inputSty}
              value={email} onChange={(e) => setEmail(e.target.value)} />
          </Campo>
          <Campo label="Senha">
            <input type="password" autoComplete="current-password" className={inputCls} style={inputSty}
              value={senha} onChange={(e) => setSenha(e.target.value)} />
          </Campo>
          <button type="submit" disabled={indo || !email.trim() || !senha}
            className="w-full rounded-md py-3 text-[14px] font-semibold"
            style={{ background: indo || !email.trim() || !senha ? C.line : C.roxo, color: "#fff" }}>
            {indo ? "Entrando…" : "Entrar"}
          </button>
          {erro && <p className="text-[12px]" style={{ color: C.laranja }}>{erro}</p>}
        </form>

        <p className="mt-6 text-[11px] leading-relaxed" style={{ color: C.mute }}>
          Conta nova precisa ser liberada pelo gerente antes de funcionar. Se você acabou de ser cadastrado e não entra, é isso.
        </p>
      </div>
    </div>
  );
}

const Aviso = ({ titulo, children, acao }) => (
  <div className="flex min-h-screen flex-col justify-center px-6" style={{ background: C.bg, fontFamily: F.body, color: C.ink }}>
    <div className="mx-auto w-full" style={{ maxWidth: 380 }}>
      <h1 className="text-[18px] leading-tight" style={{ fontFamily: F.disp, fontWeight: 800 }}>{titulo}</h1>
      <p className="mt-2 text-[13px] leading-relaxed" style={{ color: C.mute }}>{children}</p>
      {acao}
    </div>
  </div>
);

function App() {
  const [estado, setEstado] = useState("carregando");   // carregando | fora | esperando | dentro | erro
  const [perfil, setPerfil] = useState(null);
  const [erro, setErro] = useState("");
  const [aberto, setAberto] = useState(null);           // atendimento em foco, ou a lista

  const verQuemSou = async () => {
    try {
      const d = await consultarPerfil();
      if (!d.liberado || !d.eu) { setEstado("esperando"); return; }
      setPerfil(d.eu); setEstado("dentro");
    } catch (e) {
      setErro(e.message);
      setEstado(AUTH.sessao ? "erro" : "fora");
    }
  };

  useEffect(() => {
    AUTH.aoSair = () => { setPerfil(null); setEstado("fora"); };
    (async () => {
      try { await carregarConfig(); } catch (e) { setErro(e.message); setEstado("erro"); return; }
      await restaurarSessao();
      if (!AUTH.sessao) { setEstado("fora"); return; }
      await verQuemSou();
    })();
    return () => { AUTH.aoSair = null; };
  }, []);

  if (estado === "carregando") return <Aviso titulo="Carregando…">Um instante.</Aviso>;
  if (estado === "fora") return <Login aoEntrar={verQuemSou} />;

  if (estado === "esperando") return (
    <Aviso titulo="Acesso ainda não liberado"
      acao={<button onClick={sair} className="mt-4 text-[13px] underline" style={{ color: C.roxo }}>Sair</button>}>
      Sua conta existe, mas o gerente ainda não liberou. Enquanto isso, o sistema não mostra nada — é assim de propósito, porque aqui dentro tem dado de cliente.
    </Aviso>
  );

  if (estado === "erro") return (
    <Aviso titulo="Não consegui entrar"
      acao={<button onClick={sair} className="mt-4 text-[13px] underline" style={{ color: C.roxo }}>Sair e tentar de novo</button>}>
      {erro}
    </Aviso>
  );

  if (aberto) {
    return <VaaptyAponte perfil={perfil} atendimento={aberto}
             aoVoltar={() => setAberto(null)}
             aoRecarregar={async () => { try { setAberto(await lerAtendimento(aberto.id)); } catch (e) {} }} />;
  }
  return <CRM perfil={perfil} aoAbrir={async (id) => {
    try { setAberto(await lerAtendimento(id)); } catch (e) { alert(e.message); }
  }} />;
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
</body>
