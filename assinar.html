<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Assinar — Vaapty</title>
<!--
  A página que o cliente abre para assinar.

  **Ela é estática, e isso não é detalhe.** O teto do plano Hobby da
  Vercel é de 12 funções e nós estamos nele; arquivo estático não conta.
  Fosse uma função, esta tela não existiria.

  **O token vai no fragmento (#t=), não na query.** Fragmento não entra
  em log de servidor, não entra em log de proxy e não viaja no cabeçalho
  Referer — é a recomendação 3.2 da especificação, e o ERP de origem usa
  query. A página lê o hash e manda o token no CORPO do POST.

  **Não há PDF, e isso foi decisão.** Gerar PDF no navegador pediria
  html2canvas + jsPDF, e guardá-lo pediria a chave de serviço do
  Supabase numa rota pública — o oposto da decisão 9. O que se assina e
  o que se hasheia é o HTML do documento, que já é a fonte única
  (decisão 7). O hash do conteúdo é inclusive mais robusto que o do PDF:
  o PDF muda se a fonte ou a margem mudarem, o HTML não.
-->
<style>
  :root{
    --roxo:#6D1B9E; --tinta:#1B1725; --mute:#6B6478; --linha:#E6E2EC;
    --papel:#FFFFFF; --fundo:#F7F5FA; --verde:#1D7F58; --laranja:#EA5423;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--tinta);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  .caixa{max-width:720px;margin:0 auto;padding:16px 14px 40px}
  .marca{display:flex;align-items:center;gap:8px;padding:14px 0}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--roxo);color:#fff;
        display:grid;place-items:center;font-weight:800}
  .cartao{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:16px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mute);font-size:13px;margin:0}
  label{display:block;margin-top:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  input{width:100%;margin-top:3px;padding:11px 12px;border:1px solid var(--linha);border-radius:9px;
        font-size:16px;background:#fff;color:var(--tinta)}
  input:focus{outline:2px solid var(--roxo);outline-offset:-1px}
  .doc{max-height:52vh;overflow-y:auto;border:1px solid var(--linha);border-radius:10px;
       padding:14px;background:#fff;font-size:13px;line-height:1.55}
  .doc p{margin:0 0 9px}
  .pad{position:relative;border:1px dashed var(--linha);border-radius:10px;background:#fff;height:190px;touch-action:none}
  .pad canvas{width:100%;height:100%;display:block;border-radius:10px}
  .dica{position:absolute;left:0;right:0;bottom:56px;text-align:center;color:#C9C4D2;font-size:14px;pointer-events:none}
  .risco{position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px solid var(--linha)}
  .aceite{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12.5px;line-height:1.45}
  .aceite input{width:19px;height:19px;margin:1px 0 0;flex:0 0 19px}
  button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--roxo);color:#fff;
         font-size:15px;font-weight:700;margin-top:14px}
  button:disabled{opacity:.4}
  .menor{background:#fff;color:var(--roxo);border:1px solid var(--linha);font-weight:600;
         font-size:13px;padding:9px;width:auto;margin-top:8px}
  .erro{color:var(--laranja);font-size:13px;margin-top:10px}
  .ok{color:var(--verde)}
  .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.04em}
  .fim{text-align:center;padding:26px 8px}
  .fim .cod{font-size:24px;color:var(--roxo);display:block;margin:10px 0}
  .aviso{background:#FFF6E0;color:#8A6100;border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.45}
</style>
</head>
<body>
<div class="caixa">
  <div class="marca"><span class="logo">V</span><strong>Vaapty</strong></div>
  <div id="raiz"><div class="cartao"><p class="sub">Abrindo o documento…</p></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// O token mora no fragmento: nunca vai para log nem para o Referer.
const TOKEN = (location.hash || "").replace(/^#t=/, "").replace(/^#/, "").trim();

const ACEITE = "Li o documento acima, confirmo que os dados são meus e aceito assinar "
  + "eletronicamente, reconhecendo a validade jurídica desta assinatura. Estou ciente de que "
  + "ficam registrados meu nome, documento, data e hora, endereço IP, localidade, o aparelho "
  + "usado e o desenho da minha assinatura.";

async function api(recurso, corpo) {
  const r = await fetch(`/api/documento?recurso=${recurso}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || "Não consegui falar com o sistema.");
  return d;
}

// SHA-256 em hex, pelo próprio navegador. O servidor confere o formato
// e o banco guarda; o mesmo texto sempre dá o mesmo hash, e é isso que
// permite conferir a integridade depois.
async function sha256(texto) {
  const b = new TextEncoder().encode(texto);
  const h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map((x) => x.toString(16).padStart(2, "0")).join("");
}

const soDigitos = (v) => String(v || "").replace(/\D/g, "");

// Valida CPF e CNPJ pelos dígitos verificadores. Documento inventado no
// campo é a falha mais comum, e ela só aparece meses depois.
function docValido(v) {
  const d = soDigitos(v);
  if (d.length === 11) {
    if (/^(\d)\1{10}$/.test(d)) return false;
    for (let t = 9; t < 11; t++) {
      let s = 0;
      for (let i = 0; i < t; i++) s += Number(d[i]) * (t + 1 - i);
      let r = (s * 10) % 11; if (r === 10) r = 0;
      if (r !== Number(d[t])) return false;
    }
    return true;
  }
  if (d.length === 14) {
    if (/^(\d)\1{13}$/.test(d)) return false;
    const calc = (n) => {
      let s = 0, p = n - 7;
      for (let i = n; i >= 1; i--) { s += Number(d[n - i]) * p--; if (p < 2) p = 9; }
      const r = s % 11;
      return r < 2 ? 0 : 11 - r;
    };
    return calc(12) === Number(d[12]) && calc(13) === Number(d[13]);
  }
  return false;
}
</script>
<script>
let DOC = null;          // o que veio do servidor
let traçou = false;      // o dedo encostou no quadro?

function telaErro(msg) {
  $("raiz").innerHTML = `<div class="cartao"><h1>Não deu para abrir</h1>
    <p class="sub" style="margin-top:6px">${esc(msg)}</p>
    <p class="sub" style="margin-top:10px">Se você recebeu este link por engano, pode ignorá-lo.
    Se era para você, peça um link novo a quem o enviou — por segurança, cada link vale uma vez só.</p></div>`;
}

function telaPronto(codigo, quando) {
  $("raiz").innerHTML = `<div class="cartao fim">
    <div style="font-size:34px">✓</div>
    <h1 class="ok" style="margin-top:6px">Assinado</h1>
    <p class="sub">${esc(quando || "")}</p>
    <span class="cod">${esc(codigo)}</span>
    <p class="sub">Guarde este código. Com ele, qualquer pessoa confere a autenticidade
      do documento a qualquer momento.</p>
    <a href="/verificar.html?c=${encodeURIComponent(codigo)}"><button class="menor" style="width:100%">
      Conferir agora</button></a>
  </div>`;
}

function telaAssinar(d) {
  const nome = d.nome_esperado || "";
  $("raiz").innerHTML = `
    <div class="cartao">
      <h1>${esc(rotulo(d.tipo))}</h1>
      <p class="sub">Leia o documento inteiro antes de assinar. Role até o fim.</p>
      <div class="doc" id="doc">${d.conteudo || ""}</div>
    </div>

    <div class="cartao">
      <h1 style="font-size:16px">Seus dados</h1>
      <p class="sub">Precisam ser os seus: eles vão para o documento e para o registro.</p>
      <label>Nome completo</label>
      <input id="f-nome" value="${esc(nome)}" autocomplete="name" />
      <label>CPF ou CNPJ</label>
      <input id="f-doc" inputmode="numeric" autocomplete="off" />
      <label>E-mail (opcional)</label>
      <input id="f-email" type="email" autocomplete="email" />
    </div>

    <div class="cartao">
      <h1 style="font-size:16px">Assine com o dedo</h1>
      <p class="sub">Use o dedo ou o mouse no quadro abaixo.</p>
      <div class="pad" style="margin-top:10px">
        <canvas id="pad"></canvas>
        <div class="risco"></div>
        <div class="dica" id="dica">assine aqui</div>
      </div>
      <button class="menor" id="limpar">↺ Apagar e assinar de novo</button>

      <div class="aceite">
        <input type="checkbox" id="ok" />
        <label for="ok" style="text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--tinta);margin:0">
          ${esc(ACEITE)}
        </label>
      </div>

      <button id="enviar">Assinar documento</button>
      <p class="erro" id="erro" style="display:none"></p>
    </div>`;

  prepararCanvas();
  $("limpar").onclick = limparCanvas;
  $("enviar").onclick = enviar;
  $("f-doc").oninput = (e) => { e.target.value = mascaraDoc(e.target.value); };
}

const rotulo = (t) => ({
  pre_contrato: "Pré-contrato", termo_aceite: "Termo de aceite", check_list: "Check list do negócio",
  contrato_final: "Contrato", autorizacao_cautelar: "Autorização de cautelar",
}[t] || "Documento");

function mascaraDoc(v) {
  const d = soDigitos(v).slice(0, 14);
  if (d.length <= 11) {
    return d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  }
  return d.replace(/(\d{2})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1/$2").replace(/(\d{4})(\d{1,2})$/, "$1-$2");
}

// ---- o quadro da assinatura ----
let ctx = null;
function prepararCanvas() {
  const c = $("pad");
  // Resolução do aparelho: sem isto o traço sai serrilhado no celular,
  // que é onde isto é usado.
  const r = window.devicePixelRatio || 1;
  const cx = c.getBoundingClientRect();
  c.width = cx.width * r; c.height = cx.height * r;
  ctx = c.getContext("2d");
  ctx.scale(r, r);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1B1725";

  let riscando = false;
  const ponto = (ev) => {
    const b = c.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    return [t.clientX - b.left, t.clientY - b.top];
  };
  const comeca = (ev) => {
    ev.preventDefault(); riscando = true;
    const [x, y] = ponto(ev); ctx.beginPath(); ctx.moveTo(x, y);
    traçou = true; $("dica").style.display = "none";
  };
  const anda = (ev) => {
    if (!riscando) return;
    ev.preventDefault();
    const [x, y] = ponto(ev); ctx.lineTo(x, y); ctx.stroke();
  };
  const para = () => { riscando = false; };

  c.addEventListener("mousedown", comeca); c.addEventListener("mousemove", anda);
  window.addEventListener("mouseup", para);
  c.addEventListener("touchstart", comeca, { passive: false });
  c.addEventListener("touchmove", anda, { passive: false });
  c.addEventListener("touchend", para);
}
function limparCanvas() {
  const c = $("pad");
  ctx.clearRect(0, 0, c.width, c.height);
  traçou = false; $("dica").style.display = "";
}
</script>
<script>
function erro(m) {
  const e = $("erro");
  e.textContent = m; e.style.display = m ? "" : "none";
  if (m) e.scrollIntoView({ block: "center", behavior: "smooth" });
}

async function enviar() {
  const nome = $("f-nome").value.trim();
  const doc = $("f-doc").value.trim();
  const email = $("f-email").value.trim();

  if (nome.length < 5) return erro("Escreva seu nome completo.");
  if (!docValido(doc)) return erro("Confira o CPF ou CNPJ — os dígitos não fecham.");
  if (!traçou) return erro("Falta assinar no quadro.");
  if (!$("ok").checked) return erro("Marque a caixa de aceite para poder assinar.");

  const b = $("enviar");
  b.disabled = true; b.textContent = "Registrando…"; erro("");

  try {
    // O PNG do desenho vai dentro das evidências. Não há bucket aqui:
    // guardar arquivo pediria a chave de serviço numa rota pública.
    const png = $("pad").toDataURL("image/png");

    // Dois hashes, e eles respondem coisas diferentes. O do CONTEÚDO é
    // do documento como ele foi apresentado; o do ASSINADO inclui quem
    // assinou e quando — é o que prova que nada mudou depois.
    const conteudo = DOC.conteudo || "";
    const assinado = conteudo + `\n<!-- assinado por ${nome} (${soDigitos(doc)}) em ${new Date().toISOString()} -->`;
    const conteudo_sha256 = await sha256(conteudo);
    const pdf_sha256 = await sha256(assinado);

    const d = await api("assinar", {
      token: TOKEN, nome, documento: doc, email, aceite: ACEITE,
      conteudo_sha256, pdf_sha256,
      hora_cliente: new Date().toLocaleString("pt-BR"),
      fuso_cliente: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
      evidencias: {
        versaoEsquema: 1,
        assinatura_png: png,
        tela: `${screen.width}x${screen.height}@${window.devicePixelRatio || 1}`,
        idioma: navigator.language || "",
        aceite_texto: ACEITE,
        documento_assinado: assinado,
      },
    });
    telaPronto(d.codigo, new Date(d.assinado_em).toLocaleString("pt-BR"));
  } catch (e) {
    b.disabled = false; b.textContent = "Assinar documento";
    erro(e.message || "Não consegui registrar. Tente de novo.");
  }
}

(async function abrir() {
  if (!TOKEN || TOKEN.length < 32) return telaErro("O endereço está incompleto. Abra o link exatamente como recebeu.");
  try {
    const d = await api("assinar-abrir", { token: TOKEN });
    DOC = d;
    if (d.situacao === "assinado") {
      return telaPronto(d.codigo || "—", "");
    }
    if (d.situacao === "expirado") return telaErro("Este link venceu. Peça um novo a quem o enviou.");
    if (d.situacao === "revogado") return telaErro("Este link foi cancelado.");
    if (!d.conteudo) return telaErro("Este link não está mais disponível.");
    telaAssinar(d);
  } catch (e) {
    telaErro(e.message || "Não consegui abrir o documento.");
  }
})();
</script>
</body>
</html>
